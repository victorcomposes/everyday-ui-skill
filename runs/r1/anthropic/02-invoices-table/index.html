<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices - Marlow Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8F8; --card:#fff; --ink:#142320; --ink2:#566763; --line:#E0E6E4; --line2:#CCD5D2;
  --teal:#0B6E5F; --teal-d:#07594D; --teal-t:#E3F3EF;
  --red:#C2321F; --red-t:#FCE9E6; --amber:#9A5B00; --amber-t:#FFF1D6; --grey-t:#EBEEED; --paid:#0B6E5F;
}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1B8F7D;outline-offset:2px;border-radius:6px}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:32px;padding:0 32px;height:56px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:22px;height:22px}
.top nav{display:flex;gap:4px;height:100%}
.top nav a{display:flex;align-items:center;padding:0 12px;color:var(--ink2);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current]{color:var(--ink);border-color:var(--teal)}
.top .me{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:28px 32px 60px}
.title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default;border-color:var(--line)}
/* money strip */
.money{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:16px}
.stats button{all:unset;cursor:pointer;display:block;padding:6px 8px;margin:-6px -8px;border-radius:8px}
.stats button:hover{background:var(--bg)}
.stats button:focus-visible{outline:3px solid #1B8F7D}
.stats small{display:block;color:var(--ink2);font-weight:600}
.stats b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stats span{color:var(--ink2);font-size:13px;margin-left:6px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:4px}
.legend{display:flex;gap:18px;margin-top:8px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
/* toolbar */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:14px 12px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--teal)}
.tabs button:focus-visible{outline:3px solid #1B8F7D;outline-offset:-3px}
.tabs em{font-style:normal;font-weight:600;font-size:12px;background:var(--grey-t);padding:1px 7px;border-radius:99px;margin-left:6px}
.tabs button[aria-selected=true] em{background:var(--teal-t);color:var(--teal-d)}
.tools{display:flex;gap:10px;padding:14px 16px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink2)}
.search input{width:100%;min-height:38px;padding:7px 12px 7px 34px;border:1px solid var(--line2);border-radius:8px;background:#fff}
select{min-height:38px;padding:7px 30px 7px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-weight:500}
.count{margin-left:auto;color:var(--ink2)}
/* bulk */
.bulk{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--teal-t);border-top:1px solid #BFE1DA;border-bottom:1px solid #BFE1DA;flex-wrap:wrap}
.bulk.on{display:flex}
.bulk b{margin-right:6px}
/* table */
table{width:100%;border-collapse:collapse}
th{vertical-align:middle;text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:10px 12px;background:#FAFBFA;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:3px solid #1B8F7D;border-radius:4px}
th[aria-sort] button{color:var(--ink)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FAFBFA}
tbody tr.sel{background:#F1F9F7}
.num{text-align:right}
td.num,th.num{padding-right:20px}
.cust b{display:block;font-weight:600}
.cust small{color:var(--ink2)}
.inv{font-weight:700}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.paid{background:var(--teal-t);color:var(--teal-d)}
.pill.overdue{background:var(--red-t);color:var(--red)}
.pill.sent{background:var(--amber-t);color:var(--amber)}
.pill.draft{background:var(--grey-t);color:var(--ink2)}
.due small{display:block;color:var(--ink2)}
.due .late{color:var(--red);font-weight:600}
.act{display:flex;gap:8px;justify-content:flex-end;position:relative}
.kebab{width:32px;padding:0;justify-content:center}
.menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 12px 28px #14232022;z-index:10;min-width:170px;display:none;text-align:left}
.menu.on{display:block}
.menu button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 12px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--bg)}
.menu button.danger{color:var(--red)}
.empty{padding:56px 20px;text-align:center;color:var(--ink2);display:none}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.foot{padding:14px 16px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.top nav{display:none}.stats{grid-template-columns:1fr;gap:12px}}
@media (max-width:760px){
  .top{padding:0 16px}main{padding:20px 16px 60px}h1{font-size:24px}
  .tools{padding:12px}.search{max-width:none;flex-basis:100%}.tools select{flex:1}.count{display:none}
  thead{position:absolute;left:-9999px}
  table,tbody{display:block}
  tbody tr{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;padding:14px 12px;border-bottom:1px solid var(--line)}
  td{display:block;padding:0;border:0}
  td.c-sel{grid-row:1/3}
  td.c-cust{grid-column:2}
  td.c-amt{grid-column:3;grid-row:1;text-align:right;font-weight:700;padding:0}
  td.c-inv{display:none}
  td.c-iss{display:none}
  td.c-due{grid-column:2;grid-row:2}
  td.c-stat{grid-column:3;grid-row:2;text-align:right}
  td.c-act{grid-column:1/-1;margin-top:8px}
  td.num{padding-right:0}
  .act{justify-content:flex-start}
  .act .btn.sm{min-height:40px}
  .kebab{width:40px;min-height:40px}
  .menu{right:auto;left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 22 22" fill="none" stroke="#0B6E5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h10l4 4v12H4z"/><path d="M8 11h6M8 15h6"/></svg>Marlow Books</div>
  <nav aria-label="Main"><a href="#" aria-current="page">Invoices</a><a href="#">Quotes</a><a href="#">Customers</a><a href="#">Expenses</a><a href="#">Reports</a></nav>
  <div class="me" aria-label="Signed in as Tomasz Wren">TW</div>
</header>

<main>
  <div class="title">
    <h1>Invoices</h1>
    <div style="display:flex;gap:8px"><button class="btn">Import</button><button class="btn pri">New invoice</button></div>
  </div>

  <section class="money" aria-label="Money summary">
    <div class="stats">
      <button data-go="overdue"><small>Overdue</small><b id="s-over"></b><span id="n-over"></span></button>
      <button data-go="sent"><small>Awaiting payment</small><b id="s-sent"></b><span id="n-sent"></span></button>
      <button data-go="paid"><small>Paid in the last 30 days</small><b id="s-paid"></b><span id="n-paid"></span></button>
    </div>
    <div class="stack" id="stack" aria-hidden="true"></div>
    <div class="legend"><span style="--c:var(--red)">Overdue</span><span style="--c:#E7A93B">Not due yet</span><span style="--c:var(--teal)">Paid in the last 30 days</span></div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" aria-label="Filter by status" id="tabs"></div>
    <div class="tools">
      <label class="search"><span class="sr" style="position:absolute;left:-9999px">Search invoices</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
        <input id="q" type="search" placeholder="Search by customer or invoice number"></label>
      <select id="cust" aria-label="Customer"><option value="">All customers</option></select>
      <select id="range" aria-label="Issued"><option value="">Any issue date</option><option value="30">Issued in the last 30 days</option><option value="7">Issued in the last 7 days</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="bulk" id="bulk" role="region" aria-label="Bulk actions"><b id="bn"></b>
      <button class="btn sm" data-bulk="remind">Send reminders</button>
      <button class="btn sm" data-bulk="paid">Mark as paid</button>
      <button class="btn sm" data-bulk="pdf">Download PDFs</button>
      <button class="btn sm" data-bulk="clear">Clear selection</button>
    </div>
    <table>
      <thead><tr>
        <th style="width:44px"><input type="checkbox" id="all" aria-label="Select all shown invoices"></th>
        <th aria-sort="descending" data-k="no"><button>Invoice</button></th>
        <th data-k="cust"><button>Customer</button></th>
        <th data-k="issued"><button>Issued</button></th>
        <th data-k="due"><button>Due</button></th>
        <th class="num" data-k="amt"><button>Amount</button></th>
        <th>Status</th>
        <th><span style="position:absolute;left:-9999px">Actions</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty"><b>No invoices match</b>Clear the search or pick another status.</div>
    <div class="foot" id="foot"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TODAY=new Date('2026-11-26T00:00:00');
const D=s=>new Date(s+'T00:00:00');
const data=[
 [1044,'Copperleaf Yoga','2026-11-26','2026-12-10',192.00,'draft'],
 [1043,'Lumen Print Co','2026-11-25','2026-12-09',920.00,'draft'],
 [1042,'Harbour & Pine Joinery','2026-11-20','2026-12-04',2840.00,'sent'],
 [1041,'Brightside Dental','2026-11-18','2026-12-02',1260.00,'sent'],
 [1040,'Lumen Print Co','2026-11-14','2026-11-28',485.50,'sent'],
 [1039,'Okonkwo Catering','2026-11-12','2026-11-26',1575.00,'sent'],
 [1038,'Greywether Architects','2026-11-05','2026-11-19',6400.00,'sent'],
 [1037,'Saltmarsh Cafe','2026-11-03','2026-11-17',318.75,'paid','2026-11-16'],
 [1036,'Tern Logistics','2026-10-28','2026-11-11',4125.00,'sent'],
 [1035,'Nadia Rahman Photography','2026-10-25','2026-11-08',750.00,'paid','2026-11-09'],
 [1034,'Pixelmill Studio','2026-10-22','2026-11-05',2200.00,'sent'],
 [1033,'Copperleaf Yoga','2026-10-18','2026-11-01',192.00,'paid','2026-10-31'],
 [1032,'Oyelaran Auto Repair','2026-10-15','2026-10-29',1034.20,'paid','2026-10-28'],
 [1031,'Harbour & Pine Joinery','2026-10-09','2026-10-23',2610.00,'paid','2026-10-22'],
 [1030,'Brightside Dental','2026-10-02','2026-10-16',1260.00,'paid','2026-10-15'],
 [1029,'Saltmarsh Cafe','2026-09-28','2026-10-12',318.75,'paid','2026-10-12'],
].map(a=>({no:a[0],cust:a[1],issued:a[2],due:a[3],amt:a[4],raw:a[5],paidOn:a[6],reminded:false,sel:false}));
const st=i=>i.raw==='sent'&&D(i.due)<TODAY?'overdue':i.raw;
const days=(a,b)=>Math.round((a-b)/864e5);
const gbp=n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const LABEL={all:'All',draft:'Draft',sent:'Awaiting payment',overdue:'Overdue',paid:'Paid'};
const ICON={
 paid:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.5 2.3 2.3L9.5 3.5"/></svg>',
 overdue:'<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 1 11.5 11h-11z"/></svg>',
 sent:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.5V6l1.8 1"/></svg>',
 draft:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"><circle cx="6" cy="6" r="4.6"/></svg>'};
const S={tab:'all',q:'',cust:'',range:'',key:'no',dir:-1};
const $=id=>document.getElementById(id);
const custs=[...new Set(data.map(d=>d.cust))].sort();
$('cust').insertAdjacentHTML('beforeend',custs.map(c=>`<option>${c.replace('&','&amp;')}</option>`).join(''));

function visible(){
  const q=S.q.toLowerCase();
  return data.filter(i=>(S.tab==='all'||st(i)===S.tab)
    &&(!S.cust||i.cust===S.cust)
    &&(!S.range||days(TODAY,D(i.issued))<=+S.range)
    &&(!q||i.cust.toLowerCase().includes(q)||('inv-'+i.no).includes(q)||String(i.no).includes(q)))
  .sort((a,b)=>{const x=a[S.key],y=b[S.key];return (x>y?1:x<y?-1:0)*S.dir});
}
function actions(i){
  const s=st(i);let b='';
  if(s==='overdue') b=i.reminded?'<button class="btn sm" disabled>Reminder sent</button>':`<button class="btn sm pri" data-a="remind" data-n="${i.no}">Send reminder</button>`;
  else if(s==='sent') b=`<button class="btn sm" data-a="paid" data-n="${i.no}">Mark as paid</button>`;
  else if(s==='draft') b=`<button class="btn sm pri" data-a="send" data-n="${i.no}">Send invoice</button>`;
  else b=`<button class="btn sm" data-a="pdf" data-n="${i.no}">Download</button>`;
  return `<div class="act">${b}<button class="btn sm kebab" aria-label="More actions for INV-${i.no}" aria-haspopup="menu" data-a="menu" data-n="${i.no}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
  <div class="menu" role="menu"><button role="menuitem" data-a="view" data-n="${i.no}">View invoice</button><button role="menuitem" data-a="dup" data-n="${i.no}">Duplicate</button><button role="menuitem" data-a="pdf" data-n="${i.no}">Download PDF</button><button role="menuitem" class="danger" data-a="void" data-n="${i.no}">Void invoice</button></div></div>`;
}
function render(){
  const rows=visible();
  $('rows').innerHTML=rows.map(i=>{
    const s=st(i),d=days(D(i.due),TODAY);
    let dueNote='';
    if(s==='overdue') dueNote=`<small class="late">${-d} day${d===-1?'':'s'} late</small>`;
    else if(s==='sent') dueNote=`<small>${d===0?'Due today':'In '+d+' days'}</small>`;
    else if(s==='paid') dueNote=`<small>Paid ${fd(i.paidOn)}</small>`;
    else dueNote='<small>Not sent yet</small>';
    return `<tr class="${i.sel?'sel':''}"><td class="c-sel"><input type="checkbox" data-n="${i.no}" ${i.sel?'checked':''} aria-label="Select INV-${i.no}"></td>
    <td class="c-inv inv">INV-${i.no}</td>
    <td class="c-cust cust"><b>${i.cust.replace('&','&amp;')}</b><small class="mob" >INV-${i.no}</small></td>
    <td class="c-iss">${fd(i.issued)}</td>
    <td class="c-due due">${fd(i.due)}${dueNote}</td>
    <td class="c-amt num">${gbp(i.amt)}</td>
    <td class="c-stat"><span class="pill ${s}">${ICON[s]}${LABEL[s]}</span></td>
    <td class="c-act">${actions(i)}</td></tr>`}).join('');
  $('empty').style.display=rows.length?'none':'block';
  $('count').textContent=`${rows.length} of ${data.length} invoices`;
  $('foot').textContent=rows.length?`Showing ${rows.length} invoice${rows.length>1?'s':''} totalling ${gbp(rows.reduce((t,i)=>t+i.amt,0))}`:'';
  const n=data.filter(i=>i.sel&&rows.includes(i)).length;
  $('bulk').classList.toggle('on',n>0);$('bn').textContent=n+' selected';
  $('all').checked=rows.length>0&&rows.every(i=>i.sel);
  $('all').indeterminate=n>0&&!$('all').checked;
  document.querySelectorAll('th[data-k]').forEach(th=>{if(th.dataset.k===S.key)th.setAttribute('aria-sort',S.dir>0?'ascending':'descending');else th.removeAttribute('aria-sort')});
  tabs();summary();
}
function tabs(){
  const c={all:data.length};data.forEach(i=>c[st(i)]=(c[st(i)]||0)+1);
  $('tabs').innerHTML=Object.keys(LABEL).map(k=>`<button role="tab" aria-selected="${S.tab===k}" data-t="${k}">${LABEL[k]}<em>${c[k]||0}</em></button>`).join('');
}
function summary(){
  const sum=f=>data.filter(f).reduce((t,i)=>t+i.amt,0),cnt=f=>data.filter(f).length;
  const recent=i=>i.raw==='paid'&&days(TODAY,D(i.paidOn))<=30;
  const over=sum(i=>st(i)==='overdue'),sent=sum(i=>st(i)==='sent'),paid=sum(recent);
  $('s-over').textContent=gbp(over);$('n-over').textContent=cnt(i=>st(i)==='overdue')+' invoices';
  $('s-sent').textContent=gbp(sent);$('n-sent').textContent=cnt(i=>st(i)==='sent')+' invoices';
  $('s-paid').textContent=gbp(paid);$('n-paid').textContent=cnt(recent)+' invoices';
  const t=over+sent+paid||1;
  $('stack').innerHTML=`<i style="flex:${over/t};background:var(--red)"></i><i style="flex:${sent/t};background:#E7A93B"></i><i style="flex:${paid/t};background:var(--teal)"></i>`;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const by=n=>data.find(i=>i.no==n);
function act(a,i){
  if(a==='remind'){i.reminded=true;toast('Reminder sent to '+i.cust)}
  else if(a==='paid'){i.raw='paid';i.paidOn='2026-11-26';toast('INV-'+i.no+' marked as paid')}
  else if(a==='send'){i.raw='sent';toast('INV-'+i.no+' sent to '+i.cust)}
  else if(a==='pdf')toast('Downloading INV-'+i.no+'.pdf');
  else if(a==='view')toast('Opening INV-'+i.no);
  else if(a==='dup')toast('Draft created from INV-'+i.no);
  else if(a==='void'){data.splice(data.indexOf(i),1);toast('INV-'+i.no+' voided')}
}
document.addEventListener('click',e=>{
  const m=document.querySelector('.menu.on');
  const b=e.target.closest('[data-a]');
  if(m&&!(b&&b.dataset.a==='menu'))m.classList.remove('on');
  if(b){
    if(b.dataset.a==='menu'){const mm=b.nextElementSibling;const was=mm.classList.contains('on');document.querySelectorAll('.menu.on').forEach(x=>x.classList.remove('on'));mm.classList.toggle('on',!was);if(!was)mm.querySelector('button').focus();return}
    act(b.dataset.a,by(b.dataset.n));render();return;
  }
  const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;render();return}
  const g=e.target.closest('[data-go]');if(g){S.tab=g.dataset.go;render();return}
  const th=e.target.closest('th[data-k]');if(th){const k=th.dataset.k;S.dir=S.key===k?-S.dir:1;S.key=k;render();return}
  const bk=e.target.closest('[data-bulk]');if(bk){
    const sel=data.filter(i=>i.sel);
    if(bk.dataset.bulk==='clear')data.forEach(i=>i.sel=false);
    else if(bk.dataset.bulk==='remind'){const o=sel.filter(i=>st(i)==='overdue');o.forEach(i=>i.reminded=true);toast(o.length?`Reminders sent for ${o.length} overdue invoice${o.length>1?'s':''}`:'Select at least one overdue invoice to send a reminder')}
    else if(bk.dataset.bulk==='paid'){const o=sel.filter(i=>st(i)!=='paid'&&i.raw!=='draft');o.forEach(i=>{i.raw='paid';i.paidOn='2026-11-26'});sel.forEach(i=>i.sel=false);toast(`${o.length} invoice${o.length===1?'':'s'} marked as paid`)}
    else toast(`Downloading ${sel.length} PDF${sel.length>1?'s':''}`);
    render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.menu.on').forEach(m=>{m.classList.remove('on');m.previousElementSibling.focus()})});
$('rows').addEventListener('change',e=>{if(e.target.type==='checkbox'){by(e.target.dataset.n).sel=e.target.checked;render()}});
$('all').onchange=e=>{visible().forEach(i=>i.sel=e.target.checked);render()};
$('q').oninput=e=>{S.q=e.target.value;render()};
$('cust').onchange=e=>{S.cust=e.target.value;render()};
$('range').onchange=e=>{S.range=e.target.value;render()};
render();
</script>
<style>.mob{display:none;color:var(--ink2)}@media(max-width:760px){.mob{display:block}}</style>
</body>
