  <div class="main">
    <header class="topbar">
      <button class="btn sm menu-btn" aria-label="Open menu" type="button"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="gsearch" role="search"><svg class="ico"><use href="#i-search"/></svg>Search Pennant<kbd>Ctrl K</kbd></div>
      <span class="spacer"></span>
      <span class="avatar" role="img" aria-label="Tomasz Wójcik">TW</span>
    </header>
    <main class="page">
      <div class="head">
        <div><h1>Invoices</h1><p id="sub"></p></div>
        <div class="btns">
          <button class="btn" type="button" id="export"><svg class="ico"><use href="#i-dl"/></svg>Export</button>
          <button class="btn primary" type="button"><svg class="ico"><use href="#i-plus"/></svg>New invoice</button>
        </div>

      <div class="tabs" role="tablist" aria-label="Invoice views" id="tabs"></div>
      <div class="toolbar" id="toolbar">
        <div id="bulk" class="bulk" hidden></div>
        <div id="normal" style="display:contents">
          <div class="sfield"><svg class="ico"><use href="#i-search"/></svg><input class="input" id="q" type="search" placeholder="Search invoice or customer" aria-label="Search invoices" autocomplete="off" spellcheck="false"></div>
          <button class="btn filters-btn" type="button" id="fbtn" aria-expanded="false" aria-controls="fg"><svg class="ico"><use href="#i-filter"/></svg><span id="fbtn-t">Filters</span></button>
          <div class="filter-group" id="fg">
            <select class="input sel" id="f-cus" aria-label="Customer"></select>
            <select class="input sel" id="f-date" aria-label="Issue date">
              <option value="">Any issue date</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option>
            </select>
            <select class="input sel" id="f-amt" aria-label="Amount">
              <option value="">Any amount</option><option value="lt500">Under £500</option><option value="500">£500 to £5,000</option><option value="gt5000">Over £5,000</option>
            </select>
            <button class="linkbtn" type="button" id="clear" hidden>Clear filters</button>
          </div>
        </div>
      </div>
      <div class="tablewrap" id="area"></div>
      <div class="pager" id="pager"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const params = new URLSearchParams(location.search);
const state = params.get('state') || '';
const TODAY = new Date('2026-03-14T10:30:00Z'); const DAY = 864e5;
const TODAY_D = new Date('2026-03-14T00:00:00Z');

/* ---- fixtures: 1,284 invoices from a seeded generator ---- */
const customers = ['Harbour & Finch Ltd','Bramwell Dental Group','Kestrel Analytics','Oduya Textiles','Northgate Print Works','Calloway & Pryce LLP','Fernhill Veterinary Clinic','Lumen Street Studio','Ashdown Joinery','Priory Park Bakery','Tidewater Logistics','Redfern Physiotherapy','Moxon Electrical Services','Elmstead Garden Centre','Salt & Sage Catering','Greywell Architects','Brightside Accountancy','Penhallow Marine','Quayside Coffee Roasters','Holloway Tutors','Marlow Cycle Co','Thornbury Estates','Vantage Fitness Studio','Wicker & Oak Interiors','Dunmore Brewing Co'];
const LONG = 'Société Générale des Transports Maritimes et Fluviaux S.A.';
const rng = (s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296)(20260314);
const iso = d => d.toISOString().slice(0, 10);
const invoices = [];
for (let n = 1284; n >= 1; n--) {
  const age = Math.floor((1284 - n) * 0.6);
  const issued = new Date(TODAY_D - age * DAY);
  const terms = rng() < 0.7 ? 30 : 14;
  const due = new Date(+issued + terms * DAY);
  let customer = customers[Math.floor(rng() * customers.length)];
  let amount = Math.round((40 + Math.pow(rng(), 2.4) * 6800) * 100) / 100;
  if (rng() < 0.4) amount = Math.round(amount / 10) * 10;
  let id = 'INV-' + String(n).padStart(4, '0'), status, dueIso = iso(due);
  const pastDue = due < TODAY_D;
  if (n === 1284 || n === 1283 || n === 1279 || n === 1277) { status = 'Draft'; dueIso = null; }
  else if (age > 60) status = rng() < 0.985 ? 'Paid' : 'Overdue';
  else if (pastDue) status = rng() < 0.2 ? 'Overdue' : 'Paid';
  else status = rng() < 0.72 ? 'Open' : 'Paid';
  const row = { id, customer, amount, issued: iso(issued), due: dueIso, status, n };
  invoices.push(row);
}
const set = (n, f) => Object.assign(invoices.find(r => r.n === n), f);
set(1273, { customer: LONG, amount: 1284900.5, status: 'Paid' });
set(1271, { customer: 'Q', amount: 0.4, status: 'Open', due: '2026-03-27' });
set(1268, { id: 'CN-0031', customer: 'Oduya Textiles', amount: -312.4, status: 'Credited', due: null });
set(1266, { id: 'INV-1266-REISSUE-02', status: 'Open', due: '2026-03-24' });
set(1264, { amount: 0, status: 'Paid' });
set(1262, { due: null, status: 'Open' });
// keep page 1 honest: a couple of overdue rows near the top
set(1255, { status: 'Overdue' }); set(1259, { status: 'Overdue' });
const SEED_COUNT = invoices.length;
const money = new Intl.NumberFormat('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const dShort = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rel(iso8) {
  if (!iso8) return null;
  const d = new Date(iso8 + 'T00:00:00Z'), diff = Math.round((d - TODAY_D) / DAY);
  if (diff === 0) return 'Today';
  if (diff === -1) return 'Yesterday';
  if (diff === 1) return 'Tomorrow';
  if (diff < 0 && diff >= -7) return -diff + ' days ago';
  if (diff > 0 && diff <= 7) return 'In ' + diff + ' days';
  return (d.getUTCFullYear() === 2026 ? dShort : dFmt).format(d);
}
const plural = (n, one, many) => n.toLocaleString('en-GB') + ' ' + (n === 1 ? one : many);

/* ---- state ---- */
const S = { tab: 'All', q: '', cus: '', date: '', amt: '', sort: 'n', dir: -1, page: 1, size: 25, sel: new Set(), open: null, fOpen: false, err: state === 'error', load: state === 'loading' };
if (state === 'noresults') S.q = 'harbor wharf';
if (state === 'selection') ['1284', '1283', '1281'].forEach(n => S.sel.add(+n));
const EMPTY = state === 'empty';
const data = EMPTY ? [] : invoices;
const tabs = ['All', 'Open', 'Overdue', 'Paid', 'Draft'];
const countOf = t => t === 'All' ? data.length : data.filter(r => r.status === t).length;

function filtered() {
  const q = S.q.trim().toLowerCase();
  let rows = data.filter(r => {
    if (S.tab !== 'All' && r.status !== S.tab) return false;
    if (q && !(r.id.toLowerCase().includes(q) || r.customer.toLowerCase().includes(q))) return false;
    if (S.cus && r.customer !== S.cus) return false;
    if (S.date && (TODAY_D - new Date(r.issued + 'T00:00:00Z')) / DAY > +S.date) return false;
    if (S.amt === 'lt500' && !(r.amount < 500)) return false;
    if (S.amt === '500' && !(r.amount >= 500 && r.amount <= 5000)) return false;
    if (S.amt === 'gt5000' && !(r.amount > 5000)) return false;
    return true;
  });
  const k = S.sort;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (x == null) return 1; if (y == null) return -1;
    if (typeof x === 'string') return x.localeCompare(y) * S.dir;
    return (x - y) * S.dir;
  });
  return rows;
}
const hasFilters = () => !!(S.q || S.cus || S.date || S.amt);

/* ---- render ---- */
const $ = id => document.getElementById(id);
const cusSel = $('f-cus');
cusSel.innerHTML = '<option value="">All customers</option>' + [...new Set([...customers, LONG, 'Q'])].sort().map(c => `<option value="${esc(c)}">${esc(c.length > 40 ? c.slice(0, 38) + '…' : c)}</option>`).join('');
$('nav-count').textContent = '';

function renderTabs() {
  $('tabs').innerHTML = tabs.map(t => {
    const c = countOf(t);
    return `<button class="tab" role="tab" aria-selected="${S.tab === t}" data-t="${t}">${t}<span class="n num ${t === 'Overdue' && c ? 'alert' : ''}">${c.toLocaleString('en-GB')}</span></button>`;
  }).join('');
}
function renderHead() {
  const od = countOf('Overdue'), openN = countOf('Open');
  const outstanding = data.filter(r => r.status === 'Open' || r.status === 'Overdue').reduce((s, r) => s + r.amount, 0);
  $('sub').textContent = EMPTY ? 'No invoices yet' : `${plural(data.length, 'invoice', 'invoices')}. ${openN + od} unpaid, £${money.format(outstanding)} outstanding, ${od} overdue.`;
}
const cols = [['inv', 'Invoice', 'id', 'c-inv'], ['cus', 'Customer', 'customer', 'c-cus'], ['st', 'Status', 'status', 'c-st'], ['iss', 'Issued', 'issued', 'c-iss'], ['due', 'Due', 'due', 'c-due'], ['amt', 'Amount (GBP)', 'amount', 'c-amt']];
function theadHtml(rows) {
  const all = rows.length && rows.every(r => S.sel.has(r.n)), some = rows.some(r => S.sel.has(r.n));
  return `<colgroup><col class="c-cb"><col class="c-inv"><col class="c-cus"><col class="c-st"><col class="c-iss"><col class="c-due"><col class="c-amt"><col class="c-act"></colgroup>
  <thead><tr><th class="cb"><label class="cbl"><input class="check" type="checkbox" id="all" aria-label="Select all invoices on this page" ${all ? 'checked' : ''}></label></th>
  ${cols.map(([k, l, f]) => `<th scope="col" class="${k === 'amt' ? 'r' : ''} ${k === 'iss' ? 'col-iss' : ''}" ${S.sort === f ? `aria-sort="${S.dir === 1 ? 'ascending' : 'descending'}"` : ''}><button class="sortbtn" data-s="${f}" type="button">${l}<svg class="ico arr"><use href="#i-down"/></svg></button></th>`).join('')}
  <th scope="col"><span class="sr">Actions</span></th></tr></thead>`;
}
function actionFor(r) {
  return ({ Overdue: 'Send reminder', Open: 'Record payment', Draft: 'Send invoice', Paid: 'Download', Credited: 'Download' })[r.status];
}
function rowHtml(r) {
  const sel = S.sel.has(r.n);
  const cls = { Overdue: 'danger', Open: 'accent', Paid: 'success', Draft: '', Credited: 'warning' }[r.status];
  const dueTxt = r.due ? rel(r.due) : null;
  const dueCell = dueTxt ? `<time datetime="${r.due}" title="${dFmt.format(new Date(r.due + 'T00:00:00Z'))}">${dueTxt}</time>` : '<span class="muted" aria-label="None">–</span>';
  const amt = r.amount < 0 ? '−' + money.format(-r.amount) : money.format(r.amount);
  return `<tr data-n="${r.n}" data-sel="${sel}">
    <td class="cb"><label class="cbl"><input class="check rc" type="checkbox" data-n="${r.n}" ${sel ? 'checked' : ''} aria-label="Select ${esc(r.id)}"></label></td>
    <td class="inv"><a class="id" href="#" title="${esc(r.id)}">${esc(r.id)}</a></td>
    <td class="cus" title="${esc(r.customer)}">${esc(r.customer)}</td>
    <td class="st"><span class="badge ${cls}">${r.status}</span></td>
    <td class="iss" ><time datetime="${r.issued}" title="${dFmt.format(new Date(r.issued + 'T00:00:00Z'))}">${rel(r.issued)}</time></td>
    <td class="due">${dueCell}</td>
    <td class="amt r num">${amt}</td>
    <td class="act"><span class="act-wrap"><button class="rowbtn" type="button" data-a="${r.n}">${actionFor(r)}</button><button class="kebab" type="button" aria-label="More actions for ${esc(r.id)}" aria-haspopup="menu" aria-expanded="${S.open === r.n}" data-k="${r.n}"><svg class="ico"><use href="#i-more"/></svg></button>
      ${S.open === r.n ? `<div class="menu" role="menu"><button role="menuitem" data-m="view" data-n="${r.n}">View invoice</button><button role="menuitem" data-m="dup" data-n="${r.n}">Duplicate</button><button role="menuitem" data-m="pdf" data-n="${r.n}">Download PDF</button>${r.status !== 'Paid' && r.status !== 'Credited' ? `<button role="menuitem" class="d" data-m="void" data-n="${r.n}">Void invoice</button>` : ''}</div>` : ''}</span></td></tr>`;
}
function render() {
  renderTabs(); renderHead();
  const rows = filtered(), total = rows.length;
  const pages = Math.max(1, Math.ceil(total / S.size)); S.page = Math.min(S.page, pages);
  const start = (S.page - 1) * S.size, view = rows.slice(start, start + S.size);
  // toolbar
  const nSel = S.sel.size;
  $('bulk').hidden = !nSel; $('normal').style.display = nSel ? 'none' : 'contents';
  if (nSel) $('bulk').innerHTML = `<b class="num">${nSel} selected</b><button class="btn sm" data-b="remind">Send reminders</button><button class="btn sm" data-b="paid">Mark as paid</button><button class="btn sm" data-b="dl">Download PDFs</button><span class="spacer"></span><button class="linkbtn" data-b="clear">Clear selection</button>`;
  $('q').value = S.q; cusSel.value = S.cus; $('f-date').value = S.date; $('f-amt').value = S.amt;
  [['f-cus', S.cus], ['f-date', S.date], ['f-amt', S.amt]].forEach(([id, v]) => $(id).classList.toggle('on', !!v));
  $('clear').hidden = !hasFilters();
  const nf = [S.cus, S.date, S.amt].filter(Boolean).length;
  $('fbtn-t').textContent = nf ? `Filters (${nf})` : 'Filters';
  $('fg').classList.toggle('open', S.fOpen); $('fbtn').setAttribute('aria-expanded', S.fOpen);
  // area
  const area = $('area'); area.setAttribute('aria-busy', S.load);
  const head = `<table>${theadHtml(view)}`;
  if (S.load) {
    const sk = Array.from({ length: 10 }, () => `<tr><td class="cb"></td><td class="inv"><span class="skel" style="width:70%"></span></td><td class="cus"><span class="skel" style="width:60%"></span></td><td class="st"><span class="skel" style="width:60px"></span></td><td class="iss"><span class="skel" style="width:60%"></span></td><td class="due"><span class="skel" style="width:60%"></span></td><td class="amt r"><span class="skel" style="width:70%;margin-left:auto"></span></td><td class="act"></td></tr>`).join('');
    area.innerHTML = head + `<tbody>${sk}</tbody></table><span class="sr" role="status">Loading invoices</span>`; $('pager').innerHTML = ''; return;
  }
  if (S.err) { area.innerHTML = `<div class="panel"><svg class="ico" style="width:24px;height:24px;color:var(--danger)"><use href="#i-alert"/></svg><h2>Couldn’t load invoices</h2><p>The server didn’t respond. Your invoices are safe. Your filters are still applied.</p><div class="btns"><button class="btn" id="retry">Try again</button><a class="touch-a" href="#">Check status</a></div></div>`; $('pager').innerHTML = ''; return; }
  if (EMPTY) { area.innerHTML = `<div class="panel"><h2>No invoices yet</h2><p>Invoices you create or import appear here, with their payment status.</p><div class="btns"><button class="btn primary">Create your first invoice</button><a class="touch-a" href="#">Import from CSV</a></div></div>`; $('pager').innerHTML = ''; return; }
  if (!total) { area.innerHTML = head + `<tbody></tbody></table><div class="panel"><h2>No invoices match these filters</h2><p>${S.q ? `Nothing matches “${esc(S.q)}”. ` : ''}Check the spelling or remove a filter.</p><div class="btns"><button class="btn" id="clear2">Clear filters</button></div></div>`; $('pager').innerHTML = ''; return; }
  area.innerHTML = head + `<tbody>${view.map(rowHtml).join('')}</tbody></table>`;
  const all = $('all'); if (all) all.indeterminate = !all.checked && view.some(r => S.sel.has(r.n));
  // pager
  const pn = new Set([1, pages, S.page, S.page - 1, S.page + 1].filter(p => p >= 1 && p <= pages));
  const list = [...pn].sort((a, b) => a - b); let pb = '', prev = 0;
  list.forEach(p => { if (p - prev > 1) pb += '<span aria-hidden="true">…</span>'; pb += `<button class="btn sm pg num" data-p="${p}" ${p === S.page ? 'aria-current="page"' : ''} aria-label="Page ${p}">${p}</button>`; prev = p; });
  $('pager').innerHTML = `<span class="num">${(start + 1).toLocaleString('en-GB')}–${(start + view.length).toLocaleString('en-GB')} of ${total.toLocaleString('en-GB')}</span>
    <div class="grp"><label for="size">Rows</label><select class="input sel" id="size" style="min-width:72px">${[25, 50, 100].map(n => `<option ${n === S.size ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <button class="btn sm pgnav" data-p="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">Previous</button>${pb}<button class="btn sm pgnav" data-p="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">Next</button></div>`;
}

/* ---- events ---- */
let toastT;
function toast(msg, undo) {
  const t = $('toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
  if (undo) t.querySelector('button').onclick = () => { undo(); t.hidden = true; };
}
const byN = n => invoices.find(r => r.n === +n);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t],[data-s],[data-k],[data-a],[data-m],[data-p],[data-b],#clear,#clear2,#retry,#fbtn,#export');
  if (!t) { if (S.open) { S.open = null; render(); } return; }
  if (t.dataset.t) { S.tab = t.dataset.t; S.page = 1; S.sel.clear(); }
  else if (t.dataset.s) { const f = t.dataset.s; if (S.sort === f) S.dir *= -1; else { S.sort = f; S.dir = (f === 'amount' || f === 'n') ? -1 : 1; } }
  else if (t.dataset.k) { S.open = S.open === +t.dataset.k ? null : +t.dataset.k; }
  else if (t.dataset.a) { const r = byN(t.dataset.a), act = actionFor(r); S.open = null;
    if (r.status === 'Overdue') toast(`Reminder sent to ${r.customer} for ${r.id}`);
    else if (r.status === 'Open') { const old = r.status; r.status = 'Paid'; toast(`${r.id} marked as paid`, () => { r.status = old; render(); }); }
    else if (r.status === 'Draft') { r.status = 'Open'; toast(`${r.id} sent to ${r.customer}`); }
    else toast(`Downloading ${r.id}.pdf`); }
  else if (t.dataset.m) { const r = byN(t.dataset.n); S.open = null; if (t.dataset.m === 'void') { const old = r.status; r.status = 'Draft'; toast(`${r.id} voided`, () => { r.status = old; render(); }); } else toast(({ view: 'Opening ', dup: 'Duplicated ', pdf: 'Downloading ' })[t.dataset.m] + r.id); }
  else if (t.dataset.p) { S.page = +t.dataset.p; S.open = null; }
  else if (t.dataset.b) { const b = t.dataset.b, n = S.sel.size; if (b === 'clear') S.sel.clear(); else { toast(({ remind: `Sent ${plural(n, 'reminder', 'reminders')}`, paid: `Marked ${plural(n, 'invoice', 'invoices')} as paid`, dl: `Downloading ${plural(n, 'PDF', 'PDFs')}` })[b]); S.sel.clear(); } }
  else if (t.id === 'clear' || t.id === 'clear2') { S.q = S.cus = S.date = S.amt = ''; S.tab = 'All'; }
  else if (t.id === 'retry') { S.err = false; }
  else if (t.id === 'fbtn') { S.fOpen = !S.fOpen; }
  else if (t.id === 'export') { toast(`Exporting ${plural(filtered().length, 'invoice', 'invoices')} to CSV`); return; }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'all') { const rows = filtered().slice((S.page - 1) * S.size, S.page * S.size); rows.forEach(r => t.checked ? S.sel.add(r.n) : S.sel.delete(r.n)); }
  else if (t.classList.contains('rc')) { t.checked ? S.sel.add(+t.dataset.n) : S.sel.delete(+t.dataset.n); }
  else if (t.id === 'f-cus') { S.cus = t.value; S.page = 1; }
  else if (t.id === 'f-date') { S.date = t.value; S.page = 1; }
  else if (t.id === 'f-amt') { S.amt = t.value; S.page = 1; }
  else if (t.id === 'size') { S.size = +t.value; S.page = 1; }
  else return;
  render();
});
let qt; $('q').addEventListener('input', e => { S.q = e.target.value; S.page = 1; clearTimeout(qt); qt = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = $('q'); q.focus(); q.setSelectionRange(pos, pos); }, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = null; render(); } });
if (state === 'stress') { S.size = 100; }
render();
</script>
