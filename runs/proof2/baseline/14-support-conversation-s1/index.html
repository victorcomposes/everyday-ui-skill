<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harborline - Conversation</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f8f9fb; --line:#e3e6eb; --line-strong:#cfd4dc;
  --text:#1b2330; --muted:#5d6878; --accent:#0b6b73; --accent-soft:#dcf1f2; --accent-text:#fff;
  --note-bg:#fff6dc; --note-line:#ecd58a; --note-text:#4a3b07;
  --cust-bg:#fff; --agent-bg:#e6f3f4; --sys:#6a7586;
  --ok:#157347; --ok-soft:#dff3e7; --warn:#9a5b00; --warn-soft:#fdeccd; --bad:#b3261e; --bad-soft:#fbe0de;
  --focus:#1a5fd0;
  --shadow:0 8px 28px rgba(15,25,40,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1318; --surface:#171c23; --surface-2:#1c222b; --line:#2a313c; --line-strong:#3a4350;
    --text:#e8ecf2; --muted:#9aa6b6; --accent:#4fc3cc; --accent-soft:#17353a; --accent-text:#06262a;
    --note-bg:#2b2610; --note-line:#5b4e1c; --note-text:#f0e2a8;
    --cust-bg:#1c222b; --agent-bg:#143036; --sys:#8d99aa;
    --ok:#5fd08d; --ok-soft:#14301f; --warn:#f0b255; --warn-soft:#35270d; --bad:#ff8f86; --bad-soft:#3a1816;
    --focus:#7fb0ff;
    --shadow:0 8px 28px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:56px 300px minmax(0,1fr) 320px;height:100vh;height:100dvh;overflow:hidden}

/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;margin-bottom:10px}
.logo svg{width:20px;height:20px;stroke-width:2}
.rail button{width:38px;height:38px;border:0;background:none;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.rail button:hover{background:var(--surface-2);color:var(--text)}
.rail button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.rail .me{margin-top:auto;width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}

/* list */
.list{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.list h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.count{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:5px 10px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13px}
.tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.conv-list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
.conv{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;border-left:3px solid transparent}
.conv:hover{background:var(--surface-2)}
.conv[aria-current=true]{background:var(--accent-soft);border-left-color:var(--accent)}
.conv .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.conv .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .who::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.conv time{font-size:12px;color:var(--muted);white-space:nowrap}
.conv .subj{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv .snip{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.conv .meta{display:flex;gap:6px;margin-top:6px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.open{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.pending{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.solved{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .ttl{flex:1;min-width:200px}
.top h1{margin:0;font-size:16px;line-height:1.3}
.top .sub{color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .tools{display:flex;gap:8px;align-items:center}
.icon-btn{display:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;align-items:center;gap:6px;font-weight:500}
.sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;height:34px;padding:0 8px}
.sla{color:var(--warn);font-weight:600}

.thread{flex:1;overflow:auto;padding:20px;scroll-behavior:smooth}
.thread-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 12px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.agent{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);flex:none;margin-top:2px}
.msg.agent .av{background:var(--accent);color:var(--accent-text)}
.bubble{background:var(--cust-bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(580px,calc(100% - 44px));min-width:0}
.msg.agent .bubble{background:var(--agent-bg);border-color:transparent}
.bubble .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.bubble .hd b{color:var(--text);font-size:13px}
.bubble p{margin:0 0 8px;overflow-wrap:anywhere}
.bubble p:last-child{margin:0}
.msg.note .bubble{background:var(--note-bg);border:1px dashed var(--note-line);color:var(--note-text)}
.msg.note .hd,.msg.note .hd b{color:var(--note-text)}
.msg.note .av{background:var(--note-line);color:var(--note-text)}
.event{align-self:center;display:flex;align-items:center;gap:8px;color:var(--sys);font-size:12.5px;text-align:center;max-width:100%}
.event svg{width:14px;height:14px}
.event time{white-space:nowrap}

/* composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:12px 20px 14px}
.comp-in{max-width:760px;margin:0 auto;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);overflow:hidden}
.comp-in:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.comp-in.note{background:var(--note-bg);border-color:var(--note-line)}
.comp-in.note:focus-within{box-shadow:0 0 0 1px var(--focus);border-color:var(--focus)}
.mode{display:flex;border-bottom:1px solid var(--line);align-items:center;padding:0 6px;gap:2px}
.comp-in.note .mode{border-color:var(--note-line)}
.mode button.m{border:0;background:none;padding:9px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.mode button.m[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.comp-in.note .mode .m[aria-selected=true]{color:var(--note-text)}
.mode .to{margin-left:auto;font-size:12.5px;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-in.note .to{color:var(--note-text)}
textarea{display:block;width:100%;border:0;resize:vertical;background:transparent;padding:12px 14px;min-height:96px;max-height:40vh;outline:none}
textarea::placeholder{color:var(--muted)}
.comp-foot{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.comp-in.note .comp-foot{border-color:var(--note-line)}
.comp-foot .sp{flex:1}
.hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;height:34px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}

/* side */
.side{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0}
.side .close{display:none}
.card{padding:16px;border-bottom:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cust{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cust .av{width:44px;height:44px;font-size:15px;margin:0}
.cust b{display:block;font-size:15px}
.cust span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.items{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{display:flex;gap:10px;align-items:center}
.thumb{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.items .n{flex:1;min-width:0}
.items .n small{display:block;color:var(--muted)}
.items .p{font-variant-numeric:tabular-nums}
.track{list-style:none;margin:12px 0 0;padding:0 0 0 4px}
.track li{position:relative;padding:0 0 12px 20px;font-size:13px}
.track li::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.track li::after{content:"";position:absolute;left:4px;top:15px;bottom:-5px;width:1px;background:var(--line-strong)}
.track li:last-child::after{display:none}
.track li.now::before{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.track li.done::before{background:var(--ok)}
.track small{display:block;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.scrim{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:56px 280px minmax(0,1fr)}
  .side{position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(100%);transition:transform .22s;box-shadow:var(--shadow)}
  body.show-side .side{transform:none}
  body.show-side .scrim{display:block}
  .icon-btn.det{display:inline-flex}
  .side .close{display:inline-flex}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .list{position:fixed;top:0;left:0;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  body.show-list .list{transform:none}
  body.show-list .scrim{display:block}
  .icon-btn.inbox{display:inline-flex}
  .top{padding:10px 12px}
  .thread{padding:14px 12px}
  .composer{padding:10px 12px 12px}
  .hint{display:none}
  .mode .to{display:none}
  .bubble{max-width:calc(100% - 42px)}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15c2 0 2-1.5 4.5-1.5S10 15 12 15s2.5-1.5 4.5-1.5S19 15 21 15M12 4v9M8 8h8M5 19c2 0 2-1 4-1s2.500 1 3 1 1-1 3-1 2 1 4 1"/></svg></div>
    <button aria-current="page" aria-label="Inbox" title="Inbox"><svg viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></svg></button>
    <button aria-label="Customers" title="Customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.500 20c0-3.500 3-6 6.500-6s6.500 2.500 6.500 6M16 4.500a3.500 3.500 0 010 7M18 14c2.200.800 3.500 2.700 3.500 6"/></svg></button>
    <button aria-label="Reports" title="Reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></button>

    <div class="me" title="Dana Okafor">DO</div>
  </nav>

  <aside class="list" aria-label="Conversations">
    <header>
      <h2>Inbox <span class="count" id="count"></span></h2>
      <div class="tabs" role="tablist" aria-label="Filter">
        <button class="tab" role="tab" aria-selected="true" data-f="all">All</button>
        <button class="tab" role="tab" aria-selected="false" data-f="open">Open</button>
        <button class="tab" role="tab" aria-selected="false" data-f="pending">Pending</button>
        <button class="tab" role="tab" aria-selected="false" data-f="solved">Solved</button>
      </div>
    </header>
    <ul class="conv-list" id="convs"></ul>
  </aside>

  <main class="main">
    <div class="top">
      <button class="icon-btn inbox" id="openList" aria-label="Open inbox"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Inbox</button>
      <div class="ttl">
        <h1 id="subject"></h1>
        <div class="sub" id="subMeta"></div>
      </div>
      <div class="tools">
        <label class="sr" for="status">Status</label>
        <select class="sel" id="status">
          <option value="open">Open</option>
          <option value="pending">Pending</option>
          <option value="solved">Solved</option>
        </select>
        <button class="icon-btn det" id="openSide" aria-label="Open customer and order details"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-7 8-7s8 3 8 7"/></svg>Details</button>
      </div>
    </div>

    <section class="thread" id="thread" aria-label="Messages" tabindex="0"><div class="thread-in" id="msgs" aria-live="polite"></div></section>

    <form class="composer" id="form">
      <div class="comp-in" id="compIn">
        <div class="mode" role="tablist" aria-label="Message type">
          <button type="button" class="m" role="tab" aria-selected="true" data-m="reply">Reply</button>
          <button type="button" class="m" role="tab" aria-selected="false" data-m="note">Internal note</button>
          <span class="to" id="to"></span>
        </div>
        <label class="sr" for="body">Message</label>
        <textarea id="body" placeholder="Write a reply to the customer"></textarea>
        <div class="comp-foot">
          <label class="sr" for="macro">Saved replies</label>
          <select class="sel" id="macro" style="height:30px">
            <option value="">Saved replies</option>
            <option value="late">Apology for a late order</option>
            <option value="trace">Carrier trace opened</option>
            <option value="reship">Offer a free reship</option>
            <option value="refund">Offer a refund</option>
          </select>
          <span class="hint">Ctrl + Enter to send</span>
          <span class="sp"></span>
          <label class="sr" for="after">Status after sending</label>
          <select class="sel" id="after" style="height:30px">
            <option value="pending">Send, set Pending</option>
            <option value="open">Send, keep Open</option>
            <option value="solved">Send, set Solved</option>
          </select>
          <button class="btn primary" id="send" type="submit" disabled>Send</button>
        </div>
      </div>
    </form>
  </main>

  <aside class="side" id="side" aria-label="Customer and order">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px">
      <strong>Details</strong>
      <button class="btn sm close" id="closeSide" type="button">Close</button>
    </div>
    <div class="card" id="custCard"></div>
    <div class="card" id="orderCard"></div>
    <div class="card" id="tagCard"></div>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"></div>

const macros = {
 late:"Hi {n}, I am sorry your order {o} is late. I have checked it and the carrier has not scanned it since Nov 22. I will update you again by end of day.",
 trace:"Hi {n}, I opened a trace with Parcelwise for order {o} (case PW-CS-220981). They answer within 48 hours of the case opening. I will write to you as soon as they do.",
 reship:"Hi {n}, I can send you a new pair of your order {o} today with Express shipping at no cost. It leaves our hub this afternoon and the carrier quotes next-day delivery. Shall I go ahead?",
 refund:"Hi {n}, I can refund order {o} in full to your original payment method now. The money normally arrives in 3 to 5 working days. Tell me if you want me to start it."
};

let cur = convs[0], filter = "all", mode = "reply";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = n => n.split(" ").map(w => w[0]).slice(0,2).join("");

function renderList(){
  const items = convs.filter(c => filter === "all" || c.status === filter);
  $("#count").textContent = items.length + " conversation" + (items.length === 1 ? "" : "s");
  $("#convs").innerHTML = items.map(c => {
    const last = [...c.msgs].reverse().find(m => ["cust","agent"].includes(m.k));
    return `<li><button class="conv${c.unread?" unread":""}" data-id="${c.id}" ${c.id===cur.id?'aria-current="true"':""}>
      <span class="row"><span class="who">${esc(c.name)}</span><time>${c.when}</time></span>
      <span class="subj" style="display:block">${esc(c.subject)}</span>
      <span class="snip">${esc(last.b[0])}</span>
      <span class="meta"><span class="pill ${c.status}">${c.status[0].toUpperCase()+c.status.slice(1)}</span><span class="pill">${c.order.id}</span></span>
    </button></li>`;
  }).join("") || '<li style="padding:20px;color:var(--muted)">No conversations in this view.</li>';
}

function renderThread(){
  $("#subject").textContent = cur.subject;
  $("#subMeta").innerHTML = `<span>${esc(cur.name)}</span><span>&middot;</span><span class="pill ${cur.status}">${cur.status[0].toUpperCase()+cur.status.slice(1)}</span><span>&middot;</span><span class="${cur.status==="open"?"sla":""}">${esc(cur.sla)}</span>`;
  $("#status").value = cur.status;
  $("#msgs").innerHTML = cur.msgs.map(m => {
    if (m.k === "day") return `<div class="day">${m.t}</div>`;
    if (m.k === "event") return `<div class="event">${ic[m.i]}<span>${esc(m.b)}</span><time>${m.t}</time></div>`;
    const a = m.k !== "cust";
    const label = m.k === "note" ? " &middot; internal note" : "";
    return `<article class="msg ${m.k==="cust"?"":"agent"} ${m.k}">
      <div class="av" aria-hidden="true">${ini(m.who)}</div>
      <div class="bubble"><div class="hd"><b>${esc(m.who)}</b><span>${m.t}${label}</span></div>${m.b.map(p=>`<p>${esc(p)}</p>`).join("")}</div></article>`;
  }).join("");
  $("#to").textContent = mode === "reply" ? `To: ${cur.name} <${cur.email}>` : "Only your team sees this";
  const t = $("#thread"); t.scrollTop = t.scrollHeight;
}

function renderSide(){
  const o = cur.order;
  $("#custCard").innerHTML = `<h3>Customer</h3>
    <div class="cust"><div class="av" aria-hidden="true">${ini(cur.name)}</div><div><b>${esc(cur.name)}</b><span>${esc(cur.email)}</span></div></div>
    <dl><dt>Customer since</dt><dd>${cur.since}</dd><dt>Orders</dt><dd>${cur.orders}</dd><dt>Total spent</dt><dd>${cur.spent}</dd><dt>Shop</dt><dd>${SHOP}</dd></dl>`;
  $("#orderCard").innerHTML = `<h3>Order ${o.id}<span class="pill ${/Delivered/.test(JSON.stringify(o.track))?"solved":"pending"}">${/Delivered/.test(JSON.stringify(o.track))?"Delivered":(cur.id===1?"Delayed":"In progress")}</span></h3>
    <ul class="items">${o.items.map(i=>`<li><span class="thumb" aria-hidden="true">${i[1]?ic.box:ic.truck}</span><span class="n">${esc(i[0])}<small>${esc(i[1]||"Standard shipping")}</small></span><span class="p">${i[2]}</span></li>`).join("")}</ul>
    <dl><dt>Total</dt><dd><b>${o.total}</b></dd><dt>Placed</dt><dd>${o.placed}</dd><dt>Method</dt><dd>${esc(o.method)}</dd><dt>Ship to</dt><dd>${esc(o.addr)}</dd><dt>Tracking</dt><dd>${esc(o.trk)}</dd></dl>
    <ol class="track">${o.track.map(s=>`<li class="${s[0]}">${esc(s[1])}<small>${esc(s[2])}</small></li>`).join("")}</ol>
    <div class="actions"><button class="btn sm" type="button" data-macro="reship">Offer reship</button><button class="btn sm" type="button" data-macro="refund">Offer refund</button></div>`;
  $("#tagCard").innerHTML = `<h3>Tags</h3><div class="tags">${cur.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`;
}

function renderAll(){ renderList(); renderThread(); renderSide(); }

function toast(s){ const t=$("#toast"); t.textContent=s; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2200); }
function closeDrawers(){ document.body.classList.remove("show-list","show-side"); }
function now(){ return new Date(2026,10,27,12,0).toLocaleString("en-GB",{month:"short",day:"numeric"}) + ", " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }

function setMode(m){
  mode = m;
  document.querySelectorAll(".m").forEach(b => b.setAttribute("aria-selected", b.dataset.m === m));
  $("#compIn").classList.toggle("note", m === "note");
  $("#body").placeholder = m === "note" ? "Write a note for your team" : "Write a reply to the customer";
  $("#after").hidden = m === "note";
  $("#send").textContent = m === "note" ? "Add note" : "Send";
  $("#to").textContent = m === "reply" ? `To: ${cur.name} <${cur.email}>` : "Only your team sees this";
}

document.addEventListener("click", e => {
  const c = e.target.closest(".conv");
  if (c){ cur = convs.find(x => x.id == c.dataset.id); cur.unread = false; $("#body").value = ""; $("#send").disabled = true; renderAll(); closeDrawers(); return; }
  const t = e.target.closest(".tab");
  if (t){ filter = t.dataset.f; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t)); renderList(); return; }
  const m = e.target.closest(".m"); if (m){ setMode(m.dataset.m); $("#body").focus(); return; }
  const mc = e.target.closest("[data-macro]"); if (mc){ setMode("reply"); fill(mc.dataset.macro); closeDrawers(); return; }
  if (e.target.closest("#openList")) document.body.classList.add("show-list");
  if (e.target.closest("#openSide")) document.body.classList.add("show-side");
  if (e.target.closest("#closeSide") || e.target.id === "scrim") closeDrawers();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawers(); });

function fill(key){
  $("#body").value = macros[key].replace("{n}", cur.name.split(" ")[0]).replace("{o}", cur.order.id);
  $("#send").disabled = false; $("#body").focus();
}
$("#macro").addEventListener("change", e => { if (e.target.value) fill(e.target.value); e.target.value = ""; setMode("reply"); });
$("#body").addEventListener("input", e => { $("#send").disabled = !e.target.value.trim(); });
$("#body").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !$("#send").disabled) $("#form").requestSubmit(); });
$("#status").addEventListener("change", e => { cur.status = e.target.value; cur.sla = cur.status === "solved" ? "Solved" : cur.status === "pending" ? "Waiting on customer" : cur.sla; renderAll(); toast("Status set to " + cur.status); });

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("#body").value.trim(); if (!text) return;
  const t = now();
  cur.msgs.push({k: mode === "note" ? "note" : "agent", who: ME.name, t, b: text.split(/\n+/)});
  if (mode === "reply"){ cur.status = $("#after").value; cur.sla = cur.status === "solved" ? "Solved" : cur.status === "pending" ? "Waiting on customer" : "Reply sent"; cur.unread = false; }
  cur.when = "Now";
  $("#body").value = ""; $("#send").disabled = true;
  renderAll(); toast(mode === "note" ? "Note added" : "Reply sent");
});

setMode("reply");
renderAll();
</script>
</body>
</html>
