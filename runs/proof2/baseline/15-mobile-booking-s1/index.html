<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a check-up - Fernlea Dental</title>
<style>
:root{
  --bg:#eef2ec; --surface:#fff; --surface2:#f3f6f2; --ink:#1b2a21; --muted:#56655b;
  --line:#d6dfd7; --primary:#2b6a4c; --on-primary:#fff; --soft:#e0eee5; --focus:#1a5fb4;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 8px 24px rgba(20,40,28,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c110e; --surface:#161f19; --surface2:#1d2821; --ink:#e7efe9; --muted:#a2b2a7;
    --line:#2a382f; --primary:#74c39a; --on-primary:#08160e; --soft:#1f3a2b; --focus:#8ab8ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.app{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;position:relative}
@media (min-width:480px){
  body{padding:32px 0}
  .app{min-height:calc(100dvh - 64px);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:clip}
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.back{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.back:hover{background:var(--surface2)}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--primary);margin-left:auto;padding-right:8px;font-size:15px;letter-spacing:.01em}
h1{font-size:24px;line-height:1.2;margin:0;padding:4px 20px 0;letter-spacing:-.01em}
.sub{margin:6px 20px 0;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}

main{padding:8px 0 24px;flex:1}
fieldset{border:0;margin:0;padding:20px 20px 0;min-width:0}
legend{padding:0;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;float:left;width:100%;margin-bottom:12px}
legend+*{clear:both}
.num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:13px;display:grid;place-items:center;flex:none}
.hint{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}

.docs{display:grid;gap:10px}
.doc label{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;min-height:72px;background:var(--surface)}
.doc input:checked+label{border-color:var(--primary);background:var(--soft)}
.doc label:hover{border-color:var(--primary)}
.doc input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff}
.doc .meta{flex:1;min-width:0}
.doc .name{font-weight:650;display:block}
.doc .role,.doc .next{font-size:14px;color:var(--muted);display:block}
.doc .next b{color:var(--ink);font-weight:600}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.doc input:checked+label .tick{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.month{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 8px}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;scroll-snap-type:x proximity;scrollbar-width:thin}
.date{flex:none;scroll-snap-align:start;position:relative}
.date label{width:56px;height:76px;border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:var(--surface)}
.date .dow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.date .dom{font-size:20px;font-weight:700}
.date label:hover{border-color:var(--primary)}
.date input:checked+label{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.date input:checked+label .dow{color:inherit;opacity:.85}
.date input:disabled+label{background:var(--surface2);color:var(--muted);cursor:not-allowed;border-style:dashed}
.date input:disabled+label .dom{font-weight:500;text-decoration:line-through}
.date input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.legend{font-size:13px;color:var(--muted);margin:2px 0 0}

.part{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.part:first-child{margin-top:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative}
.slot label{display:flex;align-items:center;justify-content:center;min-height:46px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface)}
.slot label:hover{border-color:var(--primary)}
.slot input:checked+label{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.slot input:disabled+label{background:var(--surface2);color:var(--muted);text-decoration:line-through;cursor:not-allowed;font-weight:500;border-style:dashed}
.slot input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.empty{background:var(--surface2);border-radius:14px;padding:16px;color:var(--muted);font-size:15px;text-align:center}

.bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:grid;gap:10px}
.sum{font-size:14px;color:var(--muted);min-height:21px}
.sum b{color:var(--ink);font-weight:650}
.cta{height:52px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:17px;cursor:pointer}
.cta:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;border:1.5px solid var(--line)}
.cta:not(:disabled):hover{filter:brightness(1.07)}

.done{display:none;padding:32px 20px;text-align:center;flex:1}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;margin:16px auto}
.done h2{margin:0 0 6px;font-size:24px}
.done p{margin:0;color:var(--muted)}
.card{margin:24px 0;padding:0;border:1.5px solid var(--line);border-radius:16px;text-align:left;overflow:hidden}
.card div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px}
.card div+div{border-top:1px solid var(--line)}
.card dt{color:var(--muted)}
.card dd{margin:0;font-weight:650;text-align:right}
.ghost{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:650;cursor:pointer}
.ghost:hover{border-color:var(--primary)}
.is-done h1,.is-done .sub,.is-done main,.is-done .bar{display:none}
.is-done .done{display:block}
@media (prefers-reduced-motion:no-preference){.date label,.slot label,.doc label,.cta{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="back" type="button" aria-label="Back to appointments">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20C4 11 10 5 20 4c0 10-6 16-16 16z"/><path d="M4 20c3-5 6-8 10-10"/></svg>
      Fernlea
    </span>
  </header>
  <h1>Book a check-up</h1>
  <p class="sub"><span class="chip">Routine check-up</span> 30 min &middot; Birch Lane clinic</p>

  <main>
    <fieldset>
      <legend><span class="num" aria-hidden="true">1</span>Choose your dentist</legend>
      <div class="docs" id="docs"></div>
    </fieldset>

    <fieldset>
      <legend><span class="num" aria-hidden="true">2</span>Pick a date</legend>
      <p class="month" id="month"></p>
      <div class="dates" id="dates"></div>
      <p class="legend">Struck-through days have no appointments for this dentist.</p>
    </fieldset>

    <fieldset>
      <legend><span class="num" aria-hidden="true">3</span>Pick a time<span class="hint" id="tzhint"></span></legend>
      <div id="times" aria-live="polite"></div>
    </fieldset>
  </main>

  <div class="bar">
    <div class="sum" id="sum" aria-live="polite"></div>
    <button class="cta" id="cta" type="button" disabled>Confirm booking</button>
  </div>

  <section class="done" id="done" aria-live="polite" tabindex="-1">
    <div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>You are booked in</h2>
    <p>We sent a confirmation to s.whitfield@example.com.</p>
    <dl class="card" id="card"></dl>
    <p style="margin-bottom:20px;font-size:14px">Free to change or cancel up to 24 hours before.</p>
    <button class="ghost" id="change" type="button">Change booking</button>
  </section>
</div>

<script>
const DOCS=[
 {id:"amara",name:"Dr Amara Okafor",role:"General dentist, 12 years",days:[1,2,3,4],color:"#2b6a4c"},
 {id:"tom",name:"Dr Tom Hendry",role:"General dentist, 8 years",days:[2,3,4,5,6],color:"#7a4e9a"},
 {id:"priya",name:"Dr Priya Nair",role:"Family dentist, 15 years",days:[1,3,5],color:"#a35a2a"}
];
const DAYS=Array.from({length:21},(_,i)=>new Date(2026,10,28+i)); // first bookable day: Sat 28 Nov 2026
const TIMES=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","14:00","14:30","15:00","15:30","16:00","16:30"];
const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
// deterministic fake "already booked" pattern
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const works=(doc,d)=>doc.days.includes(d.getDay());
const free=(doc,d,t)=>works(doc,d)&&hash(doc.id+key(d)+t)%100>=38;
const avail=(doc,d)=>works(doc,d)&&TIMES.some(t=>free(doc,d,t));
const fmtDay=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtLong=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtT=t=>{const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+(h<12?" am":" pm")};
const initials=n=>n.replace("Dr ","").split(" ").map(w=>w[0]).join("");

const S={doc:"amara",date:null,time:null};
const $=id=>document.getElementById(id);
const doc=()=>DOCS.find(d=>d.id===S.doc);

function renderDocs(){
  $("docs").innerHTML=DOCS.map(d=>{
    const n=DAYS.find(x=>avail(d,x));
    return `<div class="doc"><input class="vh" type="radio" name="doc" id="doc-${d.id}" value="${d.id}" ${S.doc===d.id?"checked":""}>
    <label for="doc-${d.id}"><span class="av" style="background:${d.color}" aria-hidden="true">${initials(d.name)}</span>
    <span class="meta"><span class="name">${d.name}</span><span class="role">${d.role}</span>
    <span class="next">Next available: <b>${n?fmtDay(n):"none soon"}</b></span></span>
    <span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></label></div>`}).join("");
}
function renderDates(){
  const d0=doc(), keep=$("dates").scrollLeft;
  $("dates").innerHTML=DAYS.map(d=>{
    const ok=avail(d0,d),k=key(d);
    return `<div class="date"><input class="vh" type="radio" name="date" id="d-${k}" value="${k}" ${ok?"":"disabled"} ${S.date&&key(S.date)===k?"checked":""}>
    <label for="d-${k}" aria-label="${fmtLong(d)}${ok?"":", unavailable"}"><span class="dow">${d.toLocaleDateString("en-GB",{weekday:"short"})}</span><span class="dom">${d.getDate()}</span></label></div>`}).join("");
  $("dates").scrollLeft=keep;
  $("month").textContent=(S.date||DAYS[0]).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
}
function renderTimes(){
  const el=$("times"),d0=doc();
  $("tzhint").textContent=S.date?"30 min slots":"";
  if(!S.date){el.innerHTML=`<div class="empty">Choose a date to see ${d0.name}'s free times.</div>`;return}
  const part=(label,list)=>`<p class="part">${label}</p><div class="slots">${list.map(t=>{
    const ok=free(d0,S.date,t);
    return `<div class="slot"><input class="vh" type="radio" name="time" id="t-${t.replace(":","")}" value="${t}" ${ok?"":"disabled"} ${S.time===t?"checked":""}>
    <label for="t-${t.replace(":","")}" ${ok?"":'aria-label="'+fmtT(t)+', booked"'}>${fmtT(t)}</label></div>`}).join("")}</div>`;
  el.innerHTML=part("Morning",TIMES.filter(t=>+t.slice(0,2)<12))+part("Afternoon",TIMES.filter(t=>+t.slice(0,2)>=12));
}
function renderBar(){
  const ready=S.date&&S.time;
  $("cta").disabled=!ready;
  $("sum").innerHTML=ready?`<b>${fmtLong(S.date)}, ${fmtT(S.time)}</b> with ${doc().name}`
    :`Still to choose: <b>${[!S.date&&"a date",!S.time&&"a time"].filter(Boolean).join(" and ")}</b>`;
}
function renderAll(){renderDocs();renderDates();renderTimes();renderBar()}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.name==="doc"){
    S.doc=t.value;
    if(S.date&&!avail(doc(),S.date)){S.date=null;S.time=null}
    else if(S.time&&!free(doc(),S.date,S.time))S.time=null;
    renderAll();$("doc-"+S.doc).focus();
  }
  if(t.name==="date"){
    S.date=DAYS.find(d=>key(d)===t.value);
    if(S.time&&!free(doc(),S.date,S.time))S.time=null;
    $("month").textContent=S.date.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    renderTimes();renderBar();
  }
  if(t.name==="time"){S.time=t.value;renderBar()}
});
$("cta").addEventListener("click",()=>{
  $("card").innerHTML=[["Dentist",doc().name],["Date",fmtLong(S.date)],["Time",fmtT(S.time)],["Where","Birch Lane clinic"]]
    .map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("");
  $("app").classList.add("is-done");window.scrollTo(0,0);$("done").focus();
});
$("change").addEventListener("click",()=>{$("app").classList.remove("is-done");renderAll()});
renderAll();
</script>
</body>
</html>
