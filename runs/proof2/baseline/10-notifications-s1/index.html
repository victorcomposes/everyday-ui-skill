<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - Gigwell</title>
<style>
:root{
  --bg:#f5f6f4; --surface:#fff; --surface-2:#f0f2ef; --line:#e1e5e0; --text:#17201b; --muted:#5d6a62;
  --accent:#0b7a5a; --accent-ink:#fff; --accent-soft:#dff3ea; --unread:#f1faf6; --danger:#b3261e;
  --amber:#8a5a00; --amber-soft:#fbefd0; --blue:#1d5fb4; --blue-soft:#e0ecfb; --violet:#6339b5; --violet-soft:#ece5fa;
  --rose:#a8325e; --rose-soft:#fae3ec; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1512; --surface:#171e1a; --surface-2:#1f2823; --line:#2a352f; --text:#e8efea; --muted:#93a399;
    --accent:#3fc496; --accent-ink:#06261b; --accent-soft:#17382d; --unread:#16241e; --danger:#ff8a80;
    --amber:#f0be5a; --amber-soft:#3a2f12; --blue:#7fb2f5; --blue-soft:#172a44; --violet:#b79cf3; --violet-soft:#2a2045;
    --rose:#f08cb0; --rose-soft:#44202f; --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--violet-soft);color:var(--violet)}
.me small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.me b{display:block;font-size:14px;line-height:1.3}

.main{padding:32px 40px 56px;min-width:0}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tools{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border-radius:10px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .n{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:none;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .n{font-size:11px;font-weight:700;opacity:.8}

.list{border-top:1px solid var(--line)}
.day{margin:0;padding:10px 18px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
ul.items{list-style:none;margin:0;padding:0}
.item{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.unread{background:var(--unread)}
.item.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.t-offer{background:var(--blue-soft);color:var(--blue)}
.t-msg{background:var(--violet-soft);color:var(--violet)}
.t-pay{background:var(--accent-soft);color:var(--accent)}
.t-contract{background:var(--amber-soft);color:var(--amber)}
.t-review{background:var(--rose-soft);color:var(--rose)}
.t-system{background:var(--surface-2);color:var(--muted)}
.body{min-width:0}
.title{margin:0;font-size:15px;line-height:1.4;font-weight:500}
.unread .title{font-weight:600}
.title b{font-weight:700}
.desc{margin:2px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.row-acts{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib svg{width:18px;height:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--accent);margin-bottom:8px}
.empty h2{margin:0 0 4px;color:var(--text);font-size:18px}
.empty p{margin:0}
.foot{padding:14px 18px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

/* prefs */
.prefs{padding:18px;position:sticky;top:24px}
.prefs h2{margin:0 0 2px;font-size:17px}
.prefs p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.ph{display:grid;grid-template-columns:1fr 56px 56px;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.ph span:not(:first-child){text-align:center}
.pr{display:grid;grid-template-columns:1fr 56px 56px;gap:4px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pr .sw{justify-self:center}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:10px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.quiet{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:14px}
.quiet small{display:block;color:var(--muted);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;display:flex;align-items:center;gap:14px;font-size:14px;transition:.2s;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:2px 6px}
.toast button[hidden]{display:none}
:root:not(.x){--toast-link:var(--accent)}
@media (prefers-color-scheme:light){.toast button{color:#7fe0bd}}

@media (max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .prefs{position:static}
}
@media (max-width:760px){
  .shell{display:block}
  .side{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);flex-direction:row}
  .side .brand,.side .me{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;align-items:center;position:relative}
  .nav .badge{position:absolute;top:0;left:calc(50% + 4px);margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .main{padding:20px 16px 96px}
  h1{font-size:24px}
  .head .btn{flex:1;justify-content:center}
  .item{grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 14px}
  .ico{width:36px;height:36px;border-radius:10px}
  .meta{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;margin-top:-2px}
  .tools{padding:12px}
  .toast{bottom:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 17c3 0 3-10 6-10s3 10 6 10 2-5 4-5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.5A8 8 0 1121 12z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 012 2v10a1 1 0 01-1 1H5a2 2 0 01-2-2V6a2 2 0 012-2h11"/><circle cx="16" cy="14" r="1.2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 004 0"/></symbol>
  <symbol id="i-offer" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.5.7-2.5 1.8s1 1.6 2.5 2 2.5.9 2.5 2-1.1 1.8-2.5 1.8c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/></symbol>
  <symbol id="i-sign" viewBox="0 0 24 24"><path d="M4 20h16M5 16l9.5-9.5a2.1 2.1 0 013 3L8 19l-4 1z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.8 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-checks" viewBox="0 0 24 24"><path d="M2 12.5L6.5 17 15 8M12 15.5l1.5 1.5L22 8"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="shell">
  <aside class="side">
    <a class="brand" href="#"><span class="logo"><svg class="i" style="stroke:currentColor"><use href="#i-logo"/></svg></span>Gigwell</a>
    <nav class="nav" aria-label="Main">
      <a href="#"><svg class="i"><use href="#i-home"/></svg>Home</a>
      <a href="#"><svg class="i"><use href="#i-brief"/></svg>Jobs</a>
      <a href="#"><svg class="i"><use href="#i-chat"/></svg>Messages</a>
      <a href="#"><svg class="i"><use href="#i-wallet"/></svg>Earnings</a>
      <a href="#" aria-current="page"><svg class="i"><use href="#i-bell"/></svg>Alerts<span class="badge" id="navBadge">0</span></a>
    </nav>
    <div class="me"><span class="avatar" aria-hidden="true">AO</span><span><b>Amara Okafor</b><small>Brand designer</small></span></div>
  </aside>

  <main class="main">
    <div class="wrap">
      <header class="head">
        <div>
          <h1>Notifications</h1>
          <p class="sub" id="summary" aria-live="polite"></p>
        </div>
        <button class="btn" id="markAll" type="button"><svg class="i"><use href="#i-checks"/></svg>Mark all as read</button>
      </header>

      <section aria-label="Notification list">
        <div class="panel">
          <div class="tools">
            <div class="seg" role="group" aria-label="Show">
              <button type="button" data-status="all" aria-pressed="true">All</button>
              <button type="button" data-status="unread" aria-pressed="false">Unread <span class="n" id="unreadN"></span></button>
            </div>
            <div class="chips" role="group" aria-label="Filter by type" id="chips"></div>
          </div>
          <div class="list" id="list"></div>
          <div class="foot">Notifications older than 30 days are archived automatically.</div>
        </div>
      </section>

      <aside class="panel prefs" id="prefs" aria-labelledby="prefsH">
        <h2 id="prefsH">Delivery settings</h2>
        <p>Choose how Gigwell reaches you outside the app.</p>
        <div class="ph"><span>Type</span><span>Email</span><span>Push</span></div>
        <div id="prefRows"></div>
        <div class="quiet">
          <div><label for="quiet">Quiet hours</label><small>No push from 22:00 to 07:00 (Lagos)</small></div>
          <span class="sw"><input type="checkbox" id="quiet" checked><span></span></span>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="undo">Undo</button></div>

<script>
const TYPES = {
  offer:{label:'Offers',icon:'i-offer',cls:'t-offer',email:true,push:true},
  msg:{label:'Messages',icon:'i-chat',cls:'t-msg',email:false,push:true},
  pay:{label:'Payments',icon:'i-coin',cls:'t-pay',email:true,push:true},
  contract:{label:'Contracts',icon:'i-sign',cls:'t-contract',email:true,push:false},
  review:{label:'Reviews',icon:'i-star',cls:'t-review',email:true,push:false},
  system:{label:'Account',icon:'i-info',cls:'t-system',email:true,push:false}
};
let N = [
 {id:1,type:'offer',d:'Today',t:'9:42',unread:true,title:'<b>Northfield Coffee</b> invited you to bid on <b>Packaging redesign for 4 blends</b>',desc:'Budget $2,400 to $3,200. Closes in 2 days.',acts:[['View job',1],['Decline']]},
 {id:2,type:'pay',d:'Today',t:'8:15',unread:true,title:'Payment of <b>$1,250.00</b> released for <b>Lumen Health brand guidelines</b>',desc:'Milestone 2 of 3. Funds reach your Payoneer account in 1 to 2 business days.',acts:[['View receipt']]},
 {id:3,type:'msg',d:'Today',t:'7:58',unread:true,title:'<b>Daniel Ruiz</b> sent you a message',desc:'"Can we move the review call to Thursday 2pm? I will have the stakeholder notes by then."',acts:[['Reply',1]]},
 {id:4,type:'contract',d:'Yesterday',t:'17:30',unread:true,title:'<b>Brightpath Learning</b> sent a contract for <b>Course illustration set</b>',desc:'Fixed price $4,800 over 6 weeks. Please review and sign by Friday.',acts:[['Review contract',1],['Ask a question']]},
 {id:5,type:'review',d:'Yesterday',t:'14:06',unread:false,title:'<b>Priya Nair</b> left you a 5-star review',desc:'"Amara turned a vague brief into a logo system we use everywhere. Fast, calm and precise."',acts:[['Reply publicly']]},
 {id:6,type:'offer',d:'Yesterday',t:'11:20',unread:false,title:'Your proposal for <b>Mobile onboarding illustrations</b> was viewed',desc:'Held Studio opened your proposal twice and added you to their shortlist.',acts:[]},
 {id:7,type:'system',d:'Yesterday',t:'9:00',unread:false,title:'Verify your payout details to keep withdrawing',desc:'Your tax form W-8BEN expires on 30 Nov. Update it to avoid a payout hold.',acts:[['Update tax form',1]]},
 {id:8,type:'pay',d:'Earlier this week',t:'Mon, 16:48',unread:false,title:'<b>Lumen Health</b> funded milestone 3 of <b>Brand guidelines</b>',desc:'$1,250.00 is held in escrow and releases when you submit the final files.',acts:[]},
 {id:9,type:'msg',d:'Earlier this week',t:'Mon, 10:12',unread:false,title:'<b>Sofia Marchetti</b> sent you 2 files',desc:'moodboard-v3.pdf and palette-options.png',acts:[['Open conversation']]},
 {id:10,type:'contract',d:'Earlier this week',t:'Mon, 09:30',unread:false,title:'Contract <b>Event poster series</b> with Odeon Collective is complete',desc:'Final payment of $780.00 was released. Leave feedback to close out the project.',acts:[['Leave feedback']]},
 {id:11,type:'system',d:'Last week',t:'Nov 20',unread:false,title:'New sign-in from Chrome on Windows',desc:'Lagos, Nigeria. If this was not you, change your password now.',acts:[['Secure account']]},
 {id:12,type:'offer',d:'Last week',t:'Nov 19',unread:false,title:'<b>3 new jobs</b> match your saved search "Brand identity"',desc:'Budgets from $1,500 to $6,000. Posted in the last 24 hours.',acts:[['See matches']]}
];
const S = {status:'all',type:'all',prefs:{},nextUndo:null};
Object.keys(TYPES).forEach(k=>S.prefs[k]={email:TYPES[k].email,push:TYPES[k].push});
const $ = s=>document.querySelector(s);
const ic = (id,c='i')=>`<svg class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const unreadCount = ()=>N.filter(n=>n.unread).length;

function render(){
  const u = unreadCount();
  $('#unreadN').textContent = u||'';
  $('#navBadge').textContent = u; $('#navBadge').hidden = !u;
  $('#summary').textContent = u ? `You have ${u} unread notification${u>1?'s':''}.` : 'You are all caught up.';
  $('#markAll').disabled = !u;
  document.title = (u?`(${u}) `:'') + 'Notifications - Gigwell';

  const chips = [['all','All types',u]].concat(Object.keys(TYPES).map(k=>[k,TYPES[k].label,N.filter(n=>n.unread&&n.type===k).length]));
  $('#chips').innerHTML = chips.map(([k,l,c])=>`<button type="button" class="chip" data-type="${k}" aria-pressed="${S.type===k}">${l}${c?` <span class="n">${c}<span class="sr"> unread</span></span>`:''}</button>`).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.status===S.status));

  const rows = N.filter(n=>(S.status==='all'||n.unread)&&(S.type==='all'||n.type===S.type));
  const el = $('#list');
  if(!rows.length){
    el.innerHTML = `<div class="empty">${ic('i-bell')}<h2>${S.status==='unread'?'Nothing unread':'No notifications here'}</h2><p>${S.status==='unread'?'New offers, messages and payments will show up as they arrive.':'Try another type, or show all notifications.'}</p></div>`;
    return;
  }
  const groups = [];
  rows.forEach(n=>{let g=groups.find(g=>g.d===n.d); if(!g) groups.push(g={d:n.d,items:[]}); g.items.push(n);});
  el.innerHTML = groups.map(g=>`<h2 class="day">${g.d}</h2><ul class="items">${g.items.map(item).join('')}</ul>`).join('');
}
function item(n){
  const T = TYPES[n.type];
  const acts = n.acts.length ? `<div class="acts">${n.acts.map(([l,p])=>`<button type="button" class="btn sm${p?' primary':''}" data-act="${n.id}">${l}</button>`).join('')}</div>` : '';
  const lbl = n.unread?'Mark as read':'Mark as unread';
  return `<li class="item${n.unread?' unread':''}" data-id="${n.id}">
    <span class="ico ${T.cls}">${ic(T.icon)}</span>
    <div class="body">
      <p class="title">${n.unread?'<span class="sr">Unread: </span>':''}${n.title}</p>
      <p class="desc">${n.desc}</p>${acts}
    </div>
    <div class="meta"><span>${n.unread?'<span class="dot" aria-hidden="true"></span>':''}${n.t}</span>
      <span class="row-acts">
        <button type="button" class="ib" data-toggle="${n.id}" aria-label="${lbl}" title="${lbl}">${ic(n.unread?'i-check':'i-mail')}</button>
        <button type="button" class="ib" data-dismiss="${n.id}" aria-label="Dismiss notification" title="Dismiss">${ic('i-x')}</button>
      </span></div>
  </li>`;
}
function toast(msg,undo){
  $('#toastMsg').textContent = msg;
  $('#undo').hidden = !undo; S.nextUndo = undo||null;
  const t = $('#toast'); t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove('show'),5000);
}
document.addEventListener('click',e=>{
  const c = e.target.closest('button'); if(!c) return;
  if(c.dataset.status){S.status=c.dataset.status;render();return}
  if(c.dataset.type){S.type=c.dataset.type;render();return}
  if(c.dataset.toggle){const n=N.find(n=>n.id==c.dataset.toggle);n.unread=!n.unread;render();return}
  if(c.dataset.act){const n=N.find(n=>n.id==c.dataset.act);if(n.unread){n.unread=false;render()}toast(`Opened "${c.textContent}" (demo)`);return}
  if(c.dataset.dismiss){
    const i=N.findIndex(n=>n.id==c.dataset.dismiss), n=N[i];
    N.splice(i,1); render();
    toast('Notification dismissed',()=>{N.splice(i,0,n);render();$('#toast').classList.remove('show')});
    return;
  }
  if(c.id==='markAll'){
    const ids=N.filter(n=>n.unread).map(n=>n.id);
    N.forEach(n=>n.unread=false); render();
    toast(`${ids.length} marked as read`,()=>{N.forEach(n=>{if(ids.includes(n.id))n.unread=true});render();$('#toast').classList.remove('show')});
    return;
  }
  if(c.id==='undo'&&S.nextUndo){S.nextUndo()}
});
$('#prefRows').innerHTML = Object.keys(TYPES).map(k=>`<div class="pr"><span>${TYPES[k].label}</span>
  <span class="sw"><input type="checkbox" data-pref="${k}.email" aria-label="${TYPES[k].label} by email" ${S.prefs[k].email?'checked':''}><span></span></span>
  <span class="sw"><input type="checkbox" data-pref="${k}.push" aria-label="${TYPES[k].label} by push" ${S.prefs[k].push?'checked':''}><span></span></span></div>`).join('');
$('#prefRows').addEventListener('change',e=>{
  const [k,ch]=e.target.dataset.pref.split('.'); S.prefs[k][ch]=e.target.checked;
  toast(`${TYPES[k].label} by ${ch}: ${e.target.checked?'on':'off'}`);
});
$('#quiet').addEventListener('change',e=>toast(`Quiet hours ${e.target.checked?'on':'off'}`));
render();
</script>
</body>
</html>
