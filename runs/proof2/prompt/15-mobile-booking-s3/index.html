<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Book a check-up - Fernlea Dental</title>
<style>
:root{
  --bg:#F3F1EA; --stage:#E7E5DC; --surface:#FFFFFF; --sunken:#F7F6F1;
  --ink:#17261E; --muted:#4F5F55; --line:#DAD8CC; --ctl:#7E8A82;
  --accent:#2C6A4D; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6; --accent-line:#2C6A4D;
  --warm:#B4531F; --warm-soft:#FBEBDD;
  --shadow:0 1px 2px rgba(23,38,30,.06),0 8px 24px rgba(23,38,30,.08);
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1712; --stage:#080D0A; --surface:#17211B; --sunken:#121B16;
    --ink:#EAF0EB; --muted:#A5B3AA; --line:#2B3A31; --ctl:#6F7F75;
    --accent:#86CBA6; --accent-ink:#0A1A11; --accent-soft:#1E3327; --accent-line:#86CBA6;
    --warm:#F0A66E; --warm-soft:#3A271A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,legend{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;background:var(--bg);position:relative}
@media (min-width:600px){
  body{background:var(--stage)}
  .stage{padding:24px}
  .app{width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;overflow-y:auto;border-radius:36px;box-shadow:var(--shadow),0 0 0 1px var(--line);scrollbar-width:thin}
}

.top{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--serif);letter-spacing:.01em}
.brand svg{width:22px;height:22px;color:var(--accent)}
.step{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}

.head{padding:12px 20px 4px}
h1{font:600 30px/1.1 var(--serif);letter-spacing:-.015em}
.visit{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.visit span{display:inline-flex;align-items:center;gap:6px}
.visit svg{width:16px;height:16px;flex:none;color:var(--accent)}

section{padding:18px 0 0}
.sh{display:flex;align-items:baseline;gap:10px;padding:0 20px 12px}
.num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:inline-grid;place-items:center;flex:none;transform:translateY(-1px)}
h2{font:600 18px/1.2 var(--serif)}
.sh .aside{margin-left:auto;font-size:14px;color:var(--muted);font-weight:500}
fieldset{border:0;margin:0;padding:0;min-width:0}

.dentists{position:relative;display:grid;gap:8px;padding:0 16px}
.card{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--ctl)}
.dentists input:checked+.card{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.dentists input:focus-visible+.card{outline:3px solid var(--accent);outline-offset:2px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 18px/1 var(--serif);color:#17261E;background:var(--tint)}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:650;font-size:16px;line-height:1.25}
.who .role{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.who .meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:13px;color:var(--muted)}
.who .meta strong{color:var(--ink);font-weight:600}
.star{display:inline-flex;align-items:center;gap:3px}
.star svg{width:13px;height:13px;color:var(--warm)}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ctl);flex:none;display:grid;place-items:center;color:transparent}
.tick svg{width:14px;height:14px}
.dentists input:checked+.card .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;position:relative}
.day label{display:flex;flex-direction:column;align-items:center;width:62px;padding:10px 0 9px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.day label:hover{border-color:var(--ctl)}
.day .dw{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dn{font:600 22px/1.2 var(--serif);margin-top:2px}
.day .ds{font-size:12px;margin-top:2px;color:var(--muted);font-weight:500;white-space:nowrap}
.day input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day input:checked+label .dw,.day input:checked+label .ds{color:var(--accent-ink)}
.day input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.day input:disabled+label{background:transparent;border-style:dashed;cursor:not-allowed}
.day input:disabled+label .dn{color:var(--muted);opacity:.7}
.day input:disabled+label:hover{border-color:var(--line)}
.fade{position:relative}
.fade::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:24px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}

.period{padding:0 20px;margin-bottom:14px}
.period legend{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative}
.slot label{display:grid;place-items:center;height:48px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;transition:border-color .15s,background .15s}
.slot label:hover{border-color:var(--ctl)}
.slot input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.slot input:disabled+label{background:transparent;border-style:dashed;color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;font-weight:500;opacity:.75;cursor:not-allowed}
.empty{margin:0 20px 14px;padding:14px 16px;border-radius:16px;background:var(--sunken);border:1px dashed var(--line);color:var(--muted);font-size:14px}
.note{display:flex;gap:10px;margin:6px 20px 0;padding:12px 14px;border-radius:14px;background:var(--warm-soft);font-size:13.5px}
.note svg{width:18px;height:18px;flex:none;color:var(--warm);margin-top:1px}

.foot{position:sticky;bottom:0;margin-top:28px;display:flex;align-items:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sum{flex:1;min-width:0;font-size:15px;line-height:1.3}
.sum .what{font-weight:600;min-width:0}
.sum .what small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.foot .cta{width:auto;flex:none;padding:0 20px}
.cta{width:100%;height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:17px;cursor:pointer;transition:transform .1s}
.cta:active:not(:disabled){transform:scale(.98)}
.cta:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--ink)}
dialog::backdrop{background:rgba(8,13,10,.55)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);background:var(--surface);border-radius:28px 28px 0 0;padding:28px 24px calc(24px + env(safe-area-inset-bottom));text-align:center}
@media (min-width:600px){.sheet{bottom:50%;transform:translate(-50%,50%);width:360px;border-radius:28px}}
.ok{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.ok svg{width:28px;height:28px}
.sheet h2{font-size:24px}
.sheet p{margin:8px 0 0;color:var(--muted);font-size:15px}
.recap{margin:18px 0 20px;padding:12px 16px;border-radius:16px;background:var(--sunken);border:1px solid var(--line);text-align:left;font-size:15px}
.recap div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.recap dt{color:var(--muted)}.recap dd{margin:0;font-weight:600;text-align:right}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
<main class="app" id="app">
  <header class="top">
    <button class="back" type="button" aria-label="Back to appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V8"/><path d="M12 8c0-3 2-5 6-5 0 3-2 5-6 5z"/><path d="M12 13c0-2.5-1.8-4.5-5.5-4.5 0 2.7 1.8 4.5 5.5 4.5z"/><path d="M12 18c0-2-1.4-3.5-4.5-3.5 0 2.2 1.5 3.5 4.5 3.5z"/></svg>Fernlea</span>
    <span class="step">Book a visit</span>
  </header>

  <div class="head">
    <h1>Book your check-up</h1>
    <p class="visit">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 min</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>14 Alder Row, Bristol</span>
    </p>
  </div>

  <section aria-labelledby="h-dentist">
    <div class="sh"><span class="num" aria-hidden="true">1</span><h2 id="h-dentist">Choose your dentist</h2></div>
    <fieldset class="dentists" id="dentists"><legend class="vh">Dentist</legend></fieldset>
  </section>

  <section aria-labelledby="h-date">
    <div class="sh"><span class="num" aria-hidden="true">2</span><h2 id="h-date">Pick a day</h2><span class="aside" id="month"></span></div>
    <div class="fade"><div class="days" id="days" role="radiogroup" aria-labelledby="h-date"></div></div>
  </section>

  <section aria-labelledby="h-time">
    <div class="sh"><span class="num" aria-hidden="true">3</span><h2 id="h-time">Choose a time</h2><span class="aside" id="left"></span></div>
    <div id="times"></div>
    <p class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Free to cancel or move up to 24 hours before. We will text you a reminder the day before.</span></p>
  </section>

  <footer class="foot">
    <div class="sum" aria-live="polite">
      <div class="what" id="what"></div>
    </div>
    <button class="cta" id="cta" type="button" disabled>Book &middot; &pound;48</button>
  </footer>
</main>
</div>

<dialog id="done" aria-labelledby="done-h">
  <div class="sheet">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="done-h">You are booked in</h2>
    <p>We have sent the details to your phone.</p>
    <dl class="recap" id="recap"></dl>
    <button class="cta" id="close" type="button">Done</button>
  </div>
</dialog>

<script>
(function(){
  var DENTISTS=[
    {id:"okafor",name:"Dr Amara Okafor",ini:"AO",role:"Lead dentist, general care",rating:"4.9",n:212,days:[1,2,4,5],tint:"#BFE0CB"},
    {id:"lindqvist",name:"Dr Tomas Lindqvist",ini:"TL",role:"Gentle care for nervous patients",rating:"4.9",n:164,days:[2,3,5,6],tint:"#F2D6B8"},
    {id:"raman",name:"Dr Priya Raman",ini:"PR",role:"Family and children's dentistry",rating:"4.8",n:189,days:[1,3,4,6],tint:"#CFD9F0"}
  ];
  var MORNING=["08:30","09:00","09:30","10:30","11:00","11:30"];
  var AFTERNOON=["13:30","14:00","14:30","15:30","16:00","16:30","17:00"];
  var DW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var START=new Date(2026,10,28), DAYS=[];
  for(var i=0;i<14;i++){var d=new Date(START);d.setDate(START.getDate()+i);DAYS.push(d)}

  var st={dentist:0,day:0,time:null};
  var $=function(id){return document.getElementById(id)};
  function key(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
  function booked(di,d,t){var h=((di+3)*7919+key(d)*31+parseInt(t.replace(":",""),10)*17)>>>0;h=Math.imul(h^(h>>>7),2654435761)>>>0;return (h>>>8)%100<34}
  function works(di,d){var w=d.getDay();return w!==0&&DENTISTS[di].days.indexOf(w)>-1}
  function slotsFor(di,d){
    if(!works(di,d))return {m:[],a:[]};
    var sat=d.getDay()===6;
    var f=function(t){return{t:t,free:!booked(di,d,t)}};
    return {m:MORNING.map(f),a:sat?[]:AFTERNOON.map(f)};
  }
  function freeCount(di,d){var s=slotsFor(di,d);return s.m.concat(s.a).filter(function(x){return x.free}).length}
  function usable(di,i){return freeCount(di,DAYS[i])>0}
  function firstUsable(di){for(var i=0;i<DAYS.length;i++)if(usable(di,i))return i;return 0}
  function short(d){return DW[d.getDay()]+" "+d.getDate()+" "+MOS[d.getMonth()]}
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

  var STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function renderDentists(){
    $("dentists").insertAdjacentHTML("beforeend",DENTISTS.map(function(p,i){
      var f=firstUsable(i);
      return '<div><input class="vh" type="radio" name="dentist" id="d-'+p.id+'" value="'+i+'"'+(i===st.dentist?" checked":"")+'>'+
      '<label class="card" for="d-'+p.id+'"><span class="av" style="--tint:'+p.tint+'" aria-hidden="true">'+p.ini+'</span>'+
      '<span class="who"><b>'+p.name+'</b><span class="role">'+p.role+'</span>'+
      '<span class="meta"><span class="star">'+STAR+'<strong>'+p.rating+'</strong>&nbsp;('+p.n+')</span><span>Next: <strong>'+short(DAYS[f])+'</strong></span></span></span>'+
      '<span class="tick">'+CHECK+'</span></label></div>';
    }).join(""));
  }

  function renderDays(){
    var di=st.dentist, box=$("days");
    box.querySelectorAll(".day").forEach(function(n){n.remove()});
    box.insertAdjacentHTML("beforeend",DAYS.map(function(d,i){
      var ok=usable(di,i), closed=d.getDay()===0, n=freeCount(di,d);
      var sub=ok?n+" free":(closed?"Closed":"Off");
      return '<div class="day"><input class="vh" type="radio" name="day" id="day-'+i+'" value="'+i+'"'+(ok?"":" disabled")+(i===st.day?" checked":"")+'>'+
      '<label for="day-'+i+'" aria-label="'+DWL[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]+", "+(ok?n+" times free":(closed?"clinic closed":"dentist not working"))+'">'+
      '<span class="dw">'+DW[d.getDay()]+'</span><span class="dn">'+d.getDate()+'</span><span class="ds">'+sub+'</span></label></div>';
    }).join(""));
    $("month").textContent=MO[DAYS[st.day].getMonth()]+" "+DAYS[st.day].getFullYear();
  }

  function group(title,list){
    if(!list.length)return "";
    return '<fieldset class="period"><legend>'+title+'</legend><div class="slots">'+list.map(function(s){
      var id="t-"+s.t.replace(":","");
      return '<div class="slot"><input class="vh" type="radio" name="time" id="'+id+'" value="'+s.t+'"'+(s.free?"":" disabled")+(st.time===s.t?" checked":"")+'><label for="'+id+'"'+(s.free?"":' aria-label="'+s.t+', already booked"')+'>'+s.t+'</label></div>';
    }).join("")+'</div></fieldset>';
  }

  function renderTimes(){
    var d=DAYS[st.day], s=slotsFor(st.dentist,d);
    var free=s.m.concat(s.a).filter(function(x){return x.free}).length;
    $("left").textContent=free+" of "+(s.m.length+s.a.length)+" free";
    var html=group("Morning",s.m)+group("Afternoon",s.a);
    if(d.getDay()===6)html+='<p class="empty">The Saturday clinic closes at 12:30. Afternoon visits run Monday to Friday.</p>';
    $("times").innerHTML=html;
  }

  function renderFoot(){
    var p=DENTISTS[st.dentist], d=DAYS[st.day];
    if(st.time){
      $("what").innerHTML=short(d)+" at "+st.time+'<small>'+esc(p.name)+' &middot; check-up, 30 min</small>';
      $("cta").disabled=false;
    }else{
      $("what").innerHTML='Choose a time to continue<small>'+esc(p.name)+' &middot; check-up, 30 min</small>';
      $("cta").disabled=true;
    }
  }

  function render(){renderDays();renderTimes();renderFoot()}

  $("dentists").addEventListener("change",function(e){
    st.dentist=+e.target.value;st.time=null;
    if(!usable(st.dentist,st.day))st.day=firstUsable(st.dentist);
    render();
  });
  $("days").addEventListener("change",function(e){st.day=+e.target.value;st.time=null;renderDays();renderTimes();renderFoot()});
  $("times").addEventListener("change",function(e){st.time=e.target.value;renderFoot()});

  var dlg=$("done");
  $("cta").addEventListener("click",function(){
    var p=DENTISTS[st.dentist], d=DAYS[st.day];
    $("recap").innerHTML='<div><dt>When</dt><dd>'+short(d)+', '+st.time+'</dd></div><div><dt>Dentist</dt><dd>'+esc(p.name)+'</dd></div><div><dt>Visit</dt><dd>Check-up, 30 min</dd></div><div><dt>Where</dt><dd>14 Alder Row</dd></div>';
    if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
  });
  $("close").addEventListener("click",function(){if(dlg.close)dlg.close()});

  st.day=firstUsable(0);
  renderDentists();render();
})();
</script>
</body>
</html>
