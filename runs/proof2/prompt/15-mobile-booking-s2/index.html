<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Book a check-up - Fernlea</title>
<style>
:root{
  --bg:#efeae0; --surface:#fffdf8; --surface-2:#f6f2e9; --ink:#1b2a22; --muted:#56655c;
  --line:#ddd6c8; --line-strong:#a9b3aa; --primary:#1d5c44; --on-primary:#ffffff;
  --tint:#e1eee4; --tint-ink:#144232; --focus:#0b57d0; --disabled:#8a948d;
  --shadow:0 1px 2px rgba(27,42,34,.06),0 24px 60px -24px rgba(27,42,34,.28);
  --a1:#d9e8dc; --a2:#f1ddc9; --a3:#dfe1f1;
  --a1i:#17402f; --a2i:#6a3a14; --a3i:#2c3166;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1410; --surface:#141f19; --surface-2:#1a2820; --ink:#e9f0ea; --muted:#a2b2a8;
    --line:#2a3b31; --line-strong:#6f8277; --primary:#8fdcb2; --on-primary:#0a2217;
    --tint:#1f3a2c; --tint-ink:#c9f0da; --focus:#8ab4ff; --disabled:#6c7b72;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 60px -24px rgba(0,0,0,.7);
    --a1:#244636; --a2:#4a3524; --a3:#2b3050;
    --a1i:#c9f0da; --a2i:#f5d9bd; --a3i:#d0d5ff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
}
.app{
  width:100%; max-width:430px; min-height:100vh; background:var(--surface);
  position:relative; display:flex; flex-direction:column;
}
@media (min-width:600px){
  body{padding:32px 16px}
  .app{min-height:0; height:min(844px,calc(100vh - 64px)); border-radius:32px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line)}
  .scroll{overflow-y:auto}
}
.scroll{flex:1; padding-bottom:16px}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:8px}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* header */
header{padding:14px 16px 4px; display:flex; align-items:center; gap:8px}
.back{
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); display:grid; place-items:center; cursor:pointer; flex:none; margin-left:-4px;
}
.back svg{width:20px;height:20px}
.brand{display:flex; align-items:center; gap:8px; font-weight:650; letter-spacing:.01em; margin-left:auto; color:var(--primary)}
.brand svg{width:22px;height:22px}
.intro{padding:4px 20px 14px}
h1{font-size:27px; line-height:1.15; margin:0 0 6px; letter-spacing:-.015em; font-weight:700}
.visit{display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--muted); font-size:14px; margin:0}
.visit span{display:inline-flex; align-items:center; gap:6px}
.visit svg{width:16px;height:16px;flex:none}

/* sections */
fieldset{border:0; margin:0; padding:0; min-width:0}
section{padding:16px 0 2px; border-top:1px solid var(--line)}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; padding:0 20px; margin-bottom:12px}
legend,.sec-title{padding:0; font-size:17px; font-weight:650; letter-spacing:-.005em; float:left}
.sec-head .aside{font-size:13px; color:var(--muted)}
.num{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--tint); color:var(--tint-ink); font-size:12px; font-weight:700; margin-right:8px; vertical-align:2px}

/* dentist cards */
.dentists{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 20px 8px}
.dentist input{position:absolute; opacity:0; width:1px; height:1px}
.dentist label{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; height:100%;
  padding:12px 2px 10px; border:1.5px solid var(--line); border-radius:16px; background:var(--surface); cursor:pointer;
}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;margin-bottom:4px}
.dentist .name{font-weight:650; font-size:14px; white-space:nowrap; line-height:1.25; display:block}
.dentist .name b{display:block; font-weight:500; font-size:13px; color:var(--muted)}
.dentist .next{font-size:12.5px; color:var(--muted); display:block; margin-top:2px}
.dentist input:checked + label{border-color:var(--primary); background:var(--tint); box-shadow:0 0 0 1px var(--primary) inset}
.dentist input:checked + label .next,.dentist input:checked + label .name b{color:var(--tint-ink)}
.dentist input:focus-visible + label{outline:3px solid var(--focus); outline-offset:2px}
.about{margin:0; padding:2px 20px 18px; font-size:14px; color:var(--muted)}

/* date strip */
.dates{display:flex; gap:8px; overflow-x:auto; padding:2px 20px 16px; scroll-snap-type:x proximity; scroll-padding:0 20px; scrollbar-width:thin}
.date{flex:none; scroll-snap-align:start; position:relative}
.date input{position:absolute; opacity:0; width:1px;height:1px}
.date label{
  width:58px; min-height:76px; border:1.5px solid var(--line); border-radius:16px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; cursor:pointer; background:var(--surface);
}
.date .dow{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600}
.date .dom{font-size:21px; font-weight:700; line-height:1.2}
.date .mon{font-size:11.5px; color:var(--muted)}
.date input:checked + label{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.date input:checked + label .dow,.date input:checked + label .mon{color:var(--on-primary)}
.date input:disabled + label{background:transparent; border-style:dashed; cursor:not-allowed; color:var(--disabled)}
.date input:disabled + label .dow,.date input:disabled + label .mon{color:var(--disabled)}
.date input:disabled + label .dom{font-weight:500; text-decoration:line-through}
.date input:focus-visible + label{outline:3px solid var(--focus); outline-offset:2px}
.month-label{font-size:13px; color:var(--muted)}

/* time slots */
.period{padding:0 20px; margin-bottom:16px}
.period h3{font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:650; margin:0 0 8px}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.slot{position:relative}
.slot input{position:absolute; opacity:0; width:1px;height:1px}
.slot label{
  display:grid; place-items:center; min-height:46px; border:1.5px solid var(--line); border-radius:12px;
  font-weight:600; font-size:15px; cursor:pointer; background:var(--surface); font-variant-numeric:tabular-nums;
}
.slot input:checked + label{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.slot input:disabled + label{color:var(--disabled); background:var(--surface-2); border-style:dashed; font-weight:500; text-decoration:line-through; cursor:not-allowed}
.slot input:focus-visible + label{outline:3px solid var(--focus); outline-offset:2px}
.empty{margin:0 20px 16px; padding:14px; border-radius:12px; background:var(--surface-2); color:var(--muted); font-size:14.5px}
@media (hover:hover){
  .dentist input:not(:checked) + label:hover,.date input:not(:checked):not(:disabled) + label:hover,.slot input:not(:checked):not(:disabled) + label:hover{border-color:var(--line-strong); background:var(--surface-2)}
}
.legend{display:flex; gap:14px; padding:0 20px 16px; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1.5px dashed var(--disabled)}

/* footer */
.bar{
  border-top:1px solid var(--line); background:var(--surface); padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  position:sticky; bottom:0; box-shadow:0 -10px 24px -16px rgba(27,42,34,.25);
}
.sum{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px}
.sum strong{font-size:15px; font-weight:650}
.sum small{display:block; color:var(--muted); font-size:13.5px}
.price{font-weight:700; font-size:17px; white-space:nowrap}
.price small{display:inline; font-weight:400}
.cta{
  width:100%; min-height:52px; border:0; border-radius:14px; background:var(--primary); color:var(--on-primary);
  font:inherit; font-weight:650; font-size:16.5px; cursor:pointer;
}
.cta:disabled{background:var(--surface-2); color:var(--muted); cursor:not-allowed; border:1.5px dashed var(--line-strong)}
.cta:focus-visible{outline:3px solid var(--focus); outline-offset:3px}

/* confirmation */
.done{padding:36px 24px; display:none; text-align:left}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;margin-bottom:16px}
.done .tick svg{width:28px;height:28px}
.done h2{font-size:25px; margin:0 0 6px; letter-spacing:-.01em}
.done p{color:var(--muted); margin:0 0 20px}
.ticket{border:1.5px solid var(--line); border-radius:18px; padding:4px 16px; margin-bottom:20px; background:var(--surface-2)}
.ticket div{display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line)}
.ticket div:last-child{border:0}
.ticket dt{color:var(--muted); font-size:14px}
.ticket dd{margin:0; font-weight:600; text-align:right}
.ghost{width:100%; min-height:50px; border-radius:14px; border:1.5px solid var(--line-strong); background:transparent; color:var(--ink); font:inherit; font-weight:600; cursor:pointer}
.booked .main,.booked .bar{display:none}
.booked .done{display:block}
@media (prefers-reduced-motion:no-preference){
  .dentist label,.date label,.slot label,.cta{transition:background-color .15s,border-color .15s,color .15s}
}
@media (max-width:359px){
  .slots{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="back" type="button" aria-label="Back to appointments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="brand" aria-label="Fernlea Dental">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V8"/><path d="M12 8c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 12c0-2.6-1.8-4.4-4.6-4.4 0 2.6 1.8 4.4 4.6 4.4z"/><path d="M12 16.5c0-2.2-1.5-3.7-3.9-3.7 0 2.2 1.5 3.7 3.9 3.7z"/></svg>
      Fernlea
    </div>
  </header>

  <div class="scroll main">
    <div class="intro">
      <h1>Book a check-up</h1>
      <p class="visit">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 minutes</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>14 Alder Row, Bristol</span>
      </p>
    </div>

    <section>
      <fieldset>
        <div class="sec-head"><legend><span class="num" aria-hidden="true">1</span>Choose your dentist</legend></div>
        <div class="dentists" id="dentists"></div>
        <p class="about" id="about" aria-live="polite"></p>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <div class="sec-head"><legend><span class="num" aria-hidden="true">2</span>Pick a day</legend><span class="aside month-label" id="monthLabel"></span></div>
        <div class="dates" id="dates"></div>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <div class="sec-head"><legend><span class="num" aria-hidden="true">3</span>Select a time</legend><span class="aside" id="slotCount" aria-live="polite"></span></div>
        <div id="slots"></div>
        <div class="legend" aria-hidden="true"><span><i></i>Already booked</span></div>
      </fieldset>
    </section>
  </div>

  <div class="bar main-bar">
    <div class="sum" aria-live="polite">
      <div><strong id="sumWho">Choose a dentist</strong><small id="sumWhen">Then a day and time</small></div>
      <div class="price">&pound;58</div>
    </div>
    <button class="cta" id="confirm" type="button" disabled>Confirm appointment</button>
  </div>

  <div class="done" id="done" role="status">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>You're booked in</h2>
    <p>We've sent the details to your email. Please arrive 5 minutes early.</p>
    <dl class="ticket">
      <div><dt>Dentist</dt><dd id="dWho"></dd></div>
      <div><dt>Date</dt><dd id="dDate"></dd></div>
      <div><dt>Time</dt><dd id="dTime"></dd></div>
      <div><dt>Where</dt><dd>14 Alder Row, Bristol</dd></div>
    </dl>
    <button class="ghost" id="change" type="button">Change appointment</button>
  </div>
</div>

<script>
(function(){
  var dentists=[
    {id:"amara",name:"Dr Amara Okafor",role:"General dentist, 12 years here",days:[1,2,3,4],ini:"AO",c:1},
    {id:"tom",name:"Dr Tom Hargreaves",role:"General dentist, gentle with nervous patients",days:[2,3,4,5,6],ini:"TH",c:2},
    {id:"priya",name:"Dr Priya Raman",role:"Dentist and hygiene lead",days:[1,3,5],ini:"PR",c:3}
  ];
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
      LDOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
      MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
      LMON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var base=new Date(2026,10,30),days=[];
  for(var i=0;i<14;i++){days.push(new Date(base.getFullYear(),base.getMonth(),base.getDate()+i));}
  var times=[["Morning",["09:00","09:30","10:00","10:30","11:00","11:30"]],["Afternoon",["13:30","14:00","14:30","15:00","15:30","16:00"]]];
  var st={d:dentists[0].id,date:null,time:null};
  var $=function(id){return document.getElementById(id)};

  function dent(){return dentists.filter(function(x){return x.id===st.d})[0]}
  function worksOn(dn,dt){return dn.days.indexOf(dt.getDay())>-1}
  function key(dt){return dt.getFullYear()+"-"+(dt.getMonth()+1)+"-"+dt.getDate()}
  function fmt(t){var p=t.split(":"),h=+p[0];return (h>12?h-12:h)+":"+p[1]+(h>=12?" pm":" am")}
  function free(dn,dt,t){
    if(dt.getDay()===6&&t>="12")return false; // Saturdays are morning only
    var di=dentists.indexOf(dn),ti=[].concat(times[0][1],times[1][1]).indexOf(t);
    return (dt.getDate()*7+ti*3+di*5)%4!==0;
  }
  function slotsFor(dn,dt){return [].concat(times[0][1],times[1][1]).filter(function(t){return free(dn,dt,t)})}
  function firstOpen(dn){for(var i=0;i<days.length;i++){if(worksOn(dn,days[i])&&slotsFor(dn,days[i]).length)return days[i]}return null}
  function nextLabel(dn){var d=firstOpen(dn);return d?"Next: "+DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]:"No openings"}

  function avatarStyle(c){return "background:var(--a"+c+");color:var(--a"+c+"i)"}

  function renderDentists(){
    $("dentists").innerHTML=dentists.map(function(x){
      var p=x.name.replace("Dr ","").split(" ");
      return '<div class="dentist"><input type="radio" name="dentist" id="d-'+x.id+'" value="'+x.id+'" aria-label="'+x.name+', '+x.role+'. '+nextLabel(x)+'"'+(x.id===st.d?" checked":"")+'>'+
        '<label for="d-'+x.id+'"><span class="avatar" style="'+avatarStyle(x.c)+'" aria-hidden="true">'+x.ini+'</span>'+
        '<span class="name" aria-hidden="true">Dr '+p[1]+'<b>'+p[0]+'</b></span>'+
        '<span class="next" aria-hidden="true">'+nextLabel(x).replace("Next: ","")+'</span></label></div>';
    }).join("");
    $("about").textContent=dent().role;
  }
  function renderDates(){
    var dn=dent();
    $("dates").innerHTML=days.map(function(dt){
      var ok=worksOn(dn,dt)&&slotsFor(dn,dt).length>0,k=key(dt);
      return '<div class="date"><input type="radio" name="date" id="dt-'+k+'" value="'+k+'"'+(ok?"":" disabled")+(st.date&&key(st.date)===k?" checked":"")+'>'+
        '<label for="dt-'+k+'" aria-label="'+LDOW[dt.getDay()]+" "+dt.getDate()+" "+LMON[dt.getMonth()]+(ok?"":", unavailable")+'">'+
        '<span class="dow">'+DOW[dt.getDay()]+'</span><span class="dom">'+dt.getDate()+'</span><span class="mon">'+MON[dt.getMonth()]+'</span></label></div>';
    }).join("");
    $("monthLabel").textContent="Nov - Dec 2026";
  }
  function renderSlots(){
    var dn=dent(),dt=st.date,h="",open=0;
    if(!dt){$("slots").innerHTML='<p class="empty">Pick a day to see times.</p>';$("slotCount").textContent="";return}
    var avail=slotsFor(dn,dt);
    times.forEach(function(p){
      var list=p[1].filter(function(t){return !(dt.getDay()===6&&t>="12")});
      if(!list.length)return;
      h+='<div class="period" role="group" aria-label="'+p[0]+' times"><h3>'+p[0]+'</h3><div class="slots">'+list.map(function(t){
        var ok=avail.indexOf(t)>-1;if(ok)open++;
        return '<div class="slot"><input type="radio" name="time" id="t-'+t.replace(":","")+'" value="'+t+'"'+(ok?"":" disabled")+(st.time===t?" checked":"")+'>'+
          '<label for="t-'+t.replace(":","")+'">'+fmt(t)+(ok?"":'<span class="sr"> booked</span>')+'</label></div>';
      }).join("")+'</div></div>';
    });
    $("slots").innerHTML=h;
    $("slotCount").textContent=open+" free on "+DOW[dt.getDay()]+" "+dt.getDate();
  }
  function renderSummary(){
    var dn=dent();
    $("sumWho").textContent=dn.name;
    if(st.date&&st.time){
      $("sumWhen").textContent=DOW[st.date.getDay()]+" "+st.date.getDate()+" "+MON[st.date.getMonth()]+" at "+fmt(st.time);
      $("confirm").disabled=false;
    }else{
      $("sumWhen").textContent=st.date?"Now choose a time":"Then a day and time";
      $("confirm").disabled=true;
    }
  }
  function validate(){
    var dn=dent();
    if(st.date&&!(worksOn(dn,st.date)&&slotsFor(dn,st.date).length))st.date=null;
    if(!st.date)st.date=firstOpen(dn);
    if(st.time&&(!st.date||slotsFor(dn,st.date).indexOf(st.time)<0))st.time=null;
  }
  function all(){validate();renderDentists();renderDates();renderSlots();renderSummary()}

  document.addEventListener("change",function(e){
    var n=e.target.name,v=e.target.value;
    if(n==="dentist"){st.d=v;validate();$("about").textContent=dent().role;renderDates();renderSlots();renderSummary()}
    else if(n==="date"){st.date=days.filter(function(x){return key(x)===v})[0];st.time=null;validate();renderSlots();renderSummary()}
    else if(n==="time"){st.time=v;renderSummary()}
  });
  $("confirm").addEventListener("click",function(){
    $("dWho").textContent=dent().name;
    $("dDate").textContent=LDOW[st.date.getDay()]+" "+st.date.getDate()+" "+LMON[st.date.getMonth()];
    $("dTime").textContent=fmt(st.time);
    $("app").classList.add("booked");
    $("change").focus();
  });
  $("change").addEventListener("click",function(){$("app").classList.remove("booked");$("confirm").focus()});
  st.date=firstOpen(dentists[0]);st.time="10:30";
  all();
})();
</script>
</body>
</html>
