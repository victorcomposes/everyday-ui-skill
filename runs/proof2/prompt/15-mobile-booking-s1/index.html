<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Book a check-up - Fernlea Dental</title>
<style>
:root{
  --bg:#EFEDE5; --surface:#FFFFFF; --surface-2:#F6F5EF; --line:#D3D0C3;
  --text:#18261F; --muted:#55645C; --primary:#1D5A43; --on-primary:#FFFFFF;
  --tint:#E1EEE6; --focus:#0B6BCB;
  --shadow:0 1px 2px rgba(24,38,31,.06),0 8px 24px rgba(24,38,31,.08);
  --a1:#C9DFD2; --a1t:#164431; --a2:#F2DFC9; --a2t:#6A3C0C; --a3:#DCE3F1; --a3t:#27386B;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B110E; --surface:#16211B; --surface-2:#1C2A23; --line:#34483E;
  --text:#E8EFEA; --muted:#A3B5AB; --primary:#86D6AE; --on-primary:#07281B;
  --tint:#1F3A2E; --focus:#7DB8FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --a1:#24443A; --a1t:#BFE9D2; --a2:#4A3820; --a2t:#F2D3A8; --a3:#2A3552; --a3t:#C5D3F5;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){
  body{padding:32px 0}
  .app{min-height:0;border-radius:32px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:clip}
}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.01em;font-size:15px;color:var(--muted)}
.brand svg{width:22px;height:22px;color:var(--primary)}
main{padding:8px 16px 24px;flex:1}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 6px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.meta li{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;font-size:13.5px;font-weight:550}
.meta svg{width:16px;height:16px;color:var(--primary);flex:none}
section{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.sec-h span{font-size:13.5px;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;float:left;width:100%}
.opts{clear:both}
.vh{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.dent label:has(input:focus-visible),.day:has(input:focus-visible),.slot:has(input:focus-visible),.back:focus-visible,.cta:focus-visible,.link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* dentists */
.dent{display:grid;gap:10px}
.dent label{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;min-height:76px;position:relative}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.dent .who{flex:1;min-width:0}
.dent b{display:block;font-size:16px;line-height:1.25}
.dent small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.dent .next{display:block;font-size:13px;color:var(--primary);font-weight:650;margin-top:3px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-primary);transform:scale(0);transition:transform .15s}
.dent input:checked ~ .radio{border-color:var(--primary);background:var(--primary)}
.dent input:checked ~ .radio::after{transform:scale(1)}
.dent label:has(input:checked){background:var(--tint);border-color:var(--primary)}
/* days */
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;scroll-snap-align:start;position:relative}
.day .c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:76px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer}
.day .dow{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.day .num{font-size:21px;font-weight:700;line-height:1.1}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:3px}
.day input:checked + .c{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.day input:checked + .c .dow{color:var(--on-primary)}
.day input:checked + .c .dot{background:var(--on-primary)}
.day input:disabled + .c{background:transparent;border-style:dashed;cursor:not-allowed}
.day input:disabled + .c .num{color:var(--muted);font-weight:500}
.day input:disabled + .c .dot{visibility:hidden}
.sec-h .month{font-size:14px;color:var(--text);font-weight:650}
/* slots */
.grp{margin:0 0 18px}
.grp h3{font-size:14px;margin:0 0 8px;font-weight:650;display:flex;align-items:center;gap:8px}
.grp h3 svg{width:18px;height:18px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative}
.slot span{display:grid;place-items:center;height:48px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.slot input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.slot input:disabled + span{background:transparent;border-style:dashed;color:var(--muted);text-decoration:line-through;font-weight:450;cursor:not-allowed}
.note{display:flex;gap:10px;font-size:13.5px;color:var(--muted);margin:4px 0 0}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
/* footer */
footer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 18px);padding:22px 16px 16px;margin-top:auto}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.sum{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;font-size:14.5px;min-height:34px}
.sum svg{width:20px;height:20px;color:var(--primary);flex:none}
.sum b{font-weight:650}
.sum .ph{color:var(--muted)}
.cta{width:100%;height:54px;border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:16.5px;cursor:pointer}
.cta:disabled{background:var(--surface-2);color:var(--muted);border:1.5px solid var(--line);cursor:not-allowed;font-weight:600}
/* confirmed */
.done{text-align:center;padding:40px 8px 8px}
.done:focus{outline:none}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;margin:0 auto 18px}
.done .tick svg{width:36px;height:36px}
.done h1{margin-top:0}
.done dl{margin:24px 0 0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 16px}
.done dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.done dl div:last-child{border:0}
.done dt{color:var(--muted);font-size:14px}
.done dd{margin:0;font-weight:650;text-align:right}
.link{margin-top:18px;background:none;border:0;color:var(--primary);font-weight:650;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 12px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="back" type="button" aria-label="Back to appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c0-7 1-11 8-15-1 7-3 11-8 15z"/><path d="M12 21C12 15 11 11 4 8c.5 6 3 10 8 13z"/></svg>Fernlea Dental</div>
</header>

<main id="main">
 <div id="flow">
  <h1>Book a check-up</h1>
  <p class="sub">Pick a dentist, a day and a time.</p>
  <ul class="meta">
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 min</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>14 Alder Lane</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Denplan covered</li>
  </ul>

  <section>
   <fieldset>
    <legend><div class="sec-h"><h2>1 &middot; Dentist</h2></div></legend>
    <div class="dent opts" id="dentists"></div>
   </fieldset>
  </section>

  <section>
   <fieldset>
    <legend><div class="sec-h"><h2>2 &middot; Day</h2><span class="month" id="month"></span></div></legend>
    <div class="days opts" id="days"></div>
   </fieldset>
  </section>

  <section>
   <fieldset>
    <legend><div class="sec-h"><h2>3 &middot; Time</h2><span id="slotcount"></span></div></legend>
    <div class="opts" id="slots"></div>
   </fieldset>
   <p class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Free to cancel or move up to 24 hours before your visit.</p>
  </section>
 </div>

 <div class="done" id="done" hidden tabindex="-1">
   <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
   <h1>You're booked in</h1>
   <p class="sub">We've sent a confirmation to your phone.</p>
   <dl id="receipt"></dl>
   <button class="link" type="button" id="change">Change appointment</button>
 </div>
</main>

<footer id="foot">
  <div class="bar">
    <div class="sum" id="sum" aria-live="polite"></div>
    <button class="cta" type="button" id="cta" disabled>Choose a time</button>
  </div>
</footer>
</div>

<script>
const DENTISTS=[
 {id:"okafor",name:"Dr Amara Okafor",role:"General dentistry",ini:"AO",tone:1,days:[1,2,3,4,5]},
 {id:"lindqvist",name:"Dr Tomas Lindqvist",role:"Preventive care and hygiene",ini:"TL",tone:2,days:[2,3,4,5,6]},
 {id:"raman",name:"Dr Priya Raman",role:"Restorative and cosmetic",ini:"PR",tone:3,days:[1,3,4,6]}
];
const MORNING=["08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30"];
const AFTERNOON=["13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30"];
const START=new Date(2026,10,30); // Mon 30 Nov 2026
const DAYS=Array.from({length:14},(_,i)=>new Date(2026,10,30+i));
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const $=s=>document.querySelector(s);
const st={d:"okafor",day:null,time:null};
const dent=()=>DENTISTS.find(x=>x.id===st.d);
const works=(d,date)=>d.days.includes(date.getDay());
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const free=(d,date,t)=>works(d,date)&&hash(d.id+date.toDateString()+t)%100>=38;
const slotsFor=(d,date)=>[...MORNING,...AFTERNOON].filter(t=>free(d,date,t));
const longDate=d=>`${DOWL[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const shortDate=d=>`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`;
const fmt=t=>{const[h,m]=t.split(":").map(Number);return `${h>12?h-12:h}:${String(m).padStart(2,"0")} ${h>=12?"pm":"am"}`};
const firstFree=d=>DAYS.find(x=>slotsFor(d,x).length);
const ICON={
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M6.5 18a5.5 5.5 0 0111 0M12 7V5M4.5 11.5L3 10M19.5 11.5L21 10"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>'
};
function renderDentists(){
 $("#dentists").innerHTML=DENTISTS.map(d=>{
  const f=firstFree(d),a=f?`Next free: ${shortDate(f)}`:"No availability";
  return `<label><input class="vh" type="radio" name="dentist" value="${d.id}" ${d.id===st.d?"checked":""}>
   <span class="avatar" style="background:var(--a${d.tone});color:var(--a${d.tone}t)" aria-hidden="true">${d.ini}</span>
   <span class="who"><b>${d.name}</b><small>${d.role}</small><span class="next">${a}</span></span><span class="radio" aria-hidden="true"></span></label>`}).join("");
}
function renderDays(){
 const d=dent();
 $("#days").innerHTML=DAYS.map((x,i)=>{
  const off=!slotsFor(d,x).length, sel=st.day===i;
  return `<label class="day"><input class="vh" type="radio" name="day" value="${i}" ${off?"disabled":""} ${sel?"checked":""} aria-label="${longDate(x)}${off?", unavailable":""}">
   <span class="c" aria-hidden="true"><span class="dow">${DOW[x.getDay()]}</span><span class="num">${x.getDate()}</span><span class="dot"></span></span></label>`}).join("");
 const sd=DAYS[st.day??0];$("#month").textContent=`${MON[sd.getMonth()]} ${sd.getFullYear()}`;
}
function renderSlots(){
 const d=dent(),date=DAYS[st.day];
 const grp=(title,icon,arr)=>`<div class="grp"><h3>${icon}${title}</h3><div class="slots">${arr.map(t=>{const ok=free(d,date,t);return `<label class="slot"><input class="vh" type="radio" name="time" value="${t}" ${ok?"":"disabled"} ${st.time===t?"checked":""} aria-label="${fmt(t)}${ok?"":", taken"}"><span aria-hidden="true">${fmt(t)}</span></label>`}).join("")}</div></div>`;
 $("#slots").innerHTML=grp("Morning",ICON.sun,MORNING)+grp("Afternoon",ICON.moon,AFTERNOON);
 $("#slotcount").textContent=`${slotsFor(d,date).length} available`;
}
function renderSum(){
 const d=dent(),date=DAYS[st.day],cta=$("#cta"),sum=$("#sum");
 if(st.time){
  sum.innerHTML=`${ICON.cal}<span><b>${shortDate(date)}, ${fmt(st.time)}</b> with ${d.name}</span>`;
  cta.disabled=false;cta.textContent="Confirm appointment";
 }else{
  sum.innerHTML=`${ICON.cal}<span class="ph">${shortDate(date)} with ${d.name}</span>`;
  cta.disabled=true;cta.textContent="Choose a time";
 }
}
const refocus=n=>{const e=document.querySelector(`input[name=${n}]:checked`);if(e)e.focus()};
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.name==="dentist"){
  st.d=t.value;st.time=null;const d=dent();
  if(!slotsFor(d,DAYS[st.day]).length)st.day=DAYS.indexOf(firstFree(d));
  renderDays();renderSlots();renderSum();refocus("dentist")}
 if(t.name==="day"){st.day=+t.value;st.time=null;renderDays();renderSlots();renderSum();refocus("day")}
 if(t.name==="time"){st.time=t.value;renderSlots();renderSum();refocus("time")}
});
$("#cta").addEventListener("click",()=>{
 const d=dent(),date=DAYS[st.day];
 $("#receipt").innerHTML=[["Dentist",d.name],["Date",longDate(date)],["Time",fmt(st.time)],["Place","Fernlea Dental, 14 Alder Lane"]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("");
 $("#flow").hidden=true;$("#foot").hidden=true;$("#done").hidden=false;$("#done").focus();window.scrollTo(0,0);
});
$("#change").addEventListener("click",()=>{$("#done").hidden=true;$("#flow").hidden=false;$("#foot").hidden=false;window.scrollTo(0,0)});
st.day=DAYS.indexOf(firstFree(dent()));
renderDentists();renderDays();renderSlots();renderSum();
</script>
</body>
</html>
