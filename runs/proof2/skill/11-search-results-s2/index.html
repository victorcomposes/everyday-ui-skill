  ['Mild chickpea curry for kids','Hannah Beck','Indian',30,4,4.3,876,'B','A gentle, slightly sweet chickpea curry with no chilli. Blends easily for little ones.'],
  ['Chickpea curry with coconut rice','Noi Charoen','Thai',40,4,4.4,164,'A','Chickpea curry with lemongrass, served over coconut rice.'],
  ['Green chickpea curry with lime','Ines Duarte','Thai',30,4,4.1,143,'A','Green curry paste, courgette, chickpeas and a hit of lime.'],
].map((r, i) => ({ id: i + 1, title: r[0], by: r[1], cuisine: r[2], mins: r[3], serves: r[4], rating: r[5], reviews: r[6],
  vegan: r[7] !== 'C', vegetarian: true, gf: r[7] !== 'B', df: r[7] !== 'C', snip: r[8] }));

const params = new URLSearchParams(location.search);
const STATE = params.get('state') || '';
if (STATE === 'stress') {
  RECIPES.splice(1, 0,
    { id: 90, title: 'Slow-braised smoky chickpea and roasted aubergine curry with tamarind, green chilli and coconut cream, served with warm flatbreads', by: 'Ottoline Featherstonehaugh-Delacroix', cuisine: 'Indian', mins: 195, serves: 8, rating: null, reviews: 0, vegan: true, vegetarian: true, gf: false, df: true, snip: 'Chickpeas braised for three hours with smoked paprika, aubergine and tamarind until the sauce turns glossy. A weekend curry for a crowd.' },
    { id: 91, title: 'Chana', by: 'Kit', cuisine: 'Indian', mins: 5, serves: 1, rating: 4.9, reviews: 12480, vegan: true, vegetarian: true, gf: true, df: true, snip: 'Chickpea curry.' });
}

const PER = 10;
const f = { diet: new Set(), cuisine: new Set(), time: 'any', rating: 'any' };
let q = STATE === 'empty' ? '' : STATE === 'noresults' ? 'chickpea currry' : (params.get('q') ?? 'chickpea curry');
let sort = 'relevance', page = 1, sheet = false;
const saved = new Set([3]);
const nf = new Intl.NumberFormat('en-GB');
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rx = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const terms = (s) => s.toLowerCase().split(/\s+/).filter(Boolean);
const hi = (text) => { const t = terms(q).map(rx); const e = esc(text); return t.length ? e.replace(new RegExp('\\b(' + t.join('|') + ')\\p{L}*', 'giu'), '<strong>$&</strong>') : e; };
const dur = (m) => m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
const hay = (r) => (r.title + ' ' + r.snip).toLowerCase();
const hasTerms = (r, s) => terms(s).every((t) => new RegExp('\\b' + rx(t)).test(hay(r)));
const DIETS = [['vegan', 'Vegan'], ['vegetarian', 'Vegetarian'], ['gf', 'Gluten-free'], ['df', 'Dairy-free']];
const TIMES = [['any', 'Any time', 1e9], ['30', 'Under 30 min', 30], ['60', 'Under 1 hour', 60]];
const RATINGS = [['any', 'Any rating', 0], ['4', '4.0 and up', 4], ['4.5', '4.5 and up', 4.5]];
const lim = (list, k) => list.find((t) => t[0] === k)[2];
const passes = (r, skip) => (skip === 'diet' || [...f.diet].every((d) => r[d]))
  && (skip === 'cuisine' || !f.cuisine.size || f.cuisine.has(r.cuisine))
  && (skip === 'time' || r.mins <= lim(TIMES, f.time))
  && (skip === 'rating' || (r.rating ?? 0) >= lim(RATINGS, f.rating));

const ICON = {
  bowl: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20h28a14 14 0 0 1-28 0z"/><path d="M15 8c-2 2.6 2 4.4 0 7M25 8c-2 2.6 2 4.4 0 7"/></svg>`,
  star: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.2l2 4.3 4.7.6-3.4 3.2.9 4.7L8 11.7 3.8 14l.9-4.7L1.3 6.1 6 5.5z"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>',
  mark: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3z"/></svg>',
  x: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  rec: '<svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>',
  warn: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 5.5v5M10 13.5v.01"/></svg>',
};

function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[a.length][b.length]; }
const VOCAB = [...new Set(RECIPES.flatMap((r) => hay(r).match(/[a-z]{4,}/g)))];
function suggest() { let changed = false;
  const out = terms(q).map((t) => { if (VOCAB.some((v) => v.startsWith(t))) return t; const best = VOCAB.map((v) => [lev(t, v), v]).sort((a, b) => a[0] - b[0])[0]; if (best && best[0] <= 2) { changed = true; return best[1]; } return t; });
  return changed ? out.join(' ') : ''; }

function facetGroup(key, name, opts, type) {
  return `<fieldset><legend>${name}</legend>${opts.map(([v, label, n]) => {
    const on = type === 'checkbox' ? f[key].has(v) : f[key] === v;
    return `<label class="opt"><input type="${type}" name="${key}" value="${esc(v)}" ${on ? 'checked' : ''}><span class="t">${label}</span><span class="n num">${nf.format(n)}</span></label>`; }).join('')}</fieldset>`;
}
function filtersHTML(base, shown) {
  const cuisines = [...new Set(base.map((r) => r.cuisine))].map((c) => [c, c, base.filter((r) => r.cuisine === c && passes(r, 'cuisine')).length]).sort((a, b) => b[2] - a[2]);
  return `<div class="fhead"><h2 id="fh">Filters</h2><button type="button" class="btn btn-text fclose" data-act="close">Close</button></div>`
    + facetGroup('diet', 'Diet', DIETS.map(([k, l]) => [k, l, base.filter((r) => r[k] && passes(r, 'diet')).length]), 'checkbox')
    + facetGroup('time', 'Total time', TIMES.map(([k, l, m]) => [k, l, base.filter((r) => r.mins <= m && passes(r, 'time')).length]), 'radio')
    + facetGroup('rating', 'Rating', RATINGS.map(([k, l, m]) => [k, l, base.filter((r) => (r.rating ?? 0) >= m && passes(r, 'rating')).length]), 'radio')
    + facetGroup('cuisine', 'Cuisine', cuisines, 'checkbox')
    + `<div class="ffoot"><button type="button" class="btn btn-text" data-act="clear">Clear all</button><button type="button" class="btn btn-primary" data-act="close">Show ${nf.format(shown)} ${shown === 1 ? 'recipe' : 'recipes'}</button></div>`;
}
function applied() {
  const a = [];
  f.diet.forEach((d) => a.push(['diet', d, DIETS.find((x) => x[0] === d)[1]]));
  f.cuisine.forEach((c) => a.push(['cuisine', c, c]));
  if (f.time !== 'any') a.push(['time', 'any', TIMES.find((t) => t[0] === f.time)[1]]);
  if (f.rating !== 'any') a.push(['rating', 'any', 'Rating ' + RATINGS.find((t) => t[0] === f.rating)[1]]);
  return a;
}
function rowHTML(r) {
  const tags = [r.vegan ? 'Vegan' : 'Vegetarian', r.gf ? 'Gluten-free' : ''].filter(Boolean).map((t) => `<span class="badge tag">${t}</span>`).join('');
  const rating = r.rating == null ? '<span>No ratings yet</span>' : `<span class="rating num">${ICON.star}${r.rating.toFixed(1)} <span class="rev">(${nf.format(r.reviews)})</span></span>`;
  const on = saved.has(r.id);
  return `<li class="row"><div class="tile" aria-hidden="true">${ICON.bowl(40)}</div>
    <div><h3><a href="#r${r.id}">${hi(r.title)}</a></h3><div class="by">By ${esc(r.by)}</div>
    <p class="snip">${hi(r.snip)}</p>
    <div class="meta">${rating}<span class="num">${ICON.clock}${dur(r.mins)}</span><span class="num">Serves ${r.serves}</span>${tags}</div></div>
    <button type="button" class="btn save" data-save="${r.id}" aria-pressed="${on}" aria-label="${on ? 'Saved' : 'Save'} ${esc(r.title)}">${ICON.mark}<span class="lbl">${on ? 'Saved' : 'Save'}</span></button></li>`;
}
function pagerHTML(total) {
  const pages = Math.ceil(total / PER), a = (page - 1) * PER + 1, b = Math.min(total, page * PER);
  if (pages < 2) return `<div class="pager"><span class="num">Showing ${a}–${b} of ${nf.format(total)}</span></div>`;
  return `<nav class="pager" aria-label="Pagination"><span class="num">Showing ${a}–${b} of ${nf.format(total)} recipes</span><div class="pages">
    <button class="btn" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''}>Previous</button>
    ${Array.from({ length: pages }, (_, i) => `<button class="btn num" data-page="${i + 1}" ${i + 1 === page ? 'aria-current="page"' : ''} aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
    <button class="btn nx" data-page="${page + 1}" ${page === pages ? 'disabled' : ''}>Next</button></div></nav>`;
}
const quote = (s) => '“' + esc(s) + '”';

function render() {
  const view = $('#view'); $('#q').value = q; $('#clearQ').hidden = !q;
  document.title = (q ? q + ' - ' : '') + 'Larder recipes';
  document.body.style.overflow = sheet ? 'hidden' : '';
  if (STATE === 'error') {
    view.innerHTML = `<div class="head"><div><h1>Search recipes</h1></div></div>
      <div class="banner" role="alert">${ICON.warn}<div><b>Search isn't working right now</b>We could not load results for ${quote(q)}. Your saved recipes are safe.<br><button class="btn" data-act="retry">Try again</button></div></div>`; return; }
  if (!q.trim()) {
    view.innerHTML = `<div class="head"><div><h1>Search recipes</h1><p>Find a dish by name or by what is in your cupboard.</p></div></div>
      <h2 class="h2s">Recent searches</h2>
      <ul class="recent">${['chickpea curry', 'chana masala', 'tikka masala', 'coconut rice'].map((s) => `<li><button type="button" data-q="${s}">${ICON.rec}<span>${s}</span><span class="c num">${RECIPES.filter((r) => hasTerms(r, s)).length} recipes</span></button></li>`).join('')}</ul>
      <h2 class="h2s">Popular this week</h2>
      <div class="pop">${['Dal', 'Shakshuka', 'Banana bread', 'One-pot pasta'].map((s) => `<button type="button" class="chip" data-q="${s}">${s}</button>`).join('')}</div>`; return; }
  if (STATE === 'loading') {
    view.innerHTML = `<div class="head"><div><h1>Searching for ${quote(q)}</h1><p>Looking through 9,412 recipes.</p></div></div>
      <div class="layout"><div class="results" aria-busy="true" role="status"><div class="bar-load"><i></i></div><ul class="list dim">${[0,1,2,3,4].map(() => `<li class="row sk"><div class="tile"></div><div><i></i><i style="width:90%"></i><i style="width:45%"></i></div><span></span></li>`).join('')}</ul></div></div>`; return; }

  const base = RECIPES.filter((r) => hasTerms(r, q));
  const list = base.filter((r) => passes(r));
  if (sort === 'quick') list.sort((a, b) => a.mins - b.mins);
  if (sort === 'rated') list.sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0));
  if (sort === 'reviews') list.sort((a, b) => b.reviews - a.reviews);
  const total = list.length; page = Math.min(page, Math.max(1, Math.ceil(total / PER)));
  const chips = applied();
  const sortHTML = `<label class="sort"><span>Sort by</span> <select id="sort">${[['relevance','Relevance'],['rated','Top rated'],['reviews','Most reviewed'],['quick','Quickest']].map(([v, l]) => `<option value="${v}" ${v === sort ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;

  if (!base.length) {
    const s = suggest();
    view.innerHTML = `<div class="head"><div><h1>No recipes for ${quote(q)}</h1></div></div>
      <div class="state"><svg class="art" width="120" height="96" viewBox="0 0 120 96" fill="none" aria-hidden="true"><rect x="10" y="10" width="100" height="22" rx="8" fill="var(--accent-subtle)"/><rect x="10" y="40" width="100" height="22" rx="8" fill="var(--bg-subtle)" stroke="var(--border)"/><circle cx="92" cy="68" r="16" fill="var(--surface)" stroke="currentColor" stroke-width="3"/><path d="M104 80l8 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <h2>Nothing matched that spelling</h2>
      <p>${s ? `Did you mean <a class="link" href="#" data-q="${esc(s)}">${esc(s)}</a>? ` : ''}Check the spelling, or try a broader word such as the main ingredient.</p>
      <div class="acts"><button class="btn" data-act="clearq">Clear search</button></div></div>`; return; }

  view.innerHTML = `<div class="head"><div><h1>${nf.format(total)} ${total === 1 ? 'recipe' : 'recipes'} for ${quote(q)}</h1>
      <p>Matched in recipe titles and descriptions.</p></div>
      <div class="tools"><button type="button" class="btn fbtn" data-act="open" aria-controls="filters">Filters${chips.length ? ' (' + chips.length + ')' : ''}</button>${sortHTML}</div></div>
    ${chips.length ? `<div class="chips" aria-label="Applied filters" role="group">${chips.map(([k, v, l]) => `<button type="button" class="chip" data-rm="${k}:${esc(v)}" aria-label="Remove filter ${esc(l)}">${esc(l)}${ICON.x}</button>`).join('')}<button type="button" class="btn btn-text" data-act="clear">Clear all</button></div>` : ''}
    <div class="layout"><aside class="filters${sheet ? ' open' : ''}" id="filters" aria-labelledby="fh">${filtersHTML(base, total)}</aside>
    <section class="results" id="results" aria-label="Results">${total ? `<ul class="list">${list.slice((page - 1) * PER, page * PER).map(rowHTML).join('')}</ul>${pagerHTML(total)}`
      : `<div class="state"><h2>No recipes match these filters</h2><p>${nf.format(base.length)} recipes match ${quote(q)} without them.</p><div class="acts"><button class="btn" data-act="clear">Clear all filters</button></div></div>`}</section></div>
    ${sheet ? '<div class="scrim" data-act="close"></div>' : ''}`;
  if (sheet) $('#filters input')?.focus();
}

const clearFilters = () => { f.diet.clear(); f.cuisine.clear(); f.time = f.rating = 'any'; page = 1; };
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') sort = t.value;
  else if (t.name === 'diet' || t.name === 'cuisine') t.checked ? f[t.name].add(t.value) : f[t.name].delete(t.value);
  else if (t.name === 'time' || t.name === 'rating') f[t.name] = t.value;
  else return;
  page = 1; render();
  $(t.id ? '#' + t.id : `#filters input[name="${t.name}"][value="${CSS.escape(t.value)}"]`)?.focus();
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act],[data-q],[data-rm],[data-page],[data-save]'); if (!b) return;
  if (b.dataset.save) { const id = +b.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); const y = scrollY; render(); scrollTo(0, y); document.querySelector(`[data-save="${id}"]`)?.focus(); return; }
  if (b.dataset.page) { page = +b.dataset.page; render(); $('#results').scrollIntoView(); return; }
  if (b.dataset.rm) { const [k, v] = b.dataset.rm.split(':'); k === 'diet' || k === 'cuisine' ? f[k].delete(v) : (f[k] = 'any'); page = 1; render(); return; }
  if (b.dataset.q != null) { e.preventDefault(); q = b.dataset.q; page = 1; render(); return; }
  const a = b.dataset.act;
  if (a === 'clear') { clearFilters(); render(); }
  if (a === 'clearq') { q = ''; render(); $('#q').focus(); }
  if (a === 'open') { sheet = true; render(); }
  if (a === 'close') { sheet = false; render(); $('.fbtn')?.focus(); }
  if (a === 'retry') location.href = location.pathname;
});
$('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); q = $('#q').value.trim(); page = 1; render(); });
$('#q').addEventListener('input', (e) => { $('#clearQ').hidden = !e.target.value; });
$('#clearQ').addEventListener('click', () => { $('#q').value = ''; $('#clearQ').hidden = true; $('#q').focus(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet) { sheet = false; render(); $('.fbtn')?.focus(); } });
matchMedia('(min-width: 901px)').addEventListener('change', (e) => { if (e.matches && sheet) { sheet = false; render(); } });
render();
</script>
</body>
</html>
