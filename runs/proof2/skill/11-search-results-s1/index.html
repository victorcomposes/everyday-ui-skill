<script>
/* ---------- data ---------- */
const RECIPES = [

 { id: 'r2',  title: 'One-pot chickpea curry with spinach', by: 'Tomasz Wieczorek', min: 30, rating: 4.7, reviews: 986, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'pot', desc: 'A one-pot chickpea curry with tomatoes and wilted spinach. Cook it in the same pan you brown the onions in.' },
 { id: 'r3',  title: 'Slow cooker chickpea curry', by: 'Annika Lindqvist', min: 260, rating: 4.6, reviews: 742, diets: ['vegan'], method: 'Slow cooker', glyph: 'pot', desc: 'Dried chickpeas cook with a mild curry paste all day. Stir in coconut yoghurt just before serving.' },
 { id: 'r4',  title: 'Chana masala (Punjabi chickpea curry)', by: 'Harpreet Gill', min: 45, rating: 4.9, reviews: 3318, diets: ['vegan','gluten-free'], method: 'Stovetop', glyph: 'bowl', desc: 'The classic tangy chickpea curry, built on a slow-cooked onion and tomato base with whole spices.' },
 { id: 'r5',  title: 'Instant Pot chickpea tikka masala', by: 'Daniel Okafor', min: 40, rating: 4.5, reviews: 1102, diets: ['vegetarian','gluten-free'], method: 'Instant Pot', glyph: 'pot', desc: 'Pressure-cooked chickpeas in a creamy tikka masala sauce. This curry uses yoghurt and a splash of cream.' },
 { id: 'r6',  title: 'Chickpea and sweet potato curry', by: 'Rosa Delgado', min: 50, rating: 4.7, reviews: 1570, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Sweet potato melts into the sauce while the chickpeas hold their shape. A filling curry for cold nights.' },
 { id: 'r7',  title: 'Thai red chickpea curry', by: 'Napat Chaiyasit', min: 25, rating: 4.6, reviews: 624, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Red curry paste, lime leaves and green beans with chickpeas standing in for chicken.' },
 { id: 'r8',  title: 'Chickpea coconut curry soup', by: 'Meera Shah', min: 30, rating: 4.4, reviews: 318, diets: ['vegan','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'A thin, spoonable chickpea curry with red lentils and lemon. Blend half for a smoother soup.' },

 { id: 'r10', title: 'Chickpea curry with paneer', by: 'Harpreet Gill', min: 40, rating: 4.6, reviews: 835, diets: ['vegetarian','gluten-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Browned paneer cubes and chickpeas in a spiced tomato curry. Finish with fresh coriander.' },
 { id: 'r11', title: 'Weeknight chickpea curry in 15 minutes', by: 'Joy Abara', min: 15, rating: 4.3, reviews: 1904, diets: ['vegan','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Tinned chickpeas, tinned tomatoes and a spoon of curry powder. The fastest curry on the site.' },
 { id: 'r12', title: 'Butter chickpea curry', by: 'Daniel Okafor', min: 35, rating: 4.8, reviews: 1266, diets: ['vegetarian','gluten-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Chickpeas in a rich butter masala sauce. Serve with naan to mop up the curry.' },

 { id: 'r14', title: 'Madras-style chickpea curry', by: 'Annika Lindqvist', min: 245, rating: 4.4, reviews: 276, diets: ['vegan'], method: 'Slow cooker', glyph: 'pot', desc: 'A hotter chickpea curry with Madras spices, left to cook slowly for a deeper flavour.' },
 { id: 'r15', title: 'Chickpea curry meal prep bowls', by: 'Joy Abara', min: 50, rating: 4.6, reviews: 541, diets: ['vegan','gluten-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Four portions of chickpea curry with brown rice and pickled onion. Keeps for four days in the fridge.' },
 { id: 'r16', title: 'Kerala chickpea curry with roasted coconut', by: 'Priya Venkat', min: 60, rating: 4.8, reviews: 713, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Coconut roasted until dark gives this chickpea curry its nutty, deep body.' },
 { id: 'r17', title: 'Spinach, tomato and chickpea curry', by: 'Rosa Delgado', min: 30, rating: 4.5, reviews: 1058, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'A light curry of tomatoes, spinach and chickpeas that works with a pantry and one fresh bunch.' },
 { id: 'r18', title: 'Chickpea curry pot pie', by: 'Ben Hartley', min: 75, rating: 4.2, reviews: 144, diets: ['vegetarian'], method: 'Oven', glyph: 'tray', desc: 'Chickpea curry under a flaky pastry lid. Make the curry the day before for a quicker bake.' },
 { id: 'r19', title: 'Smoky chickpea curry with roasted aubergine', by: 'Tomasz Wieczorek', min: 55, rating: 4.6, reviews: 387, diets: ['vegan','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Charred aubergine and chickpeas in a smoked paprika curry sauce.' },
 { id: 'r20', title: 'Coconut chickpea curry with lime rice', by: 'Napat Chaiyasit', min: 35, rating: 4.7, reviews: 664, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'A coconut chickpea curry served over rice scented with lime zest and curry leaves.' },
 { id: 'r21', title: 'Curried chickpea salad sandwich', by: 'Joy Abara', min: 10, rating: 4.4, reviews: 2311, diets: ['vegetarian'], method: 'No cook', glyph: 'sand', desc: 'Mashed chickpeas with curry powder, mango chutney and celery. Ready in ten minutes with no cooking.' },
 { id: 'r22', title: 'Chickpea curry with kale', by: 'Meera Shah', min: 30, rating: 4.5, reviews: 493, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Sturdy kale and chickpeas in a lemony curry sauce. Add a spoon of tahini to finish.' },
 { id: 'r23', title: 'Instant Pot chana masala', by: 'Harpreet Gill', min: 35, rating: 4.7, reviews: 1448, diets: ['vegan','gluten-free','dairy-free'], method: 'Instant Pot', glyph: 'pot', desc: 'Dried chickpeas cooked from scratch in under 40 minutes. A classic chickpea curry without soaking.' },
 { id: 'r24', title: 'Chickpea and lentil curry', by: 'Annika Lindqvist', min: 40, rating: 4.6, reviews: 777, diets: ['vegan','gluten-free','dairy-free'], method: 'Stovetop', glyph: 'bowl', desc: 'Red lentils melt into the sauce and chickpeas keep their bite in this budget curry.' },
 { id: 'r25', title: 'Slow cooker coconut chickpea and squash curry', by: 'Rosa Delgado', min: 315, rating: 4.5, reviews: 366, diets: ['vegan','gluten-free','dairy-free'], method: 'Slow cooker', glyph: 'pot', desc: 'Butternut squash and chickpeas turn tender in a coconut curry sauce while you are out.' },
 { id: 'r26', title: 'Oven-baked chickpea curry', by: 'Ben Hartley', min: 45, rating: 4.3, reviews: 212, diets: ['vegan','gluten-free'], method: 'Oven', glyph: 'tray', desc: 'Stir everything into one dish, cover, and bake. A hands-off chickpea curry.' }
];
const DIETS = [['vegan','Vegan'],['vegetarian','Vegetarian'],['gluten-free','Gluten-free'],['dairy-free','Dairy-free']];
const METHODS = ['Stovetop','Slow cooker','Instant Pot','Oven','No cook'];
const TIMES = [[15,'15 min or less'],[30,'30 min or less'],[45,'45 min or less'],[60,'1 hour or less']];
const RECENT = ['lentil dal','weeknight pasta','chana masala','vegan chilli'];
const POPULAR = ['Quick weeknight dinners','One-pot vegetarian','Budget meal prep','Slow cooker favourites','High-protein vegan'];
const TYPOS = { kurry: 'curry', curri: 'curry', chickpee: 'chickpea', chikpea: 'chickpea' };

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
const mode = params.get('state') || '';
if (mode === 'stress') {
  RECIPES[0].reviews = 12480;
  RECIPES[1].rating = null;
  RECIPES[2].title = 'Slow cooker chickpea curry with coconut milk, toasted cumin, fenugreek leaves and a quick lime pickle';
  RECIPES[3].by = 'Q';
}
const S = {
  q: mode === 'empty' ? '' : (params.get('q') ?? 'chickpea curry'),
  diet: new Set(), method: new Set(), time: mode === 'none' ? 15 : 0, rating: 0,
  sort: 'match', page: 1, saved: new Set(['r4', 'r12'])
};
if (mode === 'none') S.method.add('Slow cooker');
const PER = 10;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = new Intl.NumberFormat('en-GB');
const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;
const fmtTime = (m) => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const ico = {
  clock: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  star: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  heart: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg>',
  prev: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  next: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  hist: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 4v4.5H8M12 8v4l3 2"/></svg>',
  go: '<svg class="i go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
};

/* ---------- search and filter logic ---------- */
const stem = (w) => w.toLowerCase().replace(/(ies|y|s)$/, '');
const tokens = () => S.q.toLowerCase().split(/\s+/).filter(Boolean);
const searchText = (r) => (r.title + ' ' + r.desc + ' ' + r.by + ' ' + r.diets.join(' ') + ' ' + r.method).toLowerCase();
const inQuery = (r) => {
  const words = searchText(r).split(/[^a-z0-9-]+/);
  return tokens().every((k) => words.some((w) => w.startsWith(stem(k))));
};
const dietMatch = (r, d) => d === 'vegetarian' ? r.diets.includes('vegetarian') || r.diets.includes('vegan') : r.diets.includes(d);
const passes = (r, skip) => {
  if (skip !== 'diet' && ![...S.diet].every((d) => dietMatch(r, d))) return false;
  if (skip !== 'method' && S.method.size && !S.method.has(r.method)) return false;
  if (skip !== 'time' && S.time && r.min > S.time) return false;
  if (skip !== 'rating' && S.rating && !(r.rating >= S.rating)) return false;
  return true;
};
const base = () => S.q.trim() ? RECIPES.filter(inQuery) : [];
const sorters = {
  match: () => 0,
  rating: (a, b) => (b.rating ?? -1) - (a.rating ?? -1),
  time: (a, b) => a.min - b.min,
  reviews: (a, b) => b.reviews - a.reviews
};
const filterCount = () => S.diet.size + S.method.size + (S.time ? 1 : 0) + (S.rating ? 1 : 0);
const highlight = (text) => {
  const stems = tokens().map(stem).filter(Boolean);
  const safe = esc(text);
  if (!stems.length) return safe;
  return safe.replace(new RegExp('\\b(' + stems.join('|') + ')[a-z]*', 'gi'), '<strong>$&</strong>');
};
const dietLabel = (d) => (DIETS.find((x) => x[0] === d) || [0, d])[1];
const timeLabel = (v) => TIMES.find((x) => x[0] === v)[1];

/* ---------- render pieces ---------- */
function renderFilters(pool) {
  const cnt = (fn) => pool.filter(fn).length;
  const opt = (type, name, val, label, n, checked) => `<label class="fopt"><input type="${type}" name="${name}" value="${esc(val)}" ${checked ? 'checked' : ''}><span class="lbl">${label}</span><span class="count">${n}</span></label>`;
  $('#filtersBody').innerHTML = `
    <fieldset class="fgroup"><legend>Diet</legend>${DIETS.map(([v, l]) => opt('checkbox', 'diet', v, l, cnt((r) => dietMatch(r, v)), S.diet.has(v))).join('')}</fieldset>
    <fieldset class="fgroup"><legend>Total time</legend>
      ${opt('radio', 'time', 0, 'Any time', pool.length, !S.time)}
      ${TIMES.map(([v, l]) => opt('radio', 'time', v, l, cnt((r) => r.min <= v), S.time === v)).join('')}</fieldset>
    <fieldset class="fgroup"><legend>Method</legend>${METHODS.map((m) => opt('checkbox', 'method', m, m, cnt((r) => r.method === m), S.method.has(m))).join('')}</fieldset>
    <fieldset class="fgroup"><legend>Rating</legend>
      ${opt('radio', 'rating', 0, 'Any rating', pool.length, !S.rating)}
      ${opt('radio', 'rating', 4.5, '4.5 stars and up', cnt((r) => r.rating >= 4.5), S.rating === 4.5)}</fieldset>`;
}
function renderChips() {
  const el = $('#chips'), list = [];
  S.diet.forEach((d) => list.push(['diet', d, dietLabel(d)]));
  S.method.forEach((m) => list.push(['method', m, m]));
  if (S.time) list.push(['time', S.time, timeLabel(S.time)]);
  if (S.rating) list.push(['rating', S.rating, '4.5 stars and up']);
  el.hidden = !list.length;
  el.innerHTML = list.map(([g, v, l]) => `<button type="button" class="chip" data-g="${g}" data-v="${esc(v)}" aria-label="Remove filter: ${esc(l)}">${esc(l)}${ico.x}</button>`).join('') +
    (list.length ? '<button type="button" class="btn btn-text" id="clearAll" style="height:var(--control-h-sm)">Clear all</button>' : '');
  const fc = $('#fcount'); fc.hidden = !list.length; fc.textContent = list.length;
}
function rowHtml(r) {
  const saved = S.saved.has(r.id);
  const rate = r.rating == null ? '<span class="it muted">Not yet rated</span>'
    : `<span class="it rate num">${ico.star}${r.rating.toFixed(1)}<span class="muted" style="font-weight:400">(${nf.format(r.reviews)})</span></span>`;
  return `<li class="row">
    <div class="thumb" aria-hidden="true"><svg viewBox="0 0 72 72"><use href="#g-${r.glyph}"/></svg></div>
    <div style="min-width:0">
      <h2 class="rtitle"><a href="#${r.id}">${highlight(r.title)}</a></h2>
      <p class="rdesc">${highlight(r.desc)}</p>
      <div class="rmeta">
        <span class="it time num">${ico.clock}${fmtTime(r.min)}</span>
        ${rate}
        <span class="it by">${esc(r.method)}, by ${esc(r.by)}</span>
        <span class="tags">${r.diets.slice(0, 3).map((d) => `<span class="badge">${dietLabel(d)}</span>`).join('')}</span>
      </div>
    </div>
    <button type="button" class="btn save" data-save="${r.id}" aria-pressed="${saved}" aria-label="${saved ? 'Saved' : 'Save'}: ${esc(r.title)}">${ico.heart}<span class="lbl-m">${saved ? 'Saved' : 'Save'}</span></button>
  </li>`;
}
const art = (g) => `<div class="state-art" aria-hidden="true"><svg viewBox="0 0 72 72"><use href="#g-${g}"/></svg></div>`;

function emptyQueryHtml() {
  return `<div class="group-title first">Recent searches</div>
    <ul class="rlist">${RECENT.map((t) => `<li><a href="?q=${encodeURIComponent(t)}">${ico.hist}<span>${esc(t)}</span>${ico.go}</a></li>`).join('')}</ul>
    <div class="group-title">Popular this week</div>
    <div class="pills">${POPULAR.map((t) => `<a href="?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div>`;
}
function noneHtml(pool) {
  const n = filterCount();
  if (!pool.length) {
    const fixed = tokens().map((t) => TYPOS[t] || t).join(' ');
    const fix = fixed !== tokens().join(' ') ? fixed : '';
    return `<div class="state">${art('bowl')}
      <h2>No recipes for &ldquo;${esc(S.q)}&rdquo;</h2>
      <p>${fix ? `Did you mean <a class="link" href="?q=${encodeURIComponent(fix)}">${esc(fix)}</a>?` : 'Check the spelling or try a more general word, like the main ingredient.'}</p>
      <div class="acts"><a class="btn" href="?q=chickpea+curry">Search &ldquo;chickpea curry&rdquo;</a></div></div>`;
  }
  const groups = { diet: S.diet.size, method: S.method.size, time: S.time, rating: S.rating };
  let best = null;
  Object.keys(groups).filter((g) => groups[g]).forEach((g) => {
    const c = pool.filter((r) => passes(r, g)).length;
    if (!best || c > best.c) best = { g, c };
  });
  const label = { diet: [...S.diet].map(dietLabel).join(' and '), method: [...S.method].join(' or '), time: S.time && timeLabel(S.time), rating: '4.5 stars and up' }[best.g];
  return `<div class="state">${art('pot')}
    <h2>No recipes match ${n === 1 ? 'this filter' : `all ${n} filters`}</h2>
    <p>Removing &ldquo;${esc(label)}&rdquo; shows ${plural(best.c, 'recipe', 'recipes')} for &ldquo;${esc(S.q)}&rdquo;.</p>
    <div class="acts"><button type="button" class="btn" data-clear-group="${best.g}">Remove &ldquo;${esc(label)}&rdquo;</button><button type="button" class="btn btn-text" id="clearAll2">Clear all filters</button></div></div>`;
}
function pagerHtml(total) {
  const pages = Math.ceil(total / PER);
  if (pages < 2) return '';
  const from = (S.page - 1) * PER + 1, to = Math.min(total, S.page * PER);
  let nums = '';
  for (let p = 1; p <= pages; p++) nums += `<li class="pn"><button type="button" data-page="${p}" ${p === S.page ? 'aria-current="page"' : ''} aria-label="Page ${p}">${p}</button></li>`;
  return `<nav class="pager" aria-label="Pagination"><span class="muted num info">Showing ${from}&ndash;${to} of ${total}</span>
    <ul><li><button type="button" data-page="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''}>${ico.prev}Previous</button></li>${nums}<li><button type="button" data-page="${S.page + 1}" ${S.page === pages ? 'disabled' : ''}>Next${ico.next}</button></li></ul></nav>`;
}

/* ---------- render ---------- */
function render() {
  const pool = base();
  const filtered = pool.filter((r) => passes(r)).sort(sorters[S.sort]);
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PER));
  if (S.page > pages) S.page = pages;
  const slice = filtered.slice((S.page - 1) * PER, S.page * PER);
  const q = S.q.trim();

  $('#q').value = S.q;
  $('#clear').hidden = !S.q;
  let title;
  if (!q) title = 'Search recipes';
  else if (!total) title = `No recipes for “${S.q}”`;
  else title = `${plural(total, 'recipe', 'recipes')} for “${S.q}”`;
  $('#title').textContent = title;
  document.title = title + ' - Spoonful';
  $('#live').textContent = q ? `${total} results for "${S.q}"` : '';
  $('#showBtn').textContent = total ? `Show ${plural(total, 'recipe', 'recipes')}` : 'No recipes match';

  renderFilters(pool);
  renderChips();
  document.querySelector('.toolbar').hidden = !q;
  $('#filters').hidden = !q;
  $('#layout').style.gridTemplateColumns = q ? '' : 'minmax(0, 1fr)';
  $('#range').textContent = total ? (total > PER ? `${(S.page - 1) * PER + 1}–${Math.min(total, S.page * PER)} of ${total}` : `All ${total}`) : '';
  document.querySelector('.sort').hidden = !total;

  let html = '';
  if (!q) html = emptyQueryHtml();
  else if (mode === 'error') {
    html = `<div class="banner" role="alert">${ico.alert}<div><strong>Search isn't working right now</strong>Your filters are kept and no recipes were lost. Try again in a moment.<br><button type="button" class="btn" id="retry">Try again</button></div></div>`;
  } else if (mode === 'loading') {
    html = `<div class="progress" role="progressbar" aria-label="Loading results"><i></i></div><div aria-hidden="true">${'<div class="skel"><i class="a"></i><div><i class="b"></i><i class="c"></i><i class="d"></i></div><i></i></div>'.repeat(6)}</div>`;
  } else if (!total) html = noneHtml(pool);
  else html = `<ul class="results" aria-label="Recipes">${slice.map(rowHtml).join('')}</ul>${pagerHtml(total)}`;
  $('#body').innerHTML = html;
}

/* ---------- events ---------- */
$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = new URL(location.href);
  u.searchParams.set('q', $('#q').value.trim());
  u.searchParams.delete('state');
  location.href = u.toString();
});
$('#clear').addEventListener('click', () => { S.q = ''; S.page = 1; render(); $('#q').focus(); });
$('#q').addEventListener('input', () => { $('#clear').hidden = !$('#q').value; });
$('#sort').addEventListener('change', (e) => { S.sort = e.target.value; S.page = 1; render(); });
$('#filtersBody').addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'diet' || t.name === 'method') (t.checked ? S[t.name].add(t.value) : S[t.name].delete(t.value));
  else S[t.name] = Number(t.value);
  S.page = 1; render();
});
const clearGroup = (g) => { if (g === 'diet' || g === 'method') S[g].clear(); else S[g] = 0; S.page = 1; render(); };
document.addEventListener('click', (e) => {
  const c = e.target.closest('button, a'); if (!c) return;
  if (c.dataset.g) {
    const g = c.dataset.g;
    if (g === 'diet' || g === 'method') S[g].delete(c.dataset.v); else S[g] = 0;
    S.page = 1; render();
  } else if (c.id === 'clearAll' || c.id === 'clearAll2') {
    S.diet.clear(); S.method.clear(); S.time = 0; S.rating = 0; S.page = 1; render();
  } else if (c.dataset.clearGroup) clearGroup(c.dataset.clearGroup);
  else if (c.dataset.page) { S.page = Number(c.dataset.page); render(); $('#results').scrollIntoView({ block: 'start' }); }
  else if (c.dataset.save) {
    const id = c.dataset.save;
    S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id);
    $('#savedCount').textContent = 10 + S.saved.size;
    render();
    document.querySelector(`[data-save="${id}"]`)?.focus();
  } else if (c.id === 'retry') {
    const u = new URL(location.href); u.searchParams.delete('state'); location.href = u.toString();
  }
});

/* phone filter sheet */
const sheet = $('#filters'), backdrop = $('#backdrop'), mq = matchMedia('(max-width: 900px)');
let sheetOpen = false;
function syncSheet() {
  sheet.inert = mq.matches && !sheetOpen;
  sheet.classList.toggle('open', sheetOpen && mq.matches);
  backdrop.classList.toggle('open', sheetOpen && mq.matches);
  if (mq.matches) sheet.setAttribute('role', 'dialog'); else sheet.removeAttribute('role');
}
function setSheet(open) { sheetOpen = open; syncSheet(); (open ? $('#closeSheet') : $('#openSheet')).focus(); }
$('#openSheet').addEventListener('click', () => setSheet(true));
$('#closeSheet').addEventListener('click', () => setSheet(false));
$('#showBtn').addEventListener('click', () => setSheet(false));
backdrop.addEventListener('click', () => setSheet(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpen) setSheet(false); });
mq.addEventListener('change', syncSheet);

render();
syncSheet();
</script>
</body>
</html>
