<!doctype html>
<html lang="en">
<head>

<title>Aero Runner 2 - Pacer</title>
<style>
/* Ember kit, soft shape, system stack (no network allowed by the output contract). */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;
  --accent: #c2410c; --accent-hover: #9a3412; --accent-subtle: #fdeee5; --on-accent: #ffffff;
  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --placeholder: #6b717d;
  --frame: #f7f7f8; --brand-deep: #1c1f26; --on-deep: #ffffff; --on-deep-muted: #b4b9c4; --accent-on-deep: #ff9a5c;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font);
  --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-xl: 20px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --rhythm-title: 12px; --rhythm-tight: 8px; --rhythm-content: 24px; --rhythm-group: 40px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;
  --control-h-touch: 48px;
  --h-topbar: 56px;
  --shadow-pop: 0 4px 16px rgb(16 24 40 / 0.12), 0 1px 3px rgb(16 24 40 / 0.08);
  --shadow-dialog: 0 16px 48px rgb(16 24 40 / 0.18);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --t-fast: 120ms; --t-base: 160ms;
  --bar-h: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #ff9a5c; --accent-hover: #ffb88a; --accent-subtle: #36210f; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72; --danger-subtle: #2d1715;
    --placeholder: #8b919d;
    --frame: #17191d; --brand-deep: #0f1115; --on-deep: #e9ebef; --on-deep-muted: #a0a6b2;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5); --shadow-dialog: 0 16px 48px rgb(0 0 0 / 0.6);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-bottom: var(--bar-h); }
body { margin: 0; min-height: 100dvh; background: var(--bg-subtle); color: var(--text);
  font: 400 var(--text-md)/24px var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font: 700 28px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 700 var(--text-xl)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
.badge { display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); z-index: 20; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4);
  background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; } }

/* phone column; on wide screens it is one centred column on a tinted page */
.app { position: relative; max-width: 430px; min-height: 100dvh; margin: 0 auto; background: var(--surface); }
@media (min-width: 641px) {
  body { padding: var(--s-6) var(--s-4); }
  .app { min-height: calc(100dvh - 48px); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); overflow: clip; }
}
.muted { color: var(--text-muted); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: var(--s-1); height: var(--h-topbar);
  padding: 0 var(--s-2); background: var(--frame); border-bottom: 1px solid var(--border); }
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px;
  border: 0; border-radius: var(--r-full); background: transparent; cursor: pointer; transition: background-color var(--t-fast) var(--ease); }
.icon-btn:hover { background: var(--border); }
.ico { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wordmark { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--s-2); font: 700 18px/1 var(--font-display); letter-spacing: -0.02em; }
.cluster { display: flex; align-items: center; }
.count-badge { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-full); background: var(--accent); color: var(--on-accent); font-size: var(--text-xs); font-weight: 600; line-height: 1;
  box-shadow: 0 0 0 2px var(--frame); }
#wish[aria-pressed="true"] .ico { fill: var(--accent); stroke: var(--accent); }

/* gallery */
.gallery { position: relative; background: var(--frame); }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; margin: 0; scroll-snap-align: start; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; padding: var(--s-6) var(--s-8) var(--s-8); }
.slide svg { width: 100%; height: 100%; }
.dots { position: absolute; left: 0; right: 0; bottom: var(--s-4); display: flex; justify-content: center; gap: var(--s-2); }
.dots i { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--border-strong); opacity: 0.5; transition: opacity var(--t-base) var(--ease), width var(--t-base) var(--ease); }
.dots i[aria-current="true"] { opacity: 1; width: 20px; background: var(--text); }
.shoe .shadow { fill: var(--text); opacity: 0.1; }
.shoe .edge { stroke: var(--text); stroke-opacity: 0.22; stroke-width: 1.5; }
.shoe .up { fill: var(--up); } .shoe .panel { fill: var(--panel); } .shoe .sole { fill: var(--sole); }
.shoe .ac { stroke: var(--ac); } .shoe .lace { stroke: var(--lace); } .shoe .in { fill: var(--in); }
.slide.flip svg { transform: scaleX(-1); }

/* sections */
.sec { padding: var(--rhythm-group) var(--s-4) 0; }
.info { padding-top: var(--s-6); }
.sub { margin-top: var(--rhythm-title); color: var(--text-muted); }
.price { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s-1) var(--s-3); margin-top: var(--s-5); }
.price strong { font: 700 32px/1.1 var(--font-display); letter-spacing: -0.02em; }
.price s { color: var(--text-muted); }
.save { align-self: center; padding: 2px 8px; border-radius: var(--r-sm); background: var(--accent-subtle); color: var(--accent-hover); font-size: var(--text-sm); font-weight: 600; }
.rating { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 44px; margin-top: var(--s-1); }
.stars { display: inline-flex; gap: 2px; }
.star { position: relative; width: 16px; height: 16px; }
.star svg { position: absolute; inset: 0; width: 16px; height: 16px; }
.star .on { overflow: hidden; position: absolute; inset: 0 auto 0 0; }
.star .on svg { fill: var(--accent); stroke: var(--accent); }
.star > svg { fill: none; stroke: var(--border-strong); }
.rating .link { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

.legend { display: flex; align-items: baseline; justify-content: space-between; width: 100%; padding: 0; margin-bottom: var(--s-3); font-weight: 600; }
.legend .val { font-weight: 400; color: var(--text-muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.legend-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-1); }
.legend-row legend, .legend-row .lg { padding: 0; font-weight: 600; }
.legend-row .val { font-weight: 400; color: var(--text-muted); margin-left: var(--s-2); }
.text-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-1); border: 0; background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; cursor: pointer; }
.text-btn:hover { color: var(--accent-hover); }

.opt { position: relative; display: block; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt input:disabled { cursor: not-allowed; }
.opt .box { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface); font-weight: 500; transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.opt:hover input:not(:disabled) + .box { background: var(--bg-subtle); }
.opt input:checked + .box { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-subtle); }
.opt input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
.opt input:disabled + .box { border-color: var(--border); background: var(--bg-subtle); color: var(--text-muted); text-decoration: line-through; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); }
.colours { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.colours .box { flex-direction: column; gap: 2px; padding: var(--s-2) var(--s-1) var(--s-2); font-size: var(--text-sm); font-weight: 500; text-decoration: none !important; }
.colours .box svg { width: 72px; height: 44px; }
.colours .box small { font-size: var(--text-xs); font-weight: 400; color: var(--text-muted); }
.colours input:disabled + .box svg { opacity: 0.4; }
.size-note { min-height: 20px; margin-top: var(--s-3); font-size: var(--text-sm); color: var(--text-muted); }
.size-note.err { color: var(--danger); font-weight: 500; }
.size-note.low { color: var(--warning); font-weight: 500; }

.deliver { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-lg); }
.deliver .ico { margin-top: 2px; color: var(--accent); }
.deliver strong { display: block; font-size: var(--text-md); }
.deliver p { font-size: var(--text-sm); color: var(--text-muted); }

details { border-top: 1px solid var(--border); }
details:last-of-type { border-bottom: 1px solid var(--border); }
summary { display: flex; align-items: center; justify-content: space-between; min-height: 56px; font-weight: 600; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary .ico { transition: transform var(--t-base) var(--ease); }
details[open] summary .ico { transform: rotate(180deg); }
.panel-body { padding-bottom: var(--s-4); }
dl { display: grid; grid-template-columns: 40% minmax(0, 1fr); gap: var(--s-2) var(--s-3); margin: 0; font-size: var(--text-sm); }
dt { color: var(--text-muted); } dd { margin: 0; }
.panel-body p { font-size: var(--text-sm); }
.panel-body p + p { margin-top: var(--s-2); }

.rev-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-bottom: var(--s-4); }
.rev-score { display: flex; gap: var(--s-4); align-items: center; }
.rev-score strong { font: 700 40px/1 var(--font-display); letter-spacing: -0.02em; }
.rev-score .muted { font-size: var(--text-sm); }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px var(--s-2); align-items: center; font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--rhythm-content); }
.bars .track { height: 6px; border-radius: var(--r-full); background: var(--border); overflow: hidden; }
.bars .fill { display: block; height: 100%; background: var(--text); border-radius: var(--r-full); }
.bars span:first-child, .bars span:last-child { text-align: right; min-width: 36px; }
.review { padding: var(--s-4) 0; border-top: 1px solid var(--border); }
.review header { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--r-full); background: var(--accent-subtle); color: var(--accent-hover); font-size: var(--text-sm); font-weight: 600; flex-shrink: 0; }
.review .who { min-width: 0; flex: 1; }
.review .who b { display: block; font-weight: 600; }
.review .who span { font-size: var(--text-xs); color: var(--text-muted); }
.review h3 { margin: var(--s-2) 0 4px; font-size: var(--text-md); font-weight: 600; }
.review p { font-size: var(--text-sm); overflow-wrap: anywhere; }
.review .meta { margin-top: var(--s-2); font-size: var(--text-xs); color: var(--text-muted); }
.more { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: var(--s-2); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); font-weight: 600; cursor: pointer; }
.more:hover { background: var(--bg-subtle); }
.end { height: var(--s-10); }

/* buy bar */
.buybar { position: sticky; bottom: 0; z-index: 6; display: flex; align-items: center; gap: var(--s-4); margin-top: var(--rhythm-group);
  padding: var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
.buybar .sum { flex: 1; min-width: 0; }
.buybar .sum strong { display: block; font: 700 var(--text-xl)/1.2 var(--font-display); letter-spacing: -0.01em; }
.buybar .sum span { display: block; font-size: var(--text-sm); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 48px; padding: 0 var(--s-6); border: 0; border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; transition: background-color var(--t-fast) var(--ease); }
.btn:hover { background: var(--accent-hover); }
.btn.add { min-width: 176px; }
.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
.btn.secondary:hover { background: var(--bg-subtle); }
.toast { position: absolute; left: var(--s-4); right: var(--s-4); bottom: calc(100% + var(--s-2)); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  padding: 0 var(--s-2) 0 var(--s-4); min-height: 48px; border-radius: var(--r-md); background: var(--brand-deep); color: var(--on-deep); box-shadow: var(--shadow-pop); font-size: var(--text-sm); }
.toast button { min-height: 44px; padding: 0 var(--s-3); border: 0; background: none; color: var(--accent-on-deep); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* size guide sheet */
dialog.sheet { width: 100%; max-width: 430px; max-height: 85dvh; margin: auto auto 0; padding: 0; border: 0; border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow-dialog); overflow: auto; }
dialog.sheet::backdrop { background: rgb(16 24 40 / 0.5); }
.sheet-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: var(--s-4) var(--s-2) var(--s-2) var(--s-4); background: var(--surface); }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: var(--r-full); background: var(--border-strong); opacity: 0.6; }
.sheet-body { padding: 0 var(--s-4) calc(var(--s-6) + env(safe-area-inset-bottom)); }
.sheet-body > p { margin-bottom: var(--s-4); font-size: var(--text-sm); color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th, td { height: 44px; padding: 0; text-align: right; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--text-muted); }
tr.pick td { background: var(--accent-subtle); font-weight: 600; }

/* other states */
.state { display: flex; flex-direction: column; align-items: flex-start; padding: var(--s-10) var(--s-4) var(--s-12); }
.state svg.art { width: 140px; height: 112px; margin-bottom: var(--s-6); }
.state p { margin-top: var(--rhythm-title); color: var(--text-muted); max-width: 34ch; }
.state .btn { margin-top: var(--rhythm-content); }
.state .text-btn { margin-top: var(--s-2); }
.skel { border-radius: var(--r-md); background: var(--bg-subtle); }
</style>
</head>

<a class="skip-link" href="#main">Skip to product</a>
<div class="app" id="app">
  <header class="topbar">

    <div class="wordmark">

  </div>
  <div class="sheet-body">
    <p>Aero Runner 2 runs half a size small. If you are between sizes, order the larger one.</p>
    <table>
      <thead><tr><th scope="col">UK</th><th scope="col">EU</th><th scope="col">US</th><th scope="col">Foot length, cm</th></tr></thead>
      <tbody id="guideRows"></tbody>
    </table>
  </div>
</dialog>

<script>
/* One data module. Every number on screen derives from it. */
const TODAY = new Date('2026-11-27T11:40:00');
const SIZES = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 12];
const STATE = new URLSearchParams(location.search).get('state');
const STRESS = STATE === 'stress';

const product = {
  name: 'Aero Runner 2', sub: "Men's road running shoe", price: 129, was: 150, freeOver: 50, cutoffHour: 16,
  colours: [
    { name: 'Chalk',    upper: '#eceae6', panel: '#d3cfc6', sole: '#faf8f4', accent: '#c2410c', lace: '#ffffff', inside: '#2a2d34', stock: [4, 2, 0, 7, 9, 6, 2, 5, 0, 3, 1, 0] },
    { name: 'Graphite', upper: '#2b2f38', panel: '#454b58', sole: '#e6e3dc', accent: '#ff9a5c', lace: '#cfd3da', inside: '#14161b', stock: [0, 3, 5, 8, 6, 0, 4, 7, 3, 0, 2, 1] },
    { name: 'Moss',     upper: '#5f7a4f', panel: '#3e5334', sole: '#efece4', accent: '#f2c14e', lace: '#f4f1e8', inside: '#1d2a18', stock: [2, 0, 6, 3, 0, 4, 0, 5, 6, 2, 0, 0] },
  ],
  stars: { 5: 842, 4: 276, 3: 98, 2: 41, 1: 27 },
  reviews: [
    { name: 'Marcus Adeyemi', rating: 5, date: '2026-11-02', title: 'Light and quick', text: 'Ran 10 km on wet pavement in these and my feet stayed dry and settled. The heel holds well. Half a size small, so I went up to UK 9.', bought: 'UK 9, Chalk' },
    { name: 'Hannah Kowalczyk', rating: 4, date: '2026-10-19', title: 'Great shoe, snug toe box', text: 'Very comfortable after a week of breaking in. The toe box is narrower than my last pair, but the cushioning is firm without being harsh.', bought: 'UK 7, Graphite' },
  ],
  details: [['Weight', '248 g (UK 9)'], ['Drop', '8 mm'], ['Use', 'Road, daily training'], ['Upper', 'Recycled engineered mesh'], ['Midsole', 'Foam, 32 mm at the heel']],
};
if (STRESS) {
  Object.assign(product, {
    name: 'Aero Runner 2 Gore-Tex Trail Waterproof Anniversary Edition', sub: '', price: 1284.5, was: null,
    stars: { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 }, reviews: [],
  });
  product.colours = product.colours.map((c, i) => ({ ...c, stock: i === 0 ? SIZES.map((_, j) => (j === 6 ? 1 : 0)) : SIZES.map(() => 0) }));
}

/* derived */
const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const num = new Intl.NumberFormat('en-GB');
const day = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const shortDate = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const totalReviews = Object.values(product.stars).reduce((a, b) => a + b, 0);
const average = totalReviews ? Object.entries(product.stars).reduce((s, [k, v]) => s + k * v, 0) / totalReviews : 0;
const savePct = product.was ? Math.round((1 - product.price / product.was) * 100) : 0;
const cutoff = new Date(TODAY); cutoff.setHours(product.cutoffHour, 0, 0, 0);
const minsLeft = Math.max(0, Math.round((cutoff - TODAY) / 60000));
const arrive = new Date(TODAY); arrive.setDate(arrive.getDate() + 1);
const free = product.price >= product.freeOver;
const uk = (s) => 'UK ' + s;
const total = (c) => c.stock.reduce((a, b) => a + b, 0);

const ui = { colour: product.colours.findIndex((c) => total(c) > 0), size: null, wished: false, bag: 2 };
if (ui.colour < 0) ui.colour = 0;
const $ = (s, r = document) => r.querySelector(s);
const ico = (d) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const chevron = ico('<path d="M6 9l6 6 6-6"/>');

function shoeVars(c) { return `--up:${c.upper};--panel:${c.panel};--sole:${c.sole};--ac:${c.accent};--lace:${c.lace};--in:${c.inside}`; }
function shoe(c, label, view = '0 0 340 200') {
  return `<svg class="shoe" viewBox="${view}" style="${shoeVars(c)}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>
    <ellipse class="shadow" cx="176" cy="176" rx="150" ry="6"/>
    <path class="sole edge" d="M26 148 L304 148 C320 148 330 154 330 161 C330 170 320 173 306 173 L52 173 C34 173 26 166 26 148 Z"/>
    <path class="up edge" d="M38 148 C32 128 34 100 44 84 C50 76 62 76 72 74 C88 72 100 66 108 52 C114 44 124 40 134 44 L166 58 C194 68 226 76 256 88 C298 100 330 116 330 148 Z"/>
    <path class="panel" d="M256 88 C298 100 330 116 330 148 L282 148 C284 124 272 100 256 88 Z"/>
    <path class="panel" d="M38 148 C32 128 34 100 44 84 C50 80 56 84 56 90 C50 108 50 128 54 148 Z"/>
    <path class="in" d="M72 74 C88 72 100 66 108 52 C112 64 96 78 72 80 Z"/>
    <path class="ac" fill="none" stroke-width="6" stroke-linecap="round" d="M92 134 C136 134 176 116 206 86"/>
    <g class="lace" fill="none" stroke-width="4" stroke-linecap="round"><path d="M138 52 L152 70"/><path d="M154 58 L168 76"/><path d="M170 65 L184 83"/><path d="M188 73 L202 91"/></g>
  </svg>`;
}
const star = (fill) => `<span class="star">${ico('<path d="M12 3.500l2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 17.300l-5.400 2.900 1.100-6.100L3.200 9.900l6.100-.8z"/>')}<span class="on" style="width:${fill * 100}%">${ico('<path d="M12 3.500l2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 17.300l-5.400 2.900 1.100-6.100L3.200 9.900l6.100-.8z"/>')}</span></span>`;
const stars = (v) => `<span class="stars" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => star(Math.min(1, Math.max(0, v - i)))).join('')}</span>`;
const plural = (n, one, many) => (n === 1 ? one : many);

/* main views */
const main = $('#main');
function renderDefault() {
  const c = product.colours[ui.colour];
  const guideLink = '<button class="text-btn" type="button" id="guideOpen">Size guide</button>';
  main.innerHTML = `
  <section class="gallery" aria-label="Photos">
    <div class="slides" id="slides" tabindex="0" aria-label="${product.name} photos, scroll sideways">
      <figure class="slide">${shoe(c, `${c.name} ${product.name}, outer side`)}</figure>
      <figure class="slide flip">${shoe(c, `${c.name} ${product.name}, inner side`)}</figure>
      <figure class="slide">${shoe(c, `${c.name} ${product.name}, toe close-up`, '170 40 170 150')}</figure>
    </div>
    <div class="dots" id="dots" aria-hidden="true"><i aria-current="true"></i><i></i><i></i></div>
  </section>

  <section class="sec info" aria-labelledby="t">
    <h1 id="t">${product.name}</h1>
    ${product.sub ? `<p class="sub">${product.sub}</p>` : ''}
    <div class="price">
      <strong>${gbp.format(product.price)}</strong>
      ${product.was ? `<s><span class="sr-only">Was </span>${gbp.format(product.was)}</s><span class="save badge">Save ${savePct}%</span>` : ''}
    </div>
    ${totalReviews
      ? `<a class="rating" href="#reviews">${stars(average)}<span><b>${average.toFixed(1)}</b> <span class="link">${num.format(totalReviews)} ${plural(totalReviews, 'review', 'reviews')}</span></span></a>`
      : `<a class="rating muted" href="#reviews">No reviews yet</a>`}
  </section>

  <section class="sec" style="padding-top:var(--s-6)" aria-label="Colour">
    <fieldset>
      <div class="legend-row"><legend>Colour<span class="val" id="colourName">${c.name}</span></legend></div>
      <div class="colours" id="colours">
        ${product.colours.map((k, i) => `<label class="opt"><input type="radio" name="colour" value="${i}" ${i === ui.colour ? 'checked' : ''} ${total(k) ? '' : 'disabled'}><span class="box">${shoe(k, '')}${k.name}${total(k) ? '' : '<small>Sold out</small>'}</span></label>`).join('')}
      </div>
    </fieldset>
  </section>

  <section class="sec" style="padding-top:var(--s-6)" aria-label="Size" id="sizeSec">
    <fieldset>
      <div class="legend-row"><legend>Size<span class="val">UK</span></legend>${guideLink}</div>
      <div class="sizes" id="sizes"></div>
    </fieldset>
    <p class="size-note" id="sizeNote" role="status"></p>
  </section>

  <section class="sec" style="padding-top:var(--s-6)" aria-label="Delivery">
    <div class="deliver">
      ${ico('<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7.500" cy="17.500" r="1.800"/><circle cx="17" cy="17.500" r="1.800"/>')}
      <div>
        <strong>Get it ${day.format(arrive)}</strong>
        <p>${minsLeft ? `Order within ${Math.floor(minsLeft / 60)} h ${minsLeft % 60} min. ` : ''}${free ? 'Delivery is free.' : 'Delivery from ' + gbp.format(4.99) + '.'} Free returns for 30 days.</p>
      </div>
    </div>
  </section>

  <section class="sec" aria-label="Product information">
    <details open><summary>Product details${chevron}</summary><div class="panel-body"><dl>${product.details.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></details>
    <details><summary>Delivery and returns${chevron}</summary><div class="panel-body"><p>Standard delivery takes 2 to 3 working days. Next-day delivery is ${gbp.format(4.99)}, or free on orders over ${gbp.format(product.freeOver)}.</p><p>Return unworn shoes within 30 days for a full refund. We pay the postage.</p></div></details>
    <details><summary>Materials and care${chevron}</summary><div class="panel-body"><p>Recycled engineered mesh upper, foam midsole, rubber outsole. Hand wash with a soft brush and let them dry away from heat.</p></div></details>
  </section>

  <section class="sec" id="reviews" aria-labelledby="rv">
    <h2 id="rv">Reviews</h2>
    ${totalReviews ? reviewsHtml() : '<p class="muted" style="margin-top:var(--s-3)">Nobody has reviewed this shoe yet. Bought a pair? Be the first to say how they fit.</p>'}
  </section>`;
  renderSizes();
  renderGuide();
  $('#buybar').hidden = false;
  renderBar();
}

function reviewsHtml() {
  const rows = [5, 4, 3, 2, 1].map((k) => `<span>${k} ${plural(k, 'star', 'stars')}</span><span class="track"><span class="fill" style="width:${(product.stars[k] / totalReviews) * 100}%"></span></span><span>${num.format(product.stars[k])}</span>`).join('');
  const revs = product.reviews.map((r) => `
    <article class="review">
      <header><span class="avatar" aria-hidden="true">${r.name.split(' ').map((p) => p[0]).join('')}</span>
        <div class="who"><b>${r.name}</b><span><time datetime="${r.date}">${shortDate.format(new Date(r.date))}</time></span></div>
        ${stars(r.rating)}<span class="sr-only">${r.rating} out of 5</span></header>
      <h3>${r.title}</h3><p>${r.text}</p><p class="meta">Bought ${r.bought}</p>
    </article>`).join('');
  return `<div class="rev-head" style="margin-top:var(--s-4)"><div class="rev-score"><strong>${average.toFixed(1)}</strong><div>${stars(average)}<div class="muted">${num.format(totalReviews)} ${plural(totalReviews, 'review', 'reviews')}</div></div></div></div>
    <div class="bars">${rows}</div>${revs}
    <button class="more" type="button">Read all ${num.format(totalReviews)} reviews</button>`;
}

function renderSizes() {
  const c = product.colours[ui.colour];
  if (ui.size !== null && !c.stock[SIZES.indexOf(ui.size)]) ui.size = null;
  $('#sizes').innerHTML = SIZES.map((s, i) => `<label class="opt"><input type="radio" name="size" value="${s}" ${c.stock[i] ? '' : 'disabled'} ${ui.size === s ? 'checked' : ''} aria-label="${uk(s)}${c.stock[i] ? '' : ', sold out'}"><span class="box">${s}</span></label>`).join('');
  const n = c.stock.filter(Boolean).length;
  setNote(`${n} of ${SIZES.length} sizes in stock in ${c.name}.`);
}
function setNote(text, cls = '') { const n = $('#sizeNote'); n.textContent = text; n.className = 'size-note ' + cls; }

function renderGuide() {
  $('#guideRows').innerHTML = SIZES.map((s) => `<tr data-s="${s}"><td>${s}</td><td>${(s + 33.5).toFixed(1).replace('.0', '')}</td><td>${s + 1}</td><td>${(24.5 + (s - 6) * 0.85).toFixed(1)}</td></tr>`).join('');
}

function renderBar() {
  $('#barPrice').textContent = gbp.format(product.price);
  const c = product.colours[ui.colour];
  $('#barNote').textContent = ui.size === null ? 'Select a size' : `${uk(ui.size)}, ${c.name}`;
}

function renderState(kind) {
  const art = `<svg class="art" viewBox="0 0 140 112" aria-hidden="true"><rect x="10" y="62" width="120" height="40" rx="12" fill="var(--bg-subtle)" stroke="var(--border)" stroke-width="2"/><path d="M26 62c0-14 8-24 22-24h18l14 14h22c14 0 18 10 18 10H26z" fill="none" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="5 5" stroke-linejoin="round"/><circle cx="104" cy="30" r="14" fill="var(--accent-subtle)"/><path d="M104 23v8M104 36v.5" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>`;
  const views = {
    empty: `<h1>This shoe is no longer available</h1><p>Aero Runner 2 sold out in every size and will not be restocked. Aero Runner 3 has the same fit and a softer midsole.</p><a class="btn" href="#">Browse running shoes</a>`,
    error: `<h1>We could not load this shoe</h1><p>Your bag is safe. Check your connection and try again.</p><button class="btn" type="button" onclick="location.reload()">Try again</button><a class="text-btn" href="#">Back to running shoes</a>`,
  };
  main.innerHTML = `<div class="state">${art}${views[kind]}</div>`;
}
function renderLoading() {
  main.setAttribute('aria-busy', 'true');
  main.innerHTML = `<div class="skel" style="aspect-ratio:3/2;border-radius:0"></div>
  <div class="sec info"><h1 class="sr-only">Loading product</h1><div class="skel" style="height:32px;width:70%"></div><div class="skel" style="height:20px;width:45%;margin-top:12px"></div><div class="skel" style="height:36px;width:36%;margin-top:20px"></div>
  <div class="skel" style="height:72px;margin-top:40px"></div><div class="skel" style="height:96px;margin-top:24px"></div></div><span class="sr-only" role="status">Loading product</span>`;
}

/* behaviour */
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'colour') {
    ui.colour = +t.value;
    const c = product.colours[ui.colour];
    document.querySelectorAll('.slides svg').forEach((s) => s.setAttribute('style', shoeVars(c)));
    $('#colourName').textContent = c.name;
    renderSizes(); renderBar();
  } else if (t.name === 'size') {
    ui.size = +t.value;
    const c = product.colours[ui.colour], left = c.stock[SIZES.indexOf(ui.size)];
    left <= 3 ? setNote(`Only ${left} left in ${uk(ui.size)}.`, 'low') : setNote(`${uk(ui.size)} in ${c.name} is in stock.`);
    renderBar();
  }
});
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast'); t.hidden = false;
  t.innerHTML = `<span>${msg}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ''}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
function setBag(n) { ui.bag = n; $('#bagCount').textContent = n; $('#bag').setAttribute('aria-label', `Bag, ${n} ${plural(n, 'item', 'items')}`); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'add') {
    if (ui.size === null) {
      setNote('Choose a size to add this shoe to your bag.', 'err');
      $('#sizeSec').scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      $('#sizes input:not(:disabled)')?.focus({ preventScroll: true });
      return;
    }
    setBag(ui.bag + 1);
    toast(`Added ${uk(ui.size)} ${product.colours[ui.colour].name} to your bag`, true);
  } else if (b.id === 'undo') { setBag(ui.bag - 1); $('#toast').hidden = true; }
  else if (b.id === 'wish') { ui.wished = !ui.wished; b.setAttribute('aria-pressed', ui.wished); b.setAttribute('aria-label', ui.wished ? 'Saved to wishlist' : 'Save to wishlist'); }
  else if (b.id === 'guideOpen') {
    document.querySelectorAll('#guideRows tr').forEach((r) => r.classList.toggle('pick', ui.size !== null && +r.dataset.s === ui.size));
    $('#guide').showModal();
  } else if (b.id === 'guideClose') $('#guide').close();
});
$('#guide').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener('scroll', (e) => {
  if (e.target.id !== 'slides') return;
  const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
  document.querySelectorAll('#dots i').forEach((d, k) => (k === i ? d.setAttribute('aria-current', 'true') : d.removeAttribute('aria-current')));
}, true);

if (STATE === 'empty' || STATE === 'error') renderState(STATE);
else if (STATE === 'loading') renderLoading();
else renderDefault();
</script>
</body>
</html>
