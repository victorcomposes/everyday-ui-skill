          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <label class="sr-only" for="q">Search conversations</label>
          <input id="q" type="search" placeholder="Search by name, order or subject" autocomplete="off">
        </div>
        <div class="filters" role="group" aria-label="Filter conversations" id="filters"></div>
      </div>
      <ul class="rows" id="rows"></ul>
    </div>

  <div>
    <header class="topbar">
      <button type="button" class="back btn sm" style="border:0;background:none" id="back" aria-label="Back to inbox">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Inbox
      </button>
      <span class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M6 17.5c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2M6 12.5c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round"/></svg>
        Harborline
      </span>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
/* ---------- data: one module, everything on screen derives from it ---------- */
const TODAY = new Date('2026-11-27T10:30:00Z');
const state = new URLSearchParams(location.search).get('state');
const STRESS = state === 'stress';
const ME = { name: 'Tomasz Wieczorek', initials: 'TW' };

const customer = {
  name: STRESS ? 'Bartholomew Featherstonehaugh-Cholmondeley-Wetherby' : 'Priya Raman',
  email: STRESS ? null : 'priya.raman@example.com',
  since: '2025-03-09',
  orders: [{ id: '48213', total: 104.95 }, { id: '47630', total: 89.0 }, { id: '45871', total: 61.5 }],
  address: '14 Kelham Row, Sheffield S3 8QX',
};
const order = {
  id: STRESS ? '1048213-LF-WINTER-2026-0004417' : '48213',
  placed: '2026-11-14', promised: '2026-11-20',
  carrier: 'Parcelwise', tracking: 'PW 7720 4418 0236',
  items: [
    { name: 'Linen duvet cover, king, oat', qty: 1, price: 64.0 },
    { name: 'Linen pillowcase pair, oat', qty: 2, price: 18.0 },
  ],
  shipping: 4.95,
  route: [
    { label: 'Ordered', at: '2026-11-14', st: 'done' },
    { label: 'Packed', at: '2026-11-15', st: 'done' },
    { label: 'With Parcelwise', at: '2026-11-17', st: 'done' },
    { label: 'Reached Leeds hub', at: '2026-11-18', st: 'current' },
    { label: 'Delivery promised', at: '2026-11-20', st: 'missed' },
  ],
};
const subject = STRESS
  ? 'Order 1048213-LF-WINTER-2026-0004417 never arrived and nobody has replied to any of my last four messages about it'
  : 'Order 48213 has not arrived';
const messages = [
  { kind: 'customer', at: '2026-11-22T09:14', body: 'Hi, my order 48213 was due on Friday and has not arrived. The tracking page says it reached Leeds on Tuesday and nothing since. Could you tell me where it is? I need the duvet cover for guests this weekend.' },
  { kind: 'event', at: '2026-11-22T09:20', body: 'Conversation assigned to Tomasz Wieczorek' },
  { kind: 'agent', who: 'Tomasz Wieczorek', at: '2026-11-23T09:05', body: 'Hi Priya, thanks for letting us know and sorry about the delay. I have asked Parcelwise to check the Leeds hub. I will update you by Wednesday.' },
  { kind: 'note', who: 'Tomasz Wieczorek', at: '2026-11-25T14:20', body: 'Parcelwise ticket PW-2291-88 raised. They say the label is damaged and the parcel is held for a re-scan. No date yet. Replacement stock: 3 oat king covers in the Sheffield store room.' },
  { kind: 'customer', at: '2026-11-26T18:47', body: 'It is now nearly a week late and I have heard nothing since Monday. Can you send a replacement by next-day delivery, or refund me? I would rather have the cover in time.' },
  { kind: 'customer', at: '2026-11-27T08:12', body: 'Any news? Guests arrive on Saturday.' },
];
if (STRESS) messages[0].body = messages[0].body + ' ' + 'The tracking link they emailed me goes to a page that says "parcel not found" and the phone line has been engaged each time I try. '.repeat(6);
const draft = 'Hi Priya,\n\nI am sorry the order is a week late. Parcelwise is holding the parcel for a re-scan and cannot give a date. I have sent a replacement today with next-day delivery, so it should reach you on Saturday 28 Nov.\n\nIf the first parcel arrives, please keep it. You do not need to send it back.\n\nTomasz';

const D = (s) => new Date(s.length === 10 ? s + 'T00:00:00Z' : s + 'Z');
const conversations = [
  { id: 'c1', name: customer.name, subject, prev: 'Any news? Guests arrive on Saturday.', at: '2026-11-27T08:12', unread: false, mine: true, tag: 'Late delivery' },
  { id: 'c2', name: 'Callum Reid', subject: 'Rug arrived in the wrong colour', prev: 'I ordered the sage one and got grey. Photo attached.', at: '2026-11-27T09:40', unread: true, mine: false, tag: 'Wrong item' },
  { id: 'c3', name: 'Ngozi Adeyemi', subject: 'Refund for cancelled order 48190', prev: 'Cancelled on Tuesday, still waiting on the money.', at: '2026-11-27T09:05', unread: true, mine: true, tag: 'Refund' },
  { id: 'c4', name: 'Marta Kowalczyk', subject: 'Can I change my delivery address?', prev: 'Order 48221 goes to my old flat. Is it too late?', at: '2026-11-27T07:50', unread: false, mine: false, tag: 'Address change' },
  { id: 'c5', name: 'Owen Brightwell-Hartington', subject: 'Lamp shade cracked on arrival', prev: 'The box was fine but the shade has a split down one side.', at: '2026-11-26T17:20', unread: false, mine: false, tag: 'Damaged' },
  { id: 'c6', name: 'Sofia Marchetti', subject: 'Parcel marked delivered but not received', prev: 'Nothing at the door or with the neighbours.', at: '2026-11-26T15:02', unread: true, mine: true, tag: 'Late delivery' },
  { id: 'c7', name: 'Daniel Osei', subject: 'Discount code not working at checkout', prev: 'WINTER15 says it has expired. The email says 30 Nov.', at: '2026-11-25T11:31', unread: false, mine: false, tag: 'Question' },
  { id: 'c8', name: 'Hannah Lindqvist', subject: 'Order 48102 is two days late', prev: 'Tracking has said out for delivery since Tuesday.', at: '2026-11-25T09:12', unread: false, mine: false, tag: 'Late delivery' },
  { id: 'c9', name: 'Reuben Castellanos', subject: 'Gift receipt for order 48044', prev: 'Could you email a receipt without prices?', at: '2026-11-24T16:44', unread: false, mine: false, tag: 'Question' },
  { id: 'c10', name: 'Mei-Ling Tan', subject: 'Return label has not arrived', prev: 'It has been four days since I asked for one.', at: '2026-11-23T10:18', unread: false, mine: true, tag: 'Return' },
];
const cleared = state === 'cleared';
const open = cleared ? [] : conversations;

/* ---------- helpers ---------- */
const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const dayFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const dayLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const monthFmt = new Intl.DateTimeFormat('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' });
const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dayKey = (d) => d.toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((D(dayKey(b)) - D(dayKey(a))) / 864e5);
const initials = (n) => n.split(/[\s-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const relTime = (d) => { const n = daysBetween(d, TODAY); return n === 0 ? timeFmt.format(d) : n < 6 ? dayFmt.format(d).split(' ')[0].replace(',', '') : new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(d); };
const ICON = {
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  at: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  refund: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- sidebar ---------- */
const late = open.filter((c) => c.tag === 'Late delivery').length;
const nav = [
  { h: null, items: [
    { t: 'Inbox', i: 'inbox', n: open.length, cur: true },
    { t: 'Mentions', i: 'at', n: 0 },
    { t: 'Sent', i: 'send' },
    { t: 'Closed', i: 'check' },
  ] },
  { h: 'Saved views', items: [
    { t: 'Late deliveries', i: 'clock', n: late },
    { t: 'Refund requests', i: 'refund', n: open.filter((c) => c.tag === 'Refund').length },
    { t: 'Returns', i: 'box', n: open.filter((c) => c.tag === 'Return').length },
  ] },
];
document.getElementById('nav').innerHTML = nav.map((g) => `<div class="nav-group" style="margin-bottom:var(--s-4)">${g.h ? `<h2>${g.h}</h2>` : ''}${g.items.map((x) =>
  `<a href="#"${x.cur ? ' aria-current="page"' : ''}>${icon(x.i)}${x.t}${x.n ? `<span class="count">${x.n}</span>` : ''}</a>`).join('')}</div>`).join('');

/* ---------- list ---------- */
let filter = 'all', query = '';
const counts = () => ({ all: open.length, mine: open.filter((c) => c.mine).length, unread: open.filter((c) => c.unread).length });
function renderFilters() {
  const c = counts();
  document.getElementById('filters').innerHTML = [['all', 'All'], ['mine', 'Mine'], ['unread', 'Unread']]
    .map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l}<span class="num">${c[k]}</span></button>`).join('');
}
function renderRows() {
  const rows = open.filter((c) => (filter === 'all' || (filter === 'mine' ? c.mine : c.unread)) &&
    (!query || (c.name + ' ' + c.subject).toLowerCase().includes(query)));
  const el = document.getElementById('rows');
  if (!open.length) { el.innerHTML = `<li class="quiet" style="height:auto;padding-top:var(--s-10)"><h2>You are all caught up</h2><p>No open conversations. New messages show here.</p></li>`; return; }
  if (!rows.length) { el.innerHTML = `<li class="quiet" style="height:auto;padding-top:var(--s-10)"><h2>No conversations match</h2><p>Try a different name or order number.</p></li>`; return; }
  let last = '';
  el.innerHTML = rows.map((c) => {
    const d = D(c.at), n = daysBetween(d, TODAY), g = n === 0 ? 'Today' : n === 1 ? 'Yesterday' : 'Earlier this week';
    const head = g !== last ? `<li class="day" >${g}</li>` : ''; last = g;
    return `${head}<li><a class="row${c.unread ? ' unread' : ''}" href="#${c.id}" data-id="${c.id}"${c.id === 'c1' && !state ? ' aria-current="true"' : ''}>
      <span class="dot" ${c.unread ? '' : 'style="visibility:hidden"'} role="img" aria-label="${c.unread ? 'Unread' : ''}"></span>
      <span class="who">${esc(c.name)}</span><time datetime="${c.at}">${relTime(d)}</time>
      <span class="subj">${esc(c.subject)}</span><span class="prev">${esc(c.prev)}</span>
      <span class="tag">${esc(c.tag)}${c.mine ? '<span>Assigned to you</span>' : ''}</span></a></li>`;
  }).join('');
}
renderFilters(); renderRows();
document.getElementById('filters').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; renderFilters(); renderRows(); } });
document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); renderRows(); });

/* ---------- conversation ---------- */
const main = document.getElementById('main');
const fullTime = (d) => `${dayLong.format(d)}, ${timeFmt.format(d)}`;
const daysLate = daysBetween(D(order.promised), TODAY);
const lastScan = order.route.find((r) => r.st === 'current');
const scanGap = daysBetween(D(lastScan.at), TODAY);

function renderMessages() {
  let last = '';
  return messages.map((m) => {
    const d = D(m.at), k = dayKey(d);
    const rule = k !== last ? `<div class="dayrule"><span>${daysBetween(d, TODAY) === 0 ? 'Today' : dayLong.format(d)}</span></div>` : ''; last = k;
    const time = `<time datetime="${m.at}" title="${fullTime(d)}">${timeFmt.format(d)}</time>`;
    if (m.kind === 'event') return `${rule}<div class="event">${icon('user')}${esc(m.body)}<span>at ${timeFmt.format(d)}</span></div>`;
    const name = m.kind === 'customer' ? customer.name : m.who;
    const av = `<span class="avatar${m.kind === 'customer' ? '' : ' agent'}" aria-hidden="true">${m.kind === 'note' ? icon('lock') : initials(name)}</span>`;
    if (m.kind === 'note') return `${rule}<article class="msg note"><span class="avatar agent" aria-hidden="true">${initials(name)}</span><div><header><strong>${esc(name)}</strong><span>${icon('lock')}Internal note, only your team sees this</span>${time}</header><p class="body">${esc(m.body)}</p></div></article>`;
    return `${rule}<article class="msg">${av}<div><header><strong>${esc(name)}</strong><span>${m.kind === 'customer' ? 'Customer' : 'You'}</span>${time}</header><p class="body">${esc(m.body)}</p></div></article>`;
  }).join('');
}

const subtotal = order.items.reduce((s, i) => s + i.qty * i.price, 0);
const orderTotal = subtotal + order.shipping;
const spent = customer.orders.reduce((s, o) => s + o.total, 0);

function renderRail() {
  return `<details class="rail" id="rail" open>
    <summary><span>Order ${esc(order.id.length > 12 ? order.id.slice(0, 9) + '...' : order.id)}</span><span class="badge danger">${daysLate} days late</span></summary>
    <div class="rail-in">
      <section aria-labelledby="r-del">
        <h2 id="r-del">Delivery</h2>
        <p class="keynum">${daysLate} days late</p>
        <p class="keysub">Promised for ${dayFmt.format(D(order.promised))}. No scan for ${scanGap} days since the Leeds hub.</p>
        <ol class="route" aria-label="Delivery route">${order.route.map((r) =>
          `<li class="${r.st}"><i aria-hidden="true"></i><span>${r.label}${r.st === 'missed' ? '<span class="sr-only"> (missed)</span>' : ''}</span><span class="when">${r.st === 'missed' ? 'Missed ' : ''}${dayFmt.format(D(r.at)).replace(',', '')}</span></li>`).join('')}</ol>
      </section>
      <section aria-labelledby="r-ord">
        <h2 id="r-ord">Order ${esc(order.id)}</h2>
        <table class="items">
          <thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Amount</th></tr></thead>
          <tbody>${order.items.map((i) => `<tr><th scope="row">${i.name}</th><td>${i.qty}</td><td>${gbp.format(i.qty * i.price)}</td></tr>`).join('')}</tbody>
          <tfoot>
            <tr><th scope="row" colspan="2">Subtotal</th><td>${gbp.format(subtotal)}</td></tr>
            <tr><th scope="row" colspan="2">Shipping</th><td>${gbp.format(order.shipping)}</td></tr>
            <tr><th scope="row" colspan="2">Total</th><td>${gbp.format(orderTotal)}</td></tr>
          </tfoot>
        </table>
        <dl class="kv" style="margin-top:var(--s-4)">
          <dt>Carrier</dt><dd>${order.carrier}</dd>
          <dt>Tracking</dt><dd class="num">${order.tracking}</dd>
        </dl>
        <a class="link ext" href="#">Open tracking page ${icon('ext')}</a>
      </section>
      <section aria-labelledby="r-cus">
        <h2 id="r-cus">Customer</h2>
        <dl class="kv">
          <dt>Name</dt><dd>${esc(customer.name)}</dd>
          <dt>Email</dt><dd>${customer.email ? `<a class="link" href="mailto:${customer.email}">${customer.email}</a>` : '<span class="muted">Not set</span>'}</dd>
          <dt>Ship to</dt><dd>${esc(customer.address)}</dd>
          <dt>History</dt><dd class="num">${customer.orders.length} orders, ${gbp.format(spent)} since ${monthFmt.format(D(customer.since))}</dd>
        </dl>
      </section>
    </div>
  </details>`;
}

const composer = () => `<form class="composer" id="composer" novalidate>
  <div class="comp-top">
    <fieldset class="seg"><legend class="sr-only">Message type</legend>
      <label><input type="radio" name="mode" value="reply" checked><span>Reply</span></label>
      <label><input type="radio" name="mode" value="note"><span>Internal note</span></label>
    </fieldset>
    <span class="to" id="to">To ${esc(customer.name)}${customer.email ? ` &lt;${customer.email}&gt;` : ''}</span>
  </div>
  <div id="sent" role="status"></div>
  <div>
    <label class="sr-only" for="msg" id="msg-label">Your reply to ${esc(customer.name)}</label>
    <textarea id="msg" aria-describedby="msg-err" placeholder="Write a reply">${esc(draft)}</textarea>
    <p class="err" id="msg-err" hidden>${icon('alert')}Write a reply before you send it.</p>
  </div>
  <div class="comp-foot">
    <label class="opt"><input type="checkbox" id="pend" checked>Set to Pending after sending</label>
    <span class="saved" id="saved">Draft saved at 08:55</span>
    <div class="push"><button class="btn primary" type="submit" id="send">Send reply</button></div>
  </div>
</form>`;

function renderMain() {
  if (state === 'empty' || cleared) {
    const c = counts();
    main.style.gridTemplateColumns = 'minmax(0,1fr)';
    main.innerHTML = `<div class="quiet"><h1 id="thread-title">${cleared ? 'You are all caught up' : 'Select a conversation'}</h1><p>${cleared ? 'No open conversations right now.' : `${c.all} open, ${c.unread} unread, ${c.all - c.mine} not assigned to you.`}</p></div>`;
    return;
  }
  if (state === 'loading') {
    main.innerHTML = `<div class="convo" aria-busy="true"><div class="chead"><h1 id="thread-title" class="sr-only">Loading conversation</h1><div class="skel" style="height:32px;width:60%"></div><div class="skel" style="height:20px;width:40%;margin-top:12px"></div></div>
      <div class="thread">${[70, 55, 80].map((w) => `<div class="msg"><div class="skel" style="width:32px;height:32px;border-radius:50%"></div><div><div class="skel" style="height:16px;width:30%"></div><div class="skel" style="height:56px;width:${w}%;margin-top:8px"></div></div></div>`).join('')}</div></div><div class="rail"></div>`;
    return;
  }
  if (state === 'error') {
    main.style.gridTemplateColumns = 'minmax(0,1fr)';
    main.innerHTML = `<div class="quiet"><h1 id="thread-title">This conversation did not load</h1><p>Your saved draft is safe. Check your connection and try again.</p><button class="btn primary" type="button" onclick="location.search=''">Try again</button></div>`;
    return;
  }
  main.innerHTML = `<div class="convo">
    <header class="chead">
      <h1 id="thread-title">${esc(subject)}</h1>
      <div class="sub">
        <span class="badge accent">Open</span><span class="badge warning">High priority</span>
        <span class="from">Opened ${dayFmt.format(D(messages[0].at))}</span>
        <div class="grow">
          <button class="btn sm" type="button">${icon('clock')}Snooze</button>
          <button class="btn sm" type="button">${icon('check')}Resolve</button>
        </div>
      </div>
    </header>
    <div class="thread" id="thread" tabindex="0" role="log" aria-label="Conversation messages">${renderMessages()}</div>
    ${composer()}
  </div>${renderRail()}`;
  wire();
}

function wire() {
  const thread = document.getElementById('thread'), form = document.getElementById('composer'), ta = document.getElementById('msg');
  const mq = matchMedia('(min-width: 1024px)'), rail = document.getElementById('rail');
  const sync = () => { rail.open = mq.matches; thread.scrollTop = mq.matches ? thread.scrollHeight : 0; };
  mq.addEventListener('change', sync); sync();
  let mode = 'reply', undoMsg = null, stash = '';
  form.addEventListener('change', (e) => {
    if (e.target.name !== 'mode') return;
    mode = e.target.value;
    form.classList.toggle('is-note', mode === 'note');
    document.getElementById('send').textContent = mode === 'note' ? 'Add note' : 'Send reply';
    ta.placeholder = mode === 'note' ? 'Write a note for your team' : 'Write a reply';
    document.getElementById('msg-label').textContent = mode === 'note' ? 'Internal note' : `Your reply to ${customer.name}`;
    document.getElementById('to').hidden = mode === 'note';
    document.getElementById('pend').closest('label').hidden = mode === 'note';
    [ta.value, stash] = [stash, ta.value];
  });
  ta.addEventListener('input', () => { ta.removeAttribute('aria-invalid'); document.getElementById('msg-err').hidden = true; document.getElementById('saved').textContent = 'Draft not saved yet'; });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text) { ta.setAttribute('aria-invalid', 'true'); document.getElementById('msg-err').hidden = false; ta.focus(); return; }
    const btn = document.getElementById('send'); btn.setAttribute('aria-busy', 'true');
    const label = btn.textContent; btn.textContent = mode === 'note' ? 'Adding...' : 'Sending...';
    setTimeout(() => {
      undoMsg = { kind: mode === 'note' ? 'note' : 'agent', who: ME.name, at: '2026-11-27T10:31', body: text };
      messages.push(undoMsg); stash = ''; ta.value = '';
      thread.innerHTML = renderMessages(); thread.scrollTop = thread.scrollHeight;
      btn.removeAttribute('aria-busy'); btn.textContent = label;
      document.getElementById('sent').innerHTML = `<div class="sent">${mode === 'note' ? 'Note added' : `Reply sent to ${esc(customer.name)}`}<button type="button" id="undo">Undo</button></div>`;
      document.getElementById('undo').onclick = () => { messages.pop(); ta.value = undoMsg.body; thread.innerHTML = renderMessages(); document.getElementById('sent').innerHTML = ''; ta.focus(); };
    }, 400);
  });
}
renderMain();

/* phone: the inbox is its own screen */
const setList = (on) => document.body.classList.toggle('show-list', on);
document.getElementById('back').addEventListener('click', () => setList(true));
document.getElementById('rows').addEventListener('click', (e) => { if (e.target.closest('a.row')) { e.preventDefault(); setList(false); } });
</script>
