<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team members - Cobalt</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;
  --accent: #2754c5; --accent-hover: #1f45a6; --accent-subtle: #eef3fd; --on-accent: #ffffff;
  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --placeholder: #6b717d;
  --frame: #f4f7fd; --brand-deep: #14285a; --on-deep: #ffffff; --on-deep-muted: #b9c8ee; --accent-on-deep: #7a9cff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font);
  --text-xs: 12px; --lh-xs: 16px;
  --text-sm: 14px; --lh-sm: 20px;
  --text-md: 16px; --lh-md: 24px;
  --text-lg: 18px; --lh-lg: 28px;
  --text-xl: 20px; --lh-xl: 28px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px;
  --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
  --rhythm-title: 12px; --rhythm-tight: 8px; --rhythm-content: 24px; --rhythm-group: 40px;
  /* crisp shape */
  --r-sm: 2px; --r-md: 4px; --r-lg: 6px; --r-xl: 8px; --r-full: 999px;
  --control-h: 36px; --control-h-sm: 32px; --control-h-touch: 44px;
  --w-sidebar: 248px; --w-content: 1200px; --w-dialog-sm: 400px; --w-dialog: 560px;
  --h-topbar: 56px;
  --shadow-pop: 0 4px 16px rgb(16 24 40 / 0.12), 0 1px 3px rgb(16 24 40 / 0.08);
  --shadow-dialog: 0 16px 48px rgb(16 24 40 / 0.18);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --t-fast: 120ms; --t-base: 160ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #7a9cff; --accent-hover: #9bb5ff; --accent-subtle: #1c2540; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72; --danger-subtle: #2d1715;
    --placeholder: #8b919d;
    --frame: #131a2b; --brand-deep: #0e1a38; --on-deep: #e9ebef; --on-deep-muted: #a9bbef;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5); --shadow-dialog: 0 16px 48px rgb(0 0 0 / 0.6);
  }
}
@media (max-width: 640px), (pointer: coarse) { :root { --control-h: 44px; --control-h-sm: 44px; } }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 var(--text-sm)/var(--lh-sm) var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
.link, p a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::placeholder { color: var(--placeholder); opacity: 1; }
h1 { font: 700 30px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; }
h2 { font: 600 var(--text-xl)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
@media (max-width: 640px) { h1 { font-size: 26px; } }
.badge { display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); z-index: 50; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4);
  background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }

/* shell */
.shell { display: grid; grid-template-columns: var(--w-sidebar) minmax(0, 1fr); min-height: 100dvh; }
.side { background: var(--frame); border-right: 1px solid var(--border); }
.side-in { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: var(--s-4) var(--s-3); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px var(--s-2) 0; min-height: 44px; font: 700 18px/1 var(--font-display); letter-spacing: -0.02em; }
.nav { margin-top: var(--s-6); display: flex; flex-direction: column; gap: var(--s-6); }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-2); border-radius: var(--r-md); }
.nav a:hover { background: color-mix(in srgb, var(--accent-subtle) 60%, transparent); }
.nav a[aria-current="page"] { background: var(--accent-subtle); font-weight: 500; }
.nav a[aria-current="page"] .ic { color: var(--accent); }
.nav .n { margin-left: auto; color: var(--text-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.account { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: var(--s-3) var(--s-2) 0; border-top: 1px solid var(--border); }
.account b { display: block; font-weight: 500; }
.account small { display: block; color: var(--text-muted); font-size: var(--text-xs); line-height: 16px; }
.topbar { display: none; }
.main { min-width: 0; }
.page { max-width: var(--w-content); margin: 0 auto; padding: var(--s-8) var(--s-8) var(--s-16); }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
.sub { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-6); margin-top: var(--rhythm-title); color: var(--text-muted); }
.seats { white-space: nowrap; display: inline-flex; align-items: center; gap: var(--s-3); font-variant-numeric: tabular-nums; }
.seats .bar { width: 120px; height: 6px; border-radius: var(--r-full); background: var(--border); overflow: hidden; }
.seats .bar i { display: block; height: 100%; background: var(--accent); }
.seats b { color: var(--text); font-weight: 600; }

/* buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--control-h); padding: 0 14px; border: 1px solid var(--border-strong);
  border-radius: var(--r-md); background: var(--surface); font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.btn:hover { background: var(--bg-subtle); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
.btn-danger:hover { background: var(--danger); filter: brightness(0.92); }
.btn-text { border-color: transparent; background: transparent; color: var(--accent); padding: 0 var(--s-2); }
.btn-text:hover { background: var(--accent-subtle); }
.btn-warn { color: var(--danger); }
.btn[disabled], .btn[aria-busy="true"] { opacity: 0.7; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: var(--control-h-sm); height: var(--control-h-sm); border: 1px solid transparent; border-radius: var(--r-md); background: transparent; cursor: pointer; color: var(--text-muted); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--bg-subtle); color: var(--text); border-color: var(--border); }
.input { width: 100%; min-height: var(--control-h); padding: 0 var(--s-3); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); }
textarea.input { padding: var(--s-2) var(--s-3); min-height: 76px; resize: vertical; }
.search { position: relative; flex: 0 1 320px; min-width: 0; }
.search .ic { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--text-muted); pointer-events: none; }
.search .input { padding-left: 36px; }
.sel { position: relative; display: inline-block; }
.sel select { appearance: none; -webkit-appearance: none; min-height: var(--control-h); padding: 0 32px 0 var(--s-3); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); cursor: pointer; width: 100%; }
.sel.sm select { min-height: var(--control-h-sm); }
.sel.sm { min-width: 0; }
.sel .ic { position: absolute; right: 8px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; pointer-events: none; color: var(--text-muted); }
.field { display: flex; flex-direction: column; gap: var(--rhythm-tight); }
.field + .field { margin-top: var(--s-5); }
.field label, .lbl { font-weight: 500; }
.hint { color: var(--text-muted); font-size: var(--text-sm); }
.field .hint { margin-top: -4px; }
.err { display: flex; gap: var(--s-2); align-items: flex-start; color: var(--danger); }
.err .ic { margin-top: 0; }
.opt { font-weight: 400; color: var(--text-muted); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-top: var(--rhythm-content); min-height: var(--control-h); }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-top: var(--rhythm-content); min-height: var(--control-h); padding: var(--s-2) var(--s-3);
  background: var(--accent-subtle); border: 1px solid var(--border); border-radius: var(--r-lg); }
.bulk b { font-weight: 600; margin-right: var(--s-2); font-variant-numeric: tabular-nums; }
.bulk .sp { flex: 1; }

.filters { display: flex; gap: var(--s-3); }
/* banner */
.banner { display: flex; gap: var(--s-3); align-items: flex-start; margin-top: var(--rhythm-content); padding: var(--s-3) var(--s-4);
  background: var(--accent-subtle); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: var(--r-lg); }
.banner .ic { color: var(--accent); margin-top: 0; }
.banner b { font-weight: 600; display: block; }

/* table */
.tablewrap { margin-top: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.banner + .tablewrap { margin-top: var(--rhythm-content); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
th { padding: 10px var(--s-3); background: var(--bg-subtle); border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 500; font-size: 13px; line-height: 18px; text-align: left; white-space: nowrap; }
td { height: 52px; padding: 6px var(--s-3); border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg-subtle); }
tbody tr.is-sel { background: var(--accent-subtle); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.c-chk { width: 48px; padding-right: 0; }
.c-role { width: 200px; }
.c-st { width: 132px; }
.c-rev { width: 140px; }
.c-last { width: 176px; white-space: nowrap; padding-left: var(--s-10); }
.c-act { width: 56px; padding-left: 0; text-align: center; }
.chk { display: grid; place-items: center; width: 36px; height: 36px; margin: 0; cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.mem { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
.mem .t { min-width: 0; }
.mem .nm { display: flex; align-items: center; gap: var(--s-2); font-weight: 500; min-width: 0; }
.mem .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem .em { display: block; color: var(--text-muted); font-size: 13px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--r-full); background: var(--accent-subtle); color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: 0; }
tr.is-sel .av { background: var(--surface); }
.av-inv { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-muted); }
.av-inv .ic { width: 16px; height: 16px; }
.you { flex: none; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-subtle); color: var(--text-muted); font-size: var(--text-xs); line-height: 16px; font-weight: 500; }
.bd { padding: 2px 8px; border-radius: var(--r-sm); font-size: var(--text-xs); line-height: 16px; font-weight: 500; }
.bd-active { background: var(--success-subtle); color: var(--success); }
.bd-invited { background: var(--accent-subtle); color: var(--accent); }
.bd-suspended { background: var(--warning-subtle); color: var(--warning); }
tr.is-sel .bd-invited { background: var(--surface); }
.muted { color: var(--text-muted); }
.m-only { display: none; }
.role-text { display: inline-flex; align-items: center; min-height: var(--control-h-sm); }

.msg td { height: auto; padding: var(--s-12) var(--s-4); text-align: center; }
.msg:hover { background: transparent; }
.state { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.state h2 { font-size: var(--text-lg); line-height: var(--lh-lg); }
.state p { color: var(--text-muted); }
.state .btn { margin-top: var(--s-3); }
.sk { display: block; height: 12px; border-radius: var(--r-sm); background: var(--border); }
.skrow td { height: 52px; }

.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-4); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.pager nav { display: flex; align-items: center; gap: var(--s-1); }
.pg { min-width: var(--control-h-sm); min-height: var(--control-h-sm); padding: 0 var(--s-2); border: 1px solid transparent; border-radius: var(--r-md); background: transparent; cursor: pointer; font-variant-numeric: tabular-nums; }
.pg:hover { background: var(--bg-subtle); }
.pg[aria-current="page"] { background: var(--accent-subtle); color: var(--accent); font-weight: 600; cursor: default; }
.pg[disabled] { color: var(--placeholder); cursor: default; background: transparent; }
.pg-dots { padding: 0 var(--s-1); }
.pginfo { display: none; padding: 0 var(--s-2); }

/* menu */
.menu { position: fixed; z-index: 30; width: 244px; padding: var(--s-1); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); }
.menu button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 36px; padding: 8px var(--s-3); border: 0; border-radius: var(--r-md); background: transparent; text-align: left; cursor: pointer; justify-content: center; }
.menu button:hover, .menu button:focus-visible { background: var(--bg-subtle); outline-offset: -2px; }
.menu button.danger { color: var(--danger); }
.menu button[aria-disabled="true"] { color: var(--text-muted); cursor: default; }
.menu button[aria-disabled="true"]:hover { background: transparent; }
.menu small { display: block; margin-top: 2px; font-size: var(--text-xs); line-height: 16px; color: var(--text-muted); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s-1) 0; }

/* dialogs */
dialog { width: min(var(--w-dialog), calc(100vw - 32px)); max-height: 85dvh; padding: 0; border: 0; border-radius: var(--r-xl); background: var(--surface); color: var(--text); box-shadow: var(--shadow-dialog); }
dialog[open] { display: flex; flex-direction: column; }
dialog.sm { width: min(var(--w-dialog-sm), calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / 0.4); }
@media (prefers-color-scheme: dark) { dialog::backdrop { background: rgb(0 0 0 / 0.6); } }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding: var(--s-5) var(--s-6) var(--s-4); border-bottom: 1px solid var(--border); }
.dhead h2 { font-size: var(--text-lg); line-height: var(--lh-lg); }
.dbody { padding: var(--s-6); overflow-y: auto; }
.dbody h2 { font-size: var(--text-lg); line-height: var(--lh-lg); }
.dbody h2 + p { margin-top: var(--s-2); }
.dbody ul { margin: var(--s-3) 0 0; padding-left: var(--s-5); color: var(--text-muted); }
.dfoot { display: flex; justify-content: flex-end; gap: var(--s-3); padding: var(--s-4) var(--s-6); border-top: 1px solid var(--border); }
dialog.sm .dfoot { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 44px; padding: 5px 6px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); cursor: text; }
.chips:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.chips input { flex: 1 1 140px; min-width: 120px; min-height: 32px; border: 0; background: transparent; padding: 0 var(--s-1); outline: none; }
.chip { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 0 2px 0 8px; min-height: 28px; border-radius: var(--r-sm); background: var(--accent-subtle); color: var(--accent); font-size: 13px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.bad { background: var(--danger-subtle); color: var(--danger); }
.chip button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: var(--r-sm); }
.chip button:hover { background: color-mix(in srgb, currentColor 15%, transparent); }

/* toast */
#toasts { position: fixed; left: 50%; bottom: var(--s-6); translate: -50% 0; z-index: 60; display: flex; flex-direction: column; gap: var(--s-2); align-items: center; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--s-4); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4); min-height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); }

@media (max-width: 900px) {
  .page { padding: var(--s-6) var(--s-6) var(--s-12); }
}
@media (max-width: 768px) {
  .shell { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: var(--h-topbar); padding: 0 var(--s-2) 0 var(--s-4); background: var(--frame); border-bottom: 1px solid var(--border); }
  .topbar .brand { padding: 0; }
  .side { display: none; }
  .side.open { display: block; position: fixed; inset: 0; z-index: 40; border-right: 0; }
  .side.open .side-in { position: static; height: 100dvh; }
  .side .close { display: grid; }
}
.side .close { display: none; position: absolute; right: var(--s-2); top: var(--s-3); }
@media (max-width: 640px) {
  .page { padding: var(--s-5) var(--s-4) var(--s-12); }
  .head .btn { min-height: 44px; }
  .sub { gap: var(--s-2) var(--s-4); }
  .toolbar { flex-direction: column; align-items: stretch; gap: var(--s-2); }
  .toolbar .search { flex: none; }
  .toolbar .filters { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
  .toolbar .sel { display: block; }
  .bulk .sp { display: none; }
  .tablewrap { border-left: 0; border-right: 0; border-radius: 0; margin-inline: calc(var(--s-4) * -1); }
  table.reflow thead { display: none; }
  table.reflow, table.reflow tbody, table.reflow tr, table.reflow td { display: block; }
  table.reflow tr.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "chk mem act" ". role st" ". rev last"; gap: 0 var(--s-3); align-items: center; padding: var(--s-2) var(--s-4) var(--s-3) 0; border-bottom: 1px solid var(--border); }
  table.reflow.ro tr.row { grid-template-columns: var(--s-4) minmax(0, 1fr) auto; }
  table.reflow tr.row:last-child { border-bottom: 0; }
  table.reflow td { border: 0; padding: 0; height: auto; }
  table.reflow .c-chk { grid-area: chk; width: auto; display: grid; place-items: center; }
  table.reflow .c-mem { grid-area: mem; }
  table.reflow .c-act { grid-area: act; width: auto; justify-self: end; }
  table.reflow .c-role { grid-area: role; width: auto; }
  table.reflow .c-st { grid-area: st; width: auto; justify-self: end; }
  table.reflow .c-rev { grid-area: rev; width: auto; text-align: left; color: var(--text-muted); }
  table.reflow .c-last { grid-area: last; width: auto; padding: 0; justify-self: end; color: var(--text-muted); }

<script>
const TODAY = new Date('2026-11-27T10:30:00Z');
const STATE = new URLSearchParams(location.search).get('state') || '';
const SEATS = STATE === 'stress' ? 1500 : 40, PAGE = 25;
const ROLES = {
  Owner: 'Full control of billing, members and the workspace',
  Admin: 'Manage members, billing and settings',
  Designer: 'Upload designs, start reviews and resolve comments',
  Reviewer: 'Comment on designs and approve or request changes',
  Viewer: 'See designs and comments, with no editing'
};
const ASSIGN = ['Admin', 'Designer', 'Reviewer', 'Viewer'];
const STATUS = { active: 'Active', invited: 'Invited', suspended: 'Suspended' };

// name, role, status, minutes since last active (since invite, for invited), open reviews, projects, email override
const RAW = [
  ['Amara Okafor','Owner','active',0,4,31],['Daniel Reyes','Admin','active',130,3,12],['Priya Raman','Admin','active',1500,6,28],
  ['Tomás Fernandes','Admin','active',9400,2,17],['Sofia Marchetti','Designer','active',45,5,9],['Jonas Lindqvist','Designer','active',300,2,6],
  ['','Designer','invited',4320,0,0,'mei.lin.tan@northlight.studio'],['Aisha Bello','Designer','active',2900,2,7],['Kwame Mensah','Designer','active',75,1,5],
  ['Elena Petrova','Designer','active',14000,0,3],['Rafael Duarte','Designer','active',600,3,8],['Yuki Tanaka','Designer','active',35,4,11],
  ['Marcus Ellery','Reviewer','active',180,7,14],['Ana Sousa','Reviewer','active',1700,2,6],['Callum Whitaker','Designer','suspended',24000,0,0],
  ['Noor Haddad','Designer','active',20,3,10],['Dmitri Volkov','Reviewer','active',4300,1,4],["Liam O'Connor",'Designer','active',700,2,7],
  ['Fatima Zahra Idrissi','Reviewer','active',11000,0,5],['','Reviewer','invited',1500,0,0,'olu.adeyemi@brightwell-agency.com'],['Greta Hoffmann','Designer','active',12,3,9],
  ['Zoe Hartley','Viewer','active',5000,0,3],['Oliver Penhallow','Reviewer','active',260,5,9],['Ibrahim Sesay','Designer','active',8000,1,6],
  ['Tariq Mahmood','Viewer','active',30000,0,2],['Sana Qureshi','Reviewer','active',90,4,8],['Chloe Dubois','Designer','active',3100,2,5],
  ['','Designer','invited',120,0,0,'hannah.brandt@northlight.studio'],['Lucía Ferrer','Viewer','active',18000,0,4],['Beatriz Calderón','Reviewer','active',960,3,7],
  ['Henrik Aalto','Reviewer','active',55,6,12],['Ben Okonkwo-Reid','Viewer','active',2000,0,2]
];
const slug = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z\- ]/g, '').trim().replace(/ +/g, '.');
let members = RAW.map((r, i) => ({ id: 'm' + (i + 1), name: r[0], email: r[6] || slug(r[0]) + '@northlight.studio', role: r[1], status: r[2], ago: r[3], reviews: r[4], projects: r[5] }));

if (STATE === 'stress') {
  Object.assign(members[4], { name: 'Maria-Alexandra Konstantinopoulou-Featherstonehaugh', email: 'maria-alexandra.konstantinopoulou-featherstonehaugh@research-collaboration.northlight.studio', reviews: 12480 });
  Object.assign(members[5], { name: 'J', email: 'j@northlight.studio', reviews: 0 });
  Object.assign(members[8], { name: '', email: 'k.mensah.contractor@independent-studio-network-europe.example.com', ago: null, status: 'active', reviews: 1 });
  const first = ['Ines','Tobias','Mira','Arjun','Leila','Felix','Nadia','Pavel','Saoirse','Hugo','Anika','Cyrus'], last = ['Varga','Nakamura','Olsen','Brennan','Abara','Rossi','Kovac','Thorne','Mbeki','Lund','Castillo','Hale'];
  for (let i = 0; members.length < 1284; i++) {
    const nm = first[i % 12] + ' ' + last[(i * 5 + 3) % 12];
    members.push({ id: 'g' + i, name: nm, email: slug(nm) + (i > 143 ? i : '') + '@northlight.studio', role: ASSIGN[1 + (i % 3)], status: i % 41 === 0 ? 'suspended' : 'active', ago: 40 + i * 37, reviews: i % 9, projects: i % 14 });
  }
}
const ME = STATE === 'readonly' ? members.find((m) => m.name === 'Sana Qureshi').id : 'm1';
const canManage = STATE !== 'readonly';
const meM = () => members.find((m) => m.id === ME);

const fmtDate = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtFull = new Intl.DateTimeFormat('en-GB', { dateStyle: 'medium', timeStyle: 'medium', timeZone: 'UTC' });
const ago = (min) => min < 5 ? 'Now' : min < 60 ? `${min} min ago` : min < 1440 ? `${Math.floor(min / 60)} h ago` : min < 2880 ? 'Yesterday' : min < 7 * 1440 ? `${Math.floor(min / 1440)} days ago` : fmtDate.format(new Date(TODAY - min * 60000));
const full = (min) => fmtFull.format(new Date(TODAY - min * 60000)) + ' UTC';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pl = (n, w, p) => `${n.toLocaleString('en-GB')} ${n === 1 ? w : (p || w + 's')}`;
const label = (m) => m.name || m.email;
const initials = (m) => { const w = (m.name || m.email.split('@')[0]).split(/[\s.\-]+/).filter(Boolean); return ((w[0] || '?')[0] + (m.name && w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); };
const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const $ = (id) => document.getElementById(id);

const st = { q: '', role: '', status: '', page: 1, sel: new Set(), loading: STATE === 'loading', error: STATE === 'error' };
if (STATE === 'empty') st.q = 'design ops';

/* ---------- derive ---------- */
function filtered() {
  const q = st.q.trim().toLowerCase();
  return members.filter((m) => (!q || label(m).toLowerCase().includes(q) || m.email.toLowerCase().includes(q)) && (!st.role || m.role === st.role) && (!st.status || m.status === st.status));
}
const selectable = (m) => canManage && m.role !== 'Owner';

/* ---------- render ---------- */
function rowHTML(m) {
  const you = m.id === ME, sel = st.sel.has(m.id), t = label(m);
  const av = m.status === 'invited' ? `<span class="av av-inv" aria-hidden="true">${icon('mail')}</span>` : `<span class="av" aria-hidden="true">${esc(initials(m))}</span>`;
  const role = canManage && m.role !== 'Owner'
    ? `<span class="sel sm"><label class="sr-only" for="r-${m.id}">Role of ${esc(t)}</label><select id="r-${m.id}" data-role="${m.id}">${ASSIGN.map((r) => `<option${r === m.role ? ' selected' : ''}>${r}</option>`).join('')}</select>${icon('chev')}</span>`
    : `<span class="role-text">${m.role}</span>`;
  const rev = m.reviews ? `<span class="d-only">${m.reviews.toLocaleString('en-GB')}</span><span class="m-only">${pl(m.reviews, 'open review')}</span>` : `<span class="d-only muted" aria-label="None">–</span><span class="m-only">No open reviews</span>`;
  const never = m.ago == null || m.status === 'invited';
  const last = never ? `<span class="d-only muted" title="${m.status === 'invited' ? 'Invited ' + full(m.ago) : ''}">Never</span><span class="m-only">Not active yet</span>`
    : `<time datetime="${new Date(TODAY - m.ago * 60000).toISOString()}" title="${full(m.ago)}"><span class="d-only">${ago(m.ago)}</span><span class="m-only">Active ${ago(m.ago).replace(/^Now$/, 'now')}</span></time>`;
  return `<tr class="row${sel ? ' is-sel' : ''}" data-id="${m.id}">
    ${canManage ? `<td class="c-chk"><label class="chk"><input type="checkbox" data-sel="${m.id}" aria-label="Select ${esc(t)}"${sel ? ' checked' : ''}${selectable(m) ? '' : ' disabled title="The only owner cannot be selected"'}></label></td>` : ''}
    <td class="c-mem"><div class="mem">${av}<div class="t"><span class="nm"><span title="${esc(t)}">${esc(t)}</span>${you ? '<span class="you">You</span>' : ''}</span>${m.name ? `<span class="em" title="${esc(m.email)}">${esc(m.email)}</span>` : `<span class="em">${m.status === 'invited' ? 'Invite sent' : 'No name set'}</span>`}</div></div></td>
    <td class="c-role">${role}</td>
    <td class="c-st"><span class="badge bd bd-${m.status}">${STATUS[m.status]}</span></td>
    <td class="c-rev num">${rev}</td>
    <td class="c-last">${last}</td>
    ${canManage ? `<td class="c-act"><button class="icon-btn" type="button" data-menu="${m.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(t)}">${icon('more')}</button></td>` : ''}
  </tr>`;
}

function render() {
  const n = { active: 0, invited: 0, suspended: 0 };
  members.forEach((m) => n[m.status]++);
  const people = n.active + n.suspended, used = n.active + n.invited;
  $('counts').textContent = `${pl(people, 'member')}, ${pl(n.invited, 'pending invite')}`;
  $('seats').innerHTML = `<b>${used.toLocaleString('en-GB')} of ${SEATS.toLocaleString('en-GB')}</b> seats used<span class="bar" aria-hidden="true"><i style="width:${Math.min(100, used / SEATS * 100)}%"></i></span>`;
  $('inviteBtn').hidden = !canManage;
  $('roBanner').hidden = canManage;
  $('meAv').textContent = initials(meM());
  $('meName').textContent = meM().name || meM().email;
  if (!canManage) {
    const admins = members.filter((m) => m.role === 'Admin' || m.role === 'Owner').map((m) => m.name);
    $('roText').innerHTML = `You can see who is on the team. Ask ${admins.slice(0, -1).join(', ')} or ${admins.slice(-1)} to invite people or change roles.`;
  }

  st.sel.forEach((id) => { if (!members.some((m) => m.id === id)) st.sel.delete(id); });
  const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PAGE));
  st.page = Math.min(st.page, pages);
  const slice = list.slice((st.page - 1) * PAGE, st.page * PAGE);
  const cols = canManage ? 7 : 5;
  const filtering = st.q || st.role || st.status;
  $('clearF').hidden = !filtering;
  $('bulk').hidden = !canManage || !st.sel.size;
  $('toolbar').hidden = canManage && st.sel.size > 0;
  $('bulkN').textContent = `${st.sel.size} selected`;

  const head = `<thead><tr>${canManage ? `<th class="c-chk"><label class="chk"><input type="checkbox" id="selAll" aria-label="Select all members on this page"></label></th>` : ''}
    <th>Member</th><th class="c-role">Role</th><th class="c-st">Status</th><th class="c-rev num">Open reviews</th><th class="c-last">Last active</th>${canManage ? '<th class="c-act"><span class="sr-only">Actions</span></th>' : ''}</tr></thead>`;
  let body;
  if (st.loading) body = Array.from({ length: 10 }, (_, i) => `<tr class="skrow"><td colspan="${cols}"><span class="sk" style="width:${[62,48,70,55,66][i % 5]}%"></span></td></tr>`).join('');
  else if (st.error) body = `<tr class="msg"><td colspan="${cols}"><div class="state"><h2>We could not load members</h2><p>Your team is unchanged. Check your connection and try again.</p><button class="btn" type="button" data-act="retry">Try again</button></div></td></tr>`;
  else if (!list.length) body = `<tr class="msg"><td colspan="${cols}"><div class="state"><h2>No members match ${st.q ? '“' + esc(st.q.trim()) + '”' : 'these filters'}</h2><p>Check the spelling, or search by the email address.</p><button class="btn" type="button" data-act="clear">Clear filters</button></div></td></tr>`;
  else body = slice.map(rowHTML).join('');
  $('tbl').className = 'reflow' + (canManage ? '' : ' ro');
  $('tbl').innerHTML = `<caption>Members of Northlight Studio</caption><colgroup>${canManage ? '<col class="c-chk">' : ''}<col><col class="c-role"><col class="c-st"><col class="c-rev"><col class="c-last">${canManage ? '<col class="c-act">' : ''}</colgroup>${head}<tbody>${body}</tbody>`;

  const selAll = $('selAll');
  if (selAll) {
    const ids = slice.filter(selectable).map((m) => m.id), k = ids.filter((id) => st.sel.has(id)).length;
    selAll.checked = ids.length > 0 && k === ids.length; selAll.indeterminate = k > 0 && k < ids.length; selAll.disabled = !ids.length;
  }

  const from = list.length ? (st.page - 1) * PAGE + 1 : 0, to = Math.min(st.page * PAGE, list.length);
  const info = st.loading ? 'Loading members' : st.error ? '' : filtering ? `${from}–${to} of ${list.length.toLocaleString('en-GB')} matching members` : `${from}–${to} of ${list.length.toLocaleString('en-GB')} members`;
  $('pager').hidden = st.error || !list.length && !st.loading;
  $('pager').innerHTML = `<span>${info}</span>` + (pages > 1 && !st.loading ? `<nav aria-label="Pagination"><button class="pg" type="button" data-pg="${st.page - 1}"${st.page === 1 ? ' disabled' : ''}>Previous</button><span class="pgnums">${pageNums(st.page, pages)}</span><span class="pginfo">Page ${st.page} of ${pages}</span><button class="pg" type="button" data-pg="${st.page + 1}"${st.page === pages ? ' disabled' : ''}>Next</button></nav>` : '');
}
function pageNums(cur, total) {
  const set = new Set([1, total, cur - 1, cur, cur + 1]);
  const out = []; let prev = 0;
  [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b).forEach((p) => {
    if (p - prev > 1) out.push('<span class="pg-dots" aria-hidden="true">…</span>');
    out.push(`<button class="pg" type="button" data-pg="${p}"${p === cur ? ' aria-current="page"' : ''} aria-label="Page ${p}">${p}</button>`); prev = p;
  });
  return out.join('');
}

/* ---------- toasts and undo ---------- */
function toast(text, undo) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button class="btn btn-text" type="button">Undo</button>' : ''}`;
  const kill = () => el.remove();
  if (undo) el.querySelector('button').onclick = () => { undo(); render(); kill(); };
  $('toasts').append(el); setTimeout(kill, 7000);
}

/* ---------- actions ---------- */
const where = () => { const t = $('tableWrap'); t.focus({ preventScroll: true }); };
function setRoles(ids, role) {
  const prev = ids.map((id) => [id, members.find((m) => m.id === id).role]);
  ids.forEach((id) => { members.find((m) => m.id === id).role = role; });
  const undo = () => prev.forEach(([id, r]) => { members.find((m) => m.id === id).role = r; });
  if (ids.length === 1) toast(`${label(members.find((m) => m.id === ids[0]))} is now ${/^[AEIOU]/.test(role) ? 'an' : 'a'} ${role}`, undo);
  else toast(`Role set to ${role} for ${ids.length} members`, undo);
}
function setStatus(m, status, msg) {
  const prev = m.status; m.status = status;
  toast(msg, () => { m.status = prev; });
}
function removeAsk(ms) {
  const invited = ms.filter((m) => m.status === 'invited'), proj = ms.reduce((s, m) => s + m.projects, 0);
  const one = ms.length === 1 ? ms[0] : null;
  $('cT').textContent = one ? (one.status === 'invited' ? `Revoke the invite to ${label(one)}?` : `Remove ${label(one)}?`) : `Remove ${ms.length} people?`;
  const tail = 'Their comments and reviews stay.';
  $('cB').textContent = one
    ? (one.status === 'invited' ? 'The invite link stops working at once. You can invite this address again later.'
      : one.projects ? `${label(one)} loses access to ${pl(one.projects, 'project')} now. ${tail}` : `${label(one)} is suspended and has no project access. ${tail}`)
    : `They lose access to ${pl(proj, 'project')} now${invited.length ? `, and ${pl(invited.length, 'pending invite')} stop${invited.length === 1 ? 's' : ''} working` : ''}. ${tail}`;
  const L = $('cL'); L.hidden = !!one;
  if (!one) L.innerHTML = ms.slice(0, 5).map((m) => `<li>${esc(label(m))}</li>`).join('') + (ms.length > 5 ? `<li>and ${ms.length - 5} more</li>` : '');
  $('cOk').textContent = one ? (one.status === 'invited' ? 'Revoke invite' : `Remove ${label(one)}`) : `Remove ${ms.length} people`;
  $('cOk').onclick = () => {
    const ids = new Set(ms.map((m) => m.id));
    members = members.filter((m) => !ids.has(m.id)); ids.forEach((id) => st.sel.delete(id));
    $('confirmDlg').close(); render(); where();
    toast(one ? (one.status === 'invited' ? `Invite to ${label(one)} revoked` : `${label(one)} removed from the team`) : `${ms.length} people removed from the team`);
  };
  $('confirmDlg').showModal();
}

/* row menu */
const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('role', 'menu'); menu.hidden = true; document.body.append(menu);
let menuBtn = null;
function closeMenu(focus) { if (!menuBtn) return; menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); const b = menuBtn; menuBtn = null; if (focus) { const live = document.querySelector(`[data-menu="${b.dataset.menu}"]`); (live || $('tableWrap')).focus(); } }
function openMenu(btn) {
  closeMenu(); menuBtn = btn; btn.setAttribute('aria-expanded', 'true');
  const m = members.find((x) => x.id === btn.dataset.menu), items = [];
  if (m.id === ME) items.push(['leave', 'Leave team', 'Transfer ownership first. You are the only owner.', 'disabled']);
  else if (m.status === 'invited') items.push(['resend', 'Resend invite'], ['revoke', 'Revoke invite…', '', 'danger']);
  else items.push([m.status === 'suspended' ? 'restore' : 'suspend', m.status === 'suspended' ? 'Restore access' : 'Suspend access'], ['remove', 'Remove from team…', '', 'danger']);
  menu.innerHTML = items.map(([a, t, sub, k]) => `<button type="button" role="menuitem" data-m="${a}" data-id="${m.id}"${k === 'disabled' ? ' aria-disabled="true"' : ''}${k === 'danger' ? ' class="danger"' : ''}>${t}${sub ? `<small>${sub}</small>` : ''}</button>`).join('');
  menu.hidden = false;
  const r = btn.getBoundingClientRect(), h = menu.offsetHeight, w = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  menu.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  menu.querySelector('button').focus();
}
menu.addEventListener('keydown', (e) => {
  const b = [...menu.querySelectorAll('button')], i = b.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { b[(i + 1) % b.length].focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { b[(i - 1 + b.length) % b.length].focus(); e.preventDefault(); }
  else if (e.key === 'Escape') { closeMenu(true); e.preventDefault(); }
  else if (e.key === 'Tab') closeMenu(false);
});
menu.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.getAttribute('aria-disabled')) return;
  const m = members.find((x) => x.id === b.dataset.id), a = b.dataset.m, t = label(m);
  closeMenu(false);
  if (a === 'suspend') { setStatus(m, 'suspended', `${t} suspended`); render(); where(); }
  else if (a === 'restore') { setStatus(m, 'active', `${t} restored`); render(); where(); }
  else if (a === 'resend') { m.ago = 0; toast(`Invite resent to ${t}`); render(); }
  else removeAsk([m]);
});

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  if (menuBtn && !t.closest('.menu') && !t.closest('[data-menu]')) closeMenu(false);
  const mb = t.closest('[data-menu]'); if (mb) { menuBtn === mb ? closeMenu(true) : openMenu(mb); return; }
  const pg = t.closest('[data-pg]'); if (pg && !pg.disabled) { st.page = +pg.dataset.pg; render(); $('tableWrap').scrollIntoView({ block: 'nearest' }); return; }
  const a = t.closest('[data-act]')?.dataset.act;
  if (a === 'retry') { st.error = false; st.loading = true; render(); setTimeout(() => { st.loading = false; render(); }, 500); }
  if (a === 'clear') clearFilters();
});
function clearFilters() { st.q = ''; st.role = ''; st.status = ''; st.page = 1; $('q').value = ''; $('fRole').value = ''; $('fStatus').value = ''; render(); }
$('clearF').onclick = clearFilters;
$('q').addEventListener('input', (e) => { st.q = e.target.value; st.page = 1; render(); });
$('fRole').onchange = (e) => { st.role = e.target.value; st.page = 1; render(); };
$('fStatus').onchange = (e) => { st.status = e.target.value; st.page = 1; render(); };
$('tbl').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.role) { setRoles([t.dataset.role], t.value); render(); document.getElementById('r-' + t.dataset.role)?.focus(); }
  else if (t.dataset.sel) { t.checked ? st.sel.add(t.dataset.sel) : st.sel.delete(t.dataset.sel); render(); document.querySelector(`[data-sel="${t.dataset.sel}"]`)?.focus(); }
  else if (t.id === 'selAll') {
    const ids = filtered().slice((st.page - 1) * PAGE, st.page * PAGE).filter(selectable).map((m) => m.id);
    ids.forEach((id) => (t.checked ? st.sel.add(id) : st.sel.delete(id))); render();
    if (!$('bulk').hidden) $('bulkClear').focus();
  }
});
$('bulkClear').onclick = () => { st.sel.clear(); render(); $('q').focus(); };
$('bulkRole').onchange = (e) => { if (e.target.value) { setRoles([...st.sel], e.target.value); e.target.value = ''; render(); } };
$('bulkRemove').onclick = () => removeAsk(members.filter((m) => st.sel.has(m.id)));
$('cCancel').onclick = () => $('confirmDlg').close();
document.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d && !sending) d.close(); }));

/* filters and role lists */
$('fRole').innerHTML = '<option value="">All roles</option>' + Object.keys(ROLES).map((r) => `<option>${r}</option>`).join('');
$('fStatus').innerHTML = '<option value="">All statuses</option>' + Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
$('bulkRole').innerHTML = '<option value="">Change role…</option>' + ASSIGN.map((r) => `<option>${r}</option>`).join('');
$('inviteRole').innerHTML = ASSIGN.map((r) => `<option${r === 'Reviewer' ? ' selected' : ''}>${r}</option>`).join('');
const roleDesc = () => { $('roleDesc').textContent = `${$('inviteRole').value}: ${ROLES[$('inviteRole').value].toLowerCase()}`; };
$('inviteRole').onchange = roleDesc; roleDesc();
if (st.q) $('q').value = st.q;

/* nav sheet on phones */
const side = $('side');
const navToggle = (open) => { side.classList.toggle('open', open); $('menuBtn').setAttribute('aria-expanded', open); (open ? $('closeNav') : $('menuBtn')).focus(); };
$('menuBtn').onclick = () => navToggle(true); $('closeNav').onclick = () => navToggle(false);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && side.classList.contains('open')) navToggle(false); });

/* ---------- invite dialog ---------- */
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let chips = [], sending = false;
const chipsEl = $('chips'), emailIn = $('emailIn');
function drawChips() {
  chipsEl.querySelectorAll('.chip').forEach((c) => c.remove());
  chips.forEach((c, i) => {
    const el = document.createElement('span'); el.className = 'chip' + (c.bad ? ' bad' : '');
    el.innerHTML = `<span title="${esc(c.v)}">${esc(c.v)}</span><button type="button" aria-label="Remove ${esc(c.v)}">${icon('x', 'ic-sm')}</button>`;
    el.querySelector('button').onclick = () => { chips.splice(i, 1); drawChips(); showErr(''); emailIn.focus(); };
    chipsEl.insertBefore(el, emailIn);
  });
  emailIn.setAttribute('aria-invalid', chips.some((c) => c.bad));
}
function commit() {
  const parts = emailIn.value.split(/[\s,;]+/).filter(Boolean);
  parts.forEach((v) => { if (!chips.some((c) => c.v.toLowerCase() === v.toLowerCase())) chips.push({ v, bad: !EMAIL.test(v) }); });
  emailIn.value = ''; drawChips();
}
const showErr = (msg) => { $('inviteErr').hidden = !msg; $('inviteErr').lastElementChild.textContent = msg; };
emailIn.addEventListener('keydown', (e) => {
  if (['Enter', ',', ' '].includes(e.key) && emailIn.value.trim()) { e.preventDefault(); commit(); }
  else if (e.key === 'Enter') e.preventDefault();
  else if (e.key === 'Backspace' && !emailIn.value && chips.length) { chips.pop(); drawChips(); }
});
emailIn.addEventListener('blur', () => { if (emailIn.value.trim()) commit(); });
emailIn.addEventListener('paste', () => setTimeout(commit));
chipsEl.addEventListener('click', (e) => { if (e.target === chipsEl) emailIn.focus(); });

function openInvite(sample) {
  chips = []; emailIn.value = ''; showErr(''); $('inviteMsg').value = ''; $('inviteRole').value = 'Reviewer'; roleDesc();
  if (sample) { ['dev.patel@brightwell-agency.com', 'rosa.lindgren@northlight.studio', 'kofi-mensah@northlight'].forEach((v) => chips.push({ v, bad: !EMAIL.test(v) })); }
  drawChips(); $('inviteDlg').showModal(); emailIn.focus();
}
$('inviteBtn').onclick = () => openInvite(new URLSearchParams(location.search).get('dialog') === 'invalid');
$('inviteDlg').addEventListener('cancel', (e) => { if (sending) e.preventDefault(); });
$('inviteForm').addEventListener('input', () => { if (!$('inviteErr').hidden && !sending) showErr(''); });
$('inviteForm').addEventListener('submit', (e) => {
  e.preventDefault(); if (sending) return;
  if (emailIn.value.trim()) commit();
  const bad = chips.filter((c) => c.bad), dupe = chips.filter((c) => !c.bad && members.some((m) => m.email.toLowerCase() === c.v.toLowerCase()));
  const free = SEATS - members.filter((m) => m.status !== 'suspended').length;
  let msg = '';
  if (!chips.length) msg = 'Enter at least one email address.';
  else if (bad.length) msg = `${pl(bad.length, 'address is', 'addresses are')} not valid: ${bad.map((c) => c.v).join(', ')}. Fix or remove ${bad.length === 1 ? 'it' : 'them'}.`;
  else if (dupe.length) { dupe.forEach((c) => (c.bad = true)); drawChips(); msg = `${dupe.map((c) => c.v).join(', ')} ${dupe.length === 1 ? 'is' : 'are'} already on the team. Remove ${dupe.length === 1 ? 'it' : 'them'} to continue.`; }
  else if (chips.length > free) msg = `Your plan has ${pl(free, 'free seat')}. Remove ${chips.length - free} ${chips.length - free === 1 ? 'address' : 'addresses'}, or ask the owner to add seats.`;
  if (msg) { showErr(msg); emailIn.focus(); return; }
  sending = true; const btn = $('sendBtn'); btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Sending…';
  setTimeout(() => {
    const role = $('inviteRole').value;
    members = chips.map((c, i) => ({ id: 'n' + Date.now() + i, name: '', email: c.v, role, status: 'invited', ago: 0, reviews: 0, projects: 0 })).concat(members);
    const k = chips.length; sending = false; btn.removeAttribute('aria-busy'); btn.textContent = 'Send invites';
    $('inviteDlg').close(); clearFilters(); where();
    toast(`${pl(k, 'invite')} sent as ${role}. Resend or revoke from the list.`);
  }, 600);
});
emailIn.addEventListener('input', () => { const n = chips.length + (emailIn.value.trim() ? 1 : 0); $('sendBtn').textContent = n > 1 ? `Send ${n} invites` : 'Send invites'; });
const syncSend = () => { $('sendBtn').textContent = chips.length > 1 ? `Send ${chips.length} invites` : 'Send invites'; };
new MutationObserver(syncSend).observe(chipsEl, { childList: true });

render();
if (new URLSearchParams(location.search).get('dialog') && canManage) openInvite(new URLSearchParams(location.search).get('dialog') === 'invalid');
</script>
</body>
