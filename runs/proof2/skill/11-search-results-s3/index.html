<script>
/* ---------- data ---------- */
const PAGE_SIZE = 12;
const RECENT = ['chickpea curry', 'lentil dal', 'weeknight pasta', 'shakshuka'];

/* [title, cook, description, minutes, ingredients, rating, ratings, diets, cuisine, glyph] */
const V = 'Vegan', VG = 'Vegetarian', GF = 'Gluten-free', DF = 'Dairy-free';
const RAW = [
 ['Creamy coconut chickpea curry', 'Anjali Rao', 'A 30 minute chickpea curry with coconut milk, tomatoes and garam masala. Freezes well.', 30, 10, 4.8, 3214, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Chana masala', 'Priya Nair', 'The classic Punjabi chickpea curry, simmered with onion, ginger and a spoon of amchur for sourness.', 40, 12, 4.7, 5120, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Chickpea and spinach curry', 'Tomas Lindqvist', 'Saag chana, a fast curry where wilted spinach melts into a thick chickpea sauce.', 25, 9, 4.6, 1893, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Sweet potato and chickpea curry', 'Maya Okafor', 'Roasted sweet potato and chickpeas in a mild tomato curry sauce with a squeeze of lime.', 45, 11, 4.7, 2276, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Thai red chickpea curry', 'Nong Suwan', 'Red curry paste, coconut milk and green beans make a chickpea curry that is ready in half an hour.', 30, 11, 4.5, 987, [V, VG, GF, DF], 'Thai', 'bowl'],
 ['Paneer and chickpea curry', 'Anjali Rao', 'Cubes of pan-fried paneer and chickpeas in a spiced onion and cashew curry.', 35, 12, 4.6, 764, [VG, GF], 'Indian', 'pot'],
 ['One-pot pantry chickpea curry', 'Daniel Brooks', 'A chickpea curry from cupboard staples: tinned tomatoes, coconut milk, curry powder and rice.', 20, 8, 4.4, 2650, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Slow cooker chickpea curry', 'Daniel Brooks', 'Put dried chickpeas, spices and tomatoes in the slow cooker and come home to a rich curry.', 240, 9, 4.6, 1432, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Moroccan chickpea curry with apricots', 'Salma Haddad', 'Ras el hanout, dried apricots and preserved lemon turn a chickpea curry into a tagine-style supper.', 50, 13, 4.5, 612, [V, VG, GF, DF], 'North African', 'pot'],
 ['Jamaican curried chickpeas', 'Marcus Bell', 'Channa with Jamaican curry powder, thyme, scotch bonnet and potato. Serve with rice and peas.', 40, 12, 4.6, 540, [V, VG, GF, DF], 'Caribbean', 'bowl'],
 ['Kerala chickpea curry with roasted coconut', 'Priya Nair', 'Kadala curry: chickpeas in a dark sauce of coconut roasted with curry leaves and black pepper.', 55, 14, 4.8, 388, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Chickpea tikka masala', 'Maya Okafor', 'Chickpeas in a creamy tikka curry sauce, finished with a swirl of yoghurt and fresh coriander.', 45, 13, 4.7, 4108, [VG, GF], 'Indian', 'bowl'],
 ['Quick chickpea curry for two', 'Tomas Lindqvist', 'A small-batch chickpea curry on the table in 15 minutes, with one pan and seven ingredients.', 15, 7, 4.2, 1120, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Japanese-style chickpea curry', 'Hana Mori', 'Chickpeas, carrot and potato in a sweet, mellow curry roux. Spoon over short-grain rice.', 35, 10, 4.4, 301, [V, VG, DF], 'Other', 'bowl'],
 ['Roasted cauliflower and chickpea curry', 'Daniel Brooks', 'Roast the cauliflower and chickpeas first for a curry with deeper flavour and a little char.', 45, 10, 4.6, 1760, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Butter chickpea curry', 'Anjali Rao', 'Butter chicken sauce with chickpeas instead of chicken: tomato, cream, fenugreek and honey.', 30, 11, 4.7, 2305, [VG, GF], 'Indian', 'bowl'],
 ['Chickpea and red lentil curry', 'Salma Haddad', 'Red lentils melt into a thick sauce around whole chickpeas. A curry that makes good leftovers.', 40, 10, 4.5, 1670, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Thai green chickpea curry', 'Nong Suwan', 'Green curry paste, lime leaves and Thai basil in a light coconut broth with chickpeas.', 30, 12, 4.4, 458, [V, VG, GF, DF], 'Thai', 'bowl'],
 ['Massaman chickpea curry', 'Nong Suwan', 'A mild Massaman curry with chickpeas, potato and peanuts, slow-simmered until the sauce thickens.', 50, 14, 4.6, 349, [V, VG, GF, DF], 'Thai', 'pot'],
 ['Chickpea shakshuka curry', 'Salma Haddad', 'Eggs poached in a curry-spiced tomato and chickpea sauce. Good for brunch or supper.', 25, 9, 4.3, 822, [VG, GF, DF], 'North African', 'pot'],
 ['Spiced potato and chickpea curry', 'Maya Okafor', 'Aloo chana, a dry-style curry of potato and chickpeas with cumin and amchur.', 35, 9, 4.5, 2012, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Chickpea curry with kale and coconut', 'Marcus Bell', 'Kale stands up to a long simmer in this coconut chickpea curry with fresh ginger.', 30, 10, 4.3, 676, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Instant Pot chickpea curry', 'Daniel Brooks', 'Dried chickpeas and curry sauce go in together, no soaking and no stirring. 35 minutes under pressure.', 35, 9, 4.6, 3090, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Chickpea curry soup', 'Tomas Lindqvist', 'A thin, warming curry soup with chickpeas, carrot and a spoon of yoghurt on top.', 35, 10, 4.3, 515, [VG, GF], 'Other', 'pot'],
 ['Roasted pumpkin chickpea curry', 'Hana Mori', 'Pumpkin and chickpeas in a coconut curry with mustard seeds and curry leaves.', 50, 12, 4.5, 713, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Chickpea curry pie', 'Maya Okafor', 'A chickpea curry baked under a flaky shortcrust lid. Make the filling a day ahead.', 75, 14, 4.4, 266, [VG], 'Other', 'pie'],
 ['Curried chickpea wraps', 'Marcus Bell', 'Mashed curry-spiced chickpeas with mango chutney and crunchy cucumber in a warm flatbread.', 15, 8, 4.3, 1840, [V, VG, DF], 'Other', 'pie'],
 ['Freezer pack chickpea curry', 'Anjali Rao', 'Pack the curry base into freezer bags with the chickpeas on Sunday and cook from frozen.', 25, 11, 4.5, 934, [V, VG, GF, DF], 'Indian', 'pot'],
 ['Chickpea curry with chard and tamarind', 'Priya Nair', 'Tangy tamarind and bright chard lift a gentle chickpea curry. Serve with plain rice.', 40, 12, 4.6, 275, [V, VG, GF, DF], 'Indian', 'bowl'],
 ['Mild chickpea curry for kids', 'Daniel Brooks', 'A sweet, creamy chickpea curry with apple and mild spices that younger eaters ask for again.', 25, 10, 4.5, 2147, [V, VG, GF, DF], 'Indian', 'bowl'],
];
const STRESS = [
 ['Slow-braised heritage chickpea and wild mushroom curry with preserved lemon, toasted fenugreek, black cardamom and fresh curry leaves (serves eight)', 'Dr. Alexandra Papadopoulos-Vandenberghe', 'Curry.', 1475, 31, null, 0, [V, VG, GF, DF], 'North African', 'pot'],
 ['Chickpea curry', 'Jo', 'A chickpea curry with no frills.', 5, 3, 3.0, 1, [V], 'Other', 'bowl'],
];
const params = new URLSearchParams(location.search);
const mode = params.get('state') || '';
const recipes = RAW.concat(mode === 'stress' ? STRESS : []).map((r, i) => ({
  id: i, title: r[0], by: r[1], desc: r[2], min: r[3], ing: r[4], rating: r[5], votes: r[6], diets: r[7], cuisine: r[8], glyph: r[9],
}));
const saved = new Set([6, 17]);

/* ---------- state ---------- */
const st = { q: params.has('q') ? params.get('q') : (mode === 'empty' ? '' : mode === 'noresults' ? 'chickpea currry' : 'chickpea curry'),
  diet: new Set(), cuisine: new Set(), time: 0, sort: 'relevance', page: 1 };

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = new Intl.NumberFormat('en-GB');
const tokens = (q) => q.toLowerCase().split(/\s+/).filter(Boolean);
const haystack = (r) => (r.title + ' ' + r.desc + ' ' + r.cuisine).toLowerCase();
const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;
const fmtTime = (m) => m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m / 60} hr`;
const icon = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
function hl(text, toks) {
  const safe = esc(text);
  if (!toks.length) return safe;
  const re = new RegExp('\\b(' + toks.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return safe.replace(re, '<strong>$1</strong>');
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const vocab = [...new Set(recipes.flatMap((r) => haystack(r).match(/[a-z]{4,}/g)))];
function didYouMean(q) {
  let changed = false;
  const out = tokens(q).map((t) => {
    if (recipes.some((r) => haystack(r).includes(t))) return t;
    let best = null, bd = 3;
    for (const w of vocab) { const dist = lev(t, w); if (dist < bd) { bd = dist; best = w; } }
    if (best) { changed = true; return best; }
    return t;
  });
  return changed ? out.join(' ') : null;
}
function matches(r, skip) {
  const toks = tokens(st.q);
  if (toks.length && !toks.every((t) => haystack(r).includes(t))) return false;
  if (skip !== 'diet' && ![...st.diet].every((d) => r.diets.includes(d))) return false;
  if (skip !== 'cuisine' && st.cuisine.size && !st.cuisine.has(r.cuisine)) return false;
  if (skip !== 'time' && st.time && r.min > st.time) return false;
  return true;
}
function results() {
  const list = recipes.filter((r) => matches(r));
  const by = { relevance: (a, b) => b.votes - a.votes, rated: (a, b) => (b.rating ?? 0) - (a.rating ?? 0) || b.votes - a.votes,
    quick: (a, b) => a.min - b.min, made: (a, b) => b.votes - a.votes };
  return list.sort(by[st.sort]);
}
const glyphFor = { bowl: 'g-bowl', pot: 'g-pot', pie: 'g-pie' };

/* ---------- facets (built once, counts updated in place) ---------- */
function facetsHtml() {
  const opt = (name, value, label, type = 'checkbox') =>
    `<label class="opt"><input type="${type}" name="${name}" value="${esc(value)}"><span>${esc(label)}</span><span class="n" data-count="${name}:${esc(value)}"></span></label>`;
  return `
  <div class="facets-head"><h2 id="filtersTitle" tabindex="-1">Filters</h2><button type="button" class="iconbtn" id="closeSheet" aria-label="Close filters">${icon('i-x')}</button></div>
  <div class="facets-body">
    <fieldset class="group"><legend>Diet</legend>${DIETS.map((d) => opt('diet', d, d)).join('')}</fieldset>
    <fieldset class="group"><legend>Cooking time</legend>
      <label class="opt"><input type="radio" name="time" value="0" checked><span>Any time</span><span class="n" data-count="time:0"></span></label>
      ${TIMES.map((t) => opt('time', t.v, t.label, 'radio')).join('')}</fieldset>
    <fieldset class="group"><legend>Cuisine</legend>${CUISINES.map((c) => opt('cuisine', c, c)).join('')}</fieldset>
  </div>
  <div class="facets-foot"><button type="button" class="btn" id="showResults"></button></div>`;
}
function updateFacets() {
  const n = (f) => recipes.filter((r) => matches(r, f));
  const set = (k, v) => { const el = $(`[data-count="${k}"]`); if (el) { el.textContent = nf.format(v); el.closest('.opt').classList.toggle('zero', v === 0); } };
  DIETS.forEach((d) => set('diet:' + d, recipes.filter((r) => matches(r) && r.diets.includes(d)).length));
  CUISINES.forEach((c) => set('cuisine:' + c, n('cuisine').filter((r) => r.cuisine === c).length));
  set('time:0', n('time').length);
  TIMES.forEach((t) => set('time:' + t.v, n('time').filter((r) => r.min <= t.v).length));
  document.querySelectorAll('.facets input').forEach((i) => {
    i.checked = i.name === 'diet' ? st.diet.has(i.value) : i.name === 'cuisine' ? st.cuisine.has(i.value) : String(st.time) === i.value;
  });
}

/* ---------- render ---------- */
const body = $('#body');
function shell() {
  body.innerHTML = `<div class="layout">
    <aside class="facets" id="facets" aria-labelledby="filtersTitle">${facetsHtml()}</aside>
    <section aria-label="Search results" id="results"></section>
  </div>`;
}
function chipsHtml() {
  const items = [...[...st.diet].map((d) => ['diet', d, d]), ...[...st.time ? [['time', st.time, TIMES.find((t) => t.v === st.time).label]] : []],
    ...[...st.cuisine].map((c) => ['cuisine', c, c])];
  if (!items.length) return '';
  return items.map(([k, v, l]) => `<button type="button" class="chip" data-remove="${k}:${esc(v)}" aria-label="Remove filter: ${esc(l)}">${esc(l)}${icon('i-x')}</button>`).join('')
    + `<button type="button" class="clearall" id="clearAll">Clear all</button>`;
}
function rowHtml(r, toks) {
  const rate = r.rating == null ? `<span>No ratings yet</span>` :
    `<span class="rate">${icon('i-star')}${r.rating.toFixed(1)}<span style="font-weight:400;color:var(--text-muted)">(${nf.format(r.votes)})</span></span>`;
  const isSaved = saved.has(r.id);
  return `<li class="row" data-id="${r.id}">
    <div class="tile" aria-hidden="true"><svg><use href="#${glyphFor[r.glyph]}"/></svg></div>
    <div style="min-width:0">
      <h2><a href="#recipe-${r.id}">${hl(r.title, toks)}</a></h2>
      <p class="desc">${hl(r.desc, toks)}</p>
      <div class="meta">${rate}<span>${icon('i-clock')}${fmtTime(r.min)}</span><span>${r.ing} ingredients</span><span class="by">By ${esc(r.by)}</span>
      ${r.diets.filter((d) => d !== 'Vegetarian' || !r.diets.includes('Vegan')).slice(0, 2).map((d) => `<span class="badge tag">${esc(d)}</span>`).join('')}</div>
    </div>
    <div class="acts"><button type="button" class="save" data-save="${r.id}" aria-pressed="${isSaved}" aria-label="${isSaved ? 'Saved' : 'Save'}: ${esc(r.title)}">${icon('i-bookmark')}<span>${isSaved ? 'Saved' : 'Save'}</span></button></div>
  </li>`;
}
function pagerHtml(total, page, pages) {
  const from = (page - 1) * PAGE_SIZE + 1, to = Math.min(total, page * PAGE_SIZE);
  const nums = Array.from({ length: pages }, (_, i) => i + 1).map((p) =>
    `<li><button type="button" class="pg ${Math.abs(p - page) > 1 && p !== 1 && p !== pages ? 'num-far' : ''}" data-page="${p}" ${p === page ? 'aria-current="page"' : ''} aria-label="Page ${p}">${p}</button></li>`).join('');
  return `<nav class="pager" aria-label="Pagination"><span class="range">Showing ${from}–${to} of ${nf.format(total)}</span>
    <ul><li><button type="button" class="pg" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="Previous page">${icon('i-prev')} Previous</button></li>${nums}
    <li><button type="button" class="pg" data-page="${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="Next page">Next ${icon('i-next')}</button></li></ul></nav>`;
}
function headHtml(titleText) {
  return `<div class="resulthead"><h1 id="resultsTitle" tabindex="-1" aria-live="polite">${titleText}</h1>
    <div class="controls"><button type="button" class="btn2 filterbtn" id="openSheet" aria-haspopup="dialog">${icon('i-filter')}Filters${activeCount() ? ` (${activeCount()})` : ''}</button>
    <div class="sortwrap"><label for="sort">Sort by</label><select class="sort" id="sort">
      ${[['relevance', 'Relevance'], ['rated', 'Highest rated'], ['quick', 'Quickest'], ['made', 'Most reviewed']].map(([v, l]) => `<option value="${v}" ${st.sort === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select></div></div></div>`;
}
const activeCount = () => st.diet.size + st.cuisine.size + (st.time ? 1 : 0);

function render(focusTitle) {
  const root = $('#results');
  const q = st.q.trim();
  $('#q').value = st.q; $('#clearQ').hidden = !st.q;
  document.title = q ? `${q} - Saltbox recipe search` : 'Search - Saltbox';
  const layout = $('.layout');

  if (mode === 'error') {
    layout.style.display = 'block'; $('#facets').style.display = 'none';
    root.innerHTML = `<div class="resulthead"><h1 id="resultsTitle" tabindex="-1">Results for “${esc(q)}”</h1></div><div class="banner" role="alert" style="margin-top:var(--rhythm-content)">${icon('i-alert')}<div><h2>Search isn't working right now</h2>
      <p>Your saved recipes are safe. Try the search again, or browse the collections while we fix it.</p>
      <button type="button" class="btn2" id="retry">Try again</button></div></div>`;
    $('#retry').onclick = () => { location.search = '?q=' + encodeURIComponent(st.q); };
    return;
  }
  if (mode === 'loading') {
    layout.style.display = 'block'; $('#facets').style.display = 'none';
    root.setAttribute('aria-busy', 'true');
    root.innerHTML = `<div class="resulthead"><h1 id="resultsTitle" tabindex="-1">Searching for “${esc(q)}”</h1></div><div class="progress" role="progressbar" aria-label="Searching" style="margin-top:var(--rhythm-content)"></div><div style="opacity:.6" aria-hidden="true">` +
      Array.from({ length: 5 }, () => `<div class="row" style="grid-template-columns:120px 1fr"><div class="skel t"></div><div><div class="skel" style="width:60%;height:20px"></div><div class="skel" style="width:30%;margin-top:10px"></div><div class="skel" style="width:90%;margin-top:14px"></div><div class="skel" style="width:50%;margin-top:14px"></div></div></div>`).join('') + `</div>
      <p class="sr-only" role="status">Searching for ${esc(q)}</p>`;
    return;
  }
  if (!q) {
    layout.style.display = 'block'; $('#facets').style.display = 'none';
    root.innerHTML = `<div class="resulthead"><h1 id="resultsTitle" tabindex="-1">Find a recipe</h1></div>
      <div class="recent" style="margin-top:var(--rhythm-content)">
        <div class="recentblock"><h2>Recent searches</h2><ul>${RECENT.map((s) => `<li><button type="button" data-search="${esc(s)}">${icon('i-clock')}${esc(s)}</button></li>`).join('')}</ul></div>
        <div class="recentblock"><h2>Browse by diet</h2><ul>${DIETS.map((d) => `<li><button type="button" data-diet="${d}">${icon('i-list')}${d}<span class="n">${recipes.filter((r) => r.diets.includes(d)).length}</span></button></li>`).join('')}</ul></div>
      </div>`;
    return;
  }
  layout.style.display = ''; $('#facets').style.display = '';
  root.removeAttribute('aria-busy');
  const all = results();
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  st.page = Math.min(st.page, pages);
  updateFacets();
  $('#showResults').textContent = total ? `Show ${plural(total, 'recipe', 'recipes')}` : 'Show results';
  const toks = tokens(q);
  const chips = chipsHtml();
  const titleText = `${nf.format(total)} ${total === 1 ? 'recipe' : 'recipes'} for “${esc(q)}”`;

  if (!total) {
    const fix = activeCount() === 0 ? didYouMean(q) : null;
    let blocker = '';
    if (activeCount()) {
      const toks2 = tokens(q); const base = recipes.filter((r) => toks2.every((t) => haystack(r).includes(t)));
      blocker = base.length ? `${plural(base.length, 'recipe', 'recipes')} match “${esc(q)}” before filters.` : '';
    }
    root.innerHTML = headHtml(`No recipes for “${esc(q)}”`) + (chips ? `<div class="chips">${chips}</div>` : '') + `
      <div class="empty" style="margin-top:var(--rhythm-content)"><div class="art" aria-hidden="true"><svg><use href="#g-bowl"/></svg></div>
        <h2>${fix ? `Did you mean “${esc(fix)}”?` : activeCount() ? 'No recipes match these filters' : 'Nothing matches that search'}</h2>
        <p>${fix ? 'We found no recipes for the words you typed.' : blocker || 'Check the spelling or try a shorter search, like one ingredient.'}</p>
        <div class="actions">
          ${fix ? `<button type="button" class="btn2" data-search="${esc(fix)}">Search for “${esc(fix)}”</button>` : ''}
          ${activeCount() ? `<button type="button" class="btn2" id="clearAll">Clear all filters</button>` : ''}
          ${!fix && !activeCount() ? `<button type="button" class="btn2" data-search="chickpea curry">Search for “chickpea curry”</button>` : ''}
        </div></div>`;
    if (focusTitle) $('#resultsTitle').focus();
    return;
  }
  const slice = all.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE);
  root.innerHTML = headHtml(titleText) + (chips ? `<div class="chips">${chips}</div>` : '') +
    `<div class="results"><ol>${slice.map((r) => rowHtml(r, toks)).join('')}</ol></div>` + pagerHtml(total, st.page, pages);
  if (focusTitle) $('#resultsTitle').focus();
}

/* ---------- events ---------- */
shell();
const facets = $('#facets');
let opener = null;
function openSheet() { opener = document.activeElement; facets.classList.add('open'); $('#scrim').hidden = false; $('#filtersTitle').focus(); }
function closeSheet() { facets.classList.remove('open'); $('#scrim').hidden = true; if (opener && document.contains(opener)) opener.focus(); }
function go(focus) { st.page = 1; render(focus); }

$('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); st.q = $('#q').value.trim(); st.page = 1; if (mode === 'loading' || mode === 'error') { location.search = '?q=' + encodeURIComponent(st.q); return; } history.replaceState(null, '', '?q=' + encodeURIComponent(st.q)); render(true); });
$('#clearQ').addEventListener('click', () => { st.q = ''; $('#q').focus(); history.replaceState(null, '', '?q='); render(); });
$('#q').addEventListener('input', (e) => { $('#clearQ').hidden = !e.target.value; });
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && facets.classList.contains('open')) closeSheet(); });
facets.addEventListener('change', (e) => {
  const i = e.target; if (!i.name) return;
  if (i.name === 'diet' || i.name === 'cuisine') (i.checked ? st[i.name].add(i.value) : st[i.name].delete(i.value));
  else st.time = Number(i.value);
  st.page = 1; render();
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'openSheet') return openSheet();
  if (t.id === 'closeSheet' || t.id === 'showResults') return closeSheet();
  if (t.id === 'clearAll') { st.diet.clear(); st.cuisine.clear(); st.time = 0; return go(true); }
  if (t.dataset.remove) { const [k, v] = t.dataset.remove.split(':'); if (k === 'time') st.time = 0; else st[k].delete(v); return go(true); }
  if (t.dataset.save) { const id = Number(t.dataset.save); saved.has(id) ? saved.delete(id) : saved.add(id);
    const r = recipes[id], on = saved.has(id); t.setAttribute('aria-pressed', on); t.setAttribute('aria-label', `${on ? 'Saved' : 'Save'}: ${r.title}`); t.lastElementChild.textContent = on ? 'Saved' : 'Save'; return; }
  if (t.dataset.page) { st.page = Number(t.dataset.page); render(true); return; }
  if (t.dataset.search) { st.q = t.dataset.search; st.page = 1; history.replaceState(null, '', '?q=' + encodeURIComponent(st.q)); render(true); return; }
  if (t.dataset.diet) { st.q = 'chickpea curry'; st.diet = new Set([t.dataset.diet]); st.page = 1; render(true); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'sort') { st.sort = e.target.value; st.page = 1; render(); $('#sort').focus(); } });
render();
</script>
</body>
