function buildData() {

}
let D = buildData();
const ui = { kind: 'reply', draft: D.draft, error: false, after: 'Pending', focus: null };

/* ---------- helpers ---------- */
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MOL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayStart = (d) => Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
const dayDiff = (iso) => Math.round((dayStart(TODAY) - dayStart(new Date(iso))) / 864e5);
const hm = (d) => String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
const dShort = (iso) => { const d = new Date(iso); return WD[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MO[d.getUTCMonth()]; };
const dLong = (iso) => { const d = new Date(iso); return WDL[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MOL[d.getUTCMonth()]; };
function when(iso) {
  const d = new Date(iso), n = dayDiff(iso);
  const t = n === 0 ? 'Today' : n === 1 ? 'Yesterday' : dShort(iso);
  return t + ', ' + hm(d);
}
const money = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

const NAV = [
  { items: [ ['inbox', 'Inbox', 24, true], ['user', 'Assigned to me', 5], ['userplus', 'Unassigned', 7] ] },

  { title: 'Workspace', items: [ ['users', 'Customers'], ['box', 'Orders'], ['chart', 'Reports'], ['book', 'Help center'], ['sliders', 'Settings'] ] }
];
const LOGO = `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 9.5A2.5 2.5 0 0 1 10.5 7h7A2.5 2.5 0 0 1 20 9.5v5a2.5 2.5 0 0 1-2.5 2.5H14l-3.5 3v-3A2.5 2.5 0 0 1 8 14.5z" fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linejoin="round"/></svg><span>Harborline</span>`;
function navHTML() {
  return '<nav class="nav" aria-label="Main">' + NAV.map((g) => `<div>${g.title ? `<h3>${g.title}</h3>` : ''}<ul>` + g.items.map(([ic, label, count, cur]) =>
    `<li><a href="#"${cur ? ' aria-current="page"' : ''}>${ico(ic)}<span>${label}</span>${count != null ? `<span class="count">${count}<span class="sr-only"> conversations</span></span>` : ''}</a></li>`).join('') + '</ul></div>').join('') + '</nav>';
}
const accountHTML = () => `<div class="account"><span class="av" aria-hidden="true">${AGENT.initials}</span><div><b>${AGENT.name}</b><small>${AGENT.shop}</small></div></div>`;

/* derived facts */
const orderTotal = (o) => o.items.reduce((s, i) => s + i.qty * i.price, 0) + o.shipping;
const daysLate = (o) => Math.max(0, dayDiff(o.promised));
const dueMin = () => Math.round((new Date(D.replyDueAt) - TODAY) / 6e4);
const dueText = () => { const m = dueMin(); return m <= 0 ? 'Reply overdue by ' + Math.abs(m) + ' min' : 'Reply due in ' + (m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'); };

function headHTML() {

}

function msgHTML(m) {
  if (m.kind === 'event') return `<div class="event">${ico('check', 'sm')}<span>${esc(m.text)}</span><time datetime="${m.at}">${when(m.at)}</time></div>`;

  const name = cust ? D.customer.name : note ? m.who : AGENT.name;
  const ini = cust ? D.customer.initials : note ? m.initials : AGENT.initials;
  const role = cust ? '<span class="role">Customer</span>' : note ? `<span class="role note">${ico('lock', 'sm')}Internal note, only your team sees this</span>` : '<span class="role">Agent</span>';
  return `<article class="msg ${m.kind}"><span class="av ${cust ? 'cust' : ''}" aria-hidden="true">${esc(ini)}</span>

function messagesHTML() {
  let out = '', last = '';
  D.thread.forEach((m) => {
    const key = dayStart(new Date(m.at));
    if (key !== last) { const n = dayDiff(m.at); out += `<div class="day" role="separator"><span>${n === 0 ? 'Today' : n === 1 ? 'Yesterday' : dLong(m.at)}</span></div>`; last = key; }

  return `<h2 class="sr-only">Messages</h2><div class="messages">${out}</div>`;
}

function composerHTML() {

function railHTML() {

  <a class="back" href="#">${ico('left', 'sm')}Inbox</a>
  <h1 class="sr-only">Conversation 4821</h1>
  <div style="margin-top:12px;display:grid;gap:12px">${sk('min(560px,80%)', 32)}${sk('min(320px,60%)', 18)}${sk('180px', 22)}</div>
  <div class="body"><div class="thread"><div class="messages">${[0, 1, 2].map(() => `<div class="msg customer"><div class="sk av" style="border-radius:999px"></div><div style="display:grid;gap:8px">${sk('140px')}${sk('90%')}${sk('70%')}</div></div>`).join('')}</div></div>
  <aside class="rail" aria-hidden="true">${sk('120px', 20)}${sk('220px', 36)}${sk('100%', 120)}${sk('100%', 80)}</aside></div></div>`;
}
function errorView() {
  return `<a class="back" href="#">${ico('left', 'sm')}Inbox</a><div class="head"><div class="head-main"><h1>Conversation 4821</h1></div></div>
  <div style="margin-top:var(--rhythm-content);max-width:720px"><div class="banner" role="alert">${ico('alert')}<div class="t"><b>We could not load this conversation</b>The request to Harborline timed out. Your drafts and the customer's messages are safe. Try again in a moment.</div>
  <div style="display:flex;gap:8px"><button class="btn primary" type="button" onclick="location.reload()">Try again</button><a class="btn" href="#">Back to inbox</a></div></div></div>`;
}
function emptyView() {
  return `<a class="back" href="#">${ico('left', 'sm')}Inbox</a><div class="empty"><h1>This conversation is gone</h1>
  <p>Conversation 4821 was merged into 4803 by Tomasz Brandt on Thursday 26 November. Open the merged conversation to keep going.</p><a class="btn primary" href="#">Open conversation 4803</a></div>`;
}

/* ---------- render ---------- */
function render() {
  document.getElementById('side').innerHTML = `<div class="sidein"><a class="logo" href="#">${LOGO}</a>${navHTML()}${accountHTML()}</div>`;
  document.getElementById('logoTop').innerHTML = LOGO;
  document.getElementById('drawerLogo').innerHTML = `<span class="logo">${LOGO}</span>`;
  document.getElementById('drawerNav').innerHTML = navHTML() + '<div style="margin-top:24px">' + accountHTML() + '</div>';
  const main = document.getElementById('main');
  if (MODE === 'loading') main.innerHTML = skeleton();
  else if (MODE === 'error') main.innerHTML = errorView();
  else if (MODE === 'empty') main.innerHTML = emptyView();
  else {
    main.innerHTML = headHTML() + `<div class="body"><div class="thread">${messagesHTML()}${composerHTML()}</div>${railHTML()}</div>`;
    wire();
  }
  const ms = document.querySelector('.messages'); if (ms) ms.scrollTop = ms.scrollHeight;
  if (ui.focus) { const el = document.getElementById(ui.focus); if (el) el.focus({ preventScroll: true }); ui.focus = null; }
}

function wire() {
  const form = document.getElementById('composer');
  if (form) {
    form.querySelectorAll('input[name=kind]').forEach((r) => r.addEventListener('change', () => { ui.kind = r.value; ui.error = false; ui.focus = 'msg'; render(); }));
    form.msg.addEventListener('input', (e) => { ui.draft = e.target.value; });
    const after = document.getElementById('after');
    if (after) after.addEventListener('change', () => { ui.after = after.value; });
    document.getElementById('macro').addEventListener('change', (e) => {
      const t = { 'Late order apology': 'I am sorry your order has not arrived on the date we promised.', 'Ask for address': 'Could you reply with your full delivery address, including the flat number?', 'Offer refund': 'I can refund the order in full if you prefer.' }[e.target.value];
      if (t) { ui.draft = (ui.draft ? ui.draft.replace(/\s+$/, '') + '\n\n' : '') + t; ui.focus = 'msg'; render(); }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!ui.draft.trim()) { ui.error = true; ui.focus = 'msg'; render(); return; }
      const note = ui.kind === 'note';
      D.thread.push(note ? { kind: 'note', at: TODAY.toISOString(), who: AGENT.name, initials: AGENT.initials, text: ui.draft.trim() } : { kind: 'agent', at: TODAY.toISOString(), text: ui.draft.trim() });
      if (!note && ui.after !== 'Open') D.status = ui.after;
      ui.draft = ''; ui.error = false; ui.kind = 'reply'; ui.focus = 'msg';
      render();
    });
  }
  const resolve = document.getElementById('resolveBtn');
  if (resolve) resolve.addEventListener('click', () => { D.status = 'Resolved'; D.thread.push({ kind: 'event', at: TODAY.toISOString(), text: AGENT.name + ' resolved the conversation' }); ui.focus = 'reopenBtn'; render(); });
  const reopen = document.getElementById('reopenBtn');
  if (reopen) reopen.addEventListener('click', () => { D.status = 'Open'; D.thread = D.thread.filter((m) => !(m.kind === 'event' && /resolved/.test(m.text))); ui.focus = 'msg'; render(); });
  const copy = document.getElementById('copyBtn');
  if (copy) copy.addEventListener('click', () => { try { navigator.clipboard.writeText(D.order.tracking); } catch (e) {} copy.setAttribute('aria-label', 'Copied'); setTimeout(() => copy.setAttribute('aria-label', 'Copy tracking number ' + D.order.tracking), 1600); });
}
document.addEventListener('click', (e) => { document.querySelectorAll('details.menu[open]').forEach((m) => { if (!m.contains(e.target)) m.open = false; }); });

/* phone nav drawer */
const drawer = document.getElementById('drawer'), menuBtn = document.getElementById('menuBtn');
function setDrawer(open) { drawer.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); if (open) document.getElementById('closeBtn').focus(); else menuBtn.focus(); }
menuBtn.addEventListener('click', () => setDrawer(true));
document.getElementById('closeBtn').addEventListener('click', () => setDrawer(false));
drawer.addEventListener('click', (e) => { if (e.target === drawer) setDrawer(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!drawer.hidden) setDrawer(false); document.querySelectorAll('details.menu[open]').forEach((m) => { m.open = false; }); } });

render();
</script>
</body>
</html>
