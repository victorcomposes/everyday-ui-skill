<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock levels - Larderly</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;
  /* Ember kit */
  --accent: #c2410c; --accent-hover: #9a3412; --accent-subtle: #fdeee5; --on-accent: #ffffff;
  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --placeholder: #6b717d;
  --frame: #f7f7f8; --brand-deep: #1c1f26; --on-deep: #ffffff; --on-deep-muted: #b4b9c4; --accent-on-deep: #ff9a5c;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font);
  --text-xs: 12px; --lh-xs: 16px;
  --text-sm: 14px; --lh-sm: 20px;
  --text-md: 16px; --lh-md: 24px;
  --text-xl: 20px; --lh-xl: 28px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --rhythm-title: 12px; --rhythm-tight: 8px; --rhythm-content: 24px; --rhythm-group: 40px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-full: 999px;
  --control-h: 36px; --control-h-sm: 32px; --control-h-touch: 44px;
  --w-sidebar: 248px; --w-content: 1200px;
  --h-topbar: 56px; --h-row: 48px;
  --shadow-pop: 0 4px 16px rgb(16 24 40 / 0.12), 0 1px 3px rgb(16 24 40 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --t-fast: 120ms; --t-base: 160ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #ff9a5c; --accent-hover: #ffb88a; --accent-subtle: #36210f; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72; --danger-subtle: #2d1715;
    --placeholder: #8b919d;
    --frame: #17191d; --brand-deep: #0f1115; --on-deep: #e9ebef; --on-deep-muted: #a0a6b2;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5);
  }
}
@media (max-width: 640px), (pointer: coarse) { :root { --control-h: 44px; --control-h-sm: 44px; } }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 var(--text-sm)/var(--lh-sm) var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::placeholder { color: var(--placeholder); opacity: 1; }
h1 { font: 700 32px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 var(--text-xl)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
@media (max-width: 640px) { h1 { font-size: 28px; } }
.badge { display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 500; padding: 2px 8px; border-radius: var(--r-sm); }
.badge.out { background: var(--danger-subtle); color: var(--danger); }
.badge.low { background: var(--warning-subtle); color: var(--warning); }
.badge.order { background: var(--bg-subtle); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
.badge.ok { color: var(--text-muted); padding-left: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); z-index: 50; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4);
  background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

/* shell */
.shell { display: grid; grid-template-columns: var(--w-sidebar) minmax(0, 1fr); min-height: 100dvh; }
.shell > aside { background: var(--frame); border-right: 1px solid var(--border); }
.side { position: sticky; top: 0; height: 100dvh; overflow-y: auto; display: flex; flex-direction: column; padding: var(--s-5) var(--s-3) var(--s-4); }
.brand { display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-2); margin-bottom: var(--s-6); font: 700 18px/1 var(--font-display); letter-spacing: -0.02em; }
.nav { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.nav + .nav { margin-top: var(--s-5); }
.nav a { display: flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-2); border-radius: var(--r-md); color: var(--text); }
.nav a svg { color: var(--text-muted); flex-shrink: 0; }
.nav a:hover { background: var(--bg-subtle); }
.nav a[aria-current="page"] { background: var(--accent-subtle); font-weight: 500; }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; color: var(--text-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.account { margin-top: auto; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-2) 0; border-top: 1px solid var(--border); }
.avatar { width: 32px; height: 32px; border-radius: var(--r-full); background: var(--accent-subtle); color: var(--accent); display: grid; place-items: center; font-size: var(--text-xs); font-weight: 600; flex-shrink: 0; }
.account b { display: block; font-weight: 500; }
.account div span { display: block; color: var(--text-muted); font-size: var(--text-xs); line-height: var(--lh-xs); }
.topbar { display: none; }
main { padding: var(--s-8) var(--s-8) var(--s-12); min-width: 0; }
.page { max-width: var(--w-content); margin: 0 auto; }

/* header */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-4); }
.head p { margin-top: var(--rhythm-title); color: var(--text-muted); }
.actions { display: flex; align-items: center; gap: var(--s-3); flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--control-h); padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap; transition: background var(--t-fast) var(--ease); }
.btn:hover { background: var(--bg-subtle); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* key numbers */
.stats { display: flex; align-items: flex-start; gap: var(--s-10); margin-top: var(--rhythm-content); padding-bottom: var(--rhythm-content); border-bottom: 1px solid var(--border); }
.stat dt { color: var(--text-muted); font-weight: 500; }
.stat dd { margin: 0; font: 600 20px/1.2 var(--font-display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin-top: var(--s-1); }
.stat.key dd { font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; }
.stat dd small { font: 400 var(--text-sm)/var(--lh-sm) var(--font); color: var(--text-muted); letter-spacing: 0; }
.stat + .stat { padding-left: var(--s-10); border-left: 1px solid var(--border); }
.stat.key + .stat { }

/* notice */
.banner { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--rhythm-content); padding: var(--s-3) var(--s-4); border-radius: var(--r-lg); background: var(--success-subtle); border: 1px solid color-mix(in srgb, var(--success) 30%, transparent); }
.banner.warn { background: var(--warning-subtle); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
.banner svg { color: var(--success); flex-shrink: 0; }
.banner.warn svg { color: var(--warning); }
.banner p { flex: 1; min-width: 0; }
.banner b { font-weight: 600; }

/* tabs and toolbar */
.tabs { display: flex; gap: var(--s-1); margin-top: var(--rhythm-content); overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: var(--s-2); min-height: var(--control-h); padding: 0 var(--s-3); border: 0; border-radius: var(--r-md); background: none; color: var(--text-muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--bg-subtle); color: var(--text); }
.tab[aria-pressed="true"] { background: var(--accent-subtle); color: var(--text); }
.tab span { font-variant-numeric: tabular-nums; font-weight: 400; color: var(--text-muted); }
.toolbar { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-3); }
.field { height: var(--control-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); padding: 0 var(--s-3); }
.search { position: relative; width: 300px; }
.search svg { position: absolute; left: var(--s-3); top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.search input { width: 100%; padding-left: 36px; }
.toolbar .meta { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* table */
.table-wrap { margin-top: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: clip; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 2; background: var(--bg-subtle); text-align: left; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); padding: 11px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { height: var(--h-row); padding: 0 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg-subtle); }
tbody tr.sel { background: var(--accent-subtle); }
.num { text-align: right; }
th.chk, td.chk { width: 40px; padding: 0 0 0 var(--s-3); }
td.chk label, th.chk label { display: grid; place-items: center; width: 24px; height: 24px; cursor: pointer; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.name a { font-weight: 500; }
.name a:hover { text-decoration: underline; text-underline-offset: 2px; }
.trunc { display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.supplier .trunc { max-width: 150px; }
.muted { color: var(--text-muted); }
.dash { color: var(--text-muted); }
.bar { position: relative; display: block; width: 88px; height: 8px; border-radius: var(--r-full); background: var(--border); }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-full); background: var(--text-muted); }
.bar.low i { background: var(--warning); }
.bar.out i { background: var(--danger); }
.bar b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
.lvl-text { display: none; }
.unit { color: var(--text-muted); }

/* states */
.state { padding: var(--s-12) var(--s-6); text-align: center; display: grid; justify-items: center; gap: var(--s-2); }
.state h2 { font-size: var(--text-xl); }
.state p { color: var(--text-muted); max-width: 44ch; }
.state .btn { margin-top: var(--s-3); }
.state .link { display: inline-flex; align-items: center; min-height: 44px; }
.state .art { margin-bottom: var(--s-3); }
.skel { display: block; height: 12px; border-radius: var(--r-sm); background: var(--border); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.foot { margin-top: var(--s-3); color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* tablet and phone */
@media (max-width: 1279px) and (min-width: 641px) { th.cat, td.cat { display: none; } }
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .shell > aside { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(300px, 86vw); transform: translateX(-100%); visibility: hidden; transition: transform var(--t-base) var(--ease), visibility 0s linear var(--t-base); box-shadow: var(--shadow-pop); }
  .shell > aside.open { transform: none; visibility: visible; transition-delay: 0s; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgb(16 24 40 / 0.45); }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: var(--h-topbar); padding: 0 var(--s-4); background: var(--frame); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .topbar .brand { margin: 0; padding: 0; min-height: 44px; }
  .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; border-radius: var(--r-md); cursor: pointer; margin-right: -10px; }
  main { padding: var(--s-6) var(--s-4) var(--s-12); }
  .nav a { min-height: 44px; }
}
@media (max-width: 640px) {
  .head { align-items: flex-start; }
  .head p { margin-top: 8px; }
  .btn.primary .long { display: none; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4) var(--s-3); }
  .stat.key { grid-column: 1 / -1; }
  .stat + .stat { padding-left: 0; border-left: 0; }
  .stat dd small { display: block; }
  .tabs { margin-right: calc(var(--s-4) * -1); padding-right: var(--s-4); }
  .tab { padding: 0 10px; min-height: 44px; }
  .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
  .search { grid-column: 1 / -1; width: auto; }
  .toolbar .meta { grid-column: 1 / -1; margin-left: 0; }
  .toolbar .link { justify-self: start; min-height: 44px; }
  .field { font-size: 16px; min-width: 0; }
  .table-wrap { border: 0; border-radius: 0; margin-top: var(--s-3); border-top: 1px solid var(--border); }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--s-3); padding: var(--s-2) 0 var(--s-3); border-bottom: 1px solid var(--border); align-items: center; }
  tbody tr:hover { background: none; }
  tr.sel { background: var(--accent-subtle); }
  td { height: auto; border: 0; padding: 0; white-space: normal; }
  tbody tr:last-child td { border-bottom: 0; }
  td.chk { grid-row: 1 / span 4; grid-column: 1; align-self: start; width: auto; }
  td.chk label { width: 44px; height: 44px; }
  td.name { grid-column: 2; grid-row: 1; display: flex; align-items: center; }
  td.status { grid-column: 3; grid-row: 1; text-align: right; }
  td.status .badge { float: right; }
  td.level { grid-column: 2 / -1; grid-row: 2; display: flex; align-items: center; gap: var(--s-3); margin: 4px 0 var(--s-2); }
  td.level .bar { flex: 0 0 96px; width: 96px; }
  .lvl-text { display: inline; }
  td.onhand, td.par { display: none; }
  td.days { grid-column: 2; grid-row: 3; text-align: left; color: var(--text-muted); }
  td.days::after { content: " left"; }
  td.supplier { grid-column: 3; grid-row: 3; text-align: left; color: var(--text-muted); }
  td.qty { grid-column: 2; grid-row: 4; text-align: left; margin-top: 2px; }
  td.qty::before { content: "Order "; color: var(--text-muted); }
  td.qty.none { display: none; }
  td.cat { grid-column: 3; grid-row: 4; text-align: right; font-size: var(--text-xs); line-height: var(--lh-xs); }
  .trunc, .supplier .trunc { max-width: none; }
  .name .trunc { white-space: normal; }
  td.name a { display: flex; align-items: center; min-height: 44px; min-width: 44px; line-height: 20px; }
  .state { padding: var(--s-10) var(--s-4); }
}
</style>
</head>

        <span>Larderly</span>
      </a>
      <ul class="nav">
        <li><a href="#main" aria-current="page"><svg width="20" height="20"><use href="#i-stock"/></svg>Stock levels</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-count"/></svg>Stock counts</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-orders"/></svg>Orders</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-truck"/></svg>Deliveries</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-store"/></svg>Suppliers</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-recipe"/></svg>Recipes</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-waste"/></svg>Waste log</a></li>
      </ul>
      <ul class="nav">
        <li><a href="#main"><svg width="20" height="20"><use href="#i-report"/></svg>Reports</a></li>
        <li><a href="#main"><svg width="20" height="20"><use href="#i-settings"/></svg>Settings</a></li>
      </ul>
      <div class="account">
        <span class="avatar" aria-hidden="true">PR</span>
        <div><b>Priya Raman</b><span>Marlow Street Kitchen</span></div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div>
    <header class="topbar">
      <a class="brand" href="#main" aria-label="Larderly home">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><rect x="7.5" y="5.5" width="5" height="6" rx="1.5" fill="var(--on-accent)"/><rect x="15" y="13.5" width="5.5" height="5" rx="1.5" fill="var(--on-accent)"/><path d="M6 12.5h16M6 20.5h16" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Larderly</span>
      </a>
      <button class="icon-btn" id="menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg width="22" height="22" aria-hidden="true"><use href="#i-menu"/></svg></button>
    </header>

    <main id="main">
      <div class="page">
        <div class="head">
          <div>
            <h1>Stock levels</h1>
            <p id="subtitle"></p>
          </div>
          <div class="actions" id="actions">
            <button class="btn primary" id="reorder" type="button"></button>
          </div>
        </div>

        <dl class="stats" id="stats" aria-label="Summary"></dl>
        <div id="notice" role="status"></div>

        <div id="controls">
          <div class="tabs" id="tabs" role="group" aria-label="Show ingredients"></div>
          <div class="toolbar">
            <div class="search">
              <svg width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
              <label class="sr-only" for="q">Search ingredients</label>
              <input class="field" id="q" type="search" placeholder="Search ingredients" autocomplete="off">
            </div>
            <label class="sr-only" for="cat">Category</label>
            <select class="field" id="cat"></select>
            <label class="sr-only" for="sup">Supplier</label>
            <select class="field" id="sup"></select>
            <button class="link" id="clear" type="button" hidden>Clear filters</button>
            <span class="meta" id="shown"></span>
          </div>
        </div>

        <div class="table-wrap" id="tablewrap"></div>
        <p class="foot" id="foot"></p>
      </div>
    </main>
  </div>
</div>

<script>
const TODAY = new Date(2026, 10, 27, 8, 0);
const params = new URLSearchParams(location.search);
const STATE = params.get('state') || '';

// name, category, unit, onHand, par, use per day, pack size, unit cost (GBP), supplier, onOrder days (or null)
const SUPPLIERS = {
  hartley: { name: 'Hartley Produce', lead: 1 },
  marlow: { name: 'Marlow Dairy Co.', lead: 1 },
  brine: { name: 'Brine & Tide Fishmongers', lead: 1 },
  fenwick: { name: 'Fenwick Butchers', lead: 1 },
  alder: { name: 'Alder Dry Goods', lead: 3 },
  tollgate: { name: 'Tollgate Wholesale', lead: 3 },
};
const RAW = [
  ['Fresh basil', 'Produce', 'bunches', 0, 6, 1.5, 6, 1.10, 'hartley'],
  ['Flat-leaf parsley', 'Produce', 'bunches', 3, 8, 2, 4, 0.90, 'hartley'],
  ['Lemons', 'Produce', 'each', 18, 40, 12, 20, 0.28, 'hartley'],
  ['Red onions', 'Produce', 'kg', 14, 10, 2.1, 5, 1.35, 'hartley'],
  ['Garlic', 'Produce', 'kg', 2.4, 2, 0.3, 1, 6.20, 'hartley'],
  ['Baby spinach', 'Produce', 'kg', 3.5, 3, 0.8, 1, 8.40, 'hartley'],
  ['Plum tomatoes', 'Produce', 'kg', 12, 10, 3.2, 6, 2.60, 'hartley'],
  ['Chestnut mushrooms', 'Produce', 'kg', 4, 3, 1, 2, 5.90, 'hartley'],
  ['Courgettes', 'Produce', 'kg', 6.5, 5, 1.4, 5, 2.10, 'hartley'],
  ['Whole milk', 'Dairy', 'L', 14, 30, 9, 12, 0.95, 'marlow'],
  ['Double cream', 'Dairy', 'L', 8, 6, 1.5, 2, 3.80, 'marlow'],
  ['Unsalted butter', 'Dairy', 'kg', 7, 5, 0.9, 1, 8.20, 'marlow'],
  ['Free-range eggs', 'Dairy', 'doz', 9, 8, 2.4, 6, 3.10, 'marlow'],
  ['Halloumi', 'Dairy', 'kg', 0, 3, 0.6, 2, 9.80, 'marlow'],
  ['Parmesan', 'Dairy', 'kg', 2.2, 1.5, 0.2, 1, 19.50, 'marlow'],
  ['Sea bass fillets', 'Fish and meat', 'kg', 3, 8, 2.4, 2, 17.50, 'brine'],
  ['Salmon fillets', 'Fish and meat', 'kg', 9.5, 8, 2.2, 2, 14.20, 'brine'],
  ['Chicken thighs', 'Fish and meat', 'kg', 6, 20, 5.5, 5, 5.40, 'fenwick'],
  ['Beef shin', 'Fish and meat', 'kg', 12, 10, 2, 4, 9.60, 'fenwick'],
  ['Pork belly', 'Fish and meat', 'kg', 11, 8, 1.8, 4, 7.30, 'fenwick'],
  ['Arborio rice', 'Dry goods', 'kg', 4, 10, 1.2, 5, 3.40, 'alder', 3],
  ['Plain flour', 'Dry goods', 'kg', 18, 15, 2.5, 8, 0.90, 'alder'],
  ['Spaghetti', 'Dry goods', 'kg', 12, 8, 1.1, 3, 1.80, 'alder'],
  ['Chickpeas, tinned', 'Dry goods', 'tins', 36, 24, 4, 12, 0.62, 'alder'],
  ['Caster sugar', 'Dry goods', 'kg', 7, 5, 0.6, 5, 1.25, 'alder'],
  ['Extra virgin olive oil', 'Seasoning', 'L', 5, 15, 2.2, 5, 8.90, 'tollgate', 3],
  ['Rapeseed oil', 'Seasoning', 'L', 20, 15, 3, 5, 2.40, 'tollgate'],
  ['Sea salt flakes', 'Seasoning', 'kg', 3, 2, 0.1, 1, 4.10, 'tollgate'],
];
if (STATE === 'stress') {
  RAW.push(
    ['Gloucestershire Old Spot pork shoulder, bone-in, dry-cured by hand and rested for 21 days', 'Fish and meat', 'kg', 0.4, 12, 1.1, 6, 11.75, 'fenwick'],
    ['Saffron threads, Spanish grade 1', 'Seasoning', 'g', 9, 60, 3, 25, 12400.50 / 25, null],
    ['Tinned plum tomatoes (catering tins)', 'Dry goods', 'tins', 12480, 24, 4, 12, 0.62, 'alder'],
  );
}

const rows = (STATE === 'empty' ? [] : RAW).map((r, i) => {
  const [name, cat, unit, onHand, par, use, pack, cost, sup, due] = r;
  return { id: i, name, cat, unit, onHand, par, use, pack, cost, sup: sup ? SUPPLIERS[sup] : null,
    eta: due ? addDays(TODAY, due) : null };
});

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const nf = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 1 });
const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const dayFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;

const statusOf = (r) => r.eta ? 'order' : r.onHand === 0 ? 'out' : r.onHand < r.par ? 'low' : 'ok';
const daysLeft = (r) => Math.floor(r.onHand / r.use);
const packs = (r) => Math.max(1, Math.ceil((r.par * 2 - r.onHand) / r.pack));
const orderQty = (r) => packs(r) * r.pack;
const orderCost = (r) => orderQty(r) * r.cost;
const needs = (r) => ['out', 'low'].includes(statusOf(r));
const RANK = { out: 0, low: 1, order: 2, ok: 3 };
const sorted = () => [...rows].sort((a, b) => RANK[statusOf(a)] - RANK[statusOf(b)] || daysLeft(a) - daysLeft(b) || a.name.localeCompare(b.name));

const view = { tab: 'all', q: '', cat: '', sup: '' };
let selected = new Set(rows.filter(needs).map((r) => r.id));
let lastOrder = null; // for undo
let notice = null;

const $ = (id) => document.getElementById(id);
const TABS = [
  ['all', 'All', () => true],
  ['need', 'To reorder', needs],
  ['order', 'On order', (r) => statusOf(r) === 'order'],
  ['ok', 'OK', (r) => statusOf(r) === 'ok'],
];

function visible() {
  const t = TABS.find((x) => x[0] === view.tab)[2];
  const q = view.q.trim().toLowerCase();
  return sorted().filter((r) => t(r)
    && (!view.cat || r.cat === view.cat)
    && (!view.sup || (r.sup && r.sup.name === view.sup))
    && (!q || r.name.toLowerCase().includes(q)));
}

function renderHead() {
  const to = rows.filter(needs), out = rows.filter((r) => statusOf(r) === 'out'), on = rows.filter((r) => statusOf(r) === 'order');
  const cost = to.reduce((s, r) => s + orderCost(r), 0);
  const firstEta = on.length ? dayFmt.format(on.map((r) => r.eta).sort((a, b) => a - b)[0]) : '';
  $('subtitle').textContent = rows.length
    ? `${nf.format(rows.length)} ingredients. Last counted today at 07:40.` : 'Track what is on the shelf and what to reorder.';
  const hasData = rows.length > 0 && STATE !== 'error' && STATE !== 'loading';
  $('stats').hidden = !hasData;
  $('actions').hidden = !hasData;
  $('controls').hidden = !(hasData || STATE === 'loading');
  $('stats').innerHTML = `
    <div class="stat key"><dt>To reorder</dt><dd>${to.length} <small>${to.length === 1 ? 'ingredient' : 'ingredients'} below par</small></dd></div>
    <div class="stat"><dt>Out of stock</dt><dd>${out.length}</dd></div>
    <div class="stat"><dt>On order</dt><dd>${on.length}${on.length ? ` <small>from ${firstEta}</small>` : ''}</dd></div>
    <div class="stat"><dt>Reorder cost, est.</dt><dd>${gbp.format(cost)}</dd></div>`;
  const n = selected.size;
  $('reorder').innerHTML = n ? `Reorder ${n}<span class="long"> selected</span>` : 'Reorder selected';
}

function renderTabs() {
  $('tabs').innerHTML = TABS.map(([k, label, f]) =>
    `<button class="tab" type="button" data-tab="${k}" aria-pressed="${view.tab === k}">${label} <span>${rows.filter(f).length}</span></button>`).join('');
}

function bar(r) {
  const s = statusOf(r);
  const pct = Math.min(100, (r.onHand / (r.par * 2)) * 100);
  const cls = s === 'out' ? 'out' : s === 'low' ? 'low' : '';
  return `<span class="bar ${cls}" role="img" aria-label="${nf.format(r.onHand)} on hand, par ${nf.format(r.par)}"><i style="width:${pct}%"></i><b></b></span>`;
}
function badge(r) {
  const s = statusOf(r);
  if (s === 'out') return '<span class="badge out">Out of stock</span>';
  if (s === 'low') return '<span class="badge low">Low</span>';
  if (s === 'order') return `<span class="badge order">Due ${dayFmt.format(r.eta)}</span>`;
  return '<span class="badge ok">OK</span>';
}
const dash = '<span class="dash" aria-label="None">–</span>';

function rowHtml(r) {
  const s = statusOf(r);
  const d = daysLeft(r);
  const checked = selected.has(r.id);
  const showQty = needs(r) || checked;
  return `<tr class="${checked ? 'sel' : ''}">
    <td class="chk"><label><input type="checkbox" data-id="${r.id}" ${checked ? 'checked' : ''} aria-label="Select ${esc(r.name)}"></label></td>
    <td class="name"><a class="trunc" href="#ingredient-${r.id}" title="${esc(r.name)}">${esc(r.name)}</a></td>
    <td class="cat muted">${esc(r.cat)}</td>
    <td class="status">${badge(r)}</td>
    <td class="level">${bar(r)}<span class="lvl-text muted">${nf.format(r.onHand)} of ${nf.format(r.par)} ${esc(r.unit)}</span></td>
    <td class="num onhand">${nf.format(r.onHand)} <span class="unit">${esc(r.unit)}</span></td>
    <td class="num par">${nf.format(r.par)} <span class="unit">${esc(r.unit)}</span></td>
    <td class="num days">${plural(d, 'day', 'days')}</td>
    <td class="supplier">${r.sup ? `<span class="trunc" title="${esc(r.sup.name)}">${esc(r.sup.name)}</span>` : dash}</td>
    <td class="num qty ${showQty ? '' : 'none'}">${showQty ? `${nf.format(orderQty(r))} <span class="unit">${esc(r.unit)}</span>` : dash}</td>
  </tr>`;
}

const HEAD = `<thead><tr>
  <th class="chk"><label><input type="checkbox" id="all" aria-label="Select all shown ingredients"></label></th>
  <th>Ingredient</th><th class="cat">Category</th><th>Status</th><th>Stock level</th>
  <th class="num">On hand</th><th class="num">Par</th><th class="num">Days left</th><th>Supplier</th><th class="num">Order qty</th>
</tr></thead>`;

function stateBlock(kind) {
  const art = `<svg class="art" width="120" height="72" viewBox="0 0 120 72" aria-hidden="true"><rect x="8" y="8" width="104" height="22" rx="6" fill="var(--bg-subtle)" stroke="var(--border)"/><rect x="18" y="16" width="36" height="6" rx="3" fill="var(--border)"/><rect x="8" y="40" width="104" height="22" rx="6" fill="var(--accent-subtle)" stroke="var(--border)"/><rect x="18" y="48" width="24" height="6" rx="3" fill="var(--accent)"/><rect x="86" y="48" width="16" height="6" rx="3" fill="var(--border)"/></svg>`;
  if (kind === 'empty') return `<div class="state">${art}<h2>No ingredients yet</h2><p>Add what you keep in the kitchen and set a par level for each. Larderly flags the ones running low.</p><button class="btn primary" type="button">Add your first ingredient</button><button class="link" type="button">Import from a spreadsheet</button></div>`;
  if (kind === 'none') return `<div class="state"><h2>No ingredients match these filters</h2><p>Try a different search, or clear the filters to see all ${rows.length} ingredients.</p><button class="btn" type="button" data-clear>Clear filters</button></div>`;
  if (kind === 'error') return `<div class="state"><h2>Stock levels did not load</h2><p>We could not reach the server. Your counts are safe. Check your connection and try again.</p><button class="btn primary" type="button" data-retry>Try again</button></div>`;
  return '';
}

function renderTable() {
  const wrap = $('tablewrap');
  if (STATE === 'loading') {
    wrap.innerHTML = `<table aria-busy="true">${HEAD}<tbody>${Array.from({ length: 9 }, () =>
      `<tr><td class="chk"></td><td><span class="skel" style="width:140px"></span></td><td><span class="skel" style="width:80px"></span></td><td><span class="skel" style="width:70px"></span></td><td><span class="skel" style="width:104px"></span></td><td></td><td></td><td></td><td><span class="skel" style="width:110px"></span></td><td></td></tr>`).join('')}</tbody></table>`;
    $('foot').textContent = ''; $('shown').textContent = ''; return;
  }
  if (STATE === 'error') { wrap.innerHTML = stateBlock('error'); $('foot').textContent = ''; return; }
  if (!rows.length) { wrap.innerHTML = stateBlock('empty'); $('foot').textContent = ''; $('controls').hidden = true; return; }
  const list = visible();
  const filtered = view.tab !== 'all' || view.cat || view.sup || view.q;
  $('clear').hidden = !(view.cat || view.sup || view.q || view.tab !== 'all');
  $('shown').textContent = `Showing ${list.length} of ${rows.length}`;
  $('foot').textContent = `${list.length} of ${rows.length} ingredients shown. Par is the level at which you reorder. Order quantity refills to twice par, in whole packs.`;
  if (!list.length) { wrap.innerHTML = `<table>${HEAD}</table>${stateBlock('none')}`; wrap.querySelector('table').querySelector('thead').insertAdjacentHTML('afterend', ''); }
  else wrap.innerHTML = `<table>${HEAD}<tbody>${list.map(rowHtml).join('')}</tbody></table>`;
  const all = $('all');
  if (all) {
    const on = list.filter((r) => selected.has(r.id)).length;
    all.checked = list.length > 0 && on === list.length;
    all.indeterminate = on > 0 && on < list.length;
  }
}

function renderNotice() {
  const el = $('notice');
  if (!notice) { el.innerHTML = ''; return; }
  const cls = notice.warn ? 'banner warn' : 'banner';
  el.innerHTML = `<div class="${cls}"><svg width="20" height="20" aria-hidden="true"><use href="#${notice.warn ? 'i-alert' : 'i-check'}"/></svg><p>${notice.html}</p>${notice.undo ? '<button class="link" type="button" id="undo">Undo</button>' : ''}</div>`;
}

function renderAll() { renderHead(); renderTabs(); renderTable(); renderNotice(); }

function setupFilters() {
  const cats = [...new Set(rows.map((r) => r.cat))];
  const sups = [...new Set(rows.filter((r) => r.sup).map((r) => r.sup.name))];
  $('cat').innerHTML = '<option value="">All categories</option>' + cats.map((c) => `<option>${esc(c)}</option>`).join('');
  $('sup').innerHTML = '<option value="">All suppliers</option>' + sups.map((c) => `<option>${esc(c)}</option>`).join('');
}

function placeOrder() {
  const picked = rows.filter((r) => selected.has(r.id));
  if (!picked.length) { notice = { warn: true, html: 'Select at least one ingredient to reorder. Tick the rows you want, then try again.' }; renderNotice(); return; }
  const bySup = new Map();
  picked.forEach((r) => { const k = r.sup ? r.sup.name : 'No supplier set'; bySup.set(k, (bySup.get(k) || 0) + 1); });
  const total = picked.reduce((s, r) => s + orderCost(r), 0);
  const first = addDays(TODAY, Math.min(...picked.map((r) => (r.sup ? r.sup.lead : 3))));
  lastOrder = picked.map((r) => ({ id: r.id, eta: r.eta }));
  picked.forEach((r) => { r.eta = addDays(TODAY, r.sup ? r.sup.lead : 3); });
  selected = new Set();
  notice = { undo: true, html: `<b>${picked.length} ${picked.length === 1 ? 'ingredient' : 'ingredients'} ordered</b> from ${bySup.size} ${bySup.size === 1 ? 'supplier' : 'suppliers'}, about ${gbp.format(total)}. First delivery ${dayFmt.format(first)}.` };
  renderAll();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.id === 'reorder') placeOrder();
  else if (t.dataset.tab) { view.tab = t.dataset.tab; renderTabs(); renderTable(); }
  else if (t.id === 'clear' || 'clear' in t.dataset) { view.tab = 'all'; view.q = view.cat = view.sup = ''; $('q').value = ''; $('cat').value = ''; $('sup').value = ''; renderTabs(); renderTable(); }
  else if (t.id === 'undo' && lastOrder) {
    lastOrder.forEach((o) => { const r = rows.find((x) => x.id === o.id); r.eta = o.eta; selected.add(r.id); });
    lastOrder = null; notice = null; renderAll();
  } else if ('retry' in t.dataset) { params.delete('state'); location.search = params.toString(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'all') { visible().forEach((r) => (t.checked ? selected.add(r.id) : selected.delete(r.id))); notice = null; renderAll(); }
  else if (t.matches('input[data-id]')) { const id = +t.dataset.id; t.checked ? selected.add(id) : selected.delete(id); notice = null; renderAll(); }
  else if (t.id === 'cat') { view.cat = t.value; renderTable(); }
  else if (t.id === 'sup') { view.sup = t.value; renderTable(); }
});
$('q').addEventListener('input', (e) => { view.q = e.target.value; renderTable(); });

// phone menu
const side = $('side'), scrim = $('scrim'), menu = $('menu');
function setMenu(open) { side.classList.toggle('open', open); scrim.hidden = !open; menu.setAttribute('aria-expanded', open); menu.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); }
menu.addEventListener('click', () => setMenu(!side.classList.contains('open')));
scrim.addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
const mq = matchMedia('(max-width: 1023px)');
function syncInert() { if (mq.matches && !side.classList.contains('open')) side.setAttribute('inert', ''); else side.removeAttribute('inert'); }
mq.addEventListener('change', syncInert);
new MutationObserver(syncInert).observe(side, { attributes: true, attributeFilter: ['class'] });
syncInert();

setupFilters();
renderAll();
</script>
</body>
</html>
