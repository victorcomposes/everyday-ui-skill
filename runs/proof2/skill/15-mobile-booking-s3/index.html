<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a check-up - Fernlea</title>
<style>
/* Fern kit, soft shape, system font stack (no network allowed) */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;
  --accent: #0b7671; --accent-hover: #085f5b; --accent-subtle: #e6f4f3; --on-accent: #ffffff;
  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --placeholder: #6b717d;
  --frame: #f1f8f7;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font);
  --text-xs: 12px;  --text-sm: 14px;  --text-md: 16px;  --text-lg: 18px;  --text-xl: 20px;  --text-3xl: 30px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --rhythm-title: 12px; --rhythm-tight: 8px; --rhythm-content: 24px; --rhythm-group: 40px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;
  --control-h-touch: 44px;
  --w-phone: 430px; --h-topbar: 56px;
  --shadow-pop: 0 4px 16px rgb(16 24 40 / 0.12), 0 1px 3px rgb(16 24 40 / 0.08);
  --shadow-dialog: 0 16px 48px rgb(16 24 40 / 0.18);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --t-fast: 120ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #4fc7bd; --accent-hover: #7dd8d0; --accent-subtle: #0f2e2c; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72;  --danger-subtle: #2d1715;
    --placeholder: #8b919d;
    --frame: #111d1c;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5); --shadow-dialog: 0 16px 48px rgb(0 0 0 / 0.6);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-bottom: 112px; scroll-padding-top: 72px; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 var(--text-md)/24px var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font: 700 var(--text-3xl)/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 700 var(--text-xl)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); z-index: 30; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4);
  background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

/* phone column; centred on a tinted page at desktop width */
.app { position: relative; display: flex; flex-direction: column; min-height: 100dvh; background: var(--surface); }
@media (min-width: 641px) {
  body { background: var(--bg-subtle); padding: var(--s-6) 0; }
  .app { width: var(--w-phone); margin: 0 auto; min-height: calc(100dvh - 48px);
    border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); overflow: clip; }
}

/* top bar: frame tint, brand moment */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--s-1);
  height: var(--h-topbar); padding: 0 var(--s-2); background: var(--frame); border-bottom: 1px solid var(--border); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none;
  border: 0; border-radius: var(--r-full); background: transparent; color: var(--text); cursor: pointer; }
.icon-btn:hover { background: var(--accent-subtle); }
.icon-btn.accent { color: var(--accent); }
.brand { display: flex; align-items: center; gap: var(--s-2); flex: 1; min-width: 0; font: 700 var(--text-lg)/1 var(--font-display); letter-spacing: -0.01em; }
svg { display: block; }
.ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { flex: 1; display: flex; flex-direction: column; }
form { flex: 1; display: flex; flex-direction: column; }
.content { flex: 1; padding: var(--s-5) var(--s-4) var(--rhythm-group); }
.head p { margin-top: var(--rhythm-title); color: var(--text-muted); font-size: var(--text-md); }
section { margin-top: var(--rhythm-group); }
.head + section { margin-top: var(--rhythm-content); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-3); }
.sec-head:has(.weeknav) { min-height: 44px; margin-bottom: var(--s-2); }
.intro { color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }
.intro strong { color: var(--text); font-weight: 600; }
section > .intro { margin-top: calc(-1 * var(--s-1)); margin-bottom: var(--s-4); }

/* radio faces: real inputs, drawn labels */
.pick { position: relative; display: block; }
.pick > input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.pick > input:disabled { cursor: default; }
.pick > input:focus-visible + .face { outline: 2px solid var(--focus); outline-offset: 2px; }

/* dentists: one grouped list */
.list { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: clip; }
.list .pick + .pick { border-top: 1px solid var(--border); }
.dentist { display: grid; grid-template-columns: 44px minmax(0, 1fr) 24px; gap: var(--s-3); align-items: center; padding: 10px var(--s-4); }
.list .pick > input:focus-visible + .face { outline-offset: -2px; }
.avatar { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-full);
  background: var(--accent-subtle); color: var(--accent); font-weight: 700; font-size: var(--text-sm); }
.dentist .name { font-weight: 600; line-height: 22px; }
.dentist .role { color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }
.dentist .next { margin-top: 2px; color: var(--accent); font-size: var(--text-sm); font-weight: 600; line-height: 20px; }
.dot { width: 24px; height: 24px; border: 2px solid var(--border-strong); border-radius: var(--r-full); display: grid; place-items: center; color: var(--on-accent); }
.dot svg { opacity: 0; }
.pick > input:checked + .dentist { background: var(--accent-subtle); }
.pick > input:checked + .dentist .avatar { background: var(--surface); }
.pick > input:checked + .dentist .dot { background: var(--accent); border-color: var(--accent); }
.pick > input:checked + .dentist .dot svg { opacity: 1; }

/* day strip: appointment blocks per day */
.weeknav { display: flex; align-items: center; gap: 0; margin-right: -10px; }
.weeknav output { font-size: var(--text-sm); color: var(--text-muted); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; }
.weeknav .icon-btn:disabled { color: var(--text-muted); opacity: .45; cursor: default; background: transparent; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--s-1); }
.day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 76px; padding: 0 2px;
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.day .wd { font-size: var(--text-xs); line-height: 16px; color: var(--text-muted); font-weight: 500; }
.day .n { font: 700 var(--text-lg)/24px var(--font-display); font-variant-numeric: tabular-nums; }
.day .meter { width: 22px; height: 4px; margin-top: 2px; border-radius: var(--r-full); background: var(--border); overflow: hidden; }
.day .meter i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-full); }
.day .tag { margin-top: 2px; font-size: var(--text-xs); line-height: 16px; color: var(--text-muted); }
.pick > input:checked + .day { border: 2px solid var(--accent); background: var(--accent-subtle); }
.pick > input:checked + .day .n, .pick > input:checked + .day .wd { color: var(--accent); }
.pick > input:disabled + .day { background: var(--bg-subtle); border-color: transparent; }
.pick > input:disabled + .day .n { color: var(--text-muted); font-weight: 500; }
.pick:has(> input:not(:disabled):not(:checked):hover) .day { background: var(--accent-subtle); }

/* time slots */
.group-label { margin: var(--s-4) 0 var(--s-2); font-size: var(--text-sm); font-weight: 500; color: var(--text-muted); }
.group-label:first-child { margin-top: 0; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.slot { display: flex; align-items: center; justify-content: center; height: 48px; border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.pick > input:checked + .slot { background: var(--accent-subtle); border: 2px solid var(--accent); color: var(--accent); }
.pick > input:disabled + .slot { background: var(--bg-subtle); border-color: transparent; color: var(--text-muted); font-weight: 400; text-decoration: line-through; }
.pick:has(> input:not(:disabled):not(:checked):hover) .slot { background: var(--accent-subtle); }
.err { display: flex; gap: var(--s-2); align-items: flex-start; margin-bottom: var(--s-4); padding: var(--s-3);
  border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); border-radius: var(--r-md); background: var(--danger-subtle); color: var(--danger); font-size: var(--text-sm); font-weight: 500; line-height: 20px; }
.err svg { flex: none; margin-top: 1px; }
.err:focus { outline: none; }
.slots-wrap.is-error .slot { border-color: var(--danger); }

/* empty day */
.empty { padding: var(--s-6) var(--s-4); border: 1px dashed var(--border-strong); border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-3); }
.empty .t { font: 700 var(--text-lg)/24px var(--font-display); letter-spacing: -0.01em; }
.empty p { color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 48px; padding: 0 var(--s-5);
  border: 1px solid transparent; border-radius: var(--r-md); font-weight: 700; cursor: pointer; transition: background-color var(--t-fast) var(--ease); }
.btn.primary { background: var(--accent); color: var(--on-accent); width: 100%; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); font-weight: 600; }
.btn.secondary:hover { background: var(--accent-subtle); }
.btn.text { background: transparent; color: var(--accent); font-weight: 600; }
.btn.text:hover { background: var(--accent-subtle); }

/* sticky booking bar, under 100px */
.submitbar { position: sticky; bottom: 0; z-index: 10; padding: 10px var(--s-4) calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 12px rgb(16 24 40 / 0.05); }
.summary { display: block; margin-bottom: 6px; font-size: var(--text-sm); line-height: 20px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary strong { color: var(--text); font-weight: 600; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgb(16 24 40 / 0.5); }
.sheet { width: 100%; max-width: var(--w-phone); background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-dialog);
  padding: var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom)); }
@media (min-width: 641px) { .scrim { padding-bottom: var(--s-6); } .sheet { border-radius: var(--r-xl); } }
.grab { width: 40px; height: 4px; margin: 0 auto var(--s-4); border-radius: var(--r-full); background: var(--border-strong); }
.sheet-head { display: flex; align-items: center; gap: var(--s-3); }
.okay { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: var(--r-full); background: var(--success-subtle); color: var(--success); }
.sheet h2:focus { outline: none; }
.facts { margin: var(--s-4) 0; }
.facts div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--border); }
.facts dt { color: var(--text-muted); font-size: var(--text-sm); font-weight: 500; line-height: 24px; }
.facts dd { margin: 0; font-weight: 600; }
.facts dd span { display: block; font-weight: 400; color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }
.sheet .note { margin-bottom: var(--s-4); color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }
.sheet .btn.text { width: 100%; margin-top: var(--s-1); }
</style>
</head>
<body>
<a class="skip-link" href="#dentist-h">Skip to booking</a>

<div class="app" id="app">
  <header class="bar">
    <button type="button" class="icon-btn" aria-label="Back">
      <svg class="ico" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="9" fill="var(--accent)"/><path d="M8.5 19.5C8.5 12.5 12.5 8.5 19.5 8.5C19.5 15.5 15.5 19.5 8.5 19.5Z" fill="var(--on-accent)"/><path d="M8 20L14 14" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Fernlea</span>
    </div>
    <a class="icon-btn accent" href="tel:01632960142" aria-label="Call Fernlea on 01632 960142">
      <svg class="ico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
    </a>
  </header>

  <main>
    <form id="booking" novalidate>
      <div class="content">
        <div class="head">
          <h1>Book a check-up</h1>
          <p>30 minutes at Fernlea Dental, 14 Mill Lane</p>
        </div>

        <section aria-labelledby="dentist-h">
          <div class="sec-head"><h2 id="dentist-h" tabindex="-1">Choose a dentist</h2></div>
          <div class="list" role="radiogroup" aria-labelledby="dentist-h" id="dentists"></div>
        </section>

        <section aria-labelledby="date-h">
          <div class="sec-head">
            <h2 id="date-h">Pick a date</h2>
            <div class="weeknav">
              <button type="button" class="icon-btn" id="prev" aria-label="Previous week"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
              <output id="range" aria-live="polite"></output>
              <button type="button" class="icon-btn" id="next" aria-label="Next week"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
          </div>
          <div class="days" role="radiogroup" aria-labelledby="date-h" id="days"></div>
        </section>

        <section aria-labelledby="time-h">
          <div class="sec-head"><h2 id="time-h">Pick a time</h2></div>
          <p class="intro" id="time-intro" aria-live="polite"></p>
          <div class="slots-wrap" id="slots-wrap">
            <p class="err" id="time-error" role="alert" tabindex="-1" hidden>
              <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg>
              <span>Choose a time to book your check-up.</span>
            </p>
            <div id="times" role="group" aria-labelledby="time-h"></div>
          </div>
        </section>
      </div>

      <div class="submitbar">
        <p class="summary" id="summary" aria-live="polite"></p>
        <button type="submit" class="btn primary">Book check-up</button>
      </div>
    </form>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <span class="okay" aria-hidden="true"><svg class="ico" width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <h2 id="sheet-h" tabindex="-1">Check-up booked</h2>
    </div>
    <dl class="facts" id="facts"></dl>
    <p class="note">We will text a reminder to 07700 900142 the day before.</p>
    <button type="button" class="btn primary" id="done">Done</button>
    <button type="button" class="btn text">Add to calendar</button>
  </div>
</div>

<script>
// ---- fixtures: one data module, everything on screen derives from it ----
const TODAY = new Date(2026, 10, 27); // Friday 27 Nov 2026
const STATE = new Set((new URLSearchParams(location.search).get('state') || '').split(','));
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MOL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const CLINIC = { name: 'Fernlea Dental', address: '14 Mill Lane, Hartsfield' };
const HOURS = {
  Morning: ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30'],
  Afternoon: ['13:30', '14:00', '14:30', '15:00', '15:30', '16:00'],
};
const DENTISTS = [
  { id: 'okafor', name: 'Dr Amara Okafor', short: 'Dr Okafor', initials: 'AO', role: 'Principal dentist', works: [1, 2, 3, 4, 5, 6], full: ['2026-11-30'] },
  { id: 'wrona', name: 'Dr Tomasz Wrona', short: 'Dr Wrona', initials: 'TW', role: 'General dentist', works: [1, 2, 3, 4], full: [] },
  { id: 'nair', name: 'Dr Priya Nair', short: 'Dr Nair', initials: 'PN', role: 'Dentist, anxious patients welcome', works: [2, 3, 4, 5, 6], full: [] },
];
if (STATE.has('stress')) {
  DENTISTS[2].name = 'Dr Ngozi Adeyemi-Featherstonehaugh';
  DENTISTS[2].short = 'Dr Adeyemi-Featherstonehaugh';
  DENTISTS[2].initials = 'NA';
  DENTISTS[2].role = 'Specialist in restorative dentistry and sedation for anxious patients';
}

const addDays = (n) => new Date(2026, 10, 27 + n);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const short = (d) => `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
const long = (d) => `${WDL[d.getDay()]} ${d.getDate()} ${MOL[d.getMonth()]}`;
const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) % 100; };

// slots for one dentist on one day: Sunday closed, Saturday mornings only, then each dentist's own working days
function slotsOn(den, n) {
  const d = addDays(n), wd = d.getDay();
  if (wd === 0) return { kind: 'closed', slots: [] };
  if (!den.works.includes(wd)) return { kind: 'off', slots: [] };
  const slots = [];
  for (const [part, times] of Object.entries(HOURS)) {
    if (wd === 6 && part === 'Afternoon') continue;
    for (const t of times) slots.push({ t, part, booked: den.full.includes(iso(d)) || hash(den.id + iso(d) + t) < 38 });
  }
  return { kind: 'open', slots };
}
const freeOf = (den, n) => slotsOn(den, n).slots.filter((s) => !s.booked);
function nextFree(den, from = 1) {
  for (let n = from; n < from + 28; n++) { const f = freeOf(den, n); if (f.length) return { n, t: f[0].t }; }
  return null;
}

// ---- state ----
const st = { den: DENTISTS[0].id, n: 1, week: 0, time: null, error: false };
const den = () => DENTISTS.find((d) => d.id === st.den);
const weekDays = () => Array.from({ length: 7 }, (_, i) => 1 + st.week * 7 + i);
const enabled = (n) => slotsOn(den(), n).kind === 'open';
function pickDay() {
  const days = weekDays();
  if (days.includes(st.n) && enabled(st.n)) return;
  st.n = days.find((n) => freeOf(den(), n).length) ?? days.find(enabled) ?? days[0];
}
if (STATE.has('empty')) st.n = 3; // Mon 30 Nov, fully booked for Dr Okafor
else pickDay();
if (STATE.has('sheet') || STATE.has('error')) st.time = freeOf(den(), st.n)[0]?.t ?? null;
if (STATE.has('error')) { st.time = null; st.error = true; }

// ---- render ----
const $ = (id) => document.getElementById(id);
const CHECK = '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:3.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function renderDentists() {
  $('dentists').innerHTML = DENTISTS.map((d) => {
    const nf = nextFree(d);
    return `<label class="pick"><input type="radio" name="dentist" value="${d.id}" ${d.id === st.den ? 'checked' : ''}>
      <span class="face dentist"><span class="avatar" aria-hidden="true">${d.initials}</span>
        <span style="min-width:0"><span class="name" style="display:block">${d.name}</span><span class="role" style="display:block">${d.role}</span>
        <span class="next" style="display:block">${nf ? `Next free ${short(addDays(nf.n))}, ${nf.t}` : 'No free times this month'}</span></span>
        <span class="dot" aria-hidden="true">${CHECK}</span></span></label>`;
  }).join('');
}

function renderDays() {
  const ds = weekDays(), a = addDays(ds[0]), b = addDays(ds[6]);
  $('range').textContent = `${a.getDate()} ${MO[a.getMonth()]} – ${b.getDate()} ${MO[b.getMonth()]}`;
  $('prev').disabled = st.week === 0;
  $('next').disabled = st.week === 3;
  $('days').innerHTML = ds.map((n) => {
    const d = addDays(n), info = slotsOn(den(), n), free = info.slots.filter((s) => !s.booked).length;
    const off = info.kind !== 'open';
    const lead = off ? (info.kind === 'closed' ? 'Closed' : 'Off') : free ? `${free} of ${info.slots.length} times free` : 'Fully booked';
    return `<label class="pick"><input type="radio" name="day" value="${n}" ${n === st.n ? 'checked' : ''} ${off ? 'disabled' : ''}>
      <span class="face day"><span class="wd">${WD[d.getDay()]}</span><span class="n">${d.getDate()}</span>
      ${off ? `<span class="tag" aria-hidden="true">${info.kind === 'closed' ? 'Closed' : 'Off'}</span>` : `<span class="meter" aria-hidden="true"><i style="width:${Math.round(100 * free / info.slots.length)}%"></i></span>`}
      <span class="sr-only">${long(d)}, ${lead}</span></span></label>`;
  }).join('');
}

function renderTimes() {
  const d = addDays(st.n), info = slotsOn(den(), st.n), free = info.slots.filter((s) => !s.booked);
  $('time-intro').innerHTML = `<strong>${free.length} of ${info.slots.length}</strong> times free on ${long(d)} with ${den().short}`;
  $('slots-wrap').classList.toggle('is-error', st.error);
  $('time-error').hidden = !st.error;
  if (!free.length) {
    const nf = nextFree(den(), st.n + 1);
    $('times').innerHTML = `<div class="empty">
      <svg width="132" height="36" viewBox="0 0 132 36" aria-hidden="true"><rect x="1" y="1" width="38" height="34" rx="8" fill="var(--bg-subtle)" stroke="var(--border)"/><rect x="47" y="1" width="38" height="34" rx="8" fill="var(--bg-subtle)" stroke="var(--border)"/><rect x="93" y="1" width="38" height="34" rx="8" fill="var(--accent-subtle)" stroke="var(--accent)" stroke-width="2"/><path d="M10 18h20M56 18h20" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><p class="t">No times left on ${short(d)}</p>
      <p style="margin-top:4px">${nf ? `The next free time with ${den().short} is ${short(addDays(nf.n))} at ${nf.t}.` : `${den().short} has no free times in the next four weeks.`}</p></div>
      ${nf ? `<button type="button" class="btn secondary" data-goto="${nf.n}">Show ${short(addDays(nf.n))}</button>` : ''}</div>`;
    return;
  }
  const parts = Object.keys(HOURS).filter((p) => info.slots.some((s) => s.part === p));
  $('times').innerHTML = parts.map((p) => `<p class="group-label">${p}</p><div class="slots">${
    info.slots.filter((s) => s.part === p).map((s) =>
      `<label class="pick"><input type="radio" name="time" value="${s.t}" ${s.t === st.time ? 'checked' : ''} ${s.booked ? 'disabled' : ''}>
       <span class="face slot">${s.t}<span class="sr-only">${s.booked ? ', booked' : ''}</span></span></label>`).join('')}</div>`).join('');
}

function renderBar() {
  $('summary').innerHTML = st.time
    ? `<strong>${short(addDays(st.n))} at ${st.time}</strong> with ${den().short}`
    : 'Choose a time to book';
}

function renderAll() { renderDays(); renderTimes(); renderBar(); }

// ---- events ----
$('dentists').addEventListener('change', (e) => { st.den = e.target.value; st.time = null; st.error = false; pickDay(); renderAll(); });
$('days').addEventListener('change', (e) => { st.n = +e.target.value; st.time = null; st.error = false; renderTimes(); renderBar(); });
$('times').addEventListener('change', (e) => { if (e.target.name === 'time') { st.time = e.target.value; st.error = false; $('time-error').hidden = true; $('slots-wrap').classList.remove('is-error'); renderBar(); } });
$('times').addEventListener('click', (e) => {
  const b = e.target.closest('[data-goto]'); if (!b) return;
  st.n = +b.dataset.goto; st.week = Math.floor((st.n - 1) / 7); st.time = null; renderAll();
});
for (const [id, step] of [['prev', -1], ['next', 1]]) $(id).addEventListener('click', () => {
  st.week += step; st.time = null; st.error = false; pickDay(); renderAll();
  $(step > 0 ? 'next' : 'prev').focus();
});

let opener = null;
function openSheet() {
  const d = addDays(st.n);
  $('facts').innerHTML = `
    <div><dt>Dentist</dt><dd>${den().name}<span>Check-up, 30 minutes</span></dd></div>
    <div><dt>When</dt><dd>${long(d)}<span>${st.time}</span></dd></div>
    <div><dt>Where</dt><dd>${CLINIC.name}<span>${CLINIC.address}</span></dd></div>`;
  opener = document.activeElement;
  $('scrim').hidden = false; $('app').inert = true; $('sheet-h').focus();
}
function closeSheet() {
  $('scrim').hidden = true; $('app').inert = false;
  (opener && opener.isConnected ? opener : $('booking').querySelector('button[type=submit]')).focus();
}
$('booking').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!st.time) { st.error = true; renderTimes(); $('time-error').scrollIntoView({ block: 'center' }); $('time-error').focus(); return; }
  openSheet();
});
$('done').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('scrim').hidden) closeSheet(); });

renderDentists();
renderAll();
if (STATE.has('sheet')) openSheet();
</script>
</body>
</html>
