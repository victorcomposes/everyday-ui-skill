<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - Gigwell</title>
<style>
:root {
  --ink: #12202b;
  --ink-2: #4a5a67;
  --ink-3: #74848f;
  --paper: #f2f5f4;
  --surface: #ffffff;
  --line: #dde5e3;
  --well: #0b6e6a;
  --well-strong: #07524f;
  --well-tint: #e0f1ef;
  --coral: #d9482b;
  --coral-tint: #fce8e2;
  --money: #17794a;
  --money-tint: #e0f3e8;
  --blue: #2f5bd0;
  --blue-tint: #e6ecfb;
  --violet: #6b4bc4;
  --violet-tint: #eee9fa;
  --amber: #a86a00;
  --amber-tint: #fbf0d6;
  --slate: #56656f;
  --slate-tint: #e8edeb;
  --radius: 10px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e8f0ee;
    --ink-2: #a9b9b5;
    --ink-3: #7e8f8b;
    --paper: #0d1615;
    --surface: #142120;
    --line: #253735;
    --well: #4cc4bc;
    --well-strong: #7fd9d3;
    --well-tint: #153634;
    --coral: #ff8466;
    --coral-tint: #3d211a;
    --money: #58cf90;
    --money-tint: #143426;
    --blue: #8fa9ff;
    --blue-tint: #1c2745;
    --violet: #b6a0ff;
    --violet-tint: #2a2347;
    --amber: #f0b648;
    --amber-tint: #38290c;
    --slate: #a2b2ad;
    --slate-tint: #1f2e2c;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--well); outline-offset: 2px; border-radius: 6px; }

/* top bar */
.bar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1160px; margin: 0 auto; padding: 0 24px;
  height: 60px; display: flex; align-items: center; gap: 32px;
}
.brand { display: flex; align-items: center; gap: 9px; font: 700 20px/1 var(--font-display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.nav { display: flex; gap: 4px; margin-right: auto; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.nav a:hover { background: var(--slate-tint); color: var(--ink); }
.nav a[aria-current] { color: var(--ink); background: var(--slate-tint); }
.me { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--well); color: var(--paper); flex: none; }
.bell { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--well-tint); }
.bell svg { width: 20px; height: 20px; }
.bell b { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.bell b[hidden] { display: none; }

/* page */
.page { max-width: 1160px; margin: 0 auto; padding: 32px 24px 80px; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 40px; }
.head { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font: 700 34px/1.1 var(--font-display); letter-spacing: -.03em; }
.head p { margin: 6px 0 0; color: var(--ink-2); }
.head-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 16px; height: 16px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn[disabled]:hover { border-color: var(--line); }
.btn.primary { background: var(--well); border-color: var(--well); color: #fff; }
.btn.primary:hover { background: var(--well-strong); border-color: var(--well-strong); }
@media (prefers-color-scheme: dark) { .btn.primary { color: #06201e; } .btn.primary:hover { color: #06201e; } }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--slate-tint); }
.btn.sm { padding: 5px 12px; min-height: 32px; font-size: 13.5px; }

/* filters */
.filters { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.filters button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.filters button:hover { background: var(--slate-tint); color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: inset 3px 0 0 var(--well); border-radius: 4px 8px 8px 4px; }
.filters .n { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 10px; color: var(--ink-3); }
.filters .n.hot { background: var(--coral); color: #fff; font-weight: 700; }
.filters hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; }
.digest { margin: 14px 12px 0; font-size: 13px; color: var(--ink-3); }
.digest strong { color: var(--ink); font-variant-numeric: tabular-nums; }

/* feed */
.group-title { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 8px; font: 650 15px/1.3 var(--font-display); }
.group-title:first-child { margin-top: 0; }
.group-title small { font: 500 13px var(--font); color: var(--ink-3); }
.group-title.needs { color: var(--coral); }
.list { margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; padding: 16px 18px 16px 20px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.unread::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--well); }
.item.needs::before { background: var(--coral); }
.item.unread { background: color-mix(in srgb, var(--well-tint) 38%, var(--surface)); }
.item.leaving { opacity: 0; transform: translateX(16px); transition: opacity .2s, transform .2s; }
.ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; }
.ico svg { width: 20px; height: 20px; }
.t-offer .ico, .t-invite .ico { background: var(--well-tint); color: var(--well); }
.t-payment .ico { background: var(--money-tint); color: var(--money); }
.t-message .ico { background: var(--blue-tint); color: var(--blue); }
.t-proposal .ico { background: var(--violet-tint); color: var(--violet); }
.t-review .ico { background: var(--amber-tint); color: var(--amber); }
.t-deadline .ico { background: var(--coral-tint); color: var(--coral); }
.t-system .ico { background: var(--slate-tint); color: var(--slate); }
.body { min-width: 0; }
.title { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 500; }
.unread .title { font-weight: 650; }
.title b { font-weight: 650; }
.text { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; max-width: 64ch; }
.quote { margin: 8px 0 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.meta { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta .due { color: var(--coral); font-weight: 650; font-variant-numeric: tabular-nums; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.done { margin: 12px 0 0; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--money); }
.done svg { width: 16px; height: 16px; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.when { font-size: 13px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt { font: 700 20px/1.2 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--money); }
.amt.neutral { color: var(--ink); }
.amt small { display: block; font: 500 12px var(--font); letter-spacing: 0; color: var(--ink-3); }
.row-tools { display: flex; gap: 2px; margin-top: auto; }
.icon-btn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
.icon-btn:hover { background: var(--slate-tint); color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }
.reply { display: flex; gap: 8px; margin-top: 12px; max-width: 520px; }
.reply input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; }
.reply input:focus-visible { outline-offset: 0; border-color: var(--well); }

.empty { padding: 56px 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty svg { width: 44px; height: 44px; color: var(--well); }
.empty h2 { margin: 12px 0 4px; font: 650 18px var(--font-display); }
.empty p { margin: 0 auto 16px; color: var(--ink-2); max-width: 44ch; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; transition: opacity .18s, transform .18s; z-index: 20; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; padding: 6px 10px; border-radius: 6px; text-decoration: underline; }

/* preferences */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 24px 60px rgba(0,0,0,.28); }
dialog::backdrop { background: rgba(8, 16, 15, .5); }
.dlg-head { display: flex; align-items: center; padding: 20px 22px 4px; }
.dlg-head h2 { margin: 0; font: 700 20px var(--font-display); letter-spacing: -.02em; }
.dlg-head .icon-btn { margin-left: auto; }
.dlg-sub { margin: 0; padding: 0 22px 12px; color: var(--ink-2); font-size: 14px; }
.prefs { width: 100%; border-collapse: collapse; }
.prefs th { font-weight: 600; font-size: 13px; color: var(--ink-3); text-align: center; padding: 8px 6px; width: 64px; }
.prefs th:first-child { text-align: left; padding-left: 22px; width: auto; }
.prefs td { padding: 11px 6px; border-top: 1px solid var(--line); text-align: center; }
.prefs td:first-child { text-align: left; padding-left: 22px; }
.prefs td:first-child span { display: block; font-size: 13px; color: var(--ink-3); }
.prefs td:first-child strong { font-weight: 600; }
.sw { position: relative; display: inline-block; width: 38px; height: 22px; vertical-align: middle; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 11px; background: var(--line); transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw input:checked + i { background: var(--well); }
.sw input:checked + i::after { transform: translateX(16px); }
.sw input:focus-visible + i { outline: 2px solid var(--well); outline-offset: 2px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 20px; border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  .bar-in { padding: 0 16px; gap: 12px; }
  .nav { display: none; }
  .me { margin-left: auto; }
  .page { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 80px; gap: 16px; }
  .head h1 { font-size: 28px; }
  .head-actions { margin-left: 0; width: 100%; }
  .head-actions .btn { flex: 1; justify-content: center; }
  .filters { position: static; flex-direction: row; overflow-x: auto; gap: 6px; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { width: auto; white-space: nowrap; border: 1px solid var(--line); border-radius: 20px !important; padding: 7px 12px; background: var(--surface); flex: none; }
  .filters button[aria-pressed="true"] { box-shadow: none; background: var(--well); border-color: var(--well); color: #fff; }
  .filters button[aria-pressed="true"] .n { color: #fff; }
  .filters hr, .digest { display: none; }
  .item { grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px 14px 14px 16px; }
  .ico { width: 36px; height: 36px; border-radius: 10px; }
  .side { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; text-align: left; margin-top: -4px; }
  .row-tools { margin-top: 0; }
  .when { order: 0; }
  .amt { order: -1; }
  .side { flex-wrap: wrap; }
  .acts .btn { flex: 1 1 auto; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" aria-label="Gigwell home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--well)"/><path d="M8 17c3 0 3-4 6-4s3 4 6 4 3-4 4-4" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round"/><path d="M8 23c3 0 3-4 6-4s3 4 6 4 3-4 4-4" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/></svg>
      Gigwell
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#">Find work</a>
      <a href="#">Contracts</a>
      <a href="#">Messages</a>
      <a href="#">Earnings</a>
    </nav>
    <div class="me">
      <a class="bell" href="#" aria-label="Notifications" aria-current="page" id="bell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <b id="bellN" aria-hidden="true">0</b>
      </a>
      <span class="avatar" title="Mara Lindqvist">ML</span>
    </div>
  </div>
</header>

<main class="page">
  <div class="head">
    <div>
      <h1>Notifications</h1>
      <p id="summary">Loading</p>
    </div>
    <div class="head-actions">
      <button class="btn" id="markAll" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5l4.5 4.5L15 8.5"/><path d="M12 15l1.5 1.5L22 8"/></svg>
        Mark all as read
      </button>
      <button class="btn" id="openPrefs" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        Preferences
      </button>
    </div>
  </div>

  <nav class="filters" id="filters" aria-label="Filter notifications"></nav>

  <section aria-label="Notification list" id="feed"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>Undo</button></div>

<dialog id="prefs" aria-labelledby="prefsTitle">
  <form method="dialog">
    <div class="dlg-head">
      <h2 id="prefsTitle">Notification preferences</h2>
      <button class="icon-btn" value="cancel" aria-label="Close preferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="dlg-sub">Choose where Gigwell tells you about each kind of update. In-app notifications always stay on.</p>
    <table class="prefs">
      <thead><tr><th scope="col">Update</th><th scope="col">Email</th><th scope="col">Phone</th></tr></thead>
      <tbody id="prefRows"></tbody>
    </table>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="save" id="savePrefs">Save preferences</button>
    </div>
  </form>
</dialog>

<script>
const ICONS = {
  offer: '<path d="M7 3h8l4 4v14H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/>',
  invite: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  payment: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.8-2.5 2 0 3 5 1.6 5 4.2 0 1.2-1.1 2-2.5 2-1.2 0-2.2-.5-2.7-1.4M12 6.5V8m0 8v1.5"/>',
  message: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/>',
  proposal: '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  review: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/>',
  deadline: '<circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9 2.5h6"/>',
  system: '<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>'
};
const svg = (p, c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${c ? 'class="' + c + '"' : ''} aria-hidden="true">${p}</svg>`;
const H = 3600e3, M = 60e3;
const T0 = Date.now();

const FILTERS = [
  { id: 'all', label: 'All' },
  { id: 'unread', label: 'Unread' },
  { id: 'work', label: 'Offers and invites', types: ['offer', 'invite', 'proposal', 'deadline'] },
  { id: 'message', label: 'Messages', types: ['message'] },
  { id: 'money', label: 'Payments', types: ['payment'] },
  { id: 'account', label: 'Reviews and account', types: ['review', 'system'] }
];

let items = [
  { id: 1, type: 'offer', unread: true, day: 'Today', when: '12 min ago',
    title: '<b>Lindqvist &amp; Sons Boatyard</b> sent you a contract offer',
    text: 'Brand identity for a family boatyard: logo, colour system and signage. Fixed price, three milestones.',
    amount: '$3,200.00', amountNote: 'fixed price', neutral: true, due: T0 + 5 * H + 38 * M, dueLabel: 'Offer expires in',
    acts: [{ k: 'accept', label: 'Accept offer', primary: true, result: 'Offer accepted. Your contract with Lindqvist & Sons starts now.' }, { k: 'decline', label: 'Decline', result: 'Offer declined. Lindqvist & Sons was told.' }, { k: 'view', label: 'View offer' }] },
  { id: 2, type: 'message', unread: true, day: 'Today', when: '38 min ago',
    title: '<b>Dana Okafor</b> at Northfold Tea sent you a message',
    quote: 'Can we move tomorrow’s check-in to 3pm? Legal wants one more look at the pack copy first.',
    meta: ['Packaging concepts contract'], reply: true },
  { id: 3, type: 'payment', unread: true, day: 'Today', when: '2 hours ago',
    title: 'Payment released for <b>Milestone 2: Packaging concepts</b>',
    text: 'Northfold Tea approved your work. Funds reach your Monzo account in 1 to 2 business days.',
    amount: '+$1,450.00', amountNote: 'after 10% fee', meta: ['Northfold Tea'] },
  { id: 4, type: 'deadline', unread: true, day: 'Today', when: '4 hours ago',
    title: 'Milestone 3 is due <b>tomorrow at 17:00</b>',
    text: 'Deliver final packaging files to Northfold Tea. Late work may pause the next payment.',
    due: T0 + 26 * H + 20 * M, dueLabel: 'Due in',
    acts: [{ k: 'submit', label: 'Submit work', primary: true, result: 'Work submitted. Northfold Tea has 5 days to review.' }, { k: 'extend', label: 'Ask for more time', result: 'Request sent. Dana can approve a new date.' }] },
  { id: 5, type: 'proposal', unread: true, day: 'Today', when: '5 hours ago',
    title: '<b>Kestrel Labs</b> viewed your proposal',
    text: 'Illustration set for their onboarding app. They opened it 3 times in the last hour.',
    meta: ['Your bid: $2,400', '14 other freelancers bid'] },
  { id: 6, type: 'invite', unread: false, day: 'Today', when: '7 hours ago',
    title: '<b>Public Works Studio</b> invited you to bid',
    text: 'Wayfinding illustrations for a city library. Budget $2,000 to $2,800, due in 3 weeks.',
    acts: [{ k: 'bid', label: 'Write a proposal', primary: true, result: 'Draft started. Find it in Proposals.' }, { k: 'pass', label: 'Not interested', result: 'Invitation declined.' }] },
  { id: 7, type: 'review', unread: true, day: 'Yesterday', when: 'Yesterday, 16:40',
    title: '<b>Hollis Bakery</b> left you a 5-star review',
    quote: 'Fast, precise, and she asked the right questions before drawing anything. We’ll hire again.',
    meta: ['Menu illustrations contract'] },
  { id: 8, type: 'system', unread: true, day: 'Yesterday', when: 'Yesterday, 11:05',
    title: 'Add your tax details before your next payout',
    text: 'Gigwell holds payouts above $600 a year until a tax form is on file. It takes about 4 minutes.',
    acts: [{ k: 'tax', label: 'Add tax details', primary: true, result: 'Tax form opened in a new tab.' }] },
  { id: 9, type: 'message', unread: false, day: 'Yesterday', when: 'Yesterday, 09:12',
    title: '<b>Tomas Reyes</b> sent you a message',
    quote: 'Thanks for the revised sketches. The second direction is the one. Go ahead with line work.',
    meta: ['Trailhead zine contract'] },
  { id: 10, type: 'payment', unread: false, day: 'Earlier this week', when: 'Mon, 18:30',
    title: 'Payout sent to <b>Monzo ending 4821</b>',
    text: 'Two milestones from Hollis Bakery and Trailhead Zine.',
    amount: '+$2,180.00', amountNote: 'paid out' },
  { id: 11, type: 'deadline', unread: false, day: 'Earlier this week', when: 'Mon, 10:00',
    title: 'Hollis Bakery requested a revision on <b>Milestone 1</b>',
    text: 'Dana asked for warmer colours on the window poster. You have 3 revisions left.', meta: ['Menu illustrations contract'] },
  { id: 12, type: 'system', unread: false, day: 'Earlier this week', when: 'Sun, 21:48',
    title: 'New sign-in from Lisbon, Portugal',
    text: 'Chrome on Windows. If this was you, no action is needed.',
    acts: [{ k: 'secure', label: 'This wasn’t me', result: 'We signed out all devices. Choose a new password to finish.' }] },
  { id: 13, type: 'proposal', unread: false, day: 'Earlier this week', when: 'Sat, 14:20',
    title: 'Your profile appeared in <b>96 searches</b> for “illustration”',
    text: 'That is up 31% from the week before. 11 people opened your profile.' }
];
const state = { filter: 'all' };
const baseId = new Set(items.map(i => i.id));
let undo = null;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function pending(i) { return i.acts && !i.resolved && (i.due || i.type === 'offer' || i.type === 'deadline'); }
function countdown(ms) {
  const t = Math.max(0, Math.round(ms / M));
  const h = Math.floor(t / 60), m = t % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}
function match(i, f) {
  if (f.id === 'all') return true;
  if (f.id === 'unread') return i.unread;
  return f.types.includes(i.type);
}

function renderFilters() {
  $('#filters').innerHTML = FILTERS.map(f => {
    const n = items.filter(i => i.unread && match(i, f)).length;
    const cls = f.id === 'unread' && n ? 'n hot' : 'n';
    const shown = f.id === 'unread' || f.id === 'all' || n ? n : 0;
    return `<button type="button" data-f="${f.id}" aria-pressed="${state.filter === f.id}">${f.label}<span class="${cls}" ${n ? '' : 'aria-hidden="true"'}>${n ? n : ''}</span></button>`;
  }).join('') + '<hr>' +
    `<p class="digest">This week: <strong>${items.filter(i => i.type === 'payment').length}</strong> payment updates, <strong>${items.filter(i => i.type === 'message').length}</strong> messages.</p>`;
}

function itemHTML(i) {
  const need = pending(i);
  const dueEl = i.due && !i.resolved ? `<span class="due" data-due="${i.due}">${i.dueLabel} ${countdown(i.due - Date.now())}</span>` : '';
  const meta = (i.meta || []).map(m => `<span>${esc(m)}</span>`).join('');
  const acts = i.resolved
    ? `<p class="done">${svg('<path d="M4 12.5l5 5L20 6.5"/>')}${esc(i.resolved)}</p>`
    : i.acts ? `<div class="acts">${i.acts.map(a => `<button type="button" class="btn sm${a.primary ? ' primary' : ''}" data-act="${a.k}" data-id="${i.id}">${a.label}</button>`).join('')}</div>` : '';
  const reply = i.reply ? (i.replied
    ? `<p class="done">${svg('<path d="M4 12.5l5 5L20 6.5"/>')}Reply sent</p>`
    : `<div class="acts" data-replybar="${i.id}"><button type="button" class="btn sm primary" data-act="reply" data-id="${i.id}">Reply</button><button type="button" class="btn sm" data-act="r3" data-id="${i.id}">Yes, 3pm works</button></div>`) : '';
  const amt = i.amount ? `<div class="amt${i.neutral ? ' neutral' : ''}">${i.amount}<small>${i.amountNote || ''}</small></div>` : '';
  return `<li class="item t-${i.type}${i.unread ? ' unread' : ''}${need ? ' needs' : ''}" data-id="${i.id}">
    <div class="ico">${svg(ICONS[i.type])}</div>
    <div class="body">
      <p class="title">${i.title}</p>
      ${i.text ? `<p class="text">${esc(i.text)}</p>` : ''}
      ${i.quote ? `<p class="quote">${esc(i.quote)}</p>` : ''}
      ${(meta || dueEl) ? `<p class="meta">${dueEl}${meta}</p>` : ''}
      ${acts}${reply}
    </div>
    <div class="side">
      <span class="when">${i.when}</span>
      ${amt}
      <div class="row-tools">
        <button class="icon-btn" type="button" data-act="toggle" data-id="${i.id}" aria-label="${i.unread ? 'Mark as read' : 'Mark as unread'}" title="${i.unread ? 'Mark as read' : 'Mark as unread'}">${svg(i.unread ? '<circle cx="12" cy="12" r="4" fill="currentColor"/>' : '<circle cx="12" cy="12" r="4"/>')}</button>
        <button class="icon-btn" type="button" data-act="dismiss" data-id="${i.id}" aria-label="Dismiss notification" title="Dismiss">${svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>')}</button>
      </div>
    </div>
  </li>`;
}

function render() {
  const f = FILTERS.find(x => x.id === state.filter);
  const list = items.filter(i => match(i, f));
  const needs = list.filter(pending);
  const rest = list.filter(i => !pending(i));
  const groups = [];
  if (needs.length) groups.push(['Needs you', needs, true]);
  ['Today', 'Yesterday', 'Earlier this week'].forEach(d => {
    const g = rest.filter(i => i.day === d);
    if (g.length) groups.push([d, g]);
  });
  let html = groups.map(([name, g, hot]) =>
    `<h2 class="group-title${hot ? ' needs' : ''}">${name}<small>${hot ? (g.length === 1 ? '1 item is waiting on your answer' : g.length + ' items are waiting on your answer') : ''}</small></h2><ul class="list">${g.map(itemHTML).join('')}</ul>`).join('');
  if (!list.length) {
    const unreadView = state.filter === 'unread';
    html = `<div class="empty">${svg(unreadView ? '<path d="M4 12.5l5 5L20 6.5"/>' : ICONS.message)}<h2>${unreadView ? 'You have read everything' : 'Nothing here yet'}</h2><p>${unreadView ? 'New offers, messages and payments show up here as they happen.' : 'When a client messages you or an offer arrives, it will appear in this list.'}</p><button class="btn primary" type="button" data-f="all">Show all notifications</button></div>`;
  }
  $('#feed').innerHTML = html;
  renderFilters();
  const unread = items.filter(i => i.unread).length;
  const waiting = items.filter(pending).length;
  $('#summary').textContent = unread
    ? `${unread} unread${waiting ? `, ${waiting} waiting on your answer` : ''}`
    : 'You are all caught up';
  $('#markAll').disabled = !unread;
  const b = $('#bellN'); b.textContent = unread; b.hidden = !unread;
  $('#bell').setAttribute('aria-label', unread ? `Notifications, ${unread} unread` : 'Notifications');
}

let toastTimer;
function toast(msg, undoFn) {
  $('#toastMsg').textContent = msg;
  const u = $('#toastUndo'); u.hidden = !undoFn; undo = undoFn || null;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), undoFn ? 6000 : 3500);
}
$('#toastUndo').onclick = () => { if (undo) undo(); undo = null; $('#toast').classList.remove('show'); };

document.addEventListener('click', e => {
  const fb = e.target.closest('[data-f]');
  if (fb) { state.filter = fb.dataset.f; render(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = +b.dataset.id, i = items.find(x => x.id === id), a = b.dataset.act;
  if (!i) return;
  if (a === 'toggle') { i.unread = !i.unread; render(); return; }
  if (a === 'dismiss') {
    const li = b.closest('.item'); li.classList.add('leaving');
    const idx = items.indexOf(i);
    setTimeout(() => { items = items.filter(x => x !== i); render(); toast('Notification dismissed', () => { items.splice(idx, 0, i); render(); }); }, 200);
    return;
  }
  if (a === 'reply') {
    const bar = b.closest('[data-replybar]');
    bar.outerHTML = `<form class="reply" data-reply="${id}"><input type="text" aria-label="Reply to Dana Okafor" placeholder="Write a reply to Dana" required><button class="btn sm primary" type="submit">Send reply</button></form>`;
    $(`[data-reply="${id}"] input`).focus();
    return;
  }
  if (a === 'r3') { i.replied = true; i.unread = false; render(); toast('Reply sent to Dana Okafor'); return; }
  const act = (i.acts || []).find(x => x.k === a);
  if (act && act.result) { i.resolved = act.result; i.unread = false; render(); toast(act.result); }
  else if (act) toast('Opening ' + act.label.toLowerCase());
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-reply]'); if (!f) return;
  e.preventDefault();
  const i = items.find(x => x.id === +f.dataset.reply); i.replied = true; i.unread = false; render(); toast('Reply sent to Dana Okafor');
});
$('#markAll').onclick = () => { const was = items.filter(i => i.unread); was.forEach(i => i.unread = false); render(); toast(`${was.length} notifications marked as read`, () => { was.forEach(i => i.unread = true); render(); }); };

/* preferences */
const PREFS = [
  ['Offers and invites', 'New contract offers and invitations to bid', true, true],
  ['Messages', 'Replies from clients on your contracts', true, true],
  ['Payments', 'Released milestones and payouts', true, true],
  ['Deadlines', 'Milestones due soon and revision requests', false, true],
  ['Proposal activity', 'When a client views your proposal', false, false],
  ['Reviews and tips', 'New reviews and profile insights', true, false]
];
let prefState = PREFS.map(p => [p[2], p[3]]);
function drawPrefs() {
  $('#prefRows').innerHTML = PREFS.map((p, r) => `<tr><td><strong>${p[0]}</strong><span>${p[1]}</span></td>` +
    [0, 1].map(c => `<td><label class="sw"><input type="checkbox" data-r="${r}" data-c="${c}" ${prefState[r][c] ? 'checked' : ''} aria-label="${p[0]} by ${c ? 'phone' : 'email'}"><i></i></label></td>`).join('') + '</tr>').join('');
}
$('#openPrefs').onclick = () => { drawPrefs(); $('#prefs').showModal(); };
$('#prefs').addEventListener('close', () => {
  if ($('#prefs').returnValue === 'save') {
    document.querySelectorAll('#prefRows input').forEach(c => prefState[+c.dataset.r][+c.dataset.c] = c.checked);
    toast('Preferences saved');
  }
});

/* live countdown */
setInterval(() => {
  document.querySelectorAll('[data-due]').forEach(el => {
    const lbl = el.textContent.replace(/\s[\dhm ]+$/, '');
    el.textContent = `${lbl} ${countdown(+el.dataset.due - Date.now())}`;
  });
}, 30000);

render();
</script>
</body>
</html>
