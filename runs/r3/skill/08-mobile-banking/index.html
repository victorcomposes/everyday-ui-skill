<style>
/* Signature: Harbour kit (default hue) / standard shape / IBM Plex Sans (precise) */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;
  --accent: #2754c5; --accent-hover: #1f45a6; --accent-subtle: #eef3fd; --on-accent: #ffffff;
  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --frame: #f4f7fd; --brand-deep: #14285a; --on-deep: #ffffff; --on-deep-muted: #b9c8ee; --accent-on-deep: #7a9cff;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font);
  --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 18px; --text-xl: 20px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-full: 999px;
  --shadow-pop: 0 4px 16px rgb(16 24 40 / 0.12), 0 1px 3px rgb(16 24 40 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1); --t-fast: 120ms; --t-base: 160ms; --t-slow: 200ms;
  --glass: rgb(255 255 255 / 0.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #7a9cff; --accent-hover: #9bb5ff; --accent-subtle: #1c2540; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72; --danger-subtle: #2d1715;
    --frame: #131a2b; --brand-deep: #0e1a38; --on-deep: #e9ebef; --on-deep-muted: #a9bbef;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5);
    --glass: rgb(255 255 255 / 0.1);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--frame); }
body { margin: 0; min-height: 100dvh; background: var(--frame); color: var(--text);
  font: 400 var(--text-md)/24px var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center; padding: var(--s-6) var(--s-4); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font: 600 var(--text-lg)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
h2 { font: 600 var(--text-lg)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4); background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); z-index: 50; }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.badge { display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; font-size: var(--text-xs); line-height: 16px; font-weight: 500; padding: 0 6px; border-radius: var(--r-sm); background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }

/* the phone: a centred column on a tinted page at desktop width */
.app { position: relative; width: 100%; max-width: 400px; height: min(860px, calc(100dvh - 48px)); display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: 80px; }

/* brand header: deep panel with balance and quick actions */
.hero { background: var(--brand-deep); color: var(--on-deep); padding: var(--s-2) var(--s-4) var(--s-5); }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
.logo { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font: 600 var(--text-lg)/1 var(--font-display); letter-spacing: -0.01em; }
.top-actions { display: flex; align-items: center; gap: var(--s-1); }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: var(--r-full); border: 0; background: transparent; color: var(--on-deep); display: grid; place-items: center; cursor: pointer; transition: background-color var(--t-fast) var(--ease); }
.icon-btn:hover { background: var(--glass); }
.icon-btn .dot { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: var(--r-full); background: var(--accent-on-deep); color: #0b1020; font-size: var(--text-xs); font-weight: 600; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--brand-deep); }
.avatar-btn { position: relative; width: 36px; height: 36px; border-radius: var(--r-full); background: var(--glass); color: var(--on-deep); font: 600 var(--text-sm)/1 var(--font); display: grid; place-items: center; }
.acct { margin-top: var(--s-4); }
.acct h1 { color: var(--on-deep); }
.acct .nums { color: var(--on-deep-muted); font-size: var(--text-sm); line-height: 20px; margin: 2px 0 0; }
.balance { font: 600 40px/1.1 var(--font-display); letter-spacing: -0.02em; margin: var(--s-3) 0 var(--s-1); }
.pending { color: var(--on-deep-muted); font-size: var(--text-sm); line-height: 20px; margin: 0; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); margin-top: var(--s-5); }
.qa { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); min-height: 44px; padding: 0; border: 0; background: none; color: var(--on-deep); cursor: pointer; font-size: var(--text-sm); line-height: 18px; font-weight: 500; text-align: center; }
.qa .c { width: 52px; height: 52px; border-radius: var(--r-full); background: var(--glass); display: grid; place-items: center; transition: background-color var(--t-fast) var(--ease); }
.qa:hover .c { background: rgb(255 255 255 / 0.22); }
.qa.primary .c { background: var(--accent-on-deep); color: #0b1020; }
.qa.primary:hover .c { background: #9bb5ff; }
.qa.primary { font-weight: 600; }

/* sections */
section.block { padding: var(--s-6) var(--s-4) 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); min-height: 44px; }
.head a, .head button.linkbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-2); margin-right: calc(var(--s-2) * -1); color: var(--accent); font-weight: 500; font-size: var(--text-sm); background: none; border: 0; cursor: pointer; }
.head a:hover { text-decoration: underline; text-underline-offset: 2px; }

.spent .v { font: 600 28px/1.1 var(--font-display); letter-spacing: -0.02em; margin-top: var(--s-1); }
.spent .cmp { color: var(--text-muted); font-size: var(--text-sm); margin: var(--s-1) 0 var(--s-4); }
.spent .cmp b { color: var(--warning); font-weight: 600; }
.meter { position: relative; height: 8px; border-radius: var(--r-full); background: var(--bg-subtle); border: 1px solid var(--border); }
.meter .fill { position: absolute; left: 0; top: -1px; bottom: -1px; border-radius: var(--r-full); background: var(--accent); }
.meter .mark { position: absolute; top: -7px; width: 2px; height: 20px; background: var(--text); border-radius: 1px; transform: translateX(-1px); }
.meter-l { position: relative; height: 20px; margin-top: var(--s-3); font-size: var(--text-xs); line-height: 16px; color: var(--text-muted); }
.meter-l span { position: absolute; top: 0; white-space: nowrap; }
.meter-l .zero { left: 0; }

/* lists */
.day { color: var(--text-muted); font-size: var(--text-sm); font-weight: 500; margin: var(--s-4) 0 var(--s-1); }
.day:first-child { margin-top: 0; }
ul.tx { list-style: none; margin: 0; padding: 0; }
.tx li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; min-height: 64px; border-top: 1px solid var(--border); }
.day + ul.tx li:first-child { border-top: 0; }
.mk { width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent-subtle); color: var(--accent); font: 600 var(--text-sm)/1 var(--font); border-radius: var(--r-md); }
.mk.person { border-radius: var(--r-full); }
.mk.in { background: var(--success-subtle); color: var(--success); }
.tx .n { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .m { display: flex; align-items: center; gap: var(--s-2); color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; white-space: nowrap; }
.tx .a { font-weight: 500; text-align: right; }
.tx .a.in { color: var(--success); }
.due { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; min-height: 64px; border-top: 1px solid var(--border); }
.due:first-of-type { border-top: 0; }
.date { width: 40px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--border); display: grid; place-items: center; align-content: center; text-align: center; line-height: 1; }
.date small { font-size: var(--text-xs); color: var(--text-muted); font-weight: 500; text-transform: none; }
.date b { font-size: var(--text-md); font-weight: 600; margin-top: 2px; }
.due .n { display: block; font-weight: 500; }
.due .m { display: block; color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }
.due .a { font-weight: 500; text-align: right; }
.due .a.in { color: var(--success); }
.end { padding: var(--s-6) var(--s-4) var(--s-6); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; width: 100%; transition: background-color var(--t-fast) var(--ease); }
.btn:hover { background: var(--bg-subtle); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* empty */
.empty { text-align: center; padding: var(--s-6) var(--s-4) var(--s-2); }
.empty svg { display: block; margin: 0 auto var(--s-4); }
.empty h3 { margin: 0; font: 600 var(--text-lg)/1.3 var(--font-display); }
.empty p { margin: var(--s-2) auto var(--s-4); color: var(--text-muted); max-width: 30ch; }
.empty .btn { width: auto; }

/* tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--border); padding: var(--s-1) var(--s-1) calc(var(--s-1) + env(safe-area-inset-bottom)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: var(--r-md); color: var(--text-muted); font-size: var(--text-xs); line-height: 16px; font-weight: 500; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab:hover { background: var(--bg-subtle); }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgb(10 14 26 / 0.5); z-index: 20; opacity: 0; transition: opacity var(--t-slow) var(--ease); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-pop); padding: var(--s-2) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform var(--t-slow) var(--ease); }
.app.sheet-open .scrim { opacity: 1; }
.app.sheet-open .sheet { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto var(--s-2); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.sheet-head button { min-height: 44px; padding: 0 var(--s-2); margin-right: calc(var(--s-2) * -1); background: none; border: 0; color: var(--accent); font-weight: 500; cursor: pointer; }
.sheet .lbl { color: var(--text-muted); font-size: var(--text-sm); font-weight: 500; margin: var(--s-2) 0 var(--s-1); }
.payees { list-style: none; margin: 0 0 var(--s-4); padding: 0; }
.payees button { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--s-3); align-items: center; width: 100%; min-height: 60px; padding: 0; background: none; border: 0; border-top: 1px solid var(--border); text-align: left; cursor: pointer; }
.payees li:first-child button { border-top: 0; }
.payees button:hover { background: var(--bg-subtle); }
.payees .n { display: block; font-weight: 500; }
.payees .m { display: block; color: var(--text-muted); font-size: var(--text-sm); line-height: 20px; }

@media (max-width: 480px) {
  body { display: block; padding: 0; background: var(--surface); }
  html { background: var(--surface); }
  .app { max-width: none; height: auto; min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
  .scroll { overflow: visible; }
  .tabbar { position: sticky; bottom: 0; z-index: 10; }
  .scrim, .sheet { position: fixed; }
  html { scroll-padding-bottom: 80px; }
}
</style>
</head>

const UPCOMING = [
  { date: new Date(2026, 11, 1), who: 'Hartley Lettings', note: 'Rent', amt: -650.00 },
  { date: new Date(2026, 11, 4), who: 'Bright Energy', note: 'Direct debit', amt: -78.00 },
  { date: new Date(2026, 11, 23), who: 'Brightwell Ltd', note: 'Salary, expected', amt: 2450.00 },
];
const PAYEES = [
  { name: 'Dara Okonkwo', note: 'Last sent £35.00 on 22 Nov', person: true },
  { name: 'Hartley Lettings', note: 'Rent, £650.00 on 1 Nov' },
  { name: 'Maisie Quinn', note: 'Last sent £120.00 on 9 Oct', person: true },
];
const TX = STATE === 'empty' ? [] : TX_ALL;

/* ---- derived ---- */
const gbp = (n) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(n).replace('-', '−');
const sgn = (n) => (n > 0 ? '+' : '') + gbp(n);
const sum = (a) => a.reduce((s, x) => s + x, 0);
const balance = STATE === 'empty' ? 0 : OPENING + sum(TX.map((t) => t.amt));
const pendingTotal = sum(TX.filter((t) => t.pending).map((t) => -t.amt));
const spent = -sum(TX.filter((t) => t.amt < 0).map((t) => t.amt));
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const fmtDay = (dt) => new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(dt).replace(',', '');
const dayLabel = (dt) => { const n = dayDiff(TODAY, dt); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : fmtDay(dt); };
const initials = (s) => s.replace(/[^A-Za-z& ]/g, '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const $ = (s) => document.querySelector(s);

/* ---- render ---- */
$('#balance').textContent = gbp(balance);
$('#pending').textContent = pendingTotal ? `${gbp(pendingTotal)} pending, not yet taken` : (STATE === 'empty' ? 'Add money to get started' : 'Nothing pending');

const primary = STATE === 'empty' ? 'add' : 'send';
const QA = [['send', 'Send money', 'i-send'], ['bill', 'Pay a bill', 'i-bill'], ['add', 'Add money', 'i-plus'], ['request', 'Request', 'i-request']];
$('#quick').innerHTML = QA.map(([id, label, ic]) => `<button class="qa${id === primary ? ' primary' : ''}" type="button" data-qa="${id}"><span class="c"><svg class="i" aria-hidden="true"><use href="#${ic}"/></svg></span>${label}</button>`).join('');

function renderSpent() {
  const el = $('#spent');
  if (STATE === 'empty') { el.innerHTML = `<div class="head"><h2 id="h-spent">Spent in November</h2></div><p class="sub" style="margin:0;color:var(--text-muted)">Nothing spent yet. Your spending shows here once you use your card.</p>`; return; }
  const max = Math.max(spent, USUAL_TO_DATE) * 1.12, fill = spent / max * 100, mark = USUAL_TO_DATE / max * 100;
  const over = spent - USUAL_TO_DATE;
  const cmp = over > 0 ? `<b>${gbp(over)} more</b> than usual by 27 Nov` : `${gbp(-over)} less than usual by 27 Nov`;
  el.innerHTML = `<div class="head"><h2 id="h-spent">Spent in November</h2></div>
    <div class="v">${gbp(spent)}</div>
    <p class="cmp">${cmp}</p>
    <div class="meter" role="img" aria-label="Spent ${gbp(spent)} this month. You usually spend ${gbp(USUAL_TO_DATE)} by now."><div class="fill" style="width:${fill.toFixed(1)}%"></div><div class="mark" style="left:${mark.toFixed(1)}%"></div></div>
    <div class="meter-l" aria-hidden="true"><span class="zero">£0</span><span style="right:${(100 - mark).toFixed(1)}%;transform:translateX(0)">Usual ${gbp(USUAL_TO_DATE).replace('.00', '')}</span></div>`;
}
function row(t) {
  const mk = `<span class="mk${t.person ? ' person' : ''}${t.income ? ' in' : ''}" aria-hidden="true">${initials(t.who)}</span>`;
  return `<li>${mk}<span style="min-width:0"><span class="n">${t.who}</span><span class="m">${t.cat}${t.pending ? ' <span class="badge">Pending</span>' : ''}</span></span><span class="a${t.income ? ' in' : ''}">${sgn(t.amt)}</span></li>`;
}
function renderTx() {
  const box = $('#txlist');
  if (!TX.length) {
    box.innerHTML = `<div class="empty"><svg width="120" height="88" viewBox="0 0 120 88" aria-hidden="true"><rect x="10" y="10" width="100" height="22" rx="6" fill="var(--accent-subtle)"/><rect x="10" y="40" width="100" height="22" rx="6" fill="var(--bg-subtle)" stroke="var(--border)"/><circle cx="26" cy="21" r="6" fill="var(--accent)"/><rect x="38" y="16" width="38" height="4" rx="2" fill="var(--border-strong)"/><rect x="38" y="24" width="24" height="4" rx="2" fill="var(--border)"/><rect x="38" y="46" width="38" height="4" rx="2" fill="var(--border)"/><rect x="38" y="54" width="24" height="4" rx="2" fill="var(--border)"/></svg><h3>No transactions yet</h3><p>Money in and out of your account shows here, newest first.</p><button class="btn primary" type="button" data-qa="add">Add money</button></div>`;
    $('#seeall').hidden = true; $('.end').hidden = true; return;
  }
  const shown = TX.slice(0, 10), groups = [];
  for (const t of shown) { const last = groups[groups.length - 1]; if (last && last.date.getTime() === t.date.getTime()) last.items.push(t); else groups.push({ date: t.date, items: [t] }); }
  box.innerHTML = groups.map((g) => `<div class="day">${dayLabel(g.date)}</div><ul class="tx">${g.items.map(row).join('')}</ul>`).join('');
  $('#seeall2').textContent = `See all ${TX.length} transactions`;
}
function renderDue() {
  if (STATE === 'empty') { $('#duesec').hidden = true; return; }
  $('#duelist').innerHTML = UPCOMING.map((u) => {
    const n = dayDiff(u.date, TODAY), when = `in ${n} days`;
    const mon = new Intl.DateTimeFormat('en-GB', { month: 'short' }).format(u.date);
    return `<div class="due"><span class="date" aria-hidden="true"><small>${mon}</small><b>${u.date.getDate()}</b></span><span><span class="n">${u.who}</span><span class="m">${u.note}, ${when}</span></span><span class="a${u.amt > 0 ? ' in' : ''}">${sgn(u.amt)}</span></div>`;
  }).join('');
}
$('#payees').innerHTML = PAYEES.map((p) => `<li><button type="button"><span class="mk${p.person ? ' person' : ''}" aria-hidden="true">${initials(p.name)}</span><span><span class="n">${p.name}</span><span class="m">${p.note}</span></span></button></li>`).join('');
renderSpent(); renderTx(); renderDue();

/* ---- sheet ---- */
let opener = null;
function openSheet(from) {
  opener = from; $('#scrim').hidden = false; $('#sheet').hidden = false;
  requestAnimationFrame(() => { $('#app').classList.add('sheet-open'); $('#sheet-cancel').focus(); });
  $('#scroll').inert = true; document.querySelector('.tabbar').inert = true;
}
function closeSheet() {
  $('#app').classList.remove('sheet-open'); $('#scroll').inert = false; document.querySelector('.tabbar').inert = false;
  setTimeout(() => { $('#scrim').hidden = true; $('#sheet').hidden = true; }, 200);
  if (opener) opener.focus();
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-qa]'); if (b && b.dataset.qa === 'send') openSheet(b); });
$('#sheet-cancel').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
if (STATE === 'sheet') { $('#scrim').hidden = false; $('#sheet').hidden = false; $('#app').classList.add('sheet-open'); $('#scroll').inert = true; document.querySelector('.tabbar').inert = true; }
</script>
</body>
</html>
