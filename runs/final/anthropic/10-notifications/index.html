<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - Gigwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0C2B33; --deep-2:#14404B; --mint:#E8F2F0; --paper:#fff; --ink:#0F2A31; --muted:#587078; --line:#D8E5E2;
  --coral:#F0502F; --coral-soft:#FFE9E3; --gold:#F2B01E; --gold-soft:#FFF3D1; --teal:#0E8C78; --teal-soft:#D9F3EC; --blue:#2D62D8; --blue-soft:#E2EBFD; --plum:#7A3FC4; --plum-soft:#EDE3FA;
  font-family:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mint);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}
h1,h2,h3,.logo{font-family:'Outfit',sans-serif}

.top{background:var(--deep);color:#fff}
.top-in{max-width:1320px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:32px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.top nav{display:flex;gap:6px;flex:1}
.top nav a{color:#B6CDD1;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.top nav a:hover{color:#fff}
.top nav a[aria-current]{color:#fff;background:var(--deep-2)}
.me{display:flex;align-items:center;gap:10px;font-weight:500}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

.wrap{max-width:1320px;margin:0 auto;padding:34px 28px 80px;display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:32px;align-items:start}
.title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:38px;line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:700}
.title p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px}
.ghost{background:var(--paper);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.ghost:hover{border-color:var(--deep)}
.ghost svg{width:18px;height:18px}

/* filters */
.filters{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
.filters button{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted)}
.filters button svg{width:20px;height:20px;flex:none}
.filters button:hover{background:rgba(12,43,51,.06);color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--deep);color:#fff}
.filters .n{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--coral);color:#fff;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.filters .n:empty,.filters .n[data-z]{display:none}

/* feed */
.group{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--muted);padding:6px 4px}
.group:not(:first-child){margin-top:22px}
ul{list-style:none;margin:0;padding:0}
.feed{background:var(--paper);border-radius:16px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);overflow:hidden}
.feed+.group{margin-top:26px}
.item{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 14px;padding:16px 20px 16px 22px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:first-child{border-top:0}
.item:hover{background:#F8FBFA}
.item.unread{background:#FFFCF3}
.item.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.item.gone{display:none}
.thumb{position:relative;width:46px;height:46px}
.thumb .ava{width:46px;height:46px;font-size:15px}
.thumb .kind{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--paper);color:#fff}
.kind svg{width:12px;height:12px}
.kind.msg{background:var(--blue)}.kind.prop{background:var(--plum)}.kind.pay{background:var(--teal)}.kind.con{background:var(--gold);color:var(--ink)}.kind.sys{background:var(--deep-2)}
.body p{margin:0}
.body b{font-weight:700}
.body .quote{margin-top:4px;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.amount{font-family:'Outfit',sans-serif;font-weight:600;color:var(--teal)}
.time{font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px;display:flex;gap:10px;align-items:flex-start}
.item.unread .time{color:var(--coral);font-weight:600}
.dismiss{opacity:0;border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--muted);display:grid;place-items:center;margin-top:-2px}
.item:hover .dismiss,.dismiss:focus-visible{opacity:1}
.dismiss:hover{background:var(--line);color:var(--ink)}
.dismiss svg{width:14px;height:14px}
.acts{grid-column:2/-1;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.pill{height:36px;padding:0 16px;border-radius:99px;font-weight:600;font-size:14px;border:1.5px solid var(--deep);background:none}
.pill:hover{background:var(--mint)}
.pill.main{background:var(--deep);color:#fff}
.pill.main:hover{background:var(--deep-2)}
.pill.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.pill.coral:hover{background:#D23F20}
.done{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--teal);font-size:14px}
.done svg{width:16px;height:16px}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty svg{width:54px;height:54px;color:var(--deep-2);opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-family:'Outfit';font-size:20px;margin-bottom:4px}

/* aside */
aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:20px}
.panel{background:var(--paper);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:20px}
.panel h2{margin:0 0 14px;font-size:19px;letter-spacing:-.01em}
.payout{background:var(--deep);color:#fff;box-shadow:none;position:relative;overflow:hidden}
.payout h2{color:#B6CDD1;font-family:'Figtree';font-weight:500;font-size:14px;margin-bottom:4px}
.payout .big{font-family:'Outfit';font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1}
.payout .big small{font-size:22px;opacity:.6;font-weight:500}
.payout p{margin:8px 0 0;color:#B6CDD1;font-size:14px}
.payout svg.w{position:absolute;right:-6px;bottom:-4px;width:150px;opacity:.9}
.due{display:flex;flex-direction:column;gap:14px}
.due li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.due li b{font-weight:600}
.due li span{color:var(--muted);font-size:14px;grid-column:1}
.due li .cd{grid-row:1/3;grid-column:2;font-family:'Outfit';font-weight:600;font-size:15px;background:var(--coral-soft);color:#B53219;border-radius:8px;padding:5px 9px;text-align:center;line-height:1.1}
.due li .cd small{display:block;font-family:'Figtree';font-weight:500;font-size:11.5px;opacity:.8}
.due li .cd.ok{background:var(--gold-soft);color:#7A5600}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:30;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1180px){
  .wrap{grid-template-columns:210px minmax(0,1fr);}
  aside{grid-column:2;grid-row:2;position:static;flex-direction:row}
  aside .panel{flex:1}
  .filters{grid-column:1;grid-row:2/4}
  #feed{grid-column:2;grid-row:3}
}
@media (max-width:820px){
  .top-in{padding:0 16px;gap:16px}
  .top nav,.me span{display:none}
  .top .me{margin-left:auto}
  .wrap{grid-template-columns:minmax(0,1fr);padding:22px 16px 80px;gap:18px}
  h1{font-size:32px}
  .tools{width:100%}.tools .ghost{flex:1;justify-content:center}
  aside{grid-column:1;grid-row:auto;flex-direction:column}
  #feed{grid-column:1;grid-row:auto}
  .filters{grid-column:1;grid-row:auto;flex-direction:row;overflow-x:auto;gap:8px;position:static;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;border:1px solid var(--line);background:var(--paper);padding:8px 14px 8px 12px;border-radius:99px;gap:8px}
  .filters button svg{width:17px;height:17px}
  .filters .n{margin-left:2px;min-width:20px;height:20px;font-size:12px}
  .item{grid-template-columns:44px minmax(0,1fr);padding:14px 14px 14px 16px;gap:4px 12px}
  .thumb,.thumb .ava{width:42px;height:42px}
  .thumb{grid-row:1/span 3}
  .time{grid-column:2;padding:0}
  .dismiss{display:none}
  .acts{grid-column:2}
  .pill{height:40px}
  .payout .big{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-prop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5zM14 4v5h5M8.5 13h7M8.5 16.5h5"/></symbol>
  <symbol id="i-pay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.3c-.5-.8-1.5-1.2-2.8-1.2-1.6 0-2.7.8-2.7 2s1 1.7 2.7 2 2.8.8 2.8 2-1.200 2-2.800 2c-1.400 0-2.400-.5-2.900-1.300M12 6.500v1.600M12 16v1.600"/></symbol>
  <symbol id="i-con" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.500 4.500 4.500L20 6.500"/></symbol>
  <symbol id="i-sys" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.500 6v5.500c0 4.500 3 8 7.500 9.500 4.500-1.500 7.500-5 7.500-9.500V6z"/><path d="m9 12 2.200 2.200L15.500 10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.500 5 5L20 6.500"/></symbol>
</svg>

<header class="top">
  <div class="top-in">
    <div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#F0502F"/><path d="M5 15c2.500 0 2.500-4 5-4s2.500 4 5 4 2.500-4 5-4" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"/></svg>Gigwell</div>
    <nav aria-label="Main">
      <a href="#">Find work</a><a href="#">My jobs</a><a href="#">Messages</a><a href="#">Earnings</a>
    </nav>
    <div class="me"><span>Noor Haddad</span><span class="ava" style="background:#F2B01E;color:#0C2B33">NH</span></div>
  </div>
</header>

<div class="wrap">
  <div class="title">
    <div>
      <h1>Notifications</h1>
      <p id="sub">You have 6 unread updates.</p>
    </div>
    <div class="tools">
      <button class="ghost" id="markAll" type="button"><svg><use href="#i-con"/></svg>Mark all as read</button>
      <button class="ghost" type="button">Settings</button>
    </div>
  </div>

  <nav class="filters" id="filters" aria-label="Filter notifications"></nav>

  <section aria-label="Notifications" id="feed"></section>

  <aside>
    <div class="panel payout">
      <h2>On its way to you</h2>
      <div class="big"><small>$</small>2,480</div>
      <p>Two milestones clear on Friday, 28 November.</p>
      <svg class="w" viewBox="0 0 150 70" aria-hidden="true"><path d="M0 48c14 0 14-14 28-14s14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 10 6 10 6V70H0z" fill="#14404B"/><path d="M0 58c14 0 14-12 28-12s14 12 28 12 14-12 28-12 14 12 28 12 10-5 10-5V70H0z" fill="#1B5663"/></svg>
    </div>
    <div class="panel">
      <h2>Needs your answer</h2>
      <ul class="due" id="due"></ul>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const AV={a:['#D9F3EC','#0B5C4D'],b:['#E2EBFD','#1B3F94'],c:['#EDE3FA','#51248F'],d:['#FFE9E3','#9A2B14'],e:['#FFF3D1','#6E4D00'],s:['#14404B','#fff']};
const CATS=[['all','All','i-all'],['msg','Messages','i-msg'],['prop','Proposals','i-prop'],['pay','Payments','i-pay'],['con','Contracts','i-con'],['sys','Account','i-sys']];
let N=[
 {id:1,g:'Today',k:'msg',who:'Lena Fischer',av:'a',t:'<b>Lena Fischer</b> from Brightloop replied on <b>Brand illustration set</b>',q:'"Love the second direction. Can we see the icon grid in the teal palette before Thursday? Happy to jump on a call too."',time:'12 min ago',u:1,acts:[['Reply','main','Reply sent to Lena Fischer.'],['Open thread','']]},
 {id:2,g:'Today',k:'pay',who:'Brightloop',av:'e',t:'<b>Brightloop</b> approved milestone 2 and released <span class="amount">$1,200</span>',q:'Funds arrive in your bank account on Friday.',time:'1 hr ago',u:1,acts:[['View receipt','']]},
 {id:3,g:'Today',k:'prop',who:'Tomasz Nowak',av:'c',t:'<b>Tomasz Nowak</b> invited you to submit a proposal for <b>Packaging design for a coffee roaster</b>',q:'Budget $3,000 to $4,500. Closes in 2 days.',time:'3 hrs ago',u:1,due:1,acts:[['Write proposal','coral','Draft started. Find it under My jobs.'],['Not interested','','Invitation declined.']]},
 {id:4,g:'Today',k:'con',who:'Orchard & Pine',av:'d',t:'<b>Orchard & Pine</b> sent you an offer: <b>12-week social campaign</b> for <span class="amount">$5,600</span>',q:'The offer expires in 5 hours. Accepting starts the contract immediately.',time:'4 hrs ago',u:1,due:1,acts:[['Accept offer','coral','Offer accepted. The contract is now active.'],['Ask a question','']]},
 {id:5,g:'Yesterday',k:'pay',who:'Northlight Studio',av:'b',t:'<b>Northlight Studio</b> funded milestone 3 of <b>Annual report layout</b>',q:'<span class="amount">$1,280</span> is held in escrow until you deliver.',time:'Yesterday, 17:20',u:1,acts:[['Deliver work','main','Delivery form opened.']]},
 {id:6,g:'Yesterday',k:'con',who:'Brightloop',av:'e',t:'Milestone 3 of <b>Brand illustration set</b> is due in 3 days',q:'Upload the final files by Monday, 1 December.',time:'Yesterday, 09:05',u:1,due:1,acts:[['Upload files','']]},
 {id:7,g:'Yesterday',k:'msg',who:'Marta Kowalczyk',av:'c',t:'<b>Marta Kowalczyk</b> left you a 5-star review',q:'"Noor turned a messy brief into something we were proud to ship. Quick, kind and precise."',time:'Yesterday, 08:12',acts:[['Thank Marta','','Thank-you note sent.'],['See review','']]},
 {id:8,g:'Earlier this week',k:'sys',who:'Gigwell',av:'s',t:'Your identity check is complete. You now have the <b>Verified</b> badge.',q:'Verified freelancers get 2 times more invitations on average.',time:'Mon, 14:30',acts:[['View profile','']]},
 {id:9,g:'Earlier this week',k:'prop',who:'Ayesha Rahman',av:'a',t:'<b>Ayesha Rahman</b> shortlisted your proposal for <b>Mobile app onboarding screens</b>',q:'She has also shortlisted 2 other freelancers and will decide by Wednesday.',time:'Mon, 11:48',acts:[['View proposal','']]},
 {id:10,g:'Earlier this week',k:'pay',who:'Gigwell',av:'s',t:'Your payout of <span class="amount">$860</span> was sent to Monzo ending 4417',q:'It can take up to 1 working day to appear.',time:'Mon, 09:00',acts:[]},
 {id:11,g:'Earlier this week',k:'sys',who:'Gigwell',av:'s',t:'Add a portfolio piece to appear in more searches',q:'Profiles with 4 or more samples receive twice as many messages.',time:'Sun, 18:10',acts:[['Add a sample','']]}
];
const DUE=[
 ['Orchard & Pine offer','Accept or decline',[5,'hrs']],
 ['Coffee roaster packaging','Submit a proposal',[2,'days']],
 ['Brightloop milestone 3','Upload final files',[3,'days']]
];
let cat='all';
const $=s=>document.querySelector(s);
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const initials=n=>n.split(/[\s&]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const unread=c=>N.filter(n=>n.u&&!n.gone&&(c==='all'||n.k===c)).length;

function renderFilters(){
  $('#filters').innerHTML=CATS.map(([k,l,i])=>{const c=unread(k);return `<button type="button" data-cat="${k}" aria-pressed="${k===cat}">${icon(i)}${l}<span class="n"${c?'':' data-z'}>${c||''}</span></button>`}).join('');
  const t=unread('all');
  $('#sub').textContent=t?`You have ${t} unread ${t===1?'update':'updates'}.`:'You are all caught up.';
}
function renderFeed(){
  const rows=N.filter(n=>!n.gone&&(cat==='all'||n.k===cat));
  if(!rows.length){$('#feed').innerHTML=`<div class="feed"><div class="empty">${icon('i-all')}<b>Nothing here yet</b>New messages, proposals and payments show up as they arrive.</div></div>`;return}
  let h='',cur='';
  rows.forEach(n=>{
    if(n.g!==cur){if(cur)h+='</ul></div>';h+=`<h2 class="group">${n.g}</h2><div class="feed"><ul>`;cur=n.g}
    const c=AV[n.av];
    const acts=n.done?`<div class="acts"><span class="done">${icon('i-check')}${n.done}</span></div>`:(n.acts.length?`<div class="acts">${n.acts.map((a,i)=>`<button type="button" class="pill ${a[1]}" data-act="${i}">${a[0]}</button>`).join('')}</div>`:'');
    h+=`<li class="item${n.u?' unread':''}" data-id="${n.id}" tabindex="0">
      <div class="thumb"><span class="ava" style="background:${c[0]};color:${c[1]}">${initials(n.who)}</span><span class="kind ${n.k}">${icon(CATS.find(x=>x[0]===n.k)[2])}</span></div>
      <div class="body"><p>${n.u?'<span class="sr">Unread. </span>':''}${n.t}</p>${n.q?`<p class="quote">${n.q}</p>`:''}</div>
      <div class="time"><span>${n.time}</span><button type="button" class="dismiss" data-x aria-label="Dismiss notification">${icon('i-x')}</button></div>
      ${acts}</li>`;
  });
  $('#feed').innerHTML=h+'</ul></div>';
}
function renderDue(){
  $('#due').innerHTML=DUE.map(d=>`<li><b>${d[0]}</b><span>${d[1]}</span><div class="cd${d[2][1]==='hrs'?'':' ok'}">${d[2][0]}<small>${d[2][1]==='hrs'?'hours left':'days left'}</small></div></li>`).join('');
}
function all(){renderFilters();renderFeed()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}

$('#filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;all()}};
$('#markAll').onclick=()=>{N.forEach(n=>n.u=0);all();toast('All notifications marked as read.')};
$('#feed').addEventListener('click',e=>{
  const li=e.target.closest('.item');if(!li)return;const n=N.find(x=>x.id==li.dataset.id);
  if(e.target.closest('[data-x]')){n.gone=1;all();toast('Notification dismissed.');return}
  const b=e.target.closest('[data-act]');
  if(b){const a=n.acts[+b.dataset.act];n.u=0;if(a[2]){n.done=a[2].replace(/\.$/,'');toast(a[2])}all();return}
  if(n.u){n.u=0;all()}
});
$('#feed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.item')){const n=N.find(x=>x.id==e.target.dataset.id);if(n.u){n.u=0;all()}}});
renderDue();all();
</script>
</body>
</html>
