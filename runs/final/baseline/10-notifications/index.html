<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - Gigwell</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f4f7; color: #222; }
  header { background: #fff; border-bottom: 1px solid #ddd; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 20px; color: #0a8f6a; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  h1 { margin: 0; font-size: 24px; }
  .tabs { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { padding: 7px 14px; border: 1px solid #ccc; background: #fff; border-radius: 16px; cursor: pointer; font-size: 14px; }
  .tabs button.on { background: #0a8f6a; color: #fff; border-color: #0a8f6a; }
  .link { background: none; border: 0; color: #0a6fa8; cursor: pointer; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
  li { padding: 14px 16px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: flex-start; }
  li:last-child { border-bottom: 0; }
  li.unread { background: #eefaf6; }
  .icon { width: 36px; height: 36px; border-radius: 50%; background: #ddd; text-align: center; line-height: 36px; font-size: 16px; flex: none; }
  .body { flex: 1; }
  .body p { margin: 0 0 4px; font-size: 14px; }
  .time { font-size: 12px; color: #777; }
  .dot { width: 8px; height: 8px; background: #0a8f6a; border-radius: 50%; margin-top: 6px; flex: none; }
  .empty { padding: 30px; text-align: center; color: #777; }
  @media (max-width: 500px) { header { padding: 12px 16px; } h1 { font-size: 20px; } }
</style>
</head>
<body>
<header><b>Gigwell</b><span>Maya Chen</span></header>
<main>
  <div class="top"><h1>Notifications</h1><button class="link" id="markAll">Mark all as read</button></div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="unread">Unread</button>
    <button data-f="proposal">Proposals</button>
    <button data-f="message">Messages</button>
    <button data-f="payment">Payments</button>
  </div>
  <ul id="list"></ul>
</main>
<script>
  const items = [
    { type: "payment", icon: "$", text: "Payment of $1,200.00 released for \"Brand identity refresh\".", time: "10 min ago", unread: true },
    { type: "message", icon: "M", text: "Jonas Weber sent you a message: \"Can we move the call to Thursday?\"", time: "1 hour ago", unread: true },
    { type: "proposal", icon: "P", text: "Your proposal for \"Mobile app onboarding illustrations\" was viewed by Fieldnote.", time: "3 hours ago", unread: true },
    { type: "proposal", icon: "P", text: "Northbeam Labs invited you to apply for \"Landing page redesign\".", time: "Yesterday", unread: false },
    { type: "payment", icon: "$", text: "Milestone 2 funded for \"Podcast cover art\".", time: "Yesterday", unread: false },
    { type: "message", icon: "M", text: "Sara Okoye left a review: 5 stars for \"Logo animation\".", time: "2 days ago", unread: false },
    { type: "proposal", icon: "P", text: "Your proposal for \"Packaging design\" was declined.", time: "4 days ago", unread: false }
  ];
  let filter = "all";
  const list = document.getElementById("list");
  function render() {
    const shown = items.filter(i => filter === "all" || (filter === "unread" ? i.unread : i.type === filter));
    list.innerHTML = shown.length ? "" : '<li class="empty">Nothing here.</li>';
    shown.forEach(i => {
      const li = document.createElement("li");
      if (i.unread) li.className = "unread";
      li.innerHTML = `<div class="icon">${i.icon}</div><div class="body"><p>${i.text}</p><span class="time">${i.time}</span></div>${i.unread ? '<span class="dot"></span>' : ""}`;
      li.onclick = () => { i.unread = false; render(); };
      list.appendChild(li);
    });
  }
  document.getElementById("tabs").onclick = e => {
    if (e.target.dataset.f) {
      filter = e.target.dataset.f;
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === e.target));
      render();
    }
  };
  document.getElementById("markAll").onclick = () => { items.forEach(i => i.unread = false); render(); };
  render();
</script>
</body>
</html>
