<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team members - Cobalt</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f6f8; color: #222; }
  header { background: #1d3fbb; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  header span { font-size: 14px; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  h2 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 20px; color: #666; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
  .invite { display: flex; gap: 10px; flex-wrap: wrap; }
  .invite input, .invite select { padding: 9px; border: 1px solid #bbb; border-radius: 4px; font-size: 14px; }
  .invite input { flex: 1; min-width: 200px; }
  button { padding: 9px 16px; border: 0; border-radius: 4px; background: #1d3fbb; color: #fff; font-size: 14px; cursor: pointer; }
  button.danger { background: #fff; color: #c62828; border: 1px solid #c62828; padding: 6px 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  th { color: #666; font-weight: bold; }
  td select { padding: 6px; border: 1px solid #bbb; border-radius: 4px; }
  .avatar { display: inline-block; width: 32px; height: 32px; border-radius: 50%; background: #1d3fbb; color: #fff; text-align: center; line-height: 32px; font-size: 13px; margin-right: 10px; vertical-align: middle; }
  .pending { color: #b26a00; }
  .msg { color: #2e7d32; margin-top: 10px; font-size: 14px; }
  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    table, thead, tbody, tr, td, th { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid #ddd; padding: 10px 0; }
    td { border: 0; padding: 4px 0; }
  }
</style>
</head>
<body>
<header><h1>Cobalt</h1><span>Acme Studio</span></header>
<main>
  <h2>Team members</h2>
  <p class="sub">Invite people, change roles and remove members.</p>

  <div class="card">
    <form class="invite" id="inviteForm">
      <input type="email" id="email" placeholder="Email address" required aria-label="Email address">
      <select id="role" aria-label="Role">
        <option>Reviewer</option><option>Designer</option><option>Admin</option>
      </select>
      <button type="submit">Send invite</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  let members = [
    { name: "Amara Okafor", email: "amara@acme.studio", role: "Admin", status: "Active" },
    { name: "Liam Fischer", email: "liam@acme.studio", role: "Designer", status: "Active" },
    { name: "Priya Raman", email: "priya@acme.studio", role: "Designer", status: "Active" },
    { name: "Tomás Ibarra", email: "tomas@acme.studio", role: "Reviewer", status: "Active" },
    { name: "Hannah Lee", email: "hannah@acme.studio", role: "Reviewer", status: "Pending" }
  ];
  const roles = ["Admin", "Designer", "Reviewer"];
  const rows = document.getElementById("rows");
  function render() {
    rows.innerHTML = "";
    members.forEach((m, i) => {
      const tr = document.createElement("tr");
      const initials = m.name.split(" ").map(s => s[0]).join("");
      tr.innerHTML = `<td><span class="avatar">${initials}</span>${m.name}</td><td>${m.email}</td>
        <td><select aria-label="Role for ${m.name}">${roles.map(r => `<option ${r === m.role ? "selected" : ""}>${r}</option>`).join("")}</select></td>
        <td class="${m.status === "Pending" ? "pending" : ""}">${m.status}</td>
        <td><button class="danger">Remove</button></td>`;
      tr.querySelector("select").onchange = e => { m.role = e.target.value; };
      tr.querySelector("button").onclick = () => { if (confirm("Remove " + m.name + "?")) { members.splice(i, 1); render(); } };
      rows.appendChild(tr);
    });
  }
  document.getElementById("inviteForm").onsubmit = e => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const name = email.split("@")[0];
    members.push({ name: name.charAt(0).toUpperCase() + name.slice(1), email, role: document.getElementById("role").value, status: "Pending" });
    document.getElementById("msg").textContent = "Invite sent to " + email;
    e.target.reset();
    render();
  };
  render();
</script>
</body>
</html>
