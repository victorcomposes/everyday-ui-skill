<style>
:root {

  --border: #e2e4e9; --border-strong: #838995;
  --text: #16181d; --text-muted: #5b616e;

  --success: #157a46; --success-subtle: #ecf8f1;
  --warning: #9a5b00; --warning-subtle: #fdf5e6;
  --danger: #c4302b; --danger-subtle: #fdf0ef;
  --focus: var(--accent);
  --placeholder: #6b717d;
  --frame: #f7f7f8; --brand-deep: #1c1f26; --on-deep: #ffffff; --on-deep-muted: #b4b9c4; --accent-on-deep: #ff9a5c;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Bricolage Grotesque", var(--font);
  --text-xs: 12px; --lh-xs: 16px;
  --text-sm: 14px; --lh-sm: 20px;
  --text-md: 16px; --lh-md: 24px;
  --text-lg: 18px; --lh-lg: 26px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px;

}
@media (prefers-color-scheme: dark) {

    --bg: #111318; --bg-subtle: #171a20; --surface: #1b1e25;
    --border: #2b2f38; --border-strong: #6f7685;
    --text: #e9ebef; --text-muted: #a0a6b2;
    --accent: #ff9a5c; --accent-hover: #ffb88a; --accent-subtle: #36210f; --on-accent: #0b1020;
    --success: #4cc38a; --success-subtle: #13261d;
    --warning: #e6a23c; --warning-subtle: #2a2112;
    --danger: #ff7a72; --danger-subtle: #2d1715;
    --placeholder: #8b919d;
    --frame: #17191d; --brand-deep: #0f1115; --on-deep: #e9ebef; --on-deep-muted: #a0a6b2;
    --shadow-pop: 0 4px 16px rgb(0 0 0 / 0.5); --shadow-dialog: 0 16px 48px rgb(0 0 0 / 0.6);
  }
}
@media (max-width: 640px), (pointer: coarse) { :root { --control-h: 44px; --control-h-sm: 44px; } }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 400 var(--text-sm)/var(--lh-sm) var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::placeholder { color: var(--placeholder); opacity: 1; }
h1 { font: 600 32px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 var(--text-lg)/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s-2); top: var(--s-2); z-index: 50; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4);
  background: var(--surface); border-radius: var(--r-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--control-h); padding: 0 var(--s-4);
  border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color var(--t-fast) var(--ease); }
.btn:hover { background: var(--bg-subtle); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.badge { display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; gap: 4px; padding: 2px 8px; border-radius: var(--r-sm);
  font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 500; background: var(--bg-subtle); color: var(--text-muted); }
.badge.good { background: var(--success-subtle); color: var(--success); }

/* header band */
.top { background: var(--frame); border-bottom: 1px solid var(--border); }
.top-in { max-width: var(--w-content); margin: 0 auto; padding: var(--s-4) var(--s-8); display: flex; align-items: center; gap: var(--s-8); }
.logo { display: inline-flex; align-items: center; gap: 10px; font: 700 var(--text-lg)/1 var(--font-display); letter-spacing: -0.02em; min-height: 44px; flex-shrink: 0; }
.nav { display: flex; align-items: center; gap: var(--s-1); margin-left: auto; flex-shrink: 0; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-3); border-radius: var(--r-md); font-weight: 500; color: var(--text-muted); }
.nav a:hover { background: var(--bg-subtle); color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); background: var(--accent-subtle); }
.nav .signin { color: var(--text); }

/* search field */
.search { position: relative; flex: 1; max-width: 680px; min-width: 0; }
.field { position: relative; display: flex; align-items: center; height: 44px; }
.field input { width: 100%; height: 44px; border: 1px solid var(--border-strong); border-radius: var(--r-full); background: var(--surface);
  padding: 0 96px 0 44px; font-size: var(--text-md); }
.field .lead { position: absolute; left: var(--s-4); top: 12px; pointer-events: none; }
.field .tail { position: absolute; right: 2px; top: 0; display: flex; align-items: center; }
.field input::-webkit-search-cancel-button { display: none; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: transparent; border-radius: var(--r-full); cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
.icon-btn:hover { background: var(--bg-subtle); color: var(--text); }
.icon-btn.go { color: var(--accent); }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: var(--s-2) 0; max-height: 60dvh; overflow: auto; }
.suggest .gh { margin: 0; padding: var(--s-2) var(--s-4) var(--s-1); font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 500; color: var(--text-muted); }
.suggest [role="option"] { display: flex; align-items: center; gap: var(--s-3); min-height: 44px; padding: 0 var(--s-4); cursor: pointer; }
.suggest [role="option"][aria-selected="true"], .suggest [role="option"]:hover { background: var(--accent-subtle); }
.suggest svg { color: var(--text-muted); flex-shrink: 0; }

/* page layout */
main { flex: 1; width: 100%; max-width: var(--w-content); margin: 0 auto; padding: var(--rhythm-content) var(--s-8) var(--s-16); }
.head { margin-bottom: var(--rhythm-content); }
.head .sub { margin-top: var(--rhythm-title); color: var(--text-muted); font-size: var(--text-md); line-height: var(--lh-md); }
.layout { display: grid; grid-template-columns: var(--w-facets) minmax(0, 1fr); gap: var(--rhythm-group); align-items: start; }

/* facets */
.facets-head { display: none; }
.facets .group { padding: var(--s-4) 0; border-top: 1px solid var(--border); }
.facets .group:first-of-type { border-top: 0; padding-top: 0; }
.facets fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.facets legend { padding: 0; margin-bottom: var(--s-2); font-weight: 600; font-size: var(--text-sm); }
.opt { display: flex; align-items: center; gap: var(--s-3); min-height: 36px; cursor: pointer; border-radius: var(--r-sm); }
.opt input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
.opt .n { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.opt.zero { color: var(--text-muted); }
.sheet-foot { display: none; }
.scrim { display: none; }

/* toolbar */
.bar { display: flex; align-items: center; gap: var(--s-4); min-height: 44px; }
.bar .range { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.sort { margin-left: auto; display: flex; align-items: center; gap: var(--s-2); color: var(--text-muted); }
.sort select { height: var(--control-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); padding: 0 var(--s-3); font-weight: 500; }
.filters-btn { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; margin-top: var(--s-3); }
.chip { display: inline-flex; align-items: center; gap: var(--s-1); min-height: 32px; padding: 0 var(--s-1) 0 var(--s-3); border-radius: var(--r-full); background: var(--accent-subtle); color: var(--text); font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.chip button { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: var(--r-full); cursor: pointer; color: var(--accent); }
.chip button:hover { background: var(--surface); }
.clear-all { min-height: 32px; padding: 0 var(--s-2); border: 0; background: none; cursor: pointer; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

/* results */
.list { margin-top: var(--s-3); border-top: 1px solid var(--border); }
.res { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr) 104px; gap: var(--s-5); padding: var(--s-4) 0; border-bottom: 1px solid var(--border); }
.res:hover { background: var(--bg-subtle); }
.thumb { width: 112px; height: 84px; border-radius: var(--r-md); overflow: hidden; background: var(--accent-subtle); display: block; }
.thumb svg { display: block; width: 100%; height: 100%; }
.res .kicker { color: var(--text-muted); font-size: var(--text-xs); line-height: var(--lh-xs); }
.res .title { margin: 2px 0 0; font: 600 var(--text-lg)/1.3 var(--font-display); letter-spacing: -0.01em; }
.res .title a::after { content: ""; position: absolute; inset: 0; }
.res .title a:hover { text-decoration: underline; text-underline-offset: 3px; }
.res strong { font-weight: 700; }
.res .title strong { font-weight: 700; color: var(--accent); }
.res .snip { margin-top: var(--s-1); color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.res .snip strong { color: var(--text); }
.meta { margin-top: var(--s-2); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); }
.rating { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rating svg { color: var(--accent); }
.rating b { font-weight: 600; }
.rating span { color: var(--text-muted); }
.uses { color: var(--text-muted); }
.uses strong { color: var(--text); font-weight: 600; }
.side { text-align: right; font-variant-numeric: tabular-nums; }
.side b { display: block; font: 600 var(--text-md)/var(--lh-md) var(--font); }
.side span { color: var(--text-muted); font-size: var(--text-xs); line-height: var(--lh-xs); }
.inline-meta { display: none; }

/* pagination */
.pager { display: flex; align-items: center; gap: var(--s-1); margin-top: var(--s-6); flex-wrap: wrap; }
.pager .count { margin-right: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.pager button { min-width: 36px; min-height: 36px; padding: 0 var(--s-2); border: 1px solid transparent; border-radius: var(--r-md); background: transparent; cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 500; }
.pager button:hover:not(:disabled) { background: var(--bg-subtle); }
.pager button[aria-current="page"] { background: var(--accent-subtle); color: var(--text); border-color: var(--accent); }
.pager button:disabled { color: var(--text-muted); cursor: default; opacity: 0.6; }

/* states */
.state { max-width: 560px; padding: var(--s-6) 0; }
.state h2 { font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; }
.state p { margin-top: var(--s-2); color: var(--text-muted); font-size: var(--text-md); line-height: var(--lh-md); }
.state .acts { margin-top: var(--s-5); display: flex; flex-wrap: wrap; gap: var(--s-3); }
.state .art { margin-bottom: var(--s-5); }
.banner { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-4); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); background: var(--danger-subtle); border-radius: var(--r-lg); }
.banner svg { color: var(--danger); flex-shrink: 0; margin-top: 2px; }
.banner b { display: block; font-weight: 600; }
.recents { margin-top: var(--rhythm-content); display: flex; flex-wrap: wrap; gap: var(--s-2); }
.recents a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s-4); border: 1px solid var(--border-strong); border-radius: var(--r-full); font-weight: 500; }
.recents a:hover { background: var(--bg-subtle); }
.group-h { margin-top: var(--rhythm-group); }
.group-h:first-child { margin-top: 0; }
.group-h h2 { margin-bottom: var(--s-3); }

.foot { border-top: 1px solid var(--border); background: var(--frame); }
.foot div { max-width: var(--w-content); margin: 0 auto; padding: var(--s-6) var(--s-8); color: var(--text-muted); display: flex; gap: var(--s-6); flex-wrap: wrap; align-items: center; }
.foot a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; }

@media (max-width: 900px) {
  .nav a:not(.signin) { display: none; }
  .top-in { flex-wrap: wrap; padding: var(--s-2) var(--s-4) var(--s-3); gap: var(--s-1) var(--s-4); }
  .search { order: 3; flex: 1 0 100%; max-width: none; }
  main { padding: var(--s-5) var(--s-4) var(--s-12); }
  h1 { font-size: 26px; }
  .head { margin-bottom: var(--s-4); }
  .head .sub { margin-top: var(--s-2); font-size: var(--text-sm); line-height: var(--lh-sm); }
  .layout { display: block; }
  .filters-btn { display: inline-flex; }
  .sort label span { display: none; }
  .bar { gap: var(--s-3); }
  .bar .range { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: calc(var(--s-4) * -1); padding: 0 var(--s-4); scrollbar-width: none;
    mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chip, .clear-all { flex-shrink: 0; min-height: 44px; }
  .chip button { width: 44px; height: 44px; margin: 0 -8px 0 -4px; }
  /* facets become a bottom sheet */
  .facets { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 86dvh; display: flex; flex-direction: column; background: var(--surface);
    border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-dialog); transform: translateY(105%); visibility: hidden;
    transition: transform var(--t-base) var(--ease), visibility 0s linear var(--t-base); }
  .facets.open { transform: none; visibility: visible; transition: transform var(--t-base) var(--ease); }
  .facets-head { display: flex; align-items: center; justify-content: space-between; padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4); border-bottom: 1px solid var(--border); }
  .facets-head h2 { font-size: var(--text-md); }
  .facets .scroll { overflow: auto; padding: var(--s-4); flex: 1; }
  .opt { min-height: 44px; }
  .sheet-foot { display: block; padding: var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
  .sheet-foot .btn { width: 100%; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / 0.4); }
  .scrim.open { display: block; }
  .list { margin-inline: calc(var(--s-4) * -1); }
  .res { grid-template-columns: 88px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-4); }
  .thumb { width: 88px; height: 72px; }
  .res .snip, .res .uses, .res .side { display: none; }
  .res .title { font-size: var(--text-md); }
  .inline-meta { display: inline; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res .title a { display: inline-flex; align-items: center; min-height: 44px; }
  .res .title { margin: 0; }
  .meta { margin-top: 0; }
  .meta .badge ~ .badge { display: none; }
  .pager { padding-inline: 0; }
  .pager .count { flex: 1 0 100%; margin-bottom: var(--s-2); }
  .pager button { min-width: 44px; min-height: 44px; }
  body { font-size: var(--text-md); line-height: var(--lh-md); }
  .foot div { padding-inline: var(--s-4); }
}
</style>

    const bare = !ap.length;
    if (bare) { $('#facets').innerHTML = ''; $('#layout').style.display = 'block'; }
    html = `${bare ? '' : bar}<div class="state"><svg class="art" width="120" height="90" viewBox="0 0 112 84" aria-hidden="true"><rect width="112" height="84" rx="12" fill="var(--accent-subtle)"/><ellipse cx="56" cy="40" rx="30" ry="9" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/><path d="M26 40c0 16 13 26 30 26s30-10 30-26" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/><path d="M48 24c0-4 4-4 4-8M60 24c0-4 4-4 4-8" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <h2>No results for “${esc(q)}”</h2>
      ${fix ? `<p>Did you mean <a class="link" href="?q=${encodeURIComponent(fix)}" data-q="${esc(fix)}">${esc(fix)}</a>?</p>` : '<p>Check the spelling, or try a broader word such as the main ingredient.</p>'}${hint}
      <div class="acts">${ap.length ? '<button class="btn" type="button" id="clearAll">Clear all filters</button>' : ''}<a class="btn" href="?q=chickpea%20curry" data-q="chickpea curry">Search chickpea curry</a></div></div>`;
  } else {
    let pager = '';
    if (pages > 1) {
      pager = `<nav class="pager" aria-label="Pagination"><span class="count">Showing ${start + 1} to ${start + shown.length} of ${fmtNum(total)}</span>
       <button type="button" data-page="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''}>Previous</button>
       ${Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" ${i + 1 === S.page ? 'aria-current="page"' : ''} aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
       <button type="button" data-page="${S.page + 1}" ${S.page === pages ? 'disabled' : ''}>Next</button></nav>`;
    }
    html = `${bar}<ul class="list">${shown.map(row).join('')}</ul>${pager}`;
  }
  $('#results').innerHTML = html;
  syncSheet();
}

/* ---------- sheet (phone) ---------- */
const mq = matchMedia('(max-width: 900px)');
function syncSheet() {
  const f = $('#facets');
  f.classList.toggle('open', S.sheet);
  $('#scrim').classList.toggle('open', S.sheet && mq.matches);
  if (mq.matches) { f.inert = !S.sheet; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.setAttribute('aria-label', 'Filters'); }
  else { f.inert = false; f.removeAttribute('role'); f.removeAttribute('aria-modal'); }
}
mq.addEventListener('change', () => { S.sheet = false; syncSheet(); });
function openSheet(on) { S.sheet = on; syncSheet(); if (on) $('#facets .icon-btn')?.focus(); else $('#openSheet')?.focus(); }

/* ---------- events ---------- */
function go(q) { S.q = q; S.page = 1; S.type.clear(); S.diet.clear(); S.meth.clear(); S.time = 0; S.rating = 0; hideSuggest(); render(); history.replaceState(null, '', MODE ? `?q=${encodeURIComponent(q)}` : q === 'chickpea curry' ? location.pathname : `?q=${encodeURIComponent(q)}`); }
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { S.sort = t.value; S.page = 1; render(); $('#sort').focus(); return; }
  const f = t.dataset.facet; if (!f) return;
  if (f === 'time') S.time = Number(t.value); else if (f === 'rating') S.rating = Number(t.value);
  else t.checked ? S[f].add(t.value) : S[f].delete(t.value);
  S.page = 1; const keep = S.sheet; render();
  document.querySelector(`[data-facet="${f}"][value="${CSS.escape(t.value)}"]`)?.focus();
  S.sheet = keep; syncSheet();
});
document.addEventListener('click', (e) => {
  const c = (s) => e.target.closest(s);
  let el;
  if ((el = c('[data-rm]'))) { removeFilter(el.dataset.rm, el.dataset.rm === 'time' || el.dataset.rm === 'rating' ? Number(el.dataset.v) : el.dataset.v); render(); }
  else if (c('#clearAll')) { S.type.clear(); S.diet.clear(); S.meth.clear(); S.time = 0; S.rating = 0; S.page = 1; render(); }
  else if ((el = c('[data-page]'))) { S.page = Number(el.dataset.page); render(); $('#title').scrollIntoView({ block: 'start' }); }
  else if (c('#openSheet')) openSheet(true);
  else if (c('#closeSheet') || c('#showBtn') || c('#scrim')) openSheet(false);
  else if ((el = c('[data-q]'))) { e.preventDefault(); $('#q').value = el.dataset.q; go(el.dataset.q); }
  else if (c('#clearBtn')) { $('#q').value = ''; $('#clearBtn').hidden = true; $('#q').focus(); showSuggest(); }
  else if (!c('#searchForm')) hideSuggest();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) openSheet(false); });

/* suggestions: combobox with aria-activedescendant */
const input = $('#q'), box = $('#suggest');
let items = [], active = -1;
function showSuggest() {
  const v = input.value.trim().toLowerCase();
  let html = '';
  items = [];
  if (!v) { items = RECENTS.map(r => ({ t: r, c: 'Recent searches' })); }
  else if (v.length >= 2) { items = SUGGESTIONS.filter(s => s.includes(v) && s !== v).slice(0, 5).map(s => ({ t: s, c: 'Suggestions' })); }
  if (!items.length) { hideSuggest(); return; }
  let last = '';
  items.forEach((it, i) => { if (it.c !== last) { html += `<div class="gh" role="presentation">${it.c}</div>`; last = it.c; }
    html += `<div role="option" id="opt${i}" aria-selected="false" data-q="${esc(it.t)}">${ico.search}<span>${esc(it.t)}</span></div>`; });
  box.innerHTML = html; box.hidden = false; active = -1;
  input.setAttribute('aria-expanded', 'true'); input.removeAttribute('aria-activedescendant');
}
function hideSuggest() { box.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); active = -1; }
function setActive(i) {
  active = (i + items.length) % items.length;
  box.querySelectorAll('[role=option]').forEach((o, k) => o.setAttribute('aria-selected', k === active));
  input.setAttribute('aria-activedescendant', `opt${active}`);
}
input.addEventListener('focus', showSuggest);
input.addEventListener('input', () => { $('#clearBtn').hidden = !input.value; showSuggest(); });
input.addEventListener('keydown', (e) => {
  if (box.hidden && e.key === 'ArrowDown') { showSuggest(); }
  if (!items.length || box.hidden) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Escape') hideSuggest();
  else if (e.key === 'Enter' && active > -1) { e.preventDefault(); input.value = items[active].t; go(items[active].t); }
});
box.addEventListener('mousedown', (e) => { const o = e.target.closest('[role=option]'); if (o) { e.preventDefault(); input.value = o.dataset.q; go(o.dataset.q); } });
$('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); go(input.value.trim()); input.blur(); });

render();
</script>
</body>
